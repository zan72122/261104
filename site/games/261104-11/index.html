<script>
(function(){
'use strict';
/* ===== palette: silhouette = one black + background colors ===== */
const INK='#121015';
const ECRU='#efe4cc';
const ROAD='#fff4d2';
const SKY_N=[238,138,92], SKY_M=[249,201,112];
const DAY={y:'#ffd35a',b:'#9ad5ef',m:'#a7e3b6',p:'#ffb59d'};
const SUN='#fff3c8';
const PMAX=70;          // particle cap
const TAU=Math.PI*2;

/* ===== utils ===== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const easeIO=t=>t<0?0:t>1?1:(t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2);
const back=t=>{if(t<=0)return 0;if(t>=1)return 1;const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
let seed=(Date.now()%100000)|0;
function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
const rr=(a,b)=>a+(b-a)*rnd();
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rgb(c){return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';}
function mix(a,b,t){return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
// damped spring helper: returns value that starts at 1 and wobbles to 0
function wob(t,f,d){return t<0?0:Math.exp(-t*d)*Math.cos(t*f);}

/* ===== audio (Web Audio synthesis, created on first touch) ===== */
const AU={ctx:null,master:null,noise:null,ok:false};
function audioInit(){
  if(AU.ctx){ if(AU.ctx.state==='suspended'){ try{AU.ctx.resume();}catch(e){} } return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{
    const c=new AC(); AU.ctx=c;
    const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    const m=c.createGain(); m.gain.value=0.55; m.connect(comp); comp.connect(c.destination); AU.master=m;
    const len=c.sampleRate*0.6|0, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    AU.noise=b; AU.ok=true;
    // unlock on iOS: play a silent buffer inside the gesture
    const sb=c.createBufferSource(); sb.buffer=c.createBuffer(1,1,22050); sb.connect(c.destination); sb.start(0);
    if(c.state==='suspended'){ try{c.resume();}catch(e){} }
  }catch(e){ AU.ctx=null; AU.ok=false; }
}
function aT(){return AU.ctx.currentTime;}
function tone(f,dur,o){
  if(!AU.ok) return; o=o||{};
  const c=AU.ctx, t=aT()+(o.at||0);
  const osc=c.createOscillator(), g=c.createGain();
  osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+dur*(o.slide||1));
  const v=(o.vol||0.2);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.att||0.008));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let out=g;
  if(o.lp){const f2=c.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=o.lp; g.connect(f2); out=f2;}
  osc.connect(g); out.connect(AU.master); osc.start(t); osc.stop(t+dur+0.05);
}
function noise(dur,o){
  if(!AU.ok) return; o=o||{};
  const c=AU.ctx, t=aT()+(o.at||0);
  const s=c.createBufferSource(); s.buffer=AU.noise;
  const f=c.createBiquadFilter(); f.type=o.ft||'bandpass'; f.frequency.setValueAtTime(o.f||1500,t);
  if(o.to) f.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  f.Q.value=o.q||1.2;
  const g=c.createGain(); const v=o.vol||0.2;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.att||0.005)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(AU.master); s.start(t,Math.random()*0.3); s.stop(t+dur+0.05);
}
const SCALE=[0,2,4,7,9,12,14,16,19,21,24];
const nf=(base,step)=>base*Math.pow(2,SCALE[clamp(step,0,SCALE.length-1)]/12);
const SFX={
  peel(step){ // "peri!" paper tear: noise sweep + rising chirp; pitch follows streak
    const b=nf(520,step);
    noise(0.11,{f:1800+step*200,to:5200,q:0.9,vol:0.22});
    tone(b,0.16,{type:'triangle',to:b*1.9,slide:0.6,vol:0.16});
    tone(b*2,0.22,{type:'sine',vol:0.07,at:0.07});
  },
  plip(step){ const b=nf(660,step); tone(b,0.12,{type:'sine',to:b*1.25,vol:0.13}); },
  wiggle(){ tone(190,0.09,{type:'sine',to:150,vol:0.10}); },
  bake(step){ const b=nf(784,step); tone(b,0.25,{type:'triangle',vol:0.11}); tone(b*1.5,0.3,{type:'sine',vol:0.06,at:0.06}); },
  serve(){ tone(988,0.12,{type:'triangle',vol:0.10}); tone(1319,0.18,{type:'sine',vol:0.08,at:0.08}); },
  munch(){ noise(0.05,{f:900,q:2,vol:0.07}); noise(0.05,{f:800,q:2,vol:0.06,at:0.09}); },
  bell(big){ const f=big?660:880;
    [1,2.76,5.4].forEach((m,i)=>tone(f*m,big?1.4:0.9,{type:'sine',vol:[0.16,0.06,0.03][i]}));
    if(big) [1,2.76].forEach((m,i)=>tone(f*m,1.2,{type:'sine',vol:[0.12,0.05][i],at:0.32})); },
  wind(n){ for(let i=0;i<3;i++) noise(0.03,{f:3200+n*300,q:6,vol:0.08,at:i*0.07}); },
  vroom(p){ const b=110+p*30; tone(b,0.6,{type:'sawtooth',to:b*2.2,slide:0.8,vol:0.06,lp:900}); noise(0.4,{f:400,q:0.8,vol:0.05}); },
  splash(){ noise(0.35,{f:2400,to:900,q:0.7,vol:0.16}); },
  spin(){ noise(0.3,{f:600,to:2600,q:2,vol:0.10}); tone(500,0.3,{type:'triangle',to:900,vol:0.05}); },
  hat(){ tone(700,0.35,{type:'sine',to:1500,slide:0.8,vol:0.12}); tone(1500,0.15,{type:'sine',to:1100,vol:0.08,at:0.33}); },
  flag(){ for(let i=0;i<4;i++) noise(0.05,{f:1200,q:1.5,vol:0.06,at:i*0.06}); tone(1175,0.14,{type:'triangle',vol:0.07,at:0.05}); },
  sign(){ tone(330,0.1,{type:'triangle',vol:0.07}); tone(392,0.1,{type:'triangle',vol:0.06,at:0.08}); },
  bike(){ tone(1568,0.18,{type:'sine',vol:0.09}); tone(1568,0.18,{type:'sine',vol:0.09,at:0.16}); },
  sweep(){ noise(0.25,{f:3000,to:1200,q:0.6,vol:0.08}); },
  hop(){ tone(520,0.12,{type:'sine',to:780,vol:0.09}); },
  // success sounds: clearly different (chords / arpeggios)
  combo(){ const r=523; [0,4,7,12].forEach((s,i)=>tone(r*Math.pow(2,s/12),0.42,{type:'triangle',vol:0.12,at:i*0.08})); tone(r*2,0.7,{type:'sine',vol:0.07,at:0.34}); },
  road(n){ const r=392*Math.pow(2,(n%5)/12); [0,7,12].forEach((s,i)=>tone(r*Math.pow(2,s/12),0.3,{type:'sine',vol:0.11,at:i*0.06})); },
  lift(){ for(let i=0;i<7;i++) tone(330*Math.pow(2,SCALE[i]/12),0.32,{type:'triangle',vol:0.09,at:i*0.055}); tone(1320,0.9,{type:'sine',vol:0.06,at:0.42}); },
  dawn(){ const ch=[[0,4,7],[5,9,12],[7,11,14],[12,16,19]]; ch.forEach((c,i)=>c.forEach(s=>tone(262*Math.pow(2,s/12),0.9,{type:'triangle',vol:0.07,at:i*0.45}))); },
  march(i){ const m=[0,4,7,4,9,7,4,2]; tone(392*Math.pow(2,m[i%8]/12),0.18,{type:'triangle',vol:0.08}); if(i%2===0) noise(0.04,{f:200,q:1,vol:0.07}); },
  night(){ [12,7,4,0].forEach((s,i)=>tone(330*Math.pow(2,s/12),0.5,{type:'sine',vol:0.07,at:i*0.18})); }
};
/* ===== canvas / layout ===== */
const cv=document.getElementById('c');
const cx=cv.getContext('2d');
const saEl=document.getElementById('sa');
const cache=document.createElement('canvas');
const cc=cache.getContext('2d');
let DPR=1, W=0, H=0;
const L={};           // layout
const SLOTS=9;
let G=null;           // game state (per night)

function readSafe(){
  const s=getComputedStyle(saEl);
  const p=v=>parseFloat(v)||0;
  return {t:p(s.paddingTop),r:p(s.paddingRight),b:p(s.paddingBottom),l:p(s.paddingLeft)};
}
function layout(){
  W=Math.max(200,window.innerWidth|0); H=Math.max(200,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cache.width=cv.width; cache.height=cv.height;
  const sf=readSafe(); L.sf=sf;
  const port=W/H<1.1; L.port=port;
  L.rows=port?3:1; L.cols=port?3:9;
  const gut=port?Math.max(18,W*0.05):Math.max(14,W*0.018);
  L.gut=gut;
  L.x0=sf.l+gut; L.x1=W-sf.r-gut; L.cw=(L.x1-L.x0)/L.cols;
  const bot=H-sf.b-4, top=sf.t;
  let S,U,A,Gd,LH;
  if(port){
    const skyMin=Math.max(H*0.085,52);
    LH=(bot-top-skyMin)/3; S=LH/2.25;
  }else{
    const R=0.8*L.cw; S=(2*R/0.95)/1.53;
    LH=S*2.92;
    const lim=(bot-top)*0.76; if(LH>lim){S*=lim/LH;}
  }
  U=port?0.58*S:1.25*S; A=0.14*S; Gd=0.53*S; LH=U+A+S+Gd;
  L.S=S; L.U=U; L.A=A; L.G=Gd; L.LH=LH;
  L.sky=bot-L.rows*LH;
  L.lv=[];
  for(let r=0;r<L.rows;r++){
    const t0=L.sky+r*LH;
    L.lv.push({top:t0,awnT:t0+U*0.14,awnB:t0+U+A,gTop:t0+U+A+S,gBot:t0+LH,roadY:t0+U+A+S+Gd*0.52});
  }
  L.R=clamp(0.5*(S+Gd)*0.95,0.53*L.cw,0.8*L.cw);
  L.unit=Math.min(S,L.cw*0.95);
  L.hem=Math.max(top+10,L.sky*(port?0.8:0.6));
  L.pos=[];
  for(let i=0;i<SLOTS;i++){
    let row,col;
    if(port){row=Math.floor(i/3);const k=i%3;col=row%2===0?k:2-k;}else{row=0;col=i;}
    const lv=L.lv[row];
    const cxp=L.x0+(col+0.5)*L.cw;
    L.pos.push({row,col,x:cxp,lv,fy:lv.roadY,dcy:lv.awnB+(S+Gd)*0.5});
  }
  // edge polylines (between chain neighbours)
  L.edges=[];
  for(let e=0;e<SLOTS-1;e++){
    const a=L.pos[e], b=L.pos[e+1];
    let pts;
    if(a.row===b.row) pts=[[a.x,a.fy],[b.x,b.fy]];
    else{
      const gx=a.col===0?L.x0-gut*0.5:L.x1+gut*0.5;
      pts=[[a.x,a.fy],[gx,a.fy],[gx,b.fy],[b.x,b.fy]];
    }
    let len=0; const seg=[];
    for(let k=1;k<pts.length;k++){const d=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]);seg.push(d);len+=d;}
    L.edges.push({pts,seg,len});
  }
  if(G) placeSlots();
}
// point on chain path. s in [0, SLOTS-1]
function pathPt(s){
  s=clamp(s,0,SLOTS-1);
  const e=Math.min(SLOTS-2,Math.floor(s)); const f=s-e;
  const E=L.edges[e]; let d=f*E.len;
  for(let k=0;k<E.seg.length;k++){
    if(d<=E.seg[k]||k===E.seg.length-1){const t=E.seg[k]?d/E.seg[k]:0;const p=E.pts[k],q=E.pts[k+1];return [lerp(p[0],q[0],t),lerp(p[1],q[1],t),q[0]-p[0],q[1]-p[1]];}
    d-=E.seg[k];
  }
  return [E.pts[0][0],E.pts[0][1],1,0];
}

/* ===== night (cycle) creation ===== */
const SHOPS=['hat','umb','fountain','toy','clock','shadeA','shadeB'];
const DAYPREF={bakery:'y',cafe:'p',toy:'m',clock:'b',hat:'p',umb:'b',fountain:'m',shadeA:'y',shadeB:'m'};
const HAS_UP={bakery:1,cafe:1,toy:1,clock:1,hat:1,umb:1};
function arrange(){
  for(let tries=0;tries<400;tries++){
    const t=new Array(SLOTS); t[4]='bakery';
    const cafeAt=rnd()<0.5?3:5; t[cafeAt]='cafe';
    const rest=shuffle(SHOPS.slice()); let k=0;
    for(let i=0;i<SLOTS;i++) if(!t[i]) t[i]=rest[k++];
    const p=n=>t.indexOf(n);
    if(Math.abs(p('umb')-p('fountain'))!==1) continue;
    if(Math.abs(p('shadeA')-p('shadeB'))===1) continue;
    if(Math.abs(p('toy')-p('clock'))<2) continue;
    // at least one shade must sit between two shops (gap to bridge)
    let gap=false; for(const n of ['shadeA','shadeB']){const q=p(n);if(q>0&&q<SLOTS-1&&!/shade/.test(t[q-1])&&!/shade/.test(t[q+1]))gap=true;}
    if(!gap) continue;
    return t;
  }
  return ['hat','umb','fountain','cafe','bakery','shadeA','toy','shadeB','clock'];
}
function newNight(){
  const types=arrange();
  const cols=types.map(n=>DAYPREF[n]);
  const pal=['y','b','m','p'];
  for(let i=1;i<SLOTS;i++){ if(cols[i]===cols[i-1]){ for(const c of pal){ if(c!==cols[i-1]&&(i+1>=SLOTS||c!==cols[i+1])){cols[i]=c;break;} } } }
  G={
    t:0, phase:'night', phaseT:0,
    slots:types.map((n,i)=>({i,type:n,open:false,t:0,px:0,py:0,sq:-9,wig:-9,act:-9,tapN:0,lastTap:-9,col:DAY[cols[i]],
      up:HAS_UP[n]?{rev:false,revT:-9,open:false,t:0,px:0,py:0,sq:-9,wig:-9,wave:-9,lastTap:-9}:null,
      awn:{lift:0,to:0,wig:-9,lit:0},sign:-9,sx:rr(-1,1)})),
    edges:new Array(SLOTS-1).fill(0).map(()=>({on:false,t:-9})),
    mem:{order:[],first:null,combos:{},edgeOrder:[],openCount:0},
    hatShape:{brim:Math.floor(rnd()*4),crown:Math.floor(rnd()*3)},
    roofs:types.map(()=>({h:rr(0,0.12),kind:Math.floor(rnd()*4),k2:rnd()})),
    stars:new Array(14).fill(0).map(()=>[rnd(),rnd(),rr(0.6,1.3)]),
    streak:0,lastPeel:-9,
    curtain:{y:1,roll:0},   // 1 = night hem
    sunY:0,
    tapLock:{}
  };
  G.idx={}; G.slots.forEach(s=>{G.idx[s.type]=s;});
  if(typeof DEFER!=='undefined') DEFER.length=0;
  initActors();
  placeSlots();
}
function S_(n){return G.idx[n];}
// geometry of each slot (recomputed on resize)
function placeSlots(){
  const S=L.S,cw=L.cw;
  for(const s of G.slots){
    const p=L.pos[s.i], lv=p.lv;
    let w=0.74*cw,h=0.78*S;
    if(s.type==='bakery'){w=0.9*cw;h=0.9*S;}
    else if(s.type==='fountain'){w=0.82*cw;h=0.86*S;}
    else if(/shade/.test(s.type)){w=0.62*cw;h=0.7*S;}
    w=Math.min(w,h*1.9);
    s.w=w; s.h=h; s.x=p.x-w/2; s.y=lv.gTop-0.03*S-h; s.cx=p.x; s.cy=s.y+h/2;
    s.lv=lv; s.row=p.row; s.dcx=p.x; s.dcy=p.dcy;
    // hit box with tolerance: whole slot column inside shop band
    // hit box: the window (and its hanging sign) with a forgiving margin, not the whole street
    const tx=Math.max(10,cw*0.08), ty=Math.max(8,L.G*0.3);
    s.hit={x:s.x-tx,y:lv.awnB-2,w:w+2*tx,h:(s.y+h)-lv.awnB+2+ty};
    if(s.up){
      const u=s.up, uw=0.46*cw, uh=0.52*L.U;
      u.w=uw;u.h=uh;u.x=p.x-uw/2;u.y=lv.top+0.32*L.U;u.cx=p.x;u.cy=u.y+uh/2;
      const ux=Math.max(10,cw*0.1), uy=Math.max(8,L.U*0.14);
      u.hit={x:u.x-ux,y:u.y-uy,w:uw+2*ux,h:uh+2*uy};
    }
    s.awn.x=p.x-cw*0.5; s.awn.w=cw; s.awn.y=lv.awnT; s.awn.h=lv.awnB-lv.awnT;
  }
  buildCache();
}

/* ===== static cache: ground strips + building silhouettes ===== */
function buildCache(){
  const c=cc; c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,W,H);
  const cw=L.cw;
  for(let r=0;r<L.rows;r++){
    const lv=L.lv[r];
    c.fillStyle=ECRU; c.fillRect(0,lv.gTop,W,(r===L.rows-1?H:lv.gBot)-lv.gTop);
    // side walls / stairs base in gutters (ecru retaining wall)
    if(L.port&&r<L.rows-1){
      const side=r%2===0?1:0;
      const gx=side?L.x1:0, gw=side?W-L.x1:L.x0;
      c.fillStyle=ECRU; c.fillRect(gx,lv.gTop,gw,L.lv[r+1].gBot-lv.gTop);
    }
  }
  c.fillStyle=INK;
  for(const s of G.slots){
    const p=L.pos[s.i], lv=p.lv, rf=G.roofs[s.i];
    const x=p.x-cw*0.5-0.5, w=cw+1;
    const top=lv.top+L.U*(0.04+rf.h);
    if(s.type==='fountain'){
      // plaza: low wall + tree
      c.fillRect(x,lv.awnB-L.A*0.6,w,lv.gTop-lv.awnB+L.A*0.6);
      const tx=p.x, ty=lv.top+L.U*0.55, tr=Math.min(cw*0.36,L.U*0.42);
      c.fillRect(tx-tr*0.09,ty,tr*0.18,lv.awnB-ty);
      c.beginPath(); c.arc(tx,ty,tr,0,TAU); c.arc(tx-tr*0.7,ty+tr*0.35,tr*0.6,0,TAU); c.arc(tx+tr*0.7,ty+tr*0.3,tr*0.62,0,TAU); c.fill();
      continue;
    }
    c.fillRect(x,top,w,lv.gTop-top);
    c.beginPath();
    if(rf.kind===0){ c.moveTo(x,top); c.lineTo(p.x,top-L.U*0.16); c.lineTo(x+w,top); }
    else if(rf.kind===1){ c.rect(p.x+cw*(0.12+rf.k2*0.15),top-L.U*0.16,cw*0.1,L.U*0.17); }
    else if(rf.kind===2){ c.rect(p.x-cw*0.3,top-L.U*0.1,cw*0.26,L.U*0.11); c.rect(p.x-cw*0.24,top-L.U*0.17,cw*0.14,L.U*0.08); }

  s.act=now;
  if(n==='bakery'){ const b=A.bread; b.heat=Math.min(3,b.heat+1); b.heatT=now; if(now-b.lastTap>0.35){ b.lastTap=now; b.timer=Math.min(b.timer,0.08); } }
  else if(n==='cafe'){ const w=A.waiter; w.hurry=Math.min(3,w.hurry+1); w.hurryT=now; A.cafe.cust.forEach((c,i)=>c.cheer=now+i*0.12); SFX.plip(2+w.hurry); }
  else if(n==='toy'){ const T=A.toy; if(T.car.st==='wait'){ T.wind=Math.min(3,T.wind+1); SFX.wind(T.wind);} else SFX.plip(4); }
  else if(n==='clock'){ if(now-A.clock.lastTap>0.6){ A.clock.lastTap=now; ringBell(false); } }
  else if(n==='hat'){ A.hat.bounce=now; if(A.boy.hat&&!A.boy.hatFly){ A.hat.variant++; tossHat(); } else SFX.plip(3); }
  else if(n==='umb'){ A.umb.swing=now; if(A.umb.combo){ A.umb.spinV=Math.min(3,A.umb.spinV+1.2); SFX.spin(); } else SFX.plip(1); }
  else if(n==='fountain'){ const f=A.fount; f.jet=Math.min(3,f.jet+1); f.jetT=now; f.burst=now; SFX.splash(); if(A.umb.combo){A.umb.spinV=Math.min(3,A.umb.spinV+0.8);} }
  else if(n==='shadeA'){ A.shadeA.t=now; SFX.bike(); }
  else if(n==='shadeB'){ A.shadeB.t=now; SFX.sweep(); for(let k=0;k<4;k++) addP({k:'dust',x:s.cx+rr(-10,10),y:s.lv.roadY,vx:rr(-40,40),vy:rr(-60,-20),l:0,m:0.6,s:rr(2,4)*L.unit/90,c:INK}); }
  if(s.up&&s.up.open) s.up.wave=now;
  if(fromUp) s.sign=now;
}
function tossHat(){
  const h=S_('hat'), b=A.boy; const p=pathPt(b.s);
  b.hatFly={t:0,x0:h.cx,y0:h.cy,shape:{brim:(G.hatShape.brim+A.hat.variant)%4,crown:(G.hatShape.crown+A.hat.variant)%3}};
  SFX.hat(); activity(h);
}
function ringBell(big){
  const c=A.clock; c.ring=G.t; SFX.bell(big); const cs=S_('clock'); activity(cs);
  const t=S_('toy');
  if(t.open){ A.toy.waves.push({s:cs.i,to:t.i,t:0,big}); }
}
/* ===== boy behaviour ===== */
function boyPt(){ const p=pathPt(A.boy.s); p[0]+=A.boy.off||0; return p; }
function boyGo(i,act,run){ const b=A.boy; b.goal={s:i,act,run:!!run}; }
function boyLook(x,y){ const b=A.boy; b.lookX=x; b.lookY=y; b.lookT=G.t; }
function boyToEdge(e){
  const b=A.boy; const r=boyRange();
  const a=e, c=e+1;
  if(r[0]<=a&&r[1]>=c){ const far=Math.abs(b.s-a)>Math.abs(b.s-c)?a:c; boyGo(far,'point',true); }
  else { b.tilt=G.t; const p=pathPt(e+0.5); boyLook(p[0],p[1]-L.S*0.5); }
}
function updBoy(dt){
  const b=A.boy, now=G.t;
  const r=boyRange();
  if(G.phase==='night'){
    if(b.goal){ b.sT=clamp(b.goal.s,r[0],r[1]); }
    const d=b.sT-b.s, sp=(b.goal&&b.goal.run?2.3:1.0)*dt;
    if(Math.abs(d)>0.005){ const st=Math.sign(d)*Math.min(Math.abs(d),sp); const p0=pathPt(b.s); b.s+=st; const p1=pathPt(b.s); if(Math.abs(p1[0]-p0[0])>0.01) b.dir=Math.sign(p1[0]-p0[0]); b.moving=1; b.ph+=dt*(b.goal&&b.goal.run?16:9); }
    else { b.s=b.sT; b.moving=0; if(b.goal){ b.act=b.goal.act; b.actT=now; b.goal=null; } }
    // idle curiosity
    if(!b.moving&&!b.goal&&now-b.actT>2.2){
      const bk=S_('bakery');
      if(A.bread.pile>=3&&r[0]<=bk.i&&r[1]>=bk.i&&Math.abs(b.s-bk.i)>0.01&&now-b.lastIdle>6){ b.lastIdle=now; boyGo(bk.i,'sniff',false); }
      else if(A.bread.pile>=2&&Math.abs(b.s-bk.i)<0.01&&now-b.lastIdle>5){ b.lastIdle=now; b.act='sniff'; b.actT=now; }
      else if(now-b.lastIdle>5.5){ b.lastIdle=now; b.tilt=now; }
    }
  }
  { const k0=Math.round(clamp(b.s,0,SLOTS-1)); const side=L.pos[k0].col<L.cols/2?1:-1; const to=(b.moving||G.phase!=='night')?0:side*L.cw*0.42; b.off=(b.off||0)+(to-(b.off||0))*(1-Math.exp(-dt*5)); }
  // hat flight
  if(b.hatFly){ const f=b.hatFly; f.t+=dt/0.9; if(f.t>=1){ b.hat=f.shape; b.hatFly=null; b.hop=now; combo('hat',boyPt()[0],boyPt()[1]-L.unit); } }
  // flashlight ring
  const p=boyPt(); const big=!!b.hat;
  let tx=p[0]+b.dir*L.unit*0.35, ty=p[1]-L.unit*0.42, tr=L.unit*0.3;
  if(big&&G.phase==='night'){
    tr=Math.max(L.cw*0.55,L.unit*0.7);
    if(now>b.ringT){ // choose a hidden awning nearby to sweep
      let best=-1,bd=1e9; for(const s of G.slots){ if(!s.up||s.awn.to>=1) continue; const dd=Math.abs(s.i-b.s)+(s.row!==G.slots[Math.round(clamp(b.s,0,8))].row?1.5:0)+(s.i===b.ringPick?0.6:0); if(dd<bd){bd=dd;best=s.i;} }
      b.ringPick=best; b.ringT=now+3.2;
    }
    if(b.ringPick>=0&&G.slots[b.ringPick].awn.to<1){ const s=G.slots[b.ringPick]; tx=s.cx; ty=s.awn.y+s.awn.h*0.62; }
    else { tx=p[0]+b.dir*L.unit*0.4; ty=p[1]-L.unit*0.55; }
  }
  const R=b.ring; const k=1-Math.exp(-dt*4); if(!R.r){R.x=tx;R.y=ty;} R.x+=(tx-R.x)*k; R.y+=(ty-R.y)*k; R.r+=(tr-R.r)*k;
  for(const s of G.slots){ const a=s.awn; const inR=big&&s.up&&a.to<1&&Math.hypot(s.cx-R.x,a.y+a.h*0.62-R.y)<R.r*0.7; a.lit+=((inR?1:0)-a.lit)*k; }
}
/* ===== shop updates ===== */
function updShops(dt){
  const now=G.t, bk=S_('bakery'), cf=S_('cafe'), B=A.bread, Wt=A.waiter;
  // heat decays
  if(B.heat>0&&now-B.heatT>5){B.heat--;B.heatT=now;}
  if(Wt.hurry>0&&now-Wt.hurryT>5){Wt.hurry--;Wt.hurryT=now;}
  if(A.fount.jet>1&&now-A.fount.jetT>4){A.fount.jet--;A.fount.jetT=now;}
  // bakery
  if(bk.open&&bk.t>0.5){
    const waitingW=cf.open&&Wt.st==='wait';
    // cafe opened first: the baker bakes for the waiting waiter, loaf by loaf (no pile)
    const gate=B.direct&&cf.open&&!waitingW&&B.heat===0;
    if((B.pile<9||waitingW)&&!gate) B.timer-=dt*(1+0.6*B.heat);
    if(B.timer<=0){
      B.timer=3.4; B.shovel=now; SFX.bake(B.heat+(B.pile>>1));
      const side=cf.i>bk.i?1:-1;
      if(waitingW&&B.pile===0){ B.fly.push({t:0,to:'w'}); }
      else B.fly.push({t:0,to:'p',n:B.pile});
      activity(bk);
    }
  }
  for(let k=B.fly.length-1;k>=0;k--){ const f=B.fly[k]; f.t+=dt/0.45; if(f.t>=1){ B.fly.splice(k,1); if(f.to==='w'){ if(Wt.st==='wait'){Wt.st='carry';Wt.carry=1;} else B.pile=Math.min(9,B.pile+1); } else { B.pile=Math.min(9,B.pile+1); if(B.pile===3&&!cf.open) A.boy.tilt=now; } } }
  // waiter (only when cafe open)
  if(cf.open&&cf.t>0.6){
    const sp=(0.85+0.4*Wt.hurry)*dt;
    const mv=(to)=>{ const d=to-Wt.s; if(Math.abs(d)<=sp){Wt.s=to;return true;} Wt.s+=Math.sign(d)*sp; Wt.ph+=dt*(10+Wt.hurry*3); return false; };
    if(Wt.st==='home'){ if(bk.open&&(B.pile>0||bk.t>0.5)&&now>Wt.wait) Wt.st='go'; }
    else if(Wt.st==='go'){ if(mv(bk.i)){ if(B.pile>0){B.pile--;Wt.carry=1;Wt.st='carry';SFX.plip(5);} else { Wt.st='wait'; if(B.direct) B.timer=Math.min(B.timer,1.1); } } }
    else if(Wt.st==='wait'){ /* handoff happens when a loaf comes out */ }
    else if(Wt.st==='carry'){ if(mv(cf.i)){ Wt.st='serve'; Wt.t=now; } }
    else if(Wt.st==='serve'){ if(now-Wt.t>0.25){ const c=A.cafe.cust[A.cafe.served%2]; c.eat=now; A.cafe.served++; Wt.carry=0; Wt.st='home'; Wt.wait=now+0.5/(1+Wt.hurry*0.5); SFX.serve(); setTimeout0(()=>SFX.munch(),0.5);
      activity(cf); combo('bread',cf.cx,cf.cy); if(Math.abs(A.boy.s-cf.i)<1.2) A.boy.act='wave',A.boy.actT=now; } }
  }
  // toy & clock
  const ty=S_('toy'), ck=S_('clock'), T=A.toy, C=A.clock;
  if(ck.open&&ck.t>0.6){ C.pend+=dt*3.2; C.timer-=dt; if(C.timer<=0){ C.timer=6; ringBell(false); } }
  for(let k=T.waves.length-1;k>=0;k--){ const w=T.waves[k]; const d=w.to-w.s; const st=Math.sign(d)*dt*7; if(Math.abs(d)<=Math.abs(st)){ T.waves.splice(k,1); carGo(); } else w.s+=st; w.t+=dt; }
  if(ty.open){
    const car=T.car;
    if(car.st==='wait'){ T.key+=dt*(2+T.wind*3); if(ty.t>0.4&&T.wind<1) T.wind=1; car.s=ty.i; }
    else if(car.st==='run'){ car.t+=dt; const sp=dt*(1.9+0.5*car.pw); const d=car.to-car.s; if(Math.abs(d)<=sp){ car.s=car.to; if(car.leg===0){ car.leg=1; car.to=ty.i; } else { car.st='wait'; T.wind=1; } } else { car.s+=Math.sign(d)*sp; car.dir=Math.sign(d); } T.key+=dt*2; if(rnd()<dt*12){ const p=pathPt(car.s); addP({k:'puff',x:p[0]-car.dir*L.unit*0.2,y:p[1]-L.unit*0.05,vx:-car.dir*30,vy:-20,l:0,m:0.5,s:L.unit*0.04,c:INK}); } }
    else if(car.st==='disc'){ car.t+=dt; car.x=Math.sin(car.t*(5+car.pw))*L.cw*0.36; if(car.t>2.2+car.pw*0.6){ car.st='wait'; car.x=0; T.wind=1; } car.dir=Math.cos(car.t*(5+car.pw))>0?1:-1; }
  }
  // umbrellas & fountain
  const U=A.umb;
  if(U.combo){ U.spin+=dt*(0.25+U.spinV); U.spinV=Math.max(0,U.spinV-dt*0.8); }
  if(U.combo===1&&now-U.comboT>2.4){ U.combo=2; const um=S_('umb'),fo=S_('fountain'); combo('umb',(um.cx+fo.cx)/2,um.lv.awnB); activity(um); activity(fo); }
  if(S_('fountain').open){ const fo=S_('fountain'); const f=A.fount; if(rnd()<dt*(6+f.jet*5)) { const jh=L.S*(0.25+0.15*f.jet); addP({k:'drop',x:fo.cx+rr(-4,4),y:fo.lv.gTop-L.S*0.32-jh*0.9,vx:rr(-70,70),vy:rr(-40,10),l:0,m:0.7,s:L.unit*0.022,c:INK,gy:300}); } }
}
function carGo(){
  const ty=S_('toy'), T=A.toy, car=T.car; if(!ty.open||car.st!=='wait') return;

    const ck=S_('clock'); let dir=ck.i>ty.i?1:-1; if(ty.i+dir<r[0]||ty.i+dir>r[1]) dir=-dir;

/* ===== scene rendering ===== */
const RING='#f6e8c2';
function hintOf(kind,s){ const h=A.hint; return h&&h.kind===kind&&h.s===s; }
function hintHop(){ const st=Math.max(A.hintT,A.lastInput+1.0); const k=G.t-st; if(k<0) return 0; const m=k%2.4; return m<0.5?Math.sin(m/0.5*Math.PI):0; }
function windowPath(s,x,y,w,h){
  const n=s.type;
  if(n==='bakery'||n==='fountain'){ cx.moveTo(x,y+h); cx.lineTo(x,y+w*0.5); cx.arc(x+w/2,y+w*0.5,w/2,Math.PI,TAU); cx.lineTo(x+w,y+h); cx.closePath(); }
  else if(n==='clock'){ const r=Math.min(w,h)*0.5; cx.moveTo(x+w/2+r,y+h/2); cx.arc(x+w/2,y+h/2,r,0,TAU); }
  else if(n==='shadeA'){ cx.moveTo(x,y+h); cx.lineTo(x+w*0.08,y+h*0.25); cx.quadraticCurveTo(x+w*0.5,y-h*0.08,x+w*0.92,y+h*0.3); cx.lineTo(x+w,y+h); cx.closePath(); }
  else if(n==='shadeB'){ cx.moveTo(x,y+h); cx.lineTo(x,y+h*0.18); cx.lineTo(x+w*0.35,y); cx.lineTo(x+w,y+h*0.1); cx.lineTo(x+w*0.94,y+h); cx.closePath(); }
  else if(n==='cafe'){ rrect(x,y,w,h,w*0.28); }
  else rrect(x,y,w,h,Math.min(w,h)*0.06);
}
function slotGeom(s){
  // squash & stretch around tap point, plus hint hop / wiggle
  let ox=0,oy=0,sx=1,sy=1;
  const tq=G.t-s.sq; if(tq>=0&&tq<0.7){ const w=wob(tq,22,6); sx=1+0.12*w; sy=1-0.12*w; }
  const tw=G.t-s.wig; if(tw>=0&&tw<0.5){ ox=Math.sin(tw*40)*3*(1-tw/0.5); }
  if(!s.open&&hintOf('slot',s.i)) oy=-hintHop()*L.S*0.06;
  return {ox,oy,sx,sy};
}
function drawDiscs(lvRow){
  const lv=L.lv[lvRow];
  cx.save(); cx.beginPath(); cx.rect(0,lv.awnB-1,W,lv.gBot-lv.awnB+1); cx.clip();
  for(const s of G.slots){ if(s.row!==lvRow||!s.open) continue;
    const t=s.t, r0=Math.hypot(s.w,s.h)*0.5;
    if(t<0.35){ // day opening inside window from the touched point
      cx.save(); cx.beginPath(); windowPath(s,s.x,s.y,s.w,s.h); cx.clip();
      cx.fillStyle=s.col; cx.beginPath(); cx.arc(s.px,s.py,r0*2.1*ease(t/0.35),0,TAU); cx.fill(); cx.restore();
    }
    if(t>0.2){ const k=back(clamp((t-0.2)/0.7,0,1)); const r=lerp(r0*0.8,L.R,k);
      cx.fillStyle=s.col; cx.beginPath(); cx.arc(s.dcx,s.dcy,r,0,TAU); cx.fill(); }
  }
  cx.restore();
}
function roadWidth(){ return L.G*0.44; }
function drawRoads(){ roadPass(true); roadPass(false); }
function roadPass(edge){
  const rw0=roadWidth(), rw=edge?rw0+4:rw0; const RC=edge?INK:ROAD;
  cx.strokeStyle=RC; cx.lineCap='round'; cx.lineJoin='round';
  for(const s of G.slots){ if(!s.open||s.t<0.4) continue; const k=ease((s.t-0.4)/0.5); const p=L.pos[s.i];
    cx.lineWidth=rw; cx.beginPath(); cx.moveTo(p.x-L.cw*0.3*k,p.fy); cx.lineTo(p.x+L.cw*0.3*k,p.fy); cx.stroke(); }
  for(let e=0;e<SLOTS-1;e++){ const E=G.edges[e]; if(!E.on) continue; const k=ease((G.t-E.t)/0.6);
    const fl=(A.flashE===e)?1.35:1;
    cx.lineWidth=rw*fl; cx.strokeStyle=(A.flashE===e&&!edge)?'#ffffff':RC; const P=L.edges[e];
    // draw progressively from both ends toward middle
    cx.beginPath(); let total=P.len*k, d=0; cx.moveTo(P.pts[0][0],P.pts[0][1]);
    for(let i=1;i<P.pts.length;i++){ const sg=P.seg[i-1]; if(d+sg<=total){cx.lineTo(P.pts[i][0],P.pts[i][1]);d+=sg;} else { const f=(total-d)/sg; cx.lineTo(lerp(P.pts[i-1][0],P.pts[i][0],f),lerp(P.pts[i-1][1],P.pts[i][1],f)); break; } }
    cx.stroke();
    if(!edge&&P.pts.length>2&&k>0.5){ // stair notches on vertical part
      const gx=P.pts[1][0], y0=P.pts[1][1], y1=P.pts[2][1]; cx.strokeStyle=INK; cx.lineWidth=1.5; cx.beginPath();
      for(let y=y0+rw*0.8;y<y1-rw*0.6;y+=rw*0.55){ cx.moveTo(gx-rw*0.35,y); cx.lineTo(gx+rw*0.35,y);} cx.stroke(); cx.strokeStyle=RC; }
  }
  cx.lineCap='round';
}
function drawClosed(s){
  const g=slotGeom(s); const hint=hintOf('slot',s.i);
  cx.save(); cx.translate(s.px||s.cx,s.py||s.cy); cx.scale(g.sx,g.sy); cx.translate(-(s.px||s.cx)+g.ox,-(s.py||s.cy)+g.oy);
  const t=s.open?s.t:-1;
  if(t<0){
    const pulse=hint?hintHop():0;
    cx.beginPath(); windowPath(s,s.x,s.y,s.w,s.h);
    cx.fillStyle=INK; cx.fill();
    cx.lineWidth=2.2+pulse*3; cx.strokeStyle=pulse>0.05?ROAD:ECRU; cx.stroke();
    if(/shade/.test(s.type)){ // shadow: a few ecru chinks hint at something inside
      cx.fillStyle=ECRU; const ph=G.t*0.7+s.sx*3;
      cx.beginPath(); cx.arc(s.cx+s.w*0.18*Math.sin(ph),s.cy+s.h*0.15,1.6,0,TAU); cx.fill(); }
  }else if(t<0.55){
    // peel: pane minus growing day disc, with a curled paper lip
    const r0=Math.hypot(s.w,s.h)*0.5, rd=r0*2.1*ease(t/0.35);
    cx.save(); cx.beginPath(); windowPath(s,s.x,s.y,s.w,s.h); cx.clip();
    cx.beginPath(); cx.rect(s.x-2,s.y-2,s.w+4,s.h+4); cx.arc(s.px,s.py,rd,0,TAU,true); cx.fillStyle=INK; cx.fill();
    cx.restore();
    const lip=Math.max(0,1-t/0.55)*L.unit*0.12;
    cx.save(); const m=L.unit*0.14; cx.beginPath(); cx.rect(s.x-m,s.y-m,s.w+2*m,s.h+2*m); cx.clip();
    if(lip>0.5){ cx.beginPath(); cx.arc(s.px,s.py,rd+lip*0.5,0,TAU); cx.lineWidth=lip; cx.strokeStyle=INK; cx.stroke();
      cx.beginPath(); cx.arc(s.px,s.py,rd+lip*0.95,0.3+t*4,2.4+t*4); cx.lineWidth=1.6; cx.strokeStyle=ECRU; cx.stroke(); }
    cx.restore();
  }
  if(s.open){ // window frame lines in ink over day colour
    cx.beginPath(); windowPath(s,s.x,s.y,s.w,s.h); cx.lineWidth=Math.max(2,L.unit*0.035); cx.strokeStyle=INK; cx.stroke(); }
  cx.restore();
}
function drawSign(s){

  const ts=G.t-s.sign; const sw=ts>=0&&ts<2?Math.sin(ts*9)*0.5*Math.exp(-ts*1.4):Math.sin(G.t*1.3+s.sx*4)*0.03;
  const hint=!s.open&&hintOf('slot',s.i); const oy=hint?-hintHop()*L.S*0.06:0;

  cx.save(); cx.translate(x,y); cx.rotate(sw);
  sil(()=>{ pLine(-sz*0.35,0,-sz*0.35,sz*0.35,1.4); pLine(sz*0.35,0,sz*0.35,sz*0.35,1.4); signIcon(s.type,0,sz*0.75,sz); }, s.open?0:1.6);
  cx.restore();

function awningShape(s,lift,wig){
  const a=s.awn, h=a.h*(1-0.84*lift), x=a.x+1.5, w=a.w-3, y=a.y+wig;
  const n=Math.max(3,Math.round(w/(L.unit*0.18)));

function drawAwnings(){
  for(const s of G.slots){ if(s.type==='fountain') continue; const a=s.awn;
    const lt=a.to>=1?ease((G.t-a.t)/0.8):0; a.lift=lt;
    const tw=G.t-a.wig; const wig=(tw>=0&&tw<0.5)?Math.sin(tw*35)*2.5*(1-tw/0.5):0;

/* ===== morning: curtain roll, sunrise, road replay, parade ===== */
function allDone(){ for(const s of G.slots){ if(!s.open) return false; if(s.up&&!s.up.open) return false; } return true; }
function buildParade(){
  const m=G.mem, list=[{k:'boy'}], used={};
  if(m.first==='bread'){ list.push({k:'waiter'},{k:'cart'},{k:'waiter'},{k:'baker'}); used.bakery=used.cafe=1; }
  else if(m.first==='toy'){ list.push({k:'car'},{k:'car'},{k:'bell'},{k:'car'}); used.toy=used.clock=1; }
  const map={bakery:'baker',cafe:'waiter',toy:'car',clock:'bell',hat:'hat',umb:'umb',fountain:'flag',shadeA:'bike',shadeB:'sweep'};
  for(const t of m.order){ if(used[t]) continue; used[t]=1; list.push({k:map[t]}); }
  const firstI=S_(m.order[0]||'bakery').i;
  const from=firstI<=4?0:SLOTS-1, to=SLOTS-1-from;
  const dir=Math.sign(to-from);
  list.forEach((q,i)=>{ q.d=i*0.8; q.s=from; q.end=clamp(to-dir*i*0.42,0,SLOTS-1); q.hop=-9; q.p=null; q.ph=rnd()*6; });
  return {list,from,to,t:0,beat:0,boyIn:true};
}
function updPhase(dt){
  const t=G.phaseT;
  if(G.phase==='night'){
    if(allDone()){ if(!G.doneT) G.doneT=G.t; if(G.t-G.doneT>1.2){ G.phase='dawn'; G.phaseT=0; SFX.dawn(); A.hint=null; } }
  } else if(G.phase==='dawn'){
    SKYK=easeIO((t-0.8)/2.2);
    const n=G.mem.edgeOrder.length, r0=3.0, step=0.24;
    const k=Math.floor((t-r0)/step);
    if(t>=r0&&k<n){ const e=G.mem.edgeOrder[k]; if(A.flashE!==e){ A.flashE=e; SFX.road(k);} } else if(t>=r0) A.flashE=-1;
    if(t>r0+n*step+0.5){ G.phase='parade'; G.phaseT=0; A.parade=buildParade(); A.flashE=-1; }
  } else if(G.phase==='parade'){
    const P=A.parade; P.t+=dt; let done=true; const dir=Math.sign(P.to-P.from);
    for(const q of P.list){ const tt=P.t-q.d; if(tt<0){done=false;continue;} const lo=Math.min(P.from,q.end), hi=Math.max(P.from,q.end); q.s=clamp(P.from+dir*tt*1.35,lo,hi); q.ph+=dt*10; if(q.s!==q.end) done=false; }
    if(P.t>P.beat){ P.beat+=0.32; SFX.march(Math.round(P.beat/0.32)); }
    if(done){ G.phase='wave'; G.phaseT=0; }
  } else if(G.phase==='wave'){
    if(t>1.8){ G.phase='dusk'; G.phaseT=0; }
  } else if(G.phase==='dusk'){
    SKYK=1-easeIO(t/1.2);
    if(t>=1.45&&!G.rebuilt){ const keepT=t; newNight(); PARTS.length=0; G.phase='dusk'; G.phaseT=keepT; G.rebuilt=true; SFX.night(); SKYK=0; }
    if(t>3.0){ G.phase='night'; G.phaseT=0; G.rebuilt=false; G.doneT=0; A.lastInput=G.t; }
  }
}

  for(let i=DEFER.length-1;i>=0;i--){ if(G.t>=DEFER[i].t){ const f=DEFER[i].fn; DEFER.splice(i,1); f(); } }
  updBoy(dt); updShops(dt); updParts(dt); updPhase(dt);
  if(G.phase==='night'){ updHint(); ambT-=dt; if(ambT<=0){ ambT=3.5; const c=G.slots.filter(s=>!s.open&&!(A.hint&&A.hint.s===s.i)); if(c.length){ const s=c[Math.floor(rnd()*c.length)]; s.wig=G.t; } } }
}
