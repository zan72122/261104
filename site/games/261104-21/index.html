function reach(from){

  const m=adj(),d={},prev={},done={};d[from]=0;

// ================= brush helpers (sumi) =================
function resample(pts,step){
  const out=[{x:pts[0].x,y:pts[0].y}];let need=step;
  for(let i=1;i<pts.length;i++){

    let l=Math.hypot(bx-ax,by-ay);
    while(l>=need&&l>0){const t=need/l;ax+=(bx-ax)*t;ay+=(by-ay)*t;out.push({x:ax,y:ay});l-=need;need=step;}
    need-=l;
  }
  const lp=pts[pts.length-1],lo=out[out.length-1];
  if(Math.hypot(lp.x-lo.x,lp.y-lo.y)>step*.25) out.push({x:lp.x,y:lp.y});
  return out;
}
function curvePts(ax,ay,bx,by,bend,n){

  for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push({x:u*u*ax+2*u*t*cx+t*t*bx,y:u*u*ay+2*u*t*cy+t*t*by});}
  return o;
}
function offsetPts(pts,d){
  const o=[],n=pts.length;
  for(let i=0;i<n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];let dx=b.x-a.x,dy=b.y-a.y;const l=Math.hypot(dx,dy)||1;o.push({x:pts[i].x-dy/l*d,y:pts[i].y+dx/l*d});}
  return o;
}
// variable width brush stroke with taper and optional dry-brush scratches (kasure)
function brush(c,pts,w,seed,o){

  const q=resample(pts,Math.max(1.5,w*.45)),n=q.length;if(n<2) return;
  const t0=o.t0==null?.12:o.t0,t1=o.t1==null?.3:o.t1,wEnd=o.wEnd==null?1:o.wEnd,prog=o.prog==null?1:o.prog;

  for(let i=0;i<m;i++){

const baseCv=document.createElement('canvas'),bctx=baseCv.getContext('2d');

    c.beginPath();c.moveTo(-10,sb+.4*S);
    for(let x=-10;x<=W+10;x+=10){const u=x/W;const y=base-amp*(.55+.45*Math.sin(u*(5+m[k]*4)+m[k+1]*6))*(.6+.4*Math.sin(u*2.3+m[2]*5+k));c.lineTo(x,y);}

  }

function drawRiver(c){
  const hT=riverHT(),along=PORT?W:H,n=Math.ceil(along/10)+1,A=[],B=[];
  for(let i=0;i<n;i++){
    const u=i/(n-1)*along,r=riverAt(u),w=hT*(1+.08*Math.sin(u*.03+town.riverPh));
    if(PORT){A.push({x:u,y:r-w});B.push({x:u,y:r+w});}else{A.push({x:r-w,y:u});B.push({x:r+w,y:u});}
  }
  c.beginPath();c.moveTo(A[0].x,A[0].y);for(const p of A)c.lineTo(p.x,p.y);for(let i=B.length-1;i>=0;i--)c.lineTo(B[i].x,B[i].y);c.closePath();
  c.fillStyle=ink(.075);c.fill();
  // flow lines
  for(let k=0;k<4;k++){
    const off=(-.55+k*.36)*hT;let u=hs(k*7.7)*along*.2;
    while(u<along){
      const len=(.12+hs(u*.01+k)*.2)*along*.5,pts=[];
      for(let v=u;v<Math.min(along,u+len);v+=8){const r=riverAt(v)+off+Math.sin(v*.05+k)*.06*hT;pts.push(PORT?{x:v,y:r}:{x:r,y:v});}
      if(pts.length>2) brush(c,pts,.05*S,k*13+u,{a:.18,t0:.3,t1:.4});
      u+=len+(.1+hs(u*.02+k*3)*.25)*along*.4;
    }
  }
  // banks: broken dry strokes
  [A,B].forEach((side,si)=>{
    let i=0;
    while(i<side.length-2){
      const len=8+Math.floor(hs(i*.3+si*5)*18),seg=side.slice(i,Math.min(side.length,i+len));
      if(seg.length>1) brush(c,seg,.1*S,i+si*99,{a:.5,dry:true,t0:.15,t1:.25});
      i+=len+1+Math.floor(hs(i*.7+si)*3);
    }
    // reed ticks on the land side
    for(let j=3;j<side.length;j+=7+Math.floor(hs(j+si*3)*9)){
      const p=side[j],dir=si===0?-1:1,ox=PORT?0:dir,oy=PORT?dir:0;
      const l=(.25+hs(j*.9)*.25)*S;
      line(c,p.x+ox*.1*S,p.y+oy*.1*S,p.x+ox*l+(PORT?(hs(j)-.5)*.3*S:0),p.y+oy*l+(PORT?0:(hs(j)-.5)*.3*S),.05*S,j,{a:.4,t0:.05,t1:.6});
    }
  });
}

function drawSketchRoad(c,e,a0){

function drawBridge(c,e,prog){

  c.strokeStyle=ink(.42);c.lineWidth=Math.max(1,.035*S);c.beginPath();

const townCv=document.createElement('canvas'),tctx=townCv.getContext('2d');

function townDrawables(){
  const list=[];
  town.sites.forEach(s=>list.push({y:LP.sites[s.i].y,t:'site',s:s}));
  list.push({y:LP.pine.y,t:'pine'});
  if(town.bench.on) list.push({y:LP.bench.y,t:'bench'});
  list.sort((a,b)=>a.y-b.y);
  return list;
}
function renderTown(){
  if(townCv.width!==Math.round(W*DPR)||townCv.height!==Math.round(H*DPR)){townCv.width=Math.max(1,Math.round(W*DPR));townCv.height=Math.max(1,Math.round(H*DPR));}
  const c=tctx;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,townCv.width,townCv.height);c.setTransform(DPR,0,0,DPR,0,0);
  for(const e of town.edges){
    if(e.ink&&!e.anim&&e.k!=='bridge') drawEdge(c,e,1);
    else if(!e.ink&&e.sk) drawSketchRoad(c,e);
  }
  for(const e of town.edges) if(e.ink&&!e.anim&&e.k==='bridge') drawEdge(c,e,1);
  for(const d of townDrawables()){
    if(d.t==='site'){const s=d.s;if(s.floors===0) drawPlot(c,s);else if(!s.anim) drawHouse(c,s,s.floors,0);}
    else if(d.t==='pine'){if(!town.pine.anim) drawPine(c,LP.pine.x,LP.pine.y,1,!town.pine.ink,town.pine.seed,0);}
    else if(d.t==='bench'){if(!town.bench.anim) drawBench(c,LP.bench.x,LP.bench.y,1);}
  }
  townDirty=false;
}

// ================= dough + brush =================
const DN=44;
const dox=new Float32Array(DN),doy=new Float32Array(DN),dvx=new Float32Array(DN),dvy=new Float32Array(DN);
const DPX=new Float32Array(DN),DPY=new Float32Array(DN);
const dough={grab:null,dentT:-9,dentA:-PI/2,relT:-9,brushA:-PI/2,brushV:0,load:0,sugA:-PI/2,guide:1};
function resetDough(){dox.fill(0);doy.fill(0);dvx.fill(0);dvy.fill(0);dough.grab=null;}
const gauss=(d,s)=>Math.exp(-d*d/(2*s*s));
function doughStep(dt){
  const D=LP.D,R=LP.R,G=dough.grab||demoGrab();
  let vx=0,vy=0,eff=0;
  if(G){
    const fd=dist(G.fx,G.fy,D.x,D.y);
    if(fd>R*.3){const na=Math.atan2(G.fy-D.y,G.fx-D.x);G.ang+=angDiff(na,G.ang)*Math.min(1,dt*14);}
    const rx=D.x+Math.cos(G.ang)*R,ry=D.y+Math.sin(G.ang)*R;
    vx=G.fx-rx;vy=G.fy-ry;const ext=Math.hypot(vx,vy),out=fd>R;
    if(out){const mx=1.3*R;eff=mx*(1-Math.exp(-ext/mx));if(ext>.001){vx=vx/ext*eff;vy=vy/ext*eff;}}
    else{vx*=.45;vy*=.45;eff=0;}
    G.eff=eff;G.ext=out?ext:0;
  }
  const k=G?60:165,cd=G?11:6.2;
  for(let i=0;i<DN;i++){
    const th=i/DN*TAU;let tx=0,ty=0;
    if(G){
      const w=gauss(angDiff(th,G.ang),.45);tx=vx*w;ty=vy*w;
      const inw=-.07*eff*(1-w);tx+=Math.cos(th)*inw;ty+=Math.sin(th)*inw;
    }
    dvx[i]+=(k*(tx-dox[i])-cd*dvx[i])*dt;dvy[i]+=(k*(ty-doy[i])-cd*dvy[i])*dt;
    dox[i]+=dvx[i]*dt;doy[i]+=dvy[i]*dt;
  }
  // brush pointer
  const ta=G?G.ang:dough.sugA;
  const acc=angDiff(ta,dough.brushA)*(G?90:20)-dough.brushV*(G?14:6);
  dough.brushV+=acc*dt;dough.brushA+=dough.brushV*dt;
  dough.load=lerp(dough.load,G?Math.min(1,.3+eff/(1.3*R)):0,Math.min(1,dt*8));
}
function computeDoughPts(){
  const D=LP.D,R=LP.R,da=T-dough.dentT;
  const dent=da<.14?1:Math.max(0,1-(da-.14)/.4);
  const gb=dough.guide*(.07*R)*Math.pow(Math.max(0,Math.sin(T*TAU/1.7)),6);
  for(let i=0;i<DN;i++){
    const th=i/DN*TAU;let r=R*(1+.025*Math.sin(3*th+1.3)+.015*Math.sin(5*th+.4));
    if(dent>0) r-=.24*R*gauss(angDiff(th,dough.dentA),.36)*dent;
    if(gb>0) r+=gb*gauss(angDiff(th,dough.sugA),.3);
    DPX[i]=D.x+Math.cos(th)*r+dox[i];DPY[i]=D.y+Math.sin(th)*r+doy[i];
  }
}

function findTarget(x,y){
  let best=null,bs=1;
  const con=(sc,t)=>{if(sc<bs){bs=sc;best=t;}};
  for(const s of town.sites){
    const p=LP.sites[s.i],cc=s.floors?siteCenter(s):{x:p.x,y:p.y-.5*S};
    con(dist(x,y,cc.x,cc.y)/((s.floors?2.0:1.9)*S),{k:s.floors?'floor':'house',s:s,x:cc.x,y:cc.y});
  }
  if(!town.pine.ink){const pc={x:LP.pine.x,y:LP.pine.y-1.1*S};con(dist(x,y,pc.x,pc.y)/(1.7*S),{k:'pine',x:pc.x,y:pc.y});}
  for(const e of town.edges) if(e.sk&&!e.ink){
    const a=LP.nodes[e.a],b=LP.nodes[e.b];const d=segDist(x,y,a.x,a.y,b.x,b.y);
    con(d/(1.15*S),{k:'road',e:e,x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  }
  const rd=riverDist(x,y),rr=riverHT()+.95*S;
  if(rd<rr){
    let bb=null,bd=1e9,bu=null,bud=1e9;
    for(const e of town.edges) if(e.k==='bridge'){
      const a=LP.nodes[e.a],b=LP.nodes[e.b],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,d=dist(x,y,mx,my);
      if(!e.ink&&d<bud){bud=d;bu={e:e,x:mx,y:my};}
      if(d<bd){bd=d;bb={e:e,x:mx,y:my};}
    }
    const sc=rd/rr*.9;
    if(bu&&bud<4.2*S) con(sc,{k:'bridge',e:bu.e,x:bu.x,y:bu.y});
    else if(bb) con(sc,{k:'river',e:bb.e,x:x,y:PORT?riverAt(x):y});

}

const cour={at:'NB_M',to:null,t:0,path:[],goal:null,mode:'idle',wait:0,carry:1,face:1,step:0,look:null,thinkT:0,hopT:-9,gx:0,gy:-1};

  const b=town.bench;if(b.on&&b.need&&!b.anim) L.push({node:'BEN',b:1,nseq:b.nseq});

function deliverAt(n){

  for(const x of needs){
    if(x.s){x.s.need=false;x.s.cheerT=T;x.s.served=(x.s.served||0)+1;}
    else{town.bench.need=false;town.bench.cheerT=T;}

    if(goal==='SHOP'&&rn.length&&cour.carry<rn.length){cour.carry=rn.length;cour.mode='pause';cour.wait=.6;SFX.pick();return;}
    deliverAt(goal);return;
  }

}

// ================= guidance =================
function siteC(s){const p=LP.sites[s.i];return {x:p.x,y:p.y-.5*S};}
function emid(e){const a=LP.nodes[e.a],b=LP.nodes[e.b];return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function suggest(){
  if(town.phase==='share') return LP.board;
  if(town.phase==='paper') return rollPos();
  const R=reachC(),b=builtSites(),bm=bridgeE('M');
  const unf=b.filter(s=>!R[siteNode(s)]);
  if(unf.length||(town.bench.on&&!R.BEN&&!town.bench.anim)){
    if(!anyBridge()) return emid(bm);
    const sk=edgeOf(e=>e.sk&&!e.ink);if(sk) return emid(sk);
    const ub=edgeOf(e=>e.k==='bridge'&&!e.ink);if(ub) return emid(ub);
  }
  if(!b.length) return siteC(town.sites[town.half]);
  if(!b.some(s=>s.floors>=2)){let last=b[0];b.forEach(s=>{if(s.ord>last.ord) last=s;});return siteCenter(last);}
  if(!town.pine.ink) return {x:LP.pine.x,y:LP.pine.y-1.1*S};
  const ps=town.sites[town.pineSite];if(!ps.floors) return siteC(ps);
  if(!anyBridge()) return emid(bm);
  const un=town.sites.filter(s=>!s.floors);
  if(un.length){const nf=un.filter(s=>s.far===!b[b.length-1].far);return siteC((nf.length?nf:un)[0]);}
  const low=town.sites.filter(s=>s.floors<3).sort((a,c)=>a.floors-c.floors)[0];
  if(low) return siteCenter(low);
  return null;
}

  const cp=courPos();
  if(dist(p.x,p.y,cp.x,cp.y-.6*S)<.9*S){cour.hopT=T;SFX.hop();return;}
  if(dist(p.x,p.y,LP.old.x,LP.old.y-1*S)<1.1*S){oldClapT=T;SFX.soft();return;}
  if(town.pine.ink&&dist(p.x,p.y,LP.pine.x,LP.pine.y-1.2*S)<1.3*S){for(let i=0;i<3;i++)addFX({k:'leaf',x:LP.pine.x+(i-1)*.5*S,y:LP.pine.y-1.6*S,dur:1.2,t0:T+i*.1});SFX.soft();return;}
  if(riverDist(p.x,p.y)<riverHT()){addFX({k:'ring',x:p.x,y:p.y,r:.8*S,dur:.9,flat:.45});SFX.soft();return;}
}
function releaseDough(doDrop){
  const g=dough.grab;if(!g) return;
  dough.grab=null;stretchStop();
  const fd=dist(g.fx,g.fy,LP.D.x,LP.D.y),amt=sat((g.eff||0)/(1.3*LP.R));
  SFX.boing(amt);dough.relT=T;
  if(doDrop&&fd>LP.R*1.2){launchDrop(findTarget(g.fx,g.fy),g.fx,g.fy);dough.brushV+=7;}
}
function dropSlice(ok){
  slice.held=false;
  if(ok){
    let best=null,bd=1;
    for(const r of recipients()){if(r.got()) continue;const d=dist(slice.x,slice.y,r.x,r.y)/r.r;if(d<bd){bd=d;best=r;}}
    if(best){
      best.give();town.slices--;SFX.give();splash(best.x,best.y-.5*S,8,1.2);oldClapT=T;
      if(town.slices<=0&&recipients().some(r=>!r.got())){town.slices=8;town.boardT=T;}
      return;
    }
  }
  slice.back={x:slice.x,y:slice.y,t0:T};SFX.back();
}
function endPtr(e,ok){
  if(!ptr||e.pointerId!==ptr.id) return;
  if(ptr.kind==='dough') releaseDough(ok);
  else if(ptr.kind==='slice') dropSlice(ok);
  ptr=null;
}
function cancelAll(){
  if(ptr){if(ptr.kind==='dough') releaseDough(false);else if(ptr.kind==='slice') dropSlice(false);}
  ptr=null;stretchStop();
}
cv.addEventListener('pointerdown',e=>{
  if(e.cancelable) e.preventDefault();
  audioStart();lastInput=T;
  if(ptr||wipe) return;
  if(demo.on){demo.on=false;demo.g=null;}
  const p=toWorld(e);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(town.phase==='share'&&town.slices>0&&dist(p.x,p.y,LP.board.x,LP.board.y)<1.9*S){
    used.slice=1;ptr={id:e.pointerId,kind:'slice'};slice.held=true;slice.x=p.x;slice.y=p.y;SFX.pick();return;
  }
  if(town.phase==='paper'){const rp=rollPos();if(dist(p.x,p.y,rp.x,rp.y)<1.7*S){used.roll=1;ptr={id:e.pointerId,kind:'tap'};startWipe();return;}}
  const D=LP.D,d=dist(p.x,p.y,D.x,D.y);
  if(d<LP.R*1.3){
    const ang=d<LP.R*.3?dough.brushA:Math.atan2(p.y-D.y,p.x-D.x);
    dough.grab={id:e.pointerId,ang:ang,fx:p.x,fy:p.y,eff:0,ext:0,t0:T,target:null};
    dough.dentT=T;dough.dentA=ang;dough.brushV+=angDiff(ang,dough.brushA)*4;
    ptr={id:e.pointerId,kind:'dough'};used.dough=1;
    SFX.grab();stretchStart();
    for(let i=0;i<5;i++) addPt(D.x+Math.cos(ang)*LP.R,D.y+Math.sin(ang)*LP.R,(Math.random()-.5)*S,-Math.random()*S*1.2,.05*S,.35);
    return;
  }
  ptr={id:e.pointerId,kind:'tap'};
  minorTap(p);
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id) return;
  if(e.cancelable) e.preventDefault();
  lastInput=T;
  const p=toWorld(e);
  if(ptr.kind==='dough'&&dough.grab){dough.grab.fx=p.x;dough.grab.fy=p.y;}
  else if(ptr.kind==='slice'){slice.x=p.x;slice.y=p.y;}
},{passive:false});
cv.addEventListener('pointerup',e=>endPtr(e,true));
cv.addEventListener('pointercancel',e=>endPtr(e,false));
cv.addEventListener('lostpointercapture',e=>{if(ptr&&e.pointerId===ptr.id) endPtr(e,true);});
['touchstart','touchmove','touchend','gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{if(e.cancelable) e.preventDefault();},{passive:false}));
window.addEventListener('blur',cancelAll);

// ================= new paper (next town) =================
function startWipe(){if(wipe) return;wipe={t0:T,swapped:false};SFX.paper();demo.on=false;}
function nextTown(){
  townNo++;newTown(townNo);computeLayout();renderBase();townDirty=true;
  resetDough();resetCourier();FX.length=0;PT.length=0;DROPS.length=0;slice.held=false;slice.back=null;
  cam.z=cam.tz=1;cam.cx=cam.tcx=W/2;cam.cy=cam.tcy=H/2;sugT=0;
}
function updWipe(){
  if(!wipe) return;const p=T-wipe.t0;
  if(p>=1.3&&!wipe.swapped){wipe.swapped=true;nextTown();}
  if(p>=2.3) wipe=null;
}
function drawWipe(c){
  if(!wipe) return;const p=T-wipe.t0;
  if(p<1.3){
    const e=eio(sat(p/1.3))*(W+1.4*S)-.7*S;
    c.fillStyle=PAPER;c.fillRect(0,0,Math.max(0,e),H);
    const g=c.createLinearGradient(e-.5*S,0,e+.7*S,0);g.addColorStop(0,ink(0));g.addColorStop(.6,ink(.14));g.addColorStop(1,ink(0));
    c.fillStyle=g;c.fillRect(e-.5*S,0,1.2*S,H);
    c.fillStyle=WHITE;c.fillRect(e,0,.45*S,H);
    line(c,e,-.2*S,e,H+.2*S,.06*S,5,{a:.6,t0:.02,t1:.02});line(c,e+.45*S,-.2*S,e+.45*S,H+.2*S,.08*S,6,{a:.7,t0:.02,t1:.02,dry:true});
  }else{
    const a=1-sat((p-1.3)/1);c.globalAlpha=a;c.fillStyle=PAPER;c.fillRect(0,0,W,H);c.globalAlpha=1;
  }
}

// ================= update / render =================
let TS=1;
function animEnds(){
  for(const s of town.sites) if(s.anim&&T>s.anim.t0+s.anim.dur){s.anim=null;townDirty=true;}
  const pi=town.pine,b=town.bench;
  if(pi.anim&&T>pi.anim.t0+pi.anim.dur){pi.anim=null;townDirty=true;}
  if(b.anim&&T>b.anim.t0+b.anim.dur){b.anim=null;townDirty=true;}
  for(const e of town.edges) if(e.anim&&T>e.anim.t0+e.anim.dur){e.anim=null;townDirty=true;graphVer++;}
}
function update(dt){
  let rem=dt;while(rem>1e-5){const h=Math.min(rem,1/60);doughStep(h);rem-=h;}
  const g=dough.grab;
  if(g){const fd=dist(g.fx,g.fy,LP.D.x,LP.D.y);g.target=fd>LP.R*1.2?findTarget(g.fx,g.fy):null;stretchSet(sat((g.ext||0)/(4.5*LP.R)));}
  updDrops();updFX(dt);animEnds();courUpdate(dt);updPhase();updGuide(dt);updDemo();camUpdate(dt);updWipe();
}
function drawGhost(c,t){
  if(!t){const g=dough.grab;c.save();c.setLineDash([.12*S,.12*S]);c.lineWidth=Math.max(1,.04*S);c.strokeStyle=ink(.3);c.beginPath();c.arc(g.fx,g.fy,.35*S,0,TAU);c.stroke();c.restore();return;}
  c.save();c.globalAlpha=(t.k==='bridge'||t.k==='road'?.4:.26)+.08*Math.sin(T*8);
  if(t.k==='house') drawHouse(c,t.s,1,0);
  else if(t.k==='floor'&&t.s.floors<3) drawHouse(c,t.s,t.s.floors+1,0);
  else if(t.k==='pine') drawPine(c,LP.pine.x,LP.pine.y,1,false,town.pine.seed,0);
  else if(t.k==='bridge') drawBridge(c,t.e,1);
  else if(t.k==='road') drawRoad(c,t.e,1,.58*S);
  c.restore();
  c.lineWidth=Math.max(1.5,.06*S);c.strokeStyle=ink(.45);c.beginPath();c.arc(t.x,t.y,(.55+.08*Math.sin(T*10))*S,0,TAU);c.stroke();
}
function drawLiveAnims(c){
  for(const e of town.edges){
    if(!e.anim) continue;
    if(T<e.anim.t0){if(e.sk) drawSketchRoad(c,e);continue;}
    drawEdge(c,e,sat((T-e.anim.t0)/e.anim.dur));
  }
  const list=townDrawables();
  for(const d of list){
    if(d.t==='site'){const s=d.s;if(!s.anim) continue;const p=(T-s.anim.t0)/s.anim.dur;
      if(s.anim.k==='house'){const ff=eo(sat((p-.28)/.45));if(ff>0) drawHouse(c,s,ff,0);else drawPlot(c,s,1-sat(p/.28));}
      else drawHouse(c,s,s.floors-1+eob(sat(p/.65)),0);}
    else if(d.t==='pine'&&town.pine.anim){const a=town.pine.anim;if(T<a.t0) drawPine(c,LP.pine.x,LP.pine.y,1,true,town.pine.seed,0);else drawPine(c,LP.pine.x,LP.pine.y,sat((T-a.t0)/a.dur),false,town.pine.seed,0);}
    else if(d.t==='bench'&&town.bench.anim){const a=town.bench.anim;if(T>=a.t0) drawBench(c,LP.bench.x,LP.bench.y,sat((T-a.t0)/.6));}
  }
}
function gazePoint(){
  if(dough.grab){const t=dough.grab.target;return t?{x:t.x,y:t.y}:{x:dough.grab.fx,y:dough.grab.fy};}
  if(slice.held) return {x:slice.x,y:slice.y};
  if(DROPS.length){const d=DROPS[DROPS.length-1],p=sat((T-d.t0)/d.dur);return {x:lerp(d.x0,d.x1,p),y:lerp(d.y0,d.y1,p)};}
  if(demo.on) return {x:lerp(demo.x0,demo.x1,.5),y:lerp(demo.y0,demo.y1,.5)};
  if(T-danceT<2.4||T-oldClapT<1) return courPos();
  return sugPt||LP.D;
}
function render(){
  if(townDirty) renderTown();
  const c=ctx;
  c.setTransform(1,0,0,1,0,0);c.fillStyle=PAPER;c.fillRect(0,0,cv.width,cv.height);
  const z=cam.z;c.setTransform(DPR*z,0,0,DPR*z,DPR*(W/2-cam.cx*z),DPR*(H/2-cam.cy*z));
  c.drawImage(baseCv,0,0,W,H);
  drawSunset(c);
  c.drawImage(townCv,0,0,W,H);
  drawLiveAnims(c);
  drawDusk(c);
  if(dough.grab&&dist(dough.grab.fx,dough.grab.fy,LP.D.x,LP.D.y)>LP.R*1.2) drawGhost(c,dough.grab.target);
  drawFX(c);
  drawWindows(c);
  drawBenchPeople(c);
  drawOutside(c);
  drawCour(c);
  drawOldMan(c,gazePoint());
  drawBoard(c);
  drawDough(c);
  drawBrushTool(c);
  drawDrops(c);
  for(const p of PT){const a=sat(p.life/p.max);ellipseFill(c,p.x,p.y,p.r,p.r,ink(.85*a));}
  drawHeldSlice(c);
  drawDemo(c);
  c.setTransform(DPR,0,0,DPR,0,0);
  drawVignette(c);
  drawWipe(c);
}
let raf=0,lastNow=0;
function frame(now){
  raf=0;if(hidden) return;
  let dt=(now-lastNow)/1000;lastNow=now;if(!(dt>0)) dt=0;dt=Math.min(dt,1/20);
  let tot=dt*TS;
  while(tot>1e-6){const h=Math.min(tot,1/30);T+=h;update(h);tot-=h;}
  render();
  raf=requestAnimationFrame(frame);
}
function startLoop(){if(raf||hidden) return;lastNow=performance.now();raf=requestAnimationFrame(frame);}
let rzT=0;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  cancelAll();
  computeLayout();
  cv.width=Math.max(1,Math.round(W*DPR));cv.height=Math.max(1,Math.round(H*DPR));cv.style.width=W+'px';cv.style.height=H+'px';
  renderBase();townDirty=true;resetDough();FX.length=0;DROPS.length=0;
  cam.z=cam.tz=1;cam.cx=cam.tcx=W/2;cam.cy=cam.tcy=H/2;sugT=0;
}
function onResize(){clearTimeout(rzT);rzT=setTimeout(()=>{resize();if(!raf) render();},80);}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);
document.addEventListener('visibilitychange',()=>{
  hidden=document.visibilityState==='hidden';
  if(hidden){cancelAll();if(raf){cancelAnimationFrame(raf);raf=0;}try{if(AC&&AC.state==='running') AC.suspend();}catch(e){}}
  else{try{if(AC) AC.resume().catch(()=>{});}catch(e){}startLoop();}
});
window.addEventListener('pageshow',()=>{hidden=document.visibilityState==='hidden';startLoop();});

// test hooks (read-only state + time scale for automated checks)
window.__G={
  st:()=>{const R=reachC();return {phase:town.phase,townNo:townNo,T:T,
    sites:town.sites.map(s=>({k:s.key,f:s.floors,need:s.need,reach:!!R[siteNode(s)],got:s.gotSlice,lit:s.litT.filter(t=>t!=null&&T>=t).length,res:s.res.slice()})),
    pine:town.pine.ink,bench:town.bench.on,benchNeed:town.bench.need,benchGot:town.bench.gotSlice,
    bridges:town.edges.filter(e=>e.k==='bridge'&&e.ink).map(e=>e.id),sketch:town.edges.filter(e=>e.sk&&!e.ink).length,
    cour:{at:cour.at,to:cour.to,carry:cour.carry,mode:cour.mode,goal:cour.goal},slices:town.slices,cam:cam.z,demo:demo.on,drops:DROPS.length,pt:PT.length,
    half:town.half,pineSite:town.pineSite,audio:AC?AC.state:'none',dlog:town.dlog.slice(),litOrder:town.sites.flatMap(s=>s.litT.map((t,k)=>[t,s.key+k])).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),grab:!!dough.grab,ptr:ptr?ptr.kind:null,held:slice.held,scrollY:window.scrollY};},
  lp:()=>({D:LP.D,R:LP.R,S:S,W:W,H:H,sites:LP.sites,nodes:LP.nodes,pine:LP.pine,bench:LP.bench,board:LP.board,roll:rollPos(),cam:{z:cam.z,cx:cam.cx,cy:cam.cy},
    win:town.sites.map(s=>s.floors?siteCenter(s):null)}),
  ts:k=>{TS=k;}
};

// ================= boot =================
newTown(0);
resize();
startLoop();
})();
</script>
