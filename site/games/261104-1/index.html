<script>
(() => {
'use strict';
/* ============================================================
   ぱたん！ペンギン郵便屋の起き上がる紙の町  (fr-261029-5 / papercut)
   4色: 濃紺(台紙) / 朱赤(帽子) / クリーム / 水色   影は濃紺の濃い版
   ============================================================ */
const C = { navy:'#22305c', deep:'#111933', red:'#e4492e', cream:'#f6ecd4', blue:'#8ccde0' };
const R = 20;                       // ビー玉半径(ワールド単位)
const MAXBALLS = 6, MAXPART = 70;
const ALL = ['RL','RR','low','up','bridge','tree','det','slA','slB','slD','slE','pass'];

const cv = document.getElementById('c');
let g = cv.getContext('2d', { alpha:false });
const saEl = document.getElementById('sa');

let W = 0, H = 0, DPR = 1, layout = 'L', S = 1, OX = 0, OY = 0, WW = 1500, WH = 1000;
let DO = { x:1000, y:470 };          // 次の区画(ブロック)の原点
let BOARD = { x:1000, y:0, w:500, h:1000 };
let now = 0, T = 0;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b - a) * t;
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const sp = (x = 0) => ({ x, v:0, t:x });
function stepSp(s, dt, k = 170, d = 12) { const a = k * (s.t - s.x) - d * s.v; s.v += a * dt; s.x += s.v * dt; }

/* ---------- 擬似乱数（紙の切り口のゆらぎ用・固定） ---------- */
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

/* ============================================================
   ログ（検証用）
   ============================================================ */
const LOG = [];
function log(ev) { LOG.push({ t: +(now / 1000).toFixed(2), ev }); }

/* ============================================================
   状態
   ============================================================ */
const HDEF = {
  A: { x0:40,  x1:200, gy:300, wt:220, rp:155, peak:120, post:{x:174,y:195}, door:{x:70},
       wins:[{x:165,y:246,w:30,h:30}], exit:[205,262], stand:[238,276], flick:'A', side:'L' },
  B: { x0:30,  x1:170, gy:800, wt:720, rp:660, peak:100, post:{x:142,y:692}, door:{x:45},
       wins:[{x:128,y:730,w:30,h:30}], exit:[172,745], stand:[214,776], flick:'B', side:'L' },
  E: { x0:470, x1:630, gy:660, wt:580, rp:515, peak:550, post:{x:550,y:515,ridge:1}, door:{x:540},
       wins:[{x:478,y:598,w:30,h:30},{x:590,y:598,w:30,h:30}], exit:[466,612], stand:[430,636], flick:'E', side:'L' },
  D: { x0:830, x1:960, gy:600, wt:430, rp:370, peak:895, chim:{x:855,y:407}, door:{x:900},
       wins:[{x:838,y:450,w:30,h:30},{x:910,y:450,w:30,h:30},{x:870,y:520,w:30,h:30}], win2:[0,1],
       exit:[826,465], stand:[800,576], flick:'D', side:'D' },
  F: { x0:40,  x1:200, gy:330, wt:240, rp:175, peak:120, post:{x:170,y:212}, door:{x:70},
       wins:[{x:130,y:270,w:30,h:30}], stand:[226,306], dist:1, side:'X' },
  G: { x0:280, x1:440, gy:330, wt:240, rp:175, peak:360, post:{x:402,y:206}, door:{x:300},
       wins:[{x:330,y:270,w:30,h:30}], stand:[256,306], dist:1, side:'X' },
};

let st;
function freshState() {
  const Hs = {};
  for (const k in HDEF) Hs[k] = { id:k, state:0, sp:sp(0), wig:0, slP:sp(0), fam:0, famT:0, shut:sp(0),
                                  win2:sp(0), paddle:0, deliveries:0, postSp:sp(0), flash:0 };
  return {
    H: Hs,
    bridge: { up:false, sp:sp(0), wig:0 },
    branch: { up:false, sp:sp(0), bend:0, bendV:0 },
    passage: { built:false, queued:false, p:0 },
    visited: new Set(),
    windows: false, windowsQueued:false, l5:sp(0),
    board: { open:false, opening:false, p:sp(0) },
    l6: sp(0),
    complete: false, tab: sp(0),
    folding: 0,
    backUsed: false,
  };
}

/* ============================================================
   レバー
   ============================================================ */
const LV = {
  L1: { id:'L1', x:450, y:122, main:1, ang:sp(0), bend:0, bendV:0, press:sp(0), dir:0, hitR:118 },
  L2: { id:'L2', x:648, y:222, opts:[{k:'up', seg:'UP'}, {k:'low', seg:'LOW1'}], st:1 },
  L3: { id:'L3', x:350, y:362, opts:[{k:'tree', seg:() => st.branch.up ? 'TRu' : 'TR'}, {k:'det', seg:'DT'}], st:0 },
  L5: { id:'L5', x:755, y:958, opts:[{k:'pond', seg:'POND'}, {k:'back', seg:'BACK'}], st:0, vis:() => st.l5.x > 0.5 },
  L6: { id:'L6', x:812, y:300, opts:[{k:'chim', seg:'CH'}, {k:'dist', seg:'DS'}], st:0, vis:() => st.l6.x > 0.5 },
  L7: { id:'L7', dx:400, dy:72, opts:[{k:'F', seg:'FP'}, {k:'G', seg:'GP'}], st:0, vis:() => st.board.open },
};
for (const k in LV) { const l = LV[k]; if (!l.main) { l.ang = sp(0); l.bend = 0; l.bendV = 0; l.press = sp(0); l.hitR = 74; l.wig = 0; } }
function lvPos(l) { return l.dx !== undefined ? [DO.x + l.dx, DO.y + l.dy] : [l.x, l.y]; }
function optAngle(l, i) {
  const o = l.opts[i]; let sid = typeof o.seg === 'function' ? o.seg() : o.seg; const s = SEG[sid];
  if (!s) return 0; const p = s.pts; return Math.atan2(p[1][1] - p[0][1], p[1][0] - p[0][0]);
}
function lvVisible(l) { return l.main || !l.vis || l.vis(); }
function resetLevers() {
  LV.L2.st = 1; LV.L3.st = 0; LV.L5.st = 0; LV.L6.st = 0; LV.L7.st = 0;
  for (const k in LV) { const l = LV[k]; if (!l.main) { l.ang.x = l.ang.t = optAngle(l, l.st); } }
}

/* ============================================================
   経路（セグメント）
   ============================================================ */
const SEG = {};
let POCKETS = [];
function calc(s) {
  s.cum = [0]; let L = 0;
  for (let i = 1; i < s.pts.length; i++) { L += Math.hypot(s.pts[i][0] - s.pts[i-1][0], s.pts[i][1] - s.pts[i-1][1]); s.cum.push(L); }
  s.len = L;
  if (s.foldsDef) s.folds = s.foldsDef.map(f => ({ d: nearestD(s, f[0], f[1]), fn: f[2], x:f[0], y:f[1] }));
}
function nearestD(s, x, y) {
  let best = 0, bd = 1e9;
  for (let d = 0; d <= s.len; d += 2) { const p = posAt(s, d); const e = (p[0]-x)**2 + (p[1]-y)**2; if (e < bd) { bd = e; best = d; } }
  return best;
}
function posAt(s, d) {
  const p = s.pts, c = s.cum, n = p.length;
  if (d <= 0) return [p[0][0], p[0][1], Math.atan2(p[1][1]-p[0][1], p[1][0]-p[0][0])];
  if (d >= s.len) return [p[n-1][0], p[n-1][1], Math.atan2(p[n-1][1]-p[n-2][1], p[n-1][0]-p[n-2][0])];
  let i = 1; while (i < n - 1 && c[i] < d) i++;
  const t = (d - c[i-1]) / (c[i] - c[i-1] || 1);
  return [lerp(p[i-1][0], p[i][0], t), lerp(p[i-1][1], p[i][1], t), Math.atan2(p[i][1]-p[i-1][1], p[i][0]-p[i-1][0])];
}
function mk(id, pts, o = {}) { const s = Object.assign({ id, pts }, o); if (o.folds) { s.foldsDef = o.folds; delete s.folds; } calc(s); SEG[id] = s; return s; }
function arcSeg(p0, p1, lift, end) {
  const pts = []; const top = Math.min(p0[1], p1[1]) - lift;
  for (let i = 0; i <= 22; i++) {
    const t = i / 22;
    const x = lerp(p0[0], p1[0], t);
    // 2次ベジェで頂点を通る放物線
    const cy = 2 * top - (p0[1] + p1[1]) / 2;
    const y = (1-t)*(1-t)*p0[1] + 2*(1-t)*t*cy + t*t*p1[1];
    pts.push([x, y]);
  }
  const s = { id:'arc', pts, arc:1, end }; calc(s); return s;
}
const dw = (x, y) => [DO.x + x, DO.y + y];

function build() {
  for (const k in SEG) delete SEG[k];
  // --- 左: 最初のレバー → 家A
  mk('RL', [[450,98],[395,118],[335,138],[260,152],[178,166]], { road:'RL', from:2, end:b => arrive(b,'A','post') });
  mk('Aby', [[178,166],[170,280]], { fall:1, end:b => go(b,'Aby2') });
  mk('Aby2', [[170,280],[110,281],[28,283]], { folds:[[122,281,b => stand('A', b)]], end:b => sink(b) });
  mk('Asl', [[205,262],[272,300],[343,357]], { road:'slA', draw:1, slope:'A', end:b => junc(b,'L3') });
  // --- 木
  mk('TR', [[350,362],[300,388],[262,408],[180,452],[106,488]], { road:'tree', from:0, folds:[[150,468,b => raiseBranch(b)]], end:b => sink(b) });
  mk('TRu', [[350,362],[300,388],[268,405]], { road:'tree', from:0, nodraw:1, end:b => branchHit(b) });
  mk('DT', [[350,362],[420,392],[490,428],[548,476]], { road:'det', end:b => arrive(b,'E','post') });
  // --- 家B
  mk('Bby', [[142,662],[140,780]], { fall:1, end:b => go(b,'Bby2') });
  mk('Bby2', [[140,780],[80,781],[16,783]], { folds:[[98,781,b => stand('B', b)]], end:b => sink(b) });
  mk('Bsl', [[176,778],[250,780],[316,783]], { road:'slB', draw:1, slope:'B', end:b => sink(b) });
  // --- 家E
  mk('Eby', [[550,482],[560,640]], { fall:1, end:b => go(b,'Eby2') });
  mk('Eby2', [[560,640],[500,641],[428,644]], { folds:[[518,641,b => stand('E', b)]], end:b => sink(b) });
  mk('Esl', [[466,612],[438,628]], { road:'slE', draw:1, slope:'E', end:b => st.passage.built ? go(b,'PS') : go(b,'Esl2') });
  mk('Esl2', [[438,628],[426,642]], { draw:1, slope:'E', end:b => sink(b) });
  mk('PS', [[438,628],[340,670],[250,705],[178,740]], { road:'pass', pass:1, end:b => arrive(b,'B','win') });
  // --- 右: 最初のレバー → L2
  mk('RR', [[450,98],[505,118],[565,138],[610,170],[646,218]], { road:'RR', from:2, end:b => junc(b,'L2') });
  mk('UP', [[648,222],[684,262],[706,296]], { road:'up', end:b => st.bridge.up ? go(b,'BR') : go(b,'DROP') });
  mk('BR', [[706,296],[760,297],[810,300]], { road:'bridge', bridge:1, nodraw:1, end:b => st.l6.x > 0.5 ? junc(b,'L6') : go(b,'CH') });
  mk('CH', [[812,300],[836,322],[855,356]], { end:b => arrive(b,'D','chim') });
  mk('DROP', [[706,296],[701,386]], { fall:1, end:b => go(b,'LOW2') });
  mk('LOW1', [[648,222],[614,256],[606,290],[626,322],[666,356],[701,386]], { road:'low', end:b => go(b,'LOW2') });
  mk('LOW2', [[701,386],[676,410],[620,442],[552,476]], { road:'low', folds:[[676,410,b => raiseBridge(b)]], end:b => arrive(b,'E','post') });
  // --- 家D
  mk('Dby', [[855,356],[860,580]], { fall:1, end:b => go(b,'Dby2') });
  mk('Dby2', [[860,580],[920,581],[966,583]], { folds:[[905,581,b => stand('D', b)]], end:b => sink(b) });
  mk('Dsl', [[826,465],[812,505],[808,560],[812,580]], { road:'slD', draw:1, slope:'D', end:b => sink(b) });
  // --- 小川（返送専用路）と奥の道
  mk('CK', [[755,250],[755,952]], { water:1, end:b => junc(b,'L5') });
  mk('POND', [[755,958],[712,976]], { end:b => sink(b) });
  if (layout === 'P') mk('BACK', [[755,958],[830,972],[900,982]], { back:1, end:b => backEnd(b) });
  else mk('BACK', [[755,958],[830,972],[990,982]], { back:1, end:b => backEnd(b) });
  // --- 次の区画へ（橋の先）
  const ent = dw(440, 30);
  if (layout === 'P') mk('DS', [[812,300],[880,316],[950,330],[990,360],[994,940],[960,1000], ent], { dist:1, end:b => go(b,'DE') });
  else mk('DS', [[812,300],[880,316],[950,330],[990,360],[1060,400],[1300,450], ent], { dist:1, end:b => go(b,'DE') });
  mk('DE', [ent, dw(402,70)], { dist:1, end:b => junc(b,'L7') });
  mk('FP', [dw(402,72), dw(320,108), dw(220,138), dw(170,180)], { dist:1, end:b => arrive(b,'F','post') });
  mk('GP', [dw(402,72), dw(440,108), dw(424,146), dw(402,180)], { dist:1, end:b => arrive(b,'G','post') });
  mk('Fby', [dw(170,180), dw(165,310)], { fall:1, end:b => go(b,'Fby2') });
  mk('Fby2', [dw(165,310), dw(100,311), dw(18,313)], { folds:[[...dw(112,311), b => stand('F', b)]], end:b => sink(b) });
  mk('Gby', [dw(402,180), dw(400,310)], { fall:1, end:b => go(b,'Gby2') });
  mk('Gby2', [dw(400,310), dw(450,311), dw(486,313)], { folds:[[...dw(442,311), b => stand('G', b)]], end:b => sink(b) });

  POCKETS = [[26,288],[104,494],[14,788],[318,788],[426,648],[812,588],[968,588],[712,980], dw(16,318), dw(488,318)];
  POCKETS.push(layout === 'P' ? [900,990] : [992,984]);
  // レバーの見た目角度を更新
  for (const k in LV) { const l = LV[k]; if (!l.main) l.ang.t = optAngle(l, l.st); }
}

/* ============================================================
   ビー玉
   ============================================================ */
let balls = [];
let cradle = { has:true, refill:0, drop:1 };
function launch(dir) {
  if (!cradle.has) return false;
  const b = { s:null, d:0, v:230, kind:'mail', x:450, y:98, rot:0, hide:0, after:null, sinkT:0, absorb:0, id:Math.random() };
  go(b, dir < 0 ? 'RL' : 'RR');
  balls.push(b);
  cradle.has = false; cradle.refill = 0.5;
  return true;
}
function go(b, s, d0 = 0) {
  if (typeof s === 'string') s = SEG[s];
  const prev = b.s; b.s = s; b.d = d0;
  if (prev && (prev.fall || prev.arc) && !s.fall && !s.arc) { sfx.land(b.x, b.y); puff(b.x, b.y + R, 3); }
  if (s.road && b.kind === 'mail') visit(s.road);
  if (s.back) st.backUsed = true;
}
function junc(b, id) {
  const l = LV[id]; const o = l.opts[l.st];
  const sid = typeof o.seg === 'function' ? o.seg() : o.seg;
  l.bendV += 6; sfx.tick(l.x || b.x, 1.2);
  go(b, sid);
}
function sink(b) { b.sinkT = 0.001; sfx.drop(b.x, b.y); }
function absorbInto(b, x, y, cb) { b.absorb = 0.001; b.ax = x; b.ay = y; b.after = cb; }

function stepBall(b, dt) {
  if (b.sinkT > 0) { b.sinkT += dt; return; }
  if (b.absorb > 0) {
    b.absorb += dt; b.x = lerp(b.x, b.ax, Math.min(1, dt * 14)); b.y = lerp(b.y, b.ay, Math.min(1, dt * 14));
    if (b.absorb > 0.22) { const cb = b.after; b.after = null; b.absorb = 0; b.hide = 9; if (cb) cb(); }
    return;
  }
  if (b.hide > 0) { b.hide -= dt; if (b.hide <= 0 && b.after) { const cb = b.after; b.after = null; cb(); } return; }
  const s = b.s;
  const p0 = posAt(s, b.d); const sn = Math.sin(p0[2]);
  if (s.fall) b.v = Math.min(b.v + 1500 * dt, 950);
  else if (s.arc) b.v = 560;
  else if (s.water) b.v += (290 - b.v) * Math.min(1, dt * 3);
  else { b.v += 950 * sn * dt; b.v = clamp(b.v, 190, 600); }
  const pd = b.d; b.d += b.v * dt;
  if (s.folds) for (const f of s.folds) if (pd < f.d && b.d >= f.d) f.fn(b);
  let guard = 0;
  while (b.s && b.d >= b.s.len && guard++ < 4 && !(b.hide > 0) && !(b.absorb > 0) && !(b.sinkT > 0)) {
    const cur = b.s; const over = b.d - cur.len; const e = posAt(cur, cur.len); b.x = e[0]; b.y = e[1];
    cur.end(b);
    if (b.s !== cur && !(b.hide > 0) && !(b.absorb > 0) && !(b.sinkT > 0)) b.d += over;
  }
  if (!(b.hide > 0) && !(b.absorb > 0) && !(b.sinkT > 0)) {
    const p = posAt(b.s, b.d);
    const dx = p[0] - b.x; b.x = p[0]; b.y = p[1];
    b.rot += dx / R;
  }
}

/* ============================================================
   紙の仕掛け
   ============================================================ */
function hX(id) { const d = HDEF[id]; return d.dist ? DO.x + (d.x0 + d.x1) / 2 : (d.x0 + d.x1) / 2; }
function hY(id) { const d = HDEF[id]; return d.dist ? DO.y + d.gy : d.gy; }
function stand(id, b) {
  const h = st.H[id]; if (h.state !== 0) return;
  h.state = 1; h.sp.t = 1; h.sp.v += 2; h.postSp.t = 1;
  sfx.stand(hX(id), id); puff(hX(id), hY(id), 8); log('stand:' + id);
}
function raiseBridge(b) {
  if (st.bridge.up) { st.bridge.wig = 0.5; return; }
  st.bridge.up = true; st.bridge.sp.t = 1; st.bridge.sp.v += 1.5;
  sfx.stand(760, 'bridge'); puff(760, 320, 10); log('bridge');
}
function raiseBranch(b) {
  if (st.branch.up) return;
  st.branch.up = true; st.branch.sp.t = 1; st.branch.sp.v += 1;
  sfx.stand(150, 'branch'); puff(170, 420, 8); log('branch');
}
function branchHit(b) {
  st.branch.bendV += 14; sfx.boing(262, 408); puff(262, 410, 5);
  const B = st.H.B;
  go(b, arcSeg([268,405], [142,662], 80, bb => arrive(bb, 'B', 'post')));
  log('branchBounce');
}
function arrive(b, id, entry) {
  const h = st.H[id], d = HDEF[id];
  if (h.state === 0) {
    const by = { A:'Aby', B:'Bby', E:'Eby', D:'Dby', F:'Fby', G:'Gby' }[id];
    go(b, by); return;
  }
  if (h.state === 1 || h.state === 1.5 || (d.dist && h.state >= 1)) { deliver(b, id, entry); return; }
  // state 2: 窓から返す or 家を通り抜ける
  if (st.windows && d.flick) { flick(b, id, entry); return; }
  passThru(b, id, entry);
}
function postPoint(id, entry) {
  const d = HDEF[id];
  if (entry === 'chim') return [d.chim.x, d.chim.y - 46];
  if (entry === 'win') return [d.exit[0], d.exit[1]];
  const ox = d.dist ? DO.x : 0, oy = d.dist ? DO.y : 0;
  return [ox + d.post.x, oy + d.post.y - 20];
}
function deliver(b, id, entry) {
  const h = st.H[id], d = HDEF[id];
  const p = postPoint(id, entry);
  absorbInto(b, p[0], p[1], () => { b.dead = true; });
  h.deliveries++; h.flash = 1; h.famT = 2.6; h.wig = 0.6;
  sfx.deliver(p[0], h.deliveries + Object.keys(HDEF).indexOf(id));
  confetti(p[0], p[1], 9);
  if (id === 'D' && entry === 'chim' && h.win2.t < 1) { h.win2.t = 1; log('chimney2F'); sfx.window(p[0], 2); }
  if (h.state === 1) {
    log('deliver:' + id);
    if (d.dist) { h.state = 2; pm.queue.push({ type:'visit', id }); checkComplete(); }
    else { h.state = 1.5; pm.queue.push({ type:'slope', id }); }
  }
  checkPassage();
}
function passThru(b, id, entry) {
  const h = st.H[id], d = HDEF[id];
  const p = postPoint(id, entry);
  absorbInto(b, p[0], p[1], () => {

  g.save(); g.translate(0, -hop); g.scale(s, s);
  shape([[0, 0], [110, 0], [0, 110]], C.cream);
  g.fillStyle = C.red; g.beginPath(); g.moveTo(110, 0); g.lineTo(0, 110); g.lineTo(60, 60); g.fill();
  if (isG) { const r = 40 + (T * 40 % 24); g.strokeStyle = C.cream; g.globalAlpha = clamp(1 - (r - 40) / 24, 0, 1); g.lineWidth = 5; g.beginPath(); g.arc(40, 40, r, 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1; }
  g.restore();
}
function drawParts() {
  for (const p of parts) {
    g.save(); g.translate(p.x, p.y); g.rotate(p.r);
    g.fillStyle = C.deep; g.fillRect(-p.s / 2 + 3, -p.s / 3 + 3, p.s, p.s * 0.66);
    g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66);
    g.restore();
  }
}
function drawHand() {
  if (!demo.on) return;
  const t = demo.t; const tgt = demo.tgt; if (!tgt) return;
  let x = tgt.x + 40, y = tgt.y + 70, sc = 1, al = 1;
  const dir = tgt.dir;
  if (t < 0.35) { al = t / 0.35; }
  else if (t < 0.6) { const k = ease((t - 0.35) / 0.25); x = lerp(tgt.x + 40, tgt.x + 10, k); y = lerp(tgt.y + 70, tgt.y + 20, k); sc = 1 - k * 0.1; }
  else if (t < 1.0) { const k = ease((t - 0.6) / 0.4); x = tgt.x + 10 + dir[0] * 90 * k; y = tgt.y + 20 + dir[1] * 90 * k; sc = 0.9; }
  else { const k = (t - 1.0) / 0.5; x = tgt.x + 10 + dir[0] * 90; y = tgt.y + 20 + dir[1] * 90 - k * 20; al = 1 - k; }
  g.save(); g.globalAlpha = clamp(al, 0, 1); g.translate(x, y); g.scale(sc * 1.3, sc * 1.3);
  // 指
  const hand = (o, cA, cB) => {
    g.fillStyle = cA; g.beginPath(); g.ellipse(o + 6, o + 34, 22, 26, 0, 0, Math.PI * 2); g.fill();
    g.fillRect(o - 6, o - 18, 14, 44); g.beginPath(); g.arc(o + 1, o - 18, 7, Math.PI, 0); g.fill();
    g.fillStyle = cB; g.fillRect(o - 14, o + 52, 40, 12);
  };
  hand(5, C.deep, C.deep); hand(0, C.cream, C.red);
  g.restore();
  // 指が通る弧
  if (t > 0.6 && t < 1.2) {
    g.save(); g.globalAlpha = 0.7 * (1 - Math.abs(t - 0.9) / 0.3); g.strokeStyle = C.cream; g.lineWidth = 4; g.setLineDash([8, 10]);
    g.beginPath(); g.moveTo(tgt.x, tgt.y); g.lineTo(tgt.x + dir[0] * 100, tgt.y + dir[1] * 100); g.stroke(); g.setLineDash([]); g.restore();
  }
}

function render() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(bake, 0, 0);
  withWorld(() => {
    drawCreek();
    // 次の区画（台紙の下）
    if (st.board.p.x > 0.02) { drawHouse('F'); drawHouse('G'); }
    drawTree();
    for (const id of ['A','B','E','D']) drawHouse(id);
    drawBridge();
    drawRoads();
    drawSlopes();
    drawPassage();
    // 郵便屋は道より前、玉より後ろ
    drawPM();
    for (const k of ['L2','L3','L5','L6','L7']) drawLever(LV[k]);
    drawL1();
    drawCradleBall();
    for (const b of balls) drawBall(b);
    drawParts();
    drawBoard();
    drawTab();
    drawHand();
  });
}

/* ============================================================
   誘導（いつも1つ）
   ============================================================ */
const guide = { cur:null, hint:0, t:0 };
function wantPlan() {
  const Hh = st.H;
  if (st.folding) return null;
  if (st.complete) return { tab:1 };
  if (st.board.open) {
    const need = Hh.F.state < 2 ? 'F' : 'G';
    return { L1:1, L2:'up', L6:'dist', L7:need };
  }
  if (st.board.opening) return { L1:1 };
  if (st.windows) return { L5:'back', L1:1 };
  if (Hh.A.state < 1) return { L1:-1 };
  if (!st.bridge.up) return { L1:1 };
  if (Hh.A.state < 1.5) return { L1:-1 };
  const Aok = Hh.A.state >= 2;
  if (Aok && (!st.visited.has('slA') || !st.branch.up)) return { L1:-1, L3:'tree' };
  if (Hh.E.state < 1.5 || (Hh.E.state === 2 && !st.visited.has('slE'))) return { L1:1, L2:'low' };
  if (Hh.D.state < 1.5 || (Hh.D.state === 2 && !st.visited.has('slD'))) return { L1:1, L2:'up' };
  if (Aok && st.branch.up && (Hh.B.state < 1.5 || (Hh.B.state === 2 && !st.visited.has('slB')))) return { L1:-1, L3:'tree' };
  if (Aok && !st.visited.has('det')) return { L1:-1, L3:'det' };
  if (st.passage.built && !st.visited.has('pass')) return { L1:1, L2:'low' };
  if (!st.visited.has('up')) return { L1:1, L2:'up' };
  if (!st.visited.has('bridge')) return { L1:1, L2:'up' };
  if (Hh.A.state < 2) return { L1:1 };
  return { L1:1 };
}
function computeGuide() {
  const p = wantPlan();
  if (!p) { guide.cur = null; return; }
  if (p.tab) { guide.cur = { id:'TAB', x:40, y:40, dir:[0.7, 0.7] }; return; }
  for (const k of ['L6','L2','L3','L5','L7']) {
    if (!p[k]) continue; const l = LV[k];
    if (!lvVisible(l)) continue;
    // その経路を実際に使うときだけ
    if (k === 'L3' && p.L1 !== -1) continue;
    if ((k === 'L2' || k === 'L6') && p.L1 !== 1) continue;
    if (k === 'L6' && p.L2 && LV.L2.opts[LV.L2.st].k !== p.L2) { /* L2 を先に */ }
    const want = l.opts.findIndex(o => o.k === p[k]);
    if (want >= 0 && l.st !== want) {
      const a = optAngle(l, want); const [x, y] = lvPos(l);
      guide.cur = { id:k, x, y, dir:[Math.cos(a), Math.sin(a)] }; guide.hint = 0; return;
    }
  }
  guide.cur = { id:'L1', x:450, y:110, dir:[p.L1 < 0 ? -1 : 1, 0.15] }; guide.hint = p.L1 < 0 ? -1 : 1;
}

/* ============================================================
   入力（Pointer Events）
   ============================================================ */
const ptrs = new Map();
let lastInput = 0, firstTouchDone = false, l1First = true;
function toWorld(cx, cy) { return [(cx - OX) / S, (cy - OY) / S]; }
function hitLever(wx, wy) {
  const minR = 26 / S;
  let best = null, bd = 1e9;
  const cand = [];
  if (st.tab.x > 0.5) cand.push({ id:'TAB', x:40, y:40, r:Math.max(85, minR) });
  cand.push({ id:'L1', x:450, y:108, r:Math.max(LV.L1.hitR, minR) });
  for (const k of ['L2','L3','L5','L6','L7']) {
    const l = LV[k]; if (!lvVisible(l)) continue;
    const [x, y] = lvPos(l); const a = l.ang.x;
    cand.push({ id:k, x:x + Math.cos(a) * 28, y:y + Math.sin(a) * 28, r:Math.max(l.hitR, minR) });
  }
  for (const c of cand) { const d = Math.hypot(wx - c.x, wy - c.y); if (d < c.r && d < bd) { bd = d; best = c.id; } }
  return best;
}
function hitObject(wx, wy) {
  for (const id of ['A','B','E','D','F','G']) {
    const d = HDEF[id]; if (d.dist && !st.board.open) continue;
    const ox = d.dist ? DO.x : 0, oy = d.dist ? DO.y : 0; const h = st.H[id];
    const top = oy + d.gy - (d.gy - d.rp) * Math.max(0.1, h.sp.x);
    if (wx > ox + d.x0 - 8 && wx < ox + d.x1 + 8 && wy > top - 10 && wy < oy + d.gy + 10) return { k:'house', id };
  }
  if (Math.hypot(wx - 76, wy - 400) < 70) return { k:'tree' };
  if (Math.hypot(wx - pm.x, wy - pm.y) < 50) return { k:'pm' };
  if (st.bridge.up && wx > 700 && wx < 820 && wy > 280 && wy < 360) return { k:'bridge' };
  if (!st.board.open && wx > BOARD.x && wx < BOARD.x + BOARD.w && wy > BOARD.y && wy < BOARD.y + BOARD.h) return { k:'board' };
  return null;
}
function onDown(e) {
  e.preventDefault();
  initAudio();
  firstTouchDone = true; lastInput = now; demo.on = false;
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  const id = hitLever(wx, wy);
  // 同じレバーを別の指が握っていたら無視
  if (id) for (const p of ptrs.values()) if (p.id === id) { return; }
  const rec = { id, x0:e.clientX, y0:e.clientY, t0:now, done:false };
  ptrs.set(e.pointerId, rec);
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (id && id !== 'TAB') { const l = LV[id]; l.press.t = 1; l.press.x = 0.7; l.bendV += 3; sfx.press(lvPos(l)[0]); }
  else if (id === 'TAB') { st.tab.v += 4; }
  else {
    const o = hitObject(wx, wy);
    if (o) {
      if (o.k === 'house') { st.H[o.id].wig = 0.6; sfx.wiggle(wx); }
      else if (o.k === 'tree') { st.treeWig = 0.6; sfx.wiggle(wx); }
      else if (o.k === 'pm') { pm.wig = 0.8; sfx.chirp(wx); }
      else if (o.k === 'bridge') { st.bridge.wig = 0.6; sfx.wiggle(wx); }
      else if (o.k === 'board') { st.boardWig = 0.6; sfx.wiggle(wx); }
    }
  }
}
function onMove(e) {
  const r = ptrs.get(e.pointerId); if (!r || !r.id || r.done) return;
  e.preventDefault();
  const dx = e.clientX - r.x0, dy = e.clientY - r.y0;
  if (Math.hypot(dx, dy) > 14) { r.done = true; act(r.id, dx, dy, false); }
}
function onUp(e) {
  const r = ptrs.get(e.pointerId); if (!r) return;
  ptrs.delete(e.pointerId);
  if (r.id && r.id !== 'TAB') LV[r.id].press.t = 0;
  if (r.id && !r.done) {
    const dx = e.clientX - r.x0, dy = e.clientY - r.y0;
    if (Math.hypot(dx, dy) > 14) act(r.id, dx, dy, false); else act(r.id, 0, 0, true, e);
  }
  lastInput = now;
}
function onCancel(e) {
  const r = ptrs.get(e.pointerId); if (!r) return;
  ptrs.delete(e.pointerId);
  if (r.id && r.id !== 'TAB') LV[r.id].press.t = 0;
}
function act(id, dx, dy, tap, e) {
  lastInput = now; demo.on = false;
  if (id === 'TAB') { foldBack(); return; }
  if (st.folding) return;
  const l = LV[id];
  if (id === 'L1') {
    let dir;
    if (!tap) dir = dx < 0 ? -1 : 1;
    else {
      const [wx] = e ? toWorld(e.clientX, e.clientY) : [450];
      if (l1First) dir = -1;
      else if (Math.abs(wx - 450) > 30) dir = wx < 450 ? -1 : 1;
      else dir = guide.cur && guide.cur.id === 'L1' ? guide.hint || -1 : (l.dir || -1);
    }
    l1First = false;
    l.dir = dir; l.ang.t = dir * 0.3; l.ang.v += dir * 7; l.bendV += 10;
    const fired = launch(dir);
    sfx.snap(450 + dir * 100, fired ? 1 : 0.8);
    puff(450 + dir * 120, 120, fired ? 5 : 2);
    log('L1:' + (dir < 0 ? 'L' : 'R') + (fired ? '' : '(empty)'));
    return;
  }
  let want;
  if (tap) want = 1 - l.st;
  else {
    let best = -2; want = l.st;
    for (let i = 0; i < l.opts.length; i++) { const a = optAngle(l, i); const dd = (Math.cos(a) * dx + Math.sin(a) * dy) / (Math.hypot(dx, dy) || 1); if (dd > best) { best = dd; want = i; } }
  }
  if (want !== l.st) { l.st = want; l.ang.t = optAngle(l, want); l.ang.v += (want ? 1 : -1) * 6; sfx.snap(lvPos(l)[0], 1.15); log(id + ':' + l.opts[want].k); }
  else { l.ang.v += 4; sfx.snap(lvPos(l)[0], 0.9); }
  l.bendV += 10;
  puff(lvPos(l)[0], lvPos(l)[1], 3);
}
cv.addEventListener('pointerdown', onDown, { passive:false });
cv.addEventListener('pointermove', onMove, { passive:false });
cv.addEventListener('pointerup', onUp, { passive:false });
cv.addEventListener('pointercancel', onCancel, { passive:false });
cv.addEventListener('lostpointercapture', onCancel);
for (const ev of ['contextmenu','gesturestart','gesturechange','dblclick','selectstart']) document.addEventListener(ev, e => e.preventDefault(), { passive:false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive:false });

/* ============================================================
   お手本（放置4秒で1回）
   ============================================================ */
const demo = { on:false, t:0, tgt:null, nextAt:4 };
function stepDemo(dt) {
  const idle = (now - lastInput) / 1000;
  if (demo.on) { demo.t += dt; if (demo.t > 1.5) { demo.on = false; demo.shown = lastInput; } return; }
  if (ptrs.size) return;
  const busy = balls.some(b => !b.dead);
  if (guide.cur && !busy && idle > 4 && demo.shown !== lastInput) {
    demo.on = true; demo.t = 0; demo.tgt = guide.cur; demo.shown = lastInput; log('demo:' + guide.cur.id);
  }
}

/* ============================================================
   メインループ
   ============================================================ */
let raf = 0, last = 0, running = true;
const TS = clamp(+(new URLSearchParams(location.search).get('ts')) || 1, 0.25, 8); // 検証用の時間倍率
function frame(ts) {
  raf = 0;
  if (!running) return;
  let dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)) * TS; last = ts;
  while (dt > 0) { const d = Math.min(dt, 0.025); dt -= d; now += d * 1000; T += d; update(d); }
  render();
  raf = requestAnimationFrame(frame);
}
function update(dt) {
  // タイマー
  for (let i = timers.length - 1; i >= 0; i--) { const t = timers[i]; t.t -= dt; if (t.t <= 0) { timers.splice(i, 1); t.fn(); } }
  // 供給口
  if (!cradle.has) { cradle.refill -= dt; if (cradle.refill <= 0 && balls.filter(b => !b.dead).length < MAXBALLS && !st.folding) { cradle.has = true; cradle.drop = 0; sfx.tick(450, 0.8); } }
  else cradle.drop = Math.min(1, cradle.drop + dt * 4);
  // 玉（細かく刻む）
  const sub = dt > 0.02 ? 2 : 1;
  for (let k = 0; k < sub; k++) for (const b of balls) if (!b.dead) stepBall(b, dt / sub);
  for (const b of balls) if (b.sinkT > 0.3) b.dead = true;
  if (balls.length > 12) balls = balls.filter(b => !b.dead);
  // ばね
  const L1 = LV.L1;
  stepSp(L1.ang, dt, 120, 10); if (Math.abs(L1.ang.x) > 0.01 && !ptrs.size) L1.ang.t *= Math.pow(0.4, dt);
  L1.bendV += (-L1.bend * 300 - L1.bendV * 9) * dt; L1.bend += L1.bendV * dt;
  stepSp(L1.press, dt, 400, 20);
  for (const k of ['L2','L3','L5','L6','L7']) { const l = LV[k]; stepSp(l.ang, dt, 260, 14); stepSp(l.press, dt, 400, 20); l.bendV += (-l.bend * 320 - l.bendV * 8) * dt; l.bend += l.bendV * dt; }
  for (const k in st.H) {
    const h = st.H[k];
    stepSp(h.sp, dt, 150, 9); stepSp(h.slP, dt, 60, 10); stepSp(h.shut, dt, 120, 10); stepSp(h.win2, dt, 120, 10); stepSp(h.postSp, dt, 200, 11);
    h.wig = Math.max(0, h.wig - dt * 1.6); h.flash = Math.max(0, h.flash - dt * 1.2); h.famT = Math.max(0, h.famT - dt); h.paddle = Math.max(0, h.paddle - dt * 3);
  }
  stepSp(st.bridge.sp, dt, 110, 8); st.bridge.wig = Math.max(0, st.bridge.wig - dt * 1.6);
  stepSp(st.branch.sp, dt, 130, 8);
  const br = st.branch; br.bendV += (-br.bend * 260 - br.bendV * 6) * dt; br.bend += br.bendV * dt;
  st.treeWig = Math.max(0, (st.treeWig || 0) - dt * 1.6);
  st.boardWig = Math.max(0, (st.boardWig || 0) - dt * 1.6);
  stepSp(st.l5, dt, 120, 10); stepSp(st.l6, dt, 50, 10); stepSp(st.tab, dt, 140, 10);
  const bp = st.board.p; bp.x = lerp(bp.x, bp.t, Math.min(1, dt * 2.2)); if (Math.abs(bp.x - bp.t) < 0.003) bp.x = bp.t;
  stepPM(dt);
  stepParts(dt);
  computeGuide();
  if (guide.cur) { const dx = guide.cur.x - pm.x, dy = guide.cur.y - pm.y, m = Math.hypot(dx, dy) || 1; pm.gx = dx / m; pm.gy = dy / m; }
  // 郵便屋は届け中なら玉を見る
  stepDemo(dt);
}
function start() { if (!raf && running) { last = performance.now(); raf = requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; if (AC && AC.state === 'running') AC.suspend().catch(() => {}); for (const r of ptrs.values()) if (r.id && r.id !== 'TAB') LV[r.id].press.t = 0; ptrs.clear(); }
  else { running = true; lastInput = now; if (AC) AC.resume().catch(() => {}); start(); }
});
window.addEventListener('pagehide', () => { running = false; });
window.addEventListener('pageshow', () => { running = true; start(); });
let rzT = 0;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(resize, 60); resize(); });
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

st = freshState();
resize();
resetLevers();
start();

/* 検証用の読み取り口（UIには出ない） */
window.__pt = {
  get st() { return st; }, get now() { return now; }, LOG, LV, get balls() { return balls; }, get layout() { return layout; },
  toScreen(x, y) { return [OX + x * S, OY + y * S]; }, guide, lvPos, demo, pm, get cradle() { return cradle; },
};
})();
</script>
