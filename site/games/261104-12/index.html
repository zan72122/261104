  if(drag||B.phase!=='build'||B.pending>=0||showBusy())return null;
  const n=B.st.length;
  let plan;
  if(!made.train)plan=PLANS.train;else if(!made.wheel)plan=PLANS.wheel;else if(!made.rocket)plan=PLANS.rocket;
  else plan=FREE_PLANS[(stats.works-3)%FREE_PLANS.length];
  return plan[n]||null;
}
function slotOf(t){for(const s of LY.slots)if(s.t===t)return s;return LY.slots[0];}
function drawTray(){
  const k=LY.k,gt=guideType();
  for(const s of LY.slots){
    const st=SLOT[s.t];
    const isG=gt===s.t;
    const bounce=isG?Math.abs(Math.sin(T*3.2))*10*k:0;
    if(isG){const r=LY.slotR*(1.35+0.08*Math.sin(T*6));const gr=ctx.createRadialGradient(s.x,s.y-bounce,r*0.4,s.x,s.y-bounce,r);
      gr.addColorStop(0,cs(CLAY[s.t].hi,0.5));gr.addColorStop(1,cs(CLAY[s.t].hi,0));ctx.fillStyle=gr;ctx.beginPath();ctx.arc(s.x,s.y-bounce,r,0,TAU);ctx.fill();}
    const pr=st.press;const rg=easeBack(st.regrow);
    const breathe=1+Math.sin(T*1.7+s.x)*0.015;
    const sx=(1+pr*0.22)*rg*breathe,sy=(1-pr*0.26)*rg*breathe;
    ctx.beginPath();ctx.ellipse(s.x,s.y+LY.slotR*0.85,LY.slotR*0.8*rg,LY.slotR*0.18,0,0,TAU);ctx.fillStyle='rgba(30,14,6,0.35)';ctx.fill();
    if(rg>0.02)drawSticker(s.t,s.x,s.y-bounce+pr*LY.slotR*0.2,LY.slotR*0.78,{sx,sy,seed:s.t.charCodeAt(0)*3});
    if(pr>0.05){dentMark(s.x+(st.px||0)*0.4,s.y-bounce+(st.py||0)*0.4,LY.slotR*0.3*pr,LY.slotR*0.2*pr,CLAY[s.t],pr);}
  }
}
function startDrag(slot,e){
  drag={pid:e.pointerId,t:slot.t,ax:slot.x,ay:slot.y,x:slot.x,y:slot.y,fx:e.clientX,fy:e.clientY,peeled:false,vx:0,vy:0,st:'drag',ft:0,fx0:0,fy0:0,tx:0,ty:0,target:null,rot:0,stretch:0};
  const st=SLOT[slot.t];st.press=1;st.px=e.clientX-slot.x;st.py=e.clientY-slot.y;
  B.face.exp=1;B.face.et=0.8;
  SFX.dent();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
}
function findTarget(x,y){
  let best=null,bd=1e9;
  if(buildAccepts()){const d=buildDropDist(x,y);if(d>=0){best={kind:'build'};bd=d/Math.max(132*LY.k,LY.pedW*0.62);}}
  if(parkOpen>0.6){for(const w of WORKS){if(w.layer!=='park'||w.retire)continue;const n=workHitN(w,x,y,30*LY.k);
    if(n<1&&n<bd){bd=n;best={kind:'work',w};}}}
  return best;
}
function releaseDrag(cancel){
  if(!drag||drag.st!=='drag')return;
  try{cv.releasePointerCapture(drag.pid);}catch(_){}
  if(!drag.peeled){drag=null;return;}
  const tg=cancel?null:findTarget(drag.x,drag.y);
  if(tg){drag.st='fly';drag.ft=0;drag.fx0=drag.x;drag.fy0=drag.y;drag.target=tg;
    if(tg.kind==='build'){const g=moundGeo();drag.tx=B.st.length?clamp(drag.x,g.cx-g.rx*0.6,g.cx+g.rx*0.6):LY.pedX;drag.ty=B.st.length?clamp(drag.y,g.cy-g.ry*0.6,g.cy+g.ry*0.3):LY.pedTop-24*LY.k;}
    else{drag.tx=drag.x;drag.ty=drag.y;}
  }else{drag.st='back';drag.ft=0;drag.fx0=drag.x;drag.fy0=drag.y;SFX.back();}
}
function updDrag(dt){
  for(const t of TYPES){const s=SLOT[t];s.press=Math.max(0,s.press-dt*(drag&&drag.t===t&&!drag.peeled?0:3.5));s.regrow=Math.min(1,s.regrow+dt*2.2);}
  if(!drag)return;
  const k=LY.k;
  if(drag.st==='drag'){
    if(!drag.peeled){
      const d=dist(drag.fx,drag.fy,drag.ax,drag.ay);
      drag.x=drag.fx;drag.y=drag.fy;
      if(d>24*k){drag.peeled=true;SFX.peel();SLOT[drag.t].regrow=0;SLOT[drag.t].press=0;crumb(drag.ax,drag.ay,CLAY[drag.t],3,80*k,{up:40*k});}
    }else{
      const nx=lerp(drag.x,drag.fx,Math.min(1,dt*28)),ny=lerp(drag.y,drag.fy,Math.min(1,dt*28));
      drag.vx=lerp(drag.vx,(nx-drag.x)/Math.max(dt,1e-3),0.3);drag.vy=lerp(drag.vy,(ny-drag.y)/Math.max(dt,1e-3),0.3);
      drag.x=nx;drag.y=ny;
    }
    const tg=findTarget(drag.x,drag.y);
    if(tg&&tg.kind==='build'){B.face.exp=3;B.face.et=0.2;}
    if(tg&&tg.kind==='work'){tg.w.face.exp=1;tg.w.face.et=0.2;}
  }else if(drag.st==='fly'){
    drag.ft+=dt;const q=easeOut(drag.ft/0.12);
    drag.x=lerp(drag.fx0,drag.tx,q);drag.y=lerp(drag.fy0,drag.ty,q);
    if(drag.ft>=0.12){const tg=drag.target,t=drag.t,x=drag.x,y=drag.y;drag=null;
      if(tg.kind==='build'){if(!attachToBuild(t,x,y)){SFX.back();}}
      else if(WORKS.indexOf(tg.w)>=0)stickOnWork(tg.w,t,x,y);}
  }else if(drag.st==='back'){
    drag.ft+=dt;const q=ease(drag.ft/0.35);
    drag.x=lerp(drag.fx0,drag.ax,q);drag.y=lerp(drag.fy0,drag.ay,q)-Math.sin(q*Math.PI)*40*k;
    if(drag.ft>=0.35){SLOT[drag.t].regrow=1;SLOT[drag.t].press=0.6;drag=null;}
  }
}
function drawDrag(){
  if(!drag)return;
  const k=LY.k,size=LY.slotR*0.78;
  if(drag.st==='drag'&&!drag.peeled){
    /* pulling the clay sticker off the sheet: it stretches between sheet and finger */
    const dx=drag.fx-drag.ax,dy=drag.fy-drag.ay,d=Math.hypot(dx,dy);const a=Math.atan2(dy,dx);
    const st=1+d/(size*2.2);
    drawSticker(drag.t,drag.ax+dx*0.5,drag.ay+dy*0.5,size,{rot:a,sx:st,sy:1/Math.sqrt(st)});
    return;
  }
  const sp=Math.hypot(drag.vx,drag.vy);const st=drag.st==='drag'?1+Math.min(0.55,sp/1600):1;
  const a=Math.atan2(drag.vy,drag.vx);
  let sc=1.08;if(drag.st==='fly'){sc=lerp(1.08,0.7,drag.ft/0.12);}
  ctx.beginPath();ctx.ellipse(drag.x+6*k,drag.y+size*1.1,size*0.8,size*0.22,0,0,TAU);ctx.fillStyle='rgba(20,8,2,0.25)';ctx.fill();
  ctx.save();ctx.translate(drag.x,drag.y);ctx.rotate(a);ctx.scale(st*sc,sc/Math.sqrt(st));ctx.rotate(-a);
  drawSticker(drag.t,0,0,size,{});
  ctx.restore();
}
/* ---- one-time hand demonstration ---- */
function updDemo(dt){
  if(demo){demo.t+=dt;if(demo.t>2.6)demo=null;return;}
  if(!demoDone&&idleT>4&&!drag&&B.phase==='build'&&!showBusy()&&guideType()){demo={t:0,type:guideType()};demoDone=true;}
}
function drawHand(x,y,press,a){
  const k=LY.k;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.scale(1-press*0.08,1-press*0.08);
  ctx.fillStyle='rgba(255,246,232,0.85)';ctx.strokeStyle='rgba(80,50,30,0.5)';ctx.lineWidth=2*k;
  /* finger */
  rrect(-7*k,-4*k,14*k,40*k,7*k);ctx.fill();ctx.stroke();
  /* palm */
  rrect(-18*k,26*k,40*k,38*k,14*k);ctx.fill();ctx.stroke();
  rrect(7*k,22*k,10*k,20*k,5*k);ctx.fill();rrect(15*k,26*k,10*k,18*k,5*k);ctx.fill();
  ctx.restore();
}
function drawDemo(){
  if(!demo)return;
  const s=slotOf(demo.type);const t=demo.t;const k=LY.k;
  const ex=LY.pedX,ey=LY.pedTop-24*k;
  let x=s.x,y=s.y,press=0,a=0.75,carry=false;
  if(t<0.4){a=0.75*t/0.4;}
  else if(t<0.6){press=(t-0.4)/0.2;}
  else if(t<1.8){const q=ease((t-0.6)/1.2);x=lerp(s.x,ex,q);y=lerp(s.y,ey,q)-Math.sin(q*Math.PI)*50*k;press=1;carry=true;}
  else if(t<2.1){x=ex;y=ey;press=1-(t-1.8)/0.3;carry=t<1.95;}
  else{x=ex;y=ey;a=0.75*(1-(t-2.1)/0.5);}
  if(carry){ctx.globalAlpha=0.55;drawSticker(demo.type,x,y,LY.slotR*0.7,{});ctx.globalAlpha=1;}
  drawHand(x+4*k,y+6*k,press,a);
}
/* =================== input =================== */
function hitSlot(x,y){let best=null,bd=LY.grabR;for(const s of LY.slots){const d=dist(x,y,s.x,s.y);if(d<bd){bd=d;best=s;}}return best;}
function hitWork(x,y){let best=null,bd=1e9;for(const w of WORKS){if(w.retire)continue;const n=workHitN(w,x,y,12*LY.k);if(n<1&&n<bd){bd=n;best=w;}}return best;}
function onDown(e){
  e.preventDefault();
  audioStart();
  idleT=0;demo=null;firstTouch=true;
  const x=e.clientX,y=e.clientY;
  const sl=hitSlot(x,y);
  if(sl){
    if(!drag){startDrag(sl,e);}
    else{SLOT[sl.t].press=0.7;SFX.dent();}
    B.face.lx=clamp((sl.x-LY.pedX)/120,-1,1);B.face.ly=1;
    return;
  }
  if(hitBuild(x,y)){tapBuild(x,y);return;}
  const w=hitWork(x,y);
  if(w){w.sqv-=5;w.face.exp=1;w.face.et=0.6;SFX.dent();TAPS.set(e.pointerId,{w,x,y,t:T});return;}
  const p=hitPass(x,y);
  if(p){p.hopV=200*LY.k;p.wave=1;SFX.wave();return;}
}
function onMove(e){
  if(drag&&e.pointerId===drag.pid&&drag.st==='drag'){e.preventDefault();drag.fx=e.clientX;drag.fy=e.clientY;idleT=0;}
}
function onUp(e){
  if(drag&&e.pointerId===drag.pid){releaseDrag(false);}
  const tp=TAPS.get(e.pointerId);
  if(tp){TAPS.delete(e.pointerId);if(dist(tp.x,tp.y,e.clientX,e.clientY)<24*LY.k&&T-tp.t<0.9&&WORKS.indexOf(tp.w)>=0)depart(tp.w);}
}
function onCancel(e){
  if(drag&&e.pointerId===drag.pid){releaseDrag(true);}
  TAPS.delete(e.pointerId);
}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp,{passive:false});
cv.addEventListener('pointercancel',onCancel,{passive:false});
cv.addEventListener('lostpointercapture',e=>{if(drag&&e.pointerId===drag.pid&&drag.st==='drag')releaseDrag(false);});
window.addEventListener('blur',()=>{if(drag&&drag.st==='drag')releaseDrag(true);});
const stop=e=>{e.preventDefault();};
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('touchmove',stop,{passive:false});
document.addEventListener('gesturestart',stop,{passive:false});
document.addEventListener('contextmenu',stop);
document.addEventListener('dblclick',stop,{passive:false});
document.addEventListener('selectstart',stop);

/* =================== update & render =================== */
function lookAt(face,x,y,fx,fy){face.lx=lerp(face.lx,clamp((x-fx)/110,-1,1),0.15);face.ly=lerp(face.ly,clamp((y-fy)/110,-1,1),0.15);}
function update(dt){
  T+=dt;idleT+=dt;
  updLater(dt);
  serviceT=Math.max(0,serviceT-dt);
  if(parkOpening){parkOpen=Math.min(1,parkOpen+dt/1.3);if(parkOpen>=1)parkOpening=false;}
  parkRipple=Math.max(0,parkRipple-dt*0.9);
  if(Math.abs(trackShown-trackLevel)>0.001){trackShown+=clamp(trackLevel-trackShown,-dt*0.9,dt*0.9);rebuildTrack();}
  updBuild(dt);
  for(let i=WORKS.length-1;i>=0;i--){const w=WORKS[i];if(w)updWork(w,dt);}
  updPass(dt);
  updParts(dt);
  updDrag(dt);
  updDemo(dt);
  /* gaze guidance of the pedestal face */
  const fx=LY.pedX,fy=LY.pedTop+LY.pedH*0.5;
  const top=WORKS.find(w=>w.layer==='top'&&!w.retire);
  if(drag)lookAt(B.face,drag.x,drag.y,fx,fy);
  else if(top)lookAt(B.face,top.x,top.y,fx,fy);
  else{const gt=guideType();if(gt){const s=slotOf(gt);lookAt(B.face,s.x,s.y,fx,fy);}else lookAt(B.face,fx,fy-60,fx,fy);}
  for(const w of WORKS){const c=workCenter(w);let tx=c.x+(w.type==='train'?Math.cos(w.ang)*60:0),ty=c.y;
    let near=null,nd=1e9;for(const p of PASS){if(p.state!=='run'&&p.state!=='queue')continue;const d=dist(p.x,p.y,c.x,c.y);if(d<nd){nd=d;near=p;}}
    if(near&&nd<260*LY.k){tx=near.x;ty=near.y;}
    lookAt(w.face,tx,ty,c.x,c.y);}
}
function render(){
  if(bgDirty||!bgC){buildBench();buildPark();bgDirty=false;}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.drawImage(bgC,0,0,W,H);
  drawShelf();
  drawPark();
  drawPedestal();
  drawRailOnPedestal();
  drawMound();
  drawDentPassengers();
  for(const p of PASS)if(!p.inPark&&(p.state==='run'||p.state==='queue'))drawPass(p);
  for(const w of WORKS)if(w.layer==='top')drawWork(w);
  for(const p of PASS)if(p.state==='jump'||p.state==='alight'&&!p.inPark)drawPass(p);
  drawTray();
  drawDrag();
  drawParts();
  drawDemo();
}
let last=0,rafId=0,running=false;const PERF={avg:0,max:0,n:0};
function frame(ts){
  if(!running)return;
  rafId=requestAnimationFrame(frame);
  let dt=(ts-last)/1000;last=ts;
  if(!(dt>0))dt=1/60;dt=Math.min(dt,1/20);
  const t0=performance.now();
  try{update(dt);render();}catch(err){if(!frame.err){frame.err=1;console.warn(err);}}
  const ms=performance.now()-t0;PERF.avg=PERF.avg*0.95+ms*0.05;if(ms>PERF.max)PERF.max=ms;PERF.n++;
}
function startLoop(){if(running)return;running=true;last=performance.now();rafId=requestAnimationFrame(frame);}
function stopLoop(){running=false;cancelAnimationFrame(rafId);}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopLoop();if(drag&&drag.st==='drag')releaseDrag(true);try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}}
  else{try{if(AC&&AC.state==='suspended')AC.resume();}catch(e){}startLoop();}
});
function onRelayout(){
  if(drag){drag.ax=slotOf(drag.t).x;drag.ay=slotOf(drag.t).y;}
  for(const w of WORKS){if(w.state==='birth'){w.x=LY.pedX+w.relX;w.y=LY.pedTop+w.relY;if(w.trail)w.trail=[];continue;}
    if(w.layer!=='park')continue;
    if(w.type==='wheel'){w.x=PK.wheelX;w.y=PK.wheelCY;}
    if(w.type==='rocket'&&w.state==='hover'){w.x=PK.hoverX;w.y=PK.hoverY;}
    if(w.type==='rocket'&&w.state==='dock'){w.x=PK.dockX;w.y=PK.dockY-33*workU(w)-6*PK.s;}
    if(w.type==='train'){w.s=Math.min(w.s,TRK.len);const hp=trackAt(w.s);w.x=hp.x;w.y=hp.y;w.trail=[];}
  }
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));
resize();
startLoop();
/* read-only probe for automated checks (no UI) */
window.__park={
  state:()=>({phase:B.phase,stickers:B.st.map(s=>s.t),works:WORKS.map(w=>({id:w.id,type:w.type,state:w.state,layer:w.layer,seats:w.seats.map(s=>s?s.id:0),ex:w.ex,gond:w.gond,cars:w.cars})),
    shelf:SHELF.map(s=>s.type),pass:PASS.map(p=>({id:p.id,state:p.state,host:p.host?p.host.id:0,want:p.want,ridden:p.ridden})),parkOpen,trackLevel,made:Object.assign({},made),demo:!!demo,demoDone,guide:guideType(),parts:PARTS.length,face:B.face.exp,audio:AC?AC.state:'none'}),
  layout:()=>({slots:LY.slots,pedX:LY.pedX,pedTop:LY.pedTop,pedW:LY.pedW,pedH:LY.pedH,P:LY.P,S:LY.S,k:LY.k,platY:PK.platY,wheelX:PK.wheelX,dockX:PK.dockX}),
  workCenter:id=>{const w=workById(id);return w?workCenter(w):null;},
  decide:arr=>decideType(arr.map(t=>({t}))),
  perf:()=>{const r={avg:PERF.avg,max:PERF.max,n:PERF.n,running};PERF.max=0;return r;}
};
})();
</script>
