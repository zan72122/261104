<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(() => {
'use strict';
/* ===== palette: navy / white + pink / yellow (4 colors) ===== */
const NAVY = '#1d2a5c', WHITE = '#fbf6ea', PINK = '#f2799e', YELLOW = '#f7c548';
const SHADOW = 'rgba(5,9,30,0.55)';
const TAU = Math.PI * 2;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const saEl = document.getElementById('sa');
let g = ctx;                      // current drawing context (swapped for photo snapshots)
let W = 0, H = 0, DPR = 1;
let SA = { t: 0, r: 0, b: 0, l: 0 };
let LY = null;                    // layout
let T = 0;                        // game time (s)

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const easeOut = t => { t = clamp(t, 0, 1); return 1 - (1 - t) * (1 - t) * (1 - t); };
const rnd = (a, b) => a + Math.random() * (b - a);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ===== audio (Web Audio synth, starts on first touch) ===== */
let AC = null, MG = null, NB = null;
function audioInit() {
  try {
    if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    MG = AC.createGain(); MG.gain.value = 0.55; MG.connect(AC.destination);
    const len = Math.floor(AC.sampleRate * 0.6);
    NB = AC.createBuffer(1, len, AC.sampleRate);
    const d = NB.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    if (AC.state === 'suspended') AC.resume().catch(() => {});
  } catch (e) { AC = null; }
}
function tone(f, t0, dur, type, vol, f2) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(MG); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function noise(t0, dur, freq, q, vol, ftype, f2) {
  if (!AC || !NB) return;
  try {
    const s = AC.createBufferSource(); s.buffer = NB;
    const f = AC.createBiquadFilter(); f.type = ftype || 'bandpass'; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    const gn = AC.createGain();
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.004);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(gn); gn.connect(MG);
    s.start(t0, Math.random() * 0.3); s.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const SND = {
  snip(p01, layer) {           // dry "chokki": pitch by height (higher = higher), timbre by layer
    if (!AC) return; const t = AC.currentTime;
    const base = 1500 + p01 * 1500 + layer * 500;
    noise(t, 0.03, base * 1.7, 3, 0.45, 'bandpass');
    tone(base, t, 0.025, 'square', 0.05, base * 0.6);
    noise(t + 0.05, 0.05, base * 2.3, 4, 0.55, 'bandpass');
    tone(base * (layer ? 1.5 : 1.2), t + 0.05, 0.06, 'triangle', 0.16, base * 0.55);
  },
  press() { if (!AC) return; const t = AC.currentTime; noise(t, 0.07, 1100, 0.9, 0.16, 'bandpass', 700); tone(330, t, 0.06, 'sine', 0.05, 260); },
  pop() { if (!AC) return; const t = AC.currentTime; tone(520, t, 0.12, 'sine', 0.22, 900); noise(t, 0.04, 2500, 2, 0.12); },
  soft() { if (!AC) return; const t = AC.currentTime; tone(260, t, 0.06, 'sine', 0.05, 220); },
  chime(level) {               // success: clearly melodic, different from snips
    if (!AC) return; const t = AC.currentTime;
    const semis = [0, 4, 7, 12, 16, 19];
    const n = 3 + Math.min(3, level | 0);
    for (let i = 0; i < n; i++) {
      const f = 1046.5 * Math.pow(2, semis[i] / 12);
      tone(f, t + i * 0.075, 0.45, 'triangle', 0.17, 0);
      tone(f * 2, t + i * 0.075, 0.18, 'sine', 0.04, 0);
    }
  },
  boing() {
    if (!AC) return; const t = AC.currentTime;
    try {
      const o = AC.createOscillator(), gn = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(760, t + 0.3);
      l.frequency.value = 18; lg.gain.value = 60; l.connect(lg); lg.connect(o.frequency);
      gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.22, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(gn); gn.connect(MG); o.start(t); l.start(t); o.stop(t + 0.42); l.stop(t + 0.42);
    } catch (e) {}
  },
  shutter() { if (!AC) return; const t = AC.currentTime; noise(t, 0.05, 3500, 1, 0.5, 'highpass'); tone(1400, t + 0.05, 0.04, 'square', 0.08); noise(t + 0.08, 0.09, 2200, 1, 0.35); },
  whoosh() { if (!AC) return; const t = AC.currentTime; noise(t, 0.9, 400, 1.2, 0.35, 'bandpass', 2600); },
  fanfare() {
    if (!AC) return; const t = AC.currentTime;
    const seq = [0, 4, 7, 12, 7, 12, 16];
    seq.forEach((s, i) => tone(784 * Math.pow(2, s / 12), t + i * 0.09, 0.4, 'triangle', 0.16));
    [0, 4, 7].forEach(s => tone(523 * Math.pow(2, s / 12), t + 0.65, 0.9, 'triangle', 0.1));
  }
};

/* ===== layout ===== */
function readSafe() {
  const s = getComputedStyle(saEl);
  SA = { t: parseFloat(s.paddingTop) || 0, r: parseFloat(s.paddingRight) || 0, b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0 };
}
function layout() {
  readSafe();
  W = Math.max(200, window.innerWidth); H = Math.max(200, window.innerHeight);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const portrait = H >= W;
  const iw = W - SA.l - SA.r;
  const wallTop = SA.t + 8;
  const wallH = portrait ? clamp(H * 0.17, 76, 190) : clamp(H * 0.165, 78, 160);
  const wallBottom = wallTop + wallH;
  const floorH = portrait ? H * 0.21 : H * 0.19;
  const floorTop = H - SA.b - floorH;
  let U, hx, hy, mir;
  if (portrait) {
    U = Math.min(iw * 0.72 / 250, (floorTop - wallBottom + 10) / 395, 1.75);
    hx = SA.l + iw * 0.39;
    hy = floorTop + 18 * U - 270 * U;
    const mw = iw * 0.33, mh = mw * 1.36;
    mir = { x: W - SA.r - 8 - mw, y: floorTop + 8 - mh, w: mw, h: mh };
  } else {
    U = Math.min(iw * 0.3 / 250, (floorTop - wallBottom + 10) / 395, 1.75);
    hx = SA.l + iw * 0.4;
    hy = floorTop + 18 * U - 270 * U;
    const mh = Math.min((floorTop - wallBottom) * 0.92, H * 0.52), mw = mh * 0.76;
    const left = hx + 178 * U;
    mir = { x: left + Math.max(0, (W - SA.r - left - mw) / 2), y: floorTop + 6 - mh, w: mw, h: mh };
  }
  const topLimit = wallBottom + 8 + 128 * U;
  if (hy < topLimit) hy = topLimit;
  const sw = Math.min(300 * U, iw - 16), sh = sw * 1.12;
  const scx = portrait ? SA.l + iw / 2 : hx + 20 * U;
  const stage = { x: scx - sw / 2, y: hy - 150 * U, w: sw, h: sh, gx: (scx - hx) / U };
  const fh = wallH - 12, fw = fh * 0.88;
  const pframe = { x: SA.l + 14, y: wallTop + 2, w: fw, h: fh };
  LY = { portrait, wallTop, wallH, wallBottom, floorTop, floorH, U, hx, hy, mir, stage, pframe };
  // re-place falling pieces after resize
  for (const p of pieces) {
    if (p.state === 'rest' || p.state === 'fall' || p.state === 'fly') { p.state = 'rest'; p.x = p.fx * W; p.y = floorY(p.fy); p.rot = p.restRot; }
    if (p.state === 'drag') { p.state = 'rest'; p.x = p.fx * W; p.y = floorY(p.fy); }
  }
  particles.length = 0;
  endGesture(true);
}
const floorY = fy => LY.floorTop + LY.floorH * (0.22 + 0.62 * fy);

/* ===== geometry helpers ===== */
function poly(p) { g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.closePath(); }
function fillP(p, col) { poly(p); g.fillStyle = col; g.fill(); }
function paper(p, col, sx, sy) { // paper with dark offset drop shadow
  if (sx || sy) { g.save(); g.translate(sx, sy); fillP(p, SHADOW); g.restore(); }
  fillP(p, col);
}
function ngon(cx, cy, rx, ry, n, rot, jit, seed) {
  const p = []; rot = rot || 0;
  for (let i = 0; i < n; i++) {
    const a = rot + i / n * TAU;
    const j = jit ? 1 + (hash(i + (seed || 0) * 17) - 0.5) * jit : 1;
    p.push(cx + Math.cos(a) * rx * j, cy + Math.sin(a) * ry * j);
  }
  return p;
}
function star(cx, cy, r) { const p = []; for (let i = 0; i < 8; i++) { const a = i / 8 * TAU - Math.PI / 2; const rr = i % 2 ? r * 0.32 : r; p.push(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } return p; }
function clipBelow(p, h) { // Sutherland–Hodgman: keep y >= h
  const out = []; const n = p.length / 2;
  for (let i = 0; i < n; i++) {
    const cx = p[i * 2], cy = p[i * 2 + 1];
    const j = (i - 1 + n) % n, px = p[j * 2], py = p[j * 2 + 1];
    const cin = cy >= h, pin = py >= h;
    if (cin) {
      if (!pin) { const t = (h - py) / (cy - py); out.push(px + (cx - px) * t, h); }
      out.push(cx, cy);
    } else if (pin) { const t = (h - py) / (cy - py); out.push(px + (cx - px) * t, h); }
  }
  return out;
}

/* ===== girl (paper doll) ===== */
const EYE_Y = 8, EYE_X = 36, BROW_Y = -24;
const PEEK1 = 12;
const PEEK2 = { curl: 20, patsun: 10, twin: 18 };
const EYE_SNAP = -18, BROW_SNAP = -42;
const DONE_THR = [44, -1, 30, -1, 44];
const SDEF = [
  { cx: -74, top: -54, w: 46, lean: -14, b: 76 },
  { cx: -38, top: -70, w: 46, lean: -6, b: 60 },
  { cx: 0, top: -76, w: 48, lean: 0, b: 62 },
  { cx: 38, top: -70, w: 46, lean: 6, b: 60 },
  { cx: 74, top: -54, w: 46, lean: 14, b: 76 }
];
const DRAW_ORDER = [0, 4, 1, 3, 2];
const TIPS = ['round', 'point', 'wave'];
const POSES = ['peace', 'cheeks', 'up', 'hip'];

let cycle = 0;
let girl = null;
function makeGirl() {
  const cols = Math.random() < 0.5 ? [PINK, YELLOW] : [YELLOW, PINK];
  if (cycle > 0 && girl && girl.cols[0] === cols[0] && Math.random() < 0.7) cols.reverse();
  const styles = shuffle(['curl', 'patsun', 'twin']);
  const tip = TIPS[cycle % 3];
  const group = [0, 0, 1, 2, 2];
  const strands = SDEF.map((d, i) => ({
    i, cx: d.cx, top: d.top, w: d.w, lean: d.lean,
    style: styles[group[i]],
    layers: [
      { col: cols[0], b: d.b + rnd(-3, 3), db: 0, cut: false, visible: true, tip: tip, jag: 0 },
      { col: cols[1], b: 0, db: 0, cut: false, visible: false, tip: 'scallop', jag: 0 },
      { col: NAVY, b: 0, db: 0, cut: false, visible: false, tip: styles[group[i]], jag: 0, pop: 0 }
    ],
    press: 0, pressT: 0, spring: 0, springV: 0, swing: 0, swingT: 0, pull: 0, pullT: 0, hop: 0, lastCutT: -9
  }));
  for (const s of strands) { s.layers[0].db = s.layers[0].b; s.layers[1].b = s.layers[1].db = s.layers[0].b - 2; s.layers[2].b = s.layers[2].db = s.layers[0].b - 4; }
  return {
    cols: [cols[0], cols[1], NAVY], capeCol: cols[1], tip, strands, styles,
    x: 0, bob: 0, tilt: 0, headX: 0, lookX: 0, lookY: 0, spinX: 1,
    blinkNext: 1.5, blinkT: 0, wink: 0, winkT: 0, mood: 'neutral', blush: 0, browUp: 0,
    hands: { lx: -58, ly: 236, rx: 58, ry: 236 }, pose: 'idle',
    react: null, reactStart: 0, reactDur: 0,
    pig: 0, pigV: 0, pigOn: false,
    brushT: -1, brushIdx: 1, nextBrush: 0.7,
    flags: { anyCut: false, eye: false, brow: false, asym: false, even: false, curl: {}, stripe: false, tri: false },
    touchSide: 0, touchUntil: 0, giggleT: -9,
    poseOrder: shuffle(POSES.slice()), poseIdx: 0, poseNext: 0,
    sparkleEdgeT: -9
  };
}
function cAt(s, y) { return s.cx + s.lean * (y - s.top) / 100; }
function layerHW(s, k) { return s.w * (k === 1 ? 0.94 : (k === 2 ? 1.02 : 1)) / 2; }
function tipDepth(s, k, tip) {
  const hw = layerHW(s, k);
  switch (tip) { case 'round': return s.w * 0.36; case 'point': return s.w * 0.5; case 'wave': return s.w * 0.22; case 'scallop': return hw * 0.5; case 'twin': return 15; default: return 0; }
}
function curlR(s) { const l1 = s.layers[1], l2 = s.layers[2]; return clamp((l2.db - l1.db) / 2, 2, 10); }
function layerPts(s, k, b, tip, jag) {
  const hw = layerHW(s, k), top = s.top - 12;
  let d = tipDepth(s, k, tip);
  if (tip === 'curl') d = curlR(s);
  const yb = b - d, m = cAt(s, b);
  const p = [cAt(s, top) - hw, top, cAt(s, yb) - hw, yb];
  switch (tip) {
    case 'round': for (let j = 1; j < 8; j++) { const a = Math.PI - j * Math.PI / 8; p.push(m + Math.cos(a) * hw, yb + Math.sin(a) * d); } break;
    case 'point': p.push(m - hw * 0.15, b - d * 0.1, m, b, m + hw * 0.15, b - d * 0.1); break;
    case 'wave': p.push(m - hw * 0.5, b, m, yb + d * 0.25, m + hw * 0.5, b); break;
    case 'flat': p.push(m - hw * 0.35, b + jag * 1.3, m + hw * 0.25, b - jag); break;
    case 'scallop':
      for (const bump of [-0.5, 0.5]) { const bc = m + bump * hw; for (let j = 0; j <= 5; j++) { const a = Math.PI - j * Math.PI / 5; p.push(bc + Math.cos(a) * hw * 0.5, yb + Math.sin(a) * d); } }
      break;
    case 'twin': p.push(m - hw * 0.7, b, m - hw * 0.25, yb + 3, m, yb + 6, m + hw * 0.25, yb + 3, m + hw * 0.7, b); break;
    default: break; // patsun / curl: straight
  }
  p.push(cAt(s, yb) + hw, yb, cAt(s, top) + hw, top);
  return p;
}
function layerBottomAt(s, k, x) { // for coverage logic (uses target b)
  const l = s.layers[k]; const hw = layerHW(s, k); const c = cAt(s, l.b);
  const dx = Math.abs(x - c) / hw; if (dx > 1) return -999;
  const d = tipDepth(s, k, l.tip);
  if (l.tip === 'round') return l.b - d * (1 - Math.sqrt(Math.max(0, 1 - dx * dx)));
  if (l.tip === 'point') return l.b - d * dx;
  if (l.tip === 'scallop' || l.tip === 'wave' || l.tip === 'twin') return l.b - d * 0.5;
  if (l.tip === 'curl') return l.b - 3;
  return l.b;
}
function covered(gl, x, y) {
  for (const s of gl.strands) {
    if (y < s.top - 12) continue;
    for (let k = 0; k < 3; k++) {
      const l = s.layers[k]; if (!l.visible) continue;
      const hw = layerHW(s, k); const c = cAt(s, y);
      if (Math.abs(x - c) > hw) continue;
      if (y < layerBottomAt(s, k, x)) return true;
    }
  }
  return false;
}
function eyeVisible(gl, side) {
  const ex = side * EYE_X; const pts = [[ex - 8, 4], [ex, 8], [ex + 8, 4], [ex, 0], [ex, 15]];
  let c = 0; for (const q of pts) if (covered(gl, q[0], q[1])) c++;
  return c <= 1;
}
function browVisible(gl, side) {
  const ex = side * EYE_X; const pts = [[ex - 6, BROW_Y], [ex + 6, BROW_Y - 1], [ex, BROW_Y - 2]];
  for (const q of pts) if (covered(gl, q[0], q[1])) return false;
  return true;
}
function strandDone(s) { return s.layers[1].cut && s.layers[2].b <= DONE_THR[s.i]; }
function allDone(gl) { return gl.strands.every(strandDone); }
function strandLowest(s) { let m = s.layers[0].b; for (let k = 1; k < 3; k++) if (s.layers[k].visible) m = Math.max(m, s.layers[k].b); return m; }
function updateAttach(s) {
  const l0 = s.layers[0], l1 = s.layers[1], l2 = s.layers[2];
  if (l1.visible && !l1.cut) l1.b = l0.b + PEEK1;
  if (l2.visible) {
    const lim = (s.i >= 1 && s.i <= 3) ? -2 : 999;
    l2.b = Math.min(l1.b + PEEK2[s.style], Math.max(l1.b + 7, lim));
  }
}

/* head transform: girl local units -> world */
function girlOrigin() { return { ox: LY.hx + girl.x * LY.U, oy: LY.hy + girl.bob * LY.U }; }
function toLocalHead(px, py) {
  const o = girlOrigin(); const U = LY.U;
  let x = (px - o.ox) / U, y = (py - o.oy) / U;
  x /= (Math.abs(girl.spinX) < 0.2 ? 0.2 : girl.spinX);
  // inverse head tilt around (0,90) and head shift
  const a = -girl.tilt; const yy = y - 90;
  const rx = x * Math.cos(a) - yy * Math.sin(a), ry = x * Math.sin(a) + yy * Math.cos(a);
  return { x: rx - girl.headX, y: ry + 90 };
}
function headToWorld(x, y) {
  const o = girlOrigin(); const U = LY.U; const a = girl.tilt;
  x += girl.headX; const yy = y - 90;
  const rx = x * Math.cos(a) - yy * Math.sin(a), ry = x * Math.sin(a) + yy * Math.cos(a) + 90;
  return { x: o.ox + rx * girl.spinX * U, y: o.oy + ry * U };
}

/* ===== pieces, particles, decorations ===== */
const pieces = [];      // cut paper pieces (floor / falling / drag / decor)
const particles = [];   // crumbs and sparkles
const confetti = [];    // floor material that grows
const photos = [];      // wall photos (snapshots, immutable)
const MAX_PARTICLES = 90, MAX_FLOOR = 34, MAX_CONF = 220, NSLOT = 14;
const slots = new Array(NSLOT).fill(null);

function addParticle(p) { if (particles.length >= MAX_PARTICLES) particles.shift(); particles.push(p); }
function crumbs(x, y, col, n, dir) {
  for (let i = 0; i < n; i++) addParticle({ kind: 'crumb', x, y, vx: rnd(-90, 90) + dir * 60, vy: rnd(-160, -30), r: rnd(1.6, 3.6) * LY.U, rot: rnd(0, TAU), vr: rnd(-12, 12), col: i % 3 === 0 ? WHITE : col, life: rnd(0.5, 0.9), t: 0 });
}
function sparkles(x, y, n, spread) {
  for (let i = 0; i < n; i++) { const a = rnd(0, TAU), r = rnd(0.3, 1) * spread; addParticle({ kind: 'star', x: x + Math.cos(a) * r, y: y + Math.sin(a) * r, vx: Math.cos(a) * 40, vy: Math.sin(a) * 40 - 30, r: rnd(5, 10) * LY.U, life: rnd(0.6, 1.0), t: 0 }); }
}

function makePiece(s, k, h, oldB, oldTip, jag) {
  const lay = s.layers[k];
  const full = layerPts(s, k, oldB, oldTip, jag);

  const cp = [-58, 106, 58, 106, 130, 272, -130, 272];
  paper(cp, gl.capeCol, SX, SY);
  for (let i = 0; i < 7; i++) { const x = -90 + (i % 4) * 58 + (i > 3 ? 29 : 0), y = 170 + (i > 3 ? 55 : 0); fillP(ngon(x, y, 7, 7, 8, 0.3), WHITE); }
  const col = [-62, 100]; for (let i = 0; i <= 8; i++) col.push(-62 + i * 15.5, i % 2 ? 128 : 118); col.push(62, 100);
  paper(col, WHITE, SX * 0.6, SY * 0.6);
}
function drawArms() {
  const gl = girl, h = gl.hands;
  const arm = (sx, sy, hx, hy, right) => {
    const dx = hx - sx, dy = hy - sy, l = Math.hypot(dx, dy) || 1, nx = -dy / l * 9, ny = dx / l * 9;
    if (hy < 200) paper([sx + nx, sy + ny, hx + nx * 0.8, hy + ny * 0.8, hx - nx * 0.8, hy - ny * 0.8, sx - nx, sy - ny], WHITE, SX, SY);
    paper(ngon(hx, hy, 15, 15, 10, 0.2, 0.08, right ? 5 : 6), WHITE, SX, SY);
    if (gl.pose === 'peace' && right) {
      paper([hx - 9, hy - 6, hx - 3, hy - 6, hx - 6, hy - 34, hx - 14, hy - 32], WHITE, SX, SY);
      paper([hx + 2, hy - 7, hx + 8, hy - 5, hx + 12, hy - 33, hx + 4, hy - 34], WHITE, SX, SY);
    }
  };
  if (gl.pose === 'idle') { // hands resting on the cape
    paper(ngon(-58, 236, 14, 12, 10, 0.2, 0.08, 5), WHITE, SX, SY);
    paper(ngon(58, 236, 14, 12, 10, 0.2, 0.08, 6), WHITE, SX, SY);
    return;
  }
  arm(-50, 120, h.lx, h.ly, false);
  arm(50, 120, h.rx, h.ry, true);
}
function drawHead(reflect) {
  const gl = girl;
  // back hair (her own navy hair)
  paper(ngon(0, -10, 118, 116, 22, 0.05, 0.04, 1), NAVY, SX, SY);
  paper([-116, -12, -118, 70, -98, 96, -76, 64], NAVY, SX, SY);
  paper([116, -12, 118, 70, 98, 96, 76, 64], NAVY, SX, SY);
  // pigtails (ふたつ結び) pop out when discovered
  if (gl.pig > 0.02) {
    const s = Math.max(0, gl.pig);
    for (const side of [-1, 1]) {
      g.save(); g.translate(side * 108, -30); g.rotate(-side * (0.45 + Math.sin(T * 3) * 0.06)); g.scale(s, s);
      paper([0, -14, side * 18, -8, side * 40, 40, side * 30, 84, side * 10, 96, side * 2, 60, -side * 4, 10], gl.cols[1], SX, SY);
      paper([-12, -18, 0, -6, -12, 6], gl.cols[0], 2, 2); paper([12, -18, 0, -6, 12, 6], gl.cols[0], 2, 2);
      paper(ngon(0, -6, 6, 6, 6, 0), WHITE, 1, 1);
      g.restore();
    }
  }
  // face
  paper(ngon(0, 2, 90, 100, 20, 0.08, 0.03, 2), WHITE, SX, SY);
  // cheeks
  g.globalAlpha = clamp(0.25 + gl.blush * 0.75, 0, 1);
  fillP(ngon(-58, 34, 12, 10, 9, 0.2), PINK); fillP(ngon(58, 34, 12, 10, 9, 0.5), PINK);
  g.globalAlpha = 1;
  drawEyes(reflect);
  drawMouth();
  // bangs: back-most layer first so front layers sit on top
  for (let k = 2; k >= 0; k--) {
    for (const i of DRAW_ORDER) { const s = gl.strands[i]; if (s.layers[k].visible) drawLayer(s, k); }
  }
  // paper crown (front long layer's root)
  const cap = [-100, -30, -90, -44, -74, -50, -56, -62, -38, -66, -19, -72, 0, -73, 19, -72, 38, -66, 56, -62, 74, -50, 90, -44, 100, -30,
    98, -60, 85, -88, 60, -108, 30, -118, 0, -121, -30, -118, -60, -108, -85, -88, -98, -60];
  paper(cap, gl.cols[0], SX * 0.6, SY * 0.6);
  // edge sparkle after stripe/tri discoveries
  const se = T - gl.sparkleEdgeT;
  if (se < 1.2) {
    for (const s of gl.strands) {
      const prog = se / 1.2; const ox = (s.i / 4);
      if (Math.abs(prog - ox) < 0.25) { const y = s.layers[0].db; fillP(star(cAt(s, y), y, 9), WHITE); if (s.layers[1].visible) { const y1 = s.layers[1].db; fillP(star(cAt(s, y1) + 8, y1, 7), WHITE); } }
    }
  }
  // lure sparkle on the strand to cut next
  if (!reflect && lure && lure.type === 'strand') {
    const s = gl.strands[lure.i]; const y = strandLowest(s);
    if (Math.sin(T * 5) > 0.2) fillP(star(cAt(s, y) + s.w * 0.45, y - 4, 8), WHITE);
  }
}
function drawLayer(s, k) {
  const l = s.layers[k];
  let sy = 1 - 0.07 * s.press + s.spring * 0.06;
  let hop = 0;
  if (lure && lure.type === 'strand' && lure.i === s.i && phase === 'play') hop = Math.abs(Math.sin(T * 5)) * 0.035;
  sy -= hop;
  const px = s.cx, py = s.top - 12;
  g.save(); g.translate(px, py); g.rotate(s.swing); g.transform(1, 0, s.pull, sy, 0, 0); g.translate(-px, -py);
  const pts = layerPts(s, k, l.db, l.tip, l.jag);
  const shm = 1 - 0.6 * s.press;
  if (k === 2 && l.pop > 0) { const ps = 1 + l.pop * 0.25; g.translate(cAt(s, l.db), l.db); g.scale(ps, ps); g.translate(-cAt(s, l.db), -l.db); }
  paper(pts, l.col, SX * shm, SY * shm);
  if (l.tip === 'curl') {
    const r = curlR(s), hw = layerHW(s, k), m = cAt(s, l.db);
    for (const off of [-0.5, 0.5]) {
      const cx = m + off * hw, cy = l.db - r;
      paper(ngon(cx, cy, r, r, 10, 0.1), l.col, SX * shm * 0.6, SY * shm * 0.6);
      // rolled-paper spiral: the white core of the curled strip
      const sp = [], sp2 = [], turns = 1.5, n = 14, bw = Math.max(0.9, r * 0.16);
      for (let j = 0; j <= n; j++) {
        const th = j / n * turns * TAU + off * 2, rr = r * (0.18 + 0.62 * j / n);
        sp.push(cx + Math.cos(th) * rr, cy + Math.sin(th) * rr);
        sp2.unshift(cx + Math.cos(th) * (rr + bw), cy + Math.sin(th) * (rr + bw));
      }
      fillP(sp.concat(sp2), WHITE);
    }
  } else if (l.tip === 'twin') {
    const hw = layerHW(s, k), m = cAt(s, l.db);
    for (const off of [-0.45, 0.45]) fillP([m + off * hw - 5, l.db - 13, m + off * hw + 5, l.db - 13, m + off * hw + 4, l.db - 7, m + off * hw - 4, l.db - 7], girl.cols[0]);
  } else if (l.tip === 'patsun') {
    const hw = layerHW(s, k), m = cAt(s, l.db);
    fillP([m - hw, l.db - 2.5, m + hw, l.db - 2.5, m + hw, l.db, m - hw, l.db], WHITE);
  }
  if (l.cut && l.tip === 'flat') { // white cut edge
    const hw = layerHW(s, k), m = cAt(s, l.db);
    fillP([m - hw + 0.5, l.db - 2.6, m + hw - 0.5, l.db - 2.6, m + hw * 0.25, l.db - l.jag, m - hw * 0.35, l.db + l.jag * 1.3, m - hw + 0.5, l.db], WHITE);

}
function drawEyes(reflect) {
  const gl = girl;
  const closed = gl.blinkT > 0;
  const lx = clamp(gl.lookX, -1, 1) * 3.5, ly = clamp(gl.lookY, -1, 1) * 3;
  for (const side of [-1, 1]) {
    const ex = side * EYE_X, ey = EYE_Y;
    const winkThis = gl.wink === side;
    // brows
    const by = BROW_Y - gl.browUp * 6;
    fillP([ex - 11, by + 2 + side * 0, ex + 11, by - 1, ex + 11, by + 3, ex - 11, by + 6], NAVY);
    if (closed || winkThis || gl.mood === 'happy') {
      // closed / happy arc (a curved paper band)
      const p = []; const up = gl.mood === 'happy' && !closed && !winkThis ? -1 : 1;
      for (let j = 0; j <= 6; j++) { const a = Math.PI * j / 6; p.push(ex - Math.cos(a) * 12, ey + 2 - up * Math.sin(a) * 7); }
      for (let j = 6; j >= 0; j--) { const a = Math.PI * j / 6; p.push(ex - Math.cos(a) * 12, ey + 2 - up * Math.sin(a) * 7 + 4.5); }
      fillP(p, NAVY);
    } else {
      fillP(ngon(ex + lx * 0.4, ey + ly * 0.4, 11, 14, 14, 0), NAVY);
      fillP(ngon(ex + lx + 3, ey + ly - 4, 4, 4, 7, 0.2), WHITE);
      fillP(ngon(ex + lx - 3, ey + ly + 5, 2, 2, 6, 0.4), WHITE);
    }

}
function drawMouth() {
  const m = girl.mood;
  if (m === 'happy') {
    const p = [-15, 46]; for (let j = 1; j < 8; j++) { const a = Math.PI * j / 8; p.push(-Math.cos(a) * 15, 46 + Math.sin(a) * 13); } p.push(15, 46);
    fillP(p, NAVY);
    fillP(ngon(0, 54, 7, 4, 8, 0), PINK);
  } else if (m === 'smile') {
    const p = []; for (let j = 0; j <= 6; j++) { const a = Math.PI * j / 6; p.push(-Math.cos(a) * 12, 46 + Math.sin(a) * 7); }
    for (let j = 6; j >= 0; j--) { const a = Math.PI * j / 6; p.push(-Math.cos(a) * 12, 46 + Math.sin(a) * 7 + 4); }
    fillP(p, NAVY);
  } else if (m === 'o') {
    fillP(ngon(0, 50, 6, 7, 9, 0), NAVY);
  } else {
    fillP([-8, 48, 8, 48, 7, 52, -7, 52], NAVY);
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    if (p.kind === 'crumb') {
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.globalAlpha = Math.min(1, a * 2);
      fillP([-p.r, -p.r * 0.5, p.r, -p.r * 0.8, p.r * 0.6, p.r * 0.7], p.col); g.restore();
    } else if (p.kind === 'star') {
      g.globalAlpha = Math.min(1, a * 1.5); fillP(star(p.x, p.y, p.r * (0.6 + 0.4 * Math.sin(p.t * 20))), WHITE); g.globalAlpha = 1;
    } else if (p.kind === 'snip') {
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.globalAlpha = a;
      const r = p.r * (0.6 + p.t / p.life * 0.6);
      fillP([-r, -1.5, -r * 0.2, -4, r, -1, r * 0.2, 3], WHITE); g.restore();
    }
  }
  g.globalAlpha = 1;
}
function drawHand(x, y, press) { // paper hand for the wordless demo
  const U = LY.U * 1.1;
  g.save(); g.translate(x, y); g.scale(U, U);
  const s = 1 - press * 0.1; g.scale(s, s);
  const sh = 6 - press * 3;
  paper([-5, 0, 5, 0, 8, 34, -6, 36], WHITE, sh, sh);
  paper(ngon(8, 50, 22, 20, 11, 0.3, 0.06, 9), WHITE, sh, sh);
  paper([14, 30, 22, 26, 34, 36, 24, 42], WHITE, sh * 0.6, sh * 0.6);
  g.restore();
}
function drawHint() {
  if (!hint) return;
  const t = hint.t, L = hint.lure;
  const fade = Math.min(1, t * 4, (hint.dur - t) * 4);
  g.globalAlpha = clamp(fade, 0, 1);
  if (L.type === 'strand') {
    const s = girl.strands[L.i];
    const y = (s.layers[0].cut ? Math.min(snapHeight(s.layers[0].b - 2), s.layers[0].b) : EYE_SNAP + 4);
    const p = clamp((t - 0.35) / 1.1, 0, 1);
    const a = headToWorld(cAt(s, y) - 50, y), b = headToWorld(cAt(s, y) + 50, y);
    const e = ease(p);
    drawHand(lerp(a.x, b.x, e), lerp(a.y, b.y, e), p > 0 && p < 1 ? 1 : 0);
  } else if (L.type === 'piece') {
    const sp = slotPos(frameRect(), firstFreeSlot());
    const p = ease(clamp((t - 0.35) / 1.2, 0, 1));
    drawHand(lerp(L.p.x, sp.x, p), lerp(L.p.y, sp.y, p), p > 0 && p < 1 ? 1 : 0);
  } else if (L.type === 'girl') {
    const w = headToWorld(10, 60);
    const press = (t % 0.8) < 0.25 ? 1 : 0;
    drawHand(w.x, w.y + (press ? 0 : -8), press);
  }

}
function firstFreeSlot() { for (let i = 0; i < NSLOT; i++) if (!slots[i]) return i; return 0; }
function drawLureMirror() {
  if (!lure || lure.type !== 'mirror') return;
  const r = frameRect(); const i = firstFreeSlot(); const sp = slotPos(r, i);
  if (Math.sin(T * 6) > -0.2) fillP(star(sp.x, sp.y, 10 * LY.U), WHITE);
}
function drawLureGirl() {
  if (!lure || lure.type !== 'girl') return;
  const w = headToWorld(0, -140);
  const s = 9 + Math.abs(Math.sin(T * 5)) * 6;
  fillP(star(w.x - 40 * LY.U, w.y, s * LY.U), WHITE);
  fillP(star(w.x + 46 * LY.U, w.y + 20 * LY.U, s * 0.7 * LY.U), WHITE);
}

function render() {
  g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();
  drawWall();
  drawFloor();
  const st = ease(stageT);
  if (st > 0.02) drawStageBackdrop(frameRect(), st);
  if (!LY.portrait && st < 0.5) drawMirror();
  drawGirl(true);
  if (LY.portrait || st >= 0.5) drawMirror();
  drawLureGirl();
  drawPieces(['rest']);
  drawPieces(['fall', 'fly']);
  drawLureMirror();
  drawParticles();
  drawPieces(['drag']);
  drawHint();
  const ft = T - flashT;
  if (ft < 0.35) { g.globalAlpha = (1 - ft / 0.35) * 0.85; g.fillStyle = WHITE; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
}

/* ===== loop ===== */
let rafId = 0, lastT = 0, running = false, frames = 0;
function frame(now) {
  rafId = 0;
  if (!running) return;
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0.016;
  if (dt > 0.05) dt = 0.05;     // tab-return / hitch: clamp time jump
  T += dt; frames++;
  lure = computeLure();
  updateGirl(dt);
  updatePieces(dt);
  updateParticles(dt);
  updatePhase(dt);
  updateHint(dt);
  render();
  rafId = requestAnimationFrame(frame);
}
function start() { if (running) return; running = true; lastT = performance.now(); rafId = requestAnimationFrame(frame); }
function stopLoop() { running = false; if (rafId) cancelAnimationFrame(rafId); rafId = 0; }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopLoop(); endGesture(true); try { if (AC && AC.state === 'running') AC.suspend(); } catch (e) {} }
  else { try { if (AC && AC.state === 'suspended') AC.resume().catch(() => {}); } catch (e) {} start(); }
});
window.addEventListener('pagehide', () => stopLoop());
window.addEventListener('pageshow', () => { if (!document.hidden) start(); });
let resizeTimer = 0;
const onResize = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { layout(); if (!running && !document.hidden) start(); else render(); }, 60); };
window.addEventListener('resize', onResize);

/* test hook (no UI): lets automated checks read state and map coordinates */
window.__salon = {

      eyes: [eyeVisible(gl, -1), eyeVisible(gl, 1)], brows: [browVisible(gl, -1), browVisible(gl, 1)],

      strands: gl.strands.map(s => ({ style: s.style, b: s.layers.map(l => Math.round(l.b)), cut: s.layers.map(l => l.cut), vis: s.layers.map(l => l.visible), done: strandDone(s), press: +s.press.toFixed(2) })),
      lure: lure ? lure.type + (lure.i !== undefined ? ':' + lure.i : '') : null, hint: !!hint, stageT, audio: AC ? AC.state : 'none', U: LY.U

  },
  toWorld(x, y) { return headToWorld(x, y); },
  strand(i) { const s = girl.strands[i]; return { cx: s.cx, top: s.top, lean: s.lean, w: s.w }; },
  floorPieces() { return pieces.filter(p => p.state === 'rest').map(p => ({ x: p.x, y: p.y, kind: p.kind })); },
  slotXY(i) { return slotPos(frameRect(), i); },
  frame() { return frameRect(); },
  girlXY() { return headToWorld(0, 40); },
