const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};

const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const mixw=(a,wa,b,wb)=>{const s=wa+wb;if(s<=0)return b.slice();return[(a[0]*wa+b[0]*wb)/s,(a[1]*wa+b[1]*wb)/s,(a[2]*wa+b[2]*wb)/s];};
const cs=(c,a)=>a===undefined?'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')':'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(+a).toFixed(3)+')';

let W=0,H=0,DPR=1,L=null,FIT=1,OX=0,OY=0;

function getSafe(){

function camT(z){const fx=L.focus[0],fy=L.focus[1];const s=FIT*z;return{s,tx:OX+FIT*fx-s*fx,ty:OY+FIT*fy-s*fy};}
function toWorld(cx,cy){const c=camT(cam.z);return{x:(cx-c.tx)/c.s,y:(cy-c.ty)/c.s};}

/* ---------------- sprites ---------------- */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c;}
const shadowSpr=(()=>{const c=mkCanvas(64,64),g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(0,0,0,0.75)');gr.addColorStop(.55,'rgba(0,0,0,0.35)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return c;})();
const glowCache=new Map();
function glowSpr(c){
  const k=((c[0]>>3)<<10)|((c[1]>>3)<<5)|(c[2]>>3);
  let s=glowCache.get(k);
  if(!s){if(glowCache.size>160)glowCache.clear();s=mkCanvas(64,64);const g=s.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,cs(c,1));gr.addColorStop(.25,cs(c,.55));gr.addColorStop(.6,cs(c,.16));gr.addColorStop(1,cs(c,0));g.fillStyle=gr;g.fillRect(0,0,64,64);glowCache.set(k,s);}
  return s;
}
function shadow(g,x,y,rx,ry,a){g.globalAlpha=a;g.drawImage(shadowSpr,x-rx,y-ry,rx*2,ry*2);g.globalAlpha=1;}
function glow(g,x,y,r,c,a){const o=g.globalCompositeOperation;g.globalCompositeOperation='lighter';g.globalAlpha=a;g.drawImage(glowSpr(c),x-r,y-r,r*2,r*2);g.globalAlpha=1;g.globalCompositeOperation=o;}
function rrect(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}

/* ---------------- static drawing helpers ---------------- */
function wood(g,x,y,w,h,base,seed,vertical,light){
  const rnd=srand(seed);light=light==null?1:light;
  const gr=vertical?g.createLinearGradient(x,y,x+w,y):g.createLinearGradient(x,y,x,y+h);
  gr.addColorStop(0,cs(lighten(base,.12*light)));gr.addColorStop(.5,cs(base));gr.addColorStop(1,cs(darken(base,.28)));
  g.fillStyle=gr;g.fillRect(x,y,w,h);
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  const n=Math.max(3,((vertical?w:h)/3.2)|0);
  g.lineWidth=.8;
  for(let i=0;i<n;i++){
    const t=rnd();g.strokeStyle=cs(darken(base,.25+rnd()*.25),.35+rnd()*.3);g.beginPath();
    if(vertical){const xx=x+t*w;g.moveTo(xx,y);for(let k=1;k<=6;k++){g.lineTo(xx+Math.sin(k*1.3+t*9)*1.4,y+h*k/6);}}
    else{const yy=y+t*h;g.moveTo(x,yy);for(let k=1;k<=8;k++){g.lineTo(x+w*k/8,yy+Math.sin(k*1.1+t*7)*1.2);}}
    g.stroke();
  }
  // scratches & dents
  const sc=Math.max(2,(w*h/900)|0);
  for(let i=0;i<sc;i++){const sx=x+rnd()*w,sy=y+rnd()*h,l=3+rnd()*12,a=rnd()*TAU;
    g.strokeStyle=cs(lighten(base,.35),.25+rnd()*.25);g.lineWidth=.6;g.beginPath();g.moveTo(sx,sy);g.lineTo(sx+Math.cos(a)*l,sy+Math.sin(a)*l*.5);g.stroke();}
  for(let i=0;i<sc/3;i++){g.fillStyle=cs(darken(base,.45),.35);g.beginPath();g.ellipse(x+rnd()*w,y+rnd()*h,1+rnd()*2.5,.8+rnd()*1.5,0,0,TAU);g.fill();}
  g.restore();
}
function plankEdge(g,x,y,w,h,base){g.fillStyle=cs(lighten(base,.3),.5);g.fillRect(x,y,w,1.5);g.fillStyle=cs(darken(base,.55),.6);g.fillRect(x,y+h-1.5,w,1.5);}
function awning(g,x0,x1,y,h,c1,c2,stripe){
  const n=Math.max(2,Math.round((x1-x0)/stripe));const sw=(x1-x0)/n;
  for(let i=0;i<n;i++){
    const c=i%2?c2:c1;const xx=x0+i*sw;
    const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,cs(lighten(c,.15)));gr.addColorStop(1,cs(darken(c,.25)));
    g.fillStyle=gr;g.beginPath();g.moveTo(xx,y);g.lineTo(xx+sw,y);g.lineTo(xx+sw,y+h);g.quadraticCurveTo(xx+sw/2,y+h+sw*.45,xx,y+h);g.closePath();g.fill();
  }
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x0,y,x1-x0,3);
  g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=1;g.beginPath();g.moveTo(x0,y+4);g.lineTo(x1,y+4);g.stroke();
}
function post(g,x,y0,y1,w,base,seed){wood(g,x-w/2,y0,w,y1-y0,base,seed,true);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x+w/2-2,y0,2,y1-y0);}

/* ---------------- far stalls ---------------- */
const FARDEF={
  wata:{a:[236,120,170],b:[250,238,240]},
  yoyo:{a:[60,120,210],b:[240,240,240]},
  ringo:{a:[210,40,40],b:[250,230,200]},

function drawFarStallStatic(g,st,seed){
  const d=FARDEF[st.k];const rnd=srand(seed);
  g.save();g.translate(st.x,st.y);g.scale(st.s,st.s);

  // roof board

  awning(g,-124,124,-214,40,d.a,d.b,22);
  // counter
  wood(g,-118,-62,236,62,darken(d.a,.35),seed+5,true,.7);
  wood(g,-124,-70,248,10,[120,84,54],seed+6,false);plankEdge(g,-124,-70,248,10,[120,84,54]);
  // picture sign (no letters)
  rrect(g,-46,-266,92,32,6);g.fillStyle=cs(lighten(d.b,.0));g.fill();g.strokeStyle=cs(darken(d.a,.2));g.lineWidth=3;g.stroke();
  g.save();g.translate(0,-250);
  if(st.k==='wata'){g.fillStyle=cs([250,170,200]);for(let i=0;i<5;i++){g.beginPath();g.arc(-14+i*7,-2+Math.sin(i)*3,8,0,TAU);g.fill();}g.fillStyle='#8a6a4a';g.fillRect(-1,4,2,10);}
  else if(st.k==='yoyo'){const cc=[[230,70,90],[70,150,230],[250,200,60]];for(let i=0;i<3;i++){g.fillStyle=cs(cc[i]);g.beginPath();g.arc(-20+i*20,0,9,0,TAU);g.fill();g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.moveTo(-28+i*20,0);g.lineTo(-12+i*20,0);g.stroke();}}
  else if(st.k==='ringo'){g.fillStyle='#c81e28';g.beginPath();g.arc(-6,2,10,0,TAU);g.arc(14,2,10,0,TAU);g.fill();g.fillStyle='#d9b07a';g.fillRect(-7,-14,2,8);g.fillRect(13,-14,2,8);}
  else if(st.k==='wanage'){g.strokeStyle='#e24';g.lineWidth=4;g.beginPath();g.ellipse(-12,0,12,6,0,0,TAU);g.stroke();g.strokeStyle='#28c';g.beginPath();g.ellipse(14,0,12,6,0,0,TAU);g.stroke();}
  else if(st.k==='shateki'){g.fillStyle='#e24';for(let i=0;i<3;i++){g.beginPath();g.arc(-20+i*20,0,8,0,TAU);g.fill();g.fillStyle=i%2?'#e24':'#fff';g.beginPath();g.arc(-20+i*20,0,4,0,TAU);g.fill();g.fillStyle='#e24';}}
  else {g.fillStyle='#f2c230';g.beginPath();g.ellipse(0,0,24,8,0,0,TAU);g.fill();g.fillStyle='#4a8a3a';g.beginPath();g.moveTo(-26,0);g.lineTo(-12,-6);g.lineTo(-12,6);g.fill();}
  g.restore();
  // props on counter
  if(st.k==='wata'){
    rrect(g,-40,-110,80,44,10);g.fillStyle='#c9c9cf';g.fill();g.fillStyle='#8a8a92';g.fillRect(-36,-74,72,6);
    for(let i=0;i<6;i++){const bx=-96+i*36+(i>2?24:0);if(Math.abs(bx)<50)continue;rrect(g,bx-12,-190+rnd()*10,24,36,8);g.fillStyle=cs(pick([[255,190,215],[190,220,255],[255,240,190]]));g.fill();g.strokeStyle='rgba(0,0,0,.2)';g.stroke();}
  }else if(st.k==='yoyo'){
    rrect(g,-96,-92,192,30,8);g.fillStyle='#3d78b8';g.fill();g.fillStyle='rgba(255,255,255,.25)';g.fillRect(-90,-90,180,4);
  }else if(st.k==='ringo'){
    for(let i=0;i<7;i++){const bx=-84+i*28;g.fillStyle='#d9b07a';g.fillRect(bx-1,-96,2,26);g.fillStyle='#c8102e';g.beginPath();g.arc(bx,-100,11,0,TAU);g.fill();g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.arc(bx-4,-104,3,0,TAU);g.fill();}
  }else if(st.k==='wanage'){
    for(let i=0;i<5;i++){const bx=-80+i*40;g.fillStyle=cs(pick([[230,80,80],[80,150,230],[240,200,60],[120,200,120]]));g.fillRect(bx-12,-150+rnd()*30,24,24);}
  }else if(st.k==='shateki'){
    for(let r=0;r<2;r++)for(let i=0;i<6;i++){const bx=-85+i*34;g.fillStyle=cs(pick([[230,90,90],[90,150,230],[240,210,80],[150,220,150],[220,150,230]]));g.fillRect(bx-10,-170+r*44,20,26);}
    g.fillStyle='#6a4a30';g.fillRect(-100,-144,200,4);g.fillRect(-100,-100,200,4);
  }else{
    g.fillStyle='#333';g.fillRect(-90,-84,180,14);for(let i=0;i<6;i++){g.fillStyle='#e9b52a';g.beginPath();g.ellipse(-70+i*28,-88,12,5,0,0,TAU);g.fill();}
  }
  g.restore();
}

/* ---------------- lanterns ---------------- */
let LANS=[];
function buildLanterns(){
  const prev=LANS;LANS=[];
  for(const row of L.rows){
    const spanLen=row.sp*row.span;
    for(let x=row.x0;x<=row.x1;x+=row.sp){
      const u=((x-row.x0)%spanLen)/spanLen;
      const y=row.y+row.sag*Math.sin(Math.PI*u);
      LANS.push({x,y,r:row.r,far:!!row.far,sw:R()*TAU,swv:0,c:PAPER.slice(),from:PAPER.slice(),to:null,at:0,flash:0,seed:(x*7+row.y)|0});
    }
  }
  if(S&&S.dyeColor){for(const l of LANS){l.c=S.dyeColor.slice();}}
}
function lanternRopeY(row,x){const spanLen=row.sp*row.span;const u=(((x-row.x0)%spanLen)+spanLen)%spanLen/spanLen;return row.y+row.sag*Math.sin(Math.PI*u)-row.r*1.15;}
function drawLanternRows(g,vr){
  // ropes
  for(const row of L.rows){
    g.strokeStyle=row.far?'rgba(30,24,20,.7)':'rgba(40,30,24,.9)';g.lineWidth=row.far?1:1.6;g.beginPath();
    const x0=Math.max(row.x0,vr.x0-50),x1=Math.min(row.x1,vr.x1+50);
    for(let x=x0;x<=x1;x+=8){const y=lanternRopeY(row,x);if(x===x0)g.moveTo(x,y);else g.lineTo(x,y);}g.stroke();
  }
  for(const l of LANS){
    if(l.x<vr.x0-40||l.x>vr.x1+40)continue;
    drawLantern(g,l);
  }
}
function drawLantern(g,l){
  const sw=Math.sin(l.sw)*.12;
  const r=l.r;const c=l.c;
  const lum=1+l.flash*.6;
  glow(g,l.x,l.y+r*.2,r*(l.far?2.4:3)*(1+l.flash*.4),lighten(c,.15),(l.far?.4:.5)*lum);
  g.save();g.translate(l.x,l.y-r*1.1);g.rotate(sw);g.translate(0,r*1.1);
  const rx=r*.82,ry=r;
  // body
  g.fillStyle=cs(darken(c,.12));g.beginPath();g.ellipse(0,0,rx,ry,0,0,TAU);g.fill();
  g.fillStyle=cs(lighten(c,.35+l.flash*.3),.85);g.beginPath();g.ellipse(-rx*.12,-ry*.08,rx*.62,ry*.72,0,0,TAU);g.fill();
  g.fillStyle=cs([255,255,235],.35+l.flash*.4);g.beginPath();g.ellipse(-rx*.18,-ry*.15,rx*.28,ry*.4,0,0,TAU);g.fill();
  // ribs & fiber

/* ---------------- glass logic ---------------- */
function colorGroups(gs){
  // merge consecutive layers of (almost) the same color; boundary blur = blur at the start of each group
  const out=[];
  for(const l of gs.layers){const g=out[out.length-1];
    if(g&&cdist(g.c,l.c)<26){g.c=mixw(g.c,g.a,l.c,l.a);g.a+=l.a;}
    else out.push({c:l.c.slice(),a:l.a,blur:l.blur||0});}
  return out;
}
function glassSharp(gs){const g=colorGroups(gs);let sharp=0;for(let i=1;i<g.length;i++){if(g[i].blur<.05&&cdist(g[i].c,g[i-1].c)>40&&g[i].a>.04&&g[i-1].a>.04)sharp++;}return sharp;}
function glassType(gs){
  const sharp=glassSharp(gs);
  if(sharp>=2)return'shima';
  if(gs.foam>.09)return'awa';
  if(sharp===1)return'shima';
  return'mazari';
}
function pourInto(amount,c,pulp,foam,spin){
  const gs=S.gl;
  if(!gs.present||S.hand){addOverflow(amount,c);return;}
  const room=Math.max(0,1-gs.vol);const a=Math.min(room,amount);
  if(a>0){
    const top=gs.layers[gs.layers.length-1];
    if(top&&cdist(top.c,c)<26&&Math.abs(top.pulp-pulp)<.4){top.c=mixw(top.c,top.a,c,a);top.pulp=(top.pulp*top.a+pulp*a)/(top.a+a);top.a+=a;}
    else{
      const iced=gs.ices.length>0;
      gs.layers.push({c:c.slice(),a,pulp,iced,blur:iced?.006:(.03+spin*.05),seed:(R()*1e6)|0});
      if(gs.layers.length>=2){const lo=gs.layers[gs.layers.length-2];if(cdist(lo.c,c)>40)logDisc('layer',{n:gs.layers.length});}
      if(gs.layers.length>12){const l0=gs.layers.shift(),l1=gs.layers[0];l1.c=mixw(l0.c,l0.a,l1.c,l1.a);l1.a+=l0.a;}
    }
    gs.vol+=a;gs.foam=Math.min(.3,gs.foam+foam*a*1.5);
  }
  if(amount>a)addOverflow(amount-a,c);
}
function addOverflow(a,c){S.G+=a;S.ovC=c?c.slice():S.bl.c.slice();S.ovT=S.t;}

function pulpOf(B){if(B.amt<.01)return 0;let s=0;for(const ch of B.chunks)s+=ch.size;return clamp(s/(B.amt*12),0,1);}

function scaleChunks(B,a){const before=B.amt+a;if(before<=0)return;const k=1-a/before;for(const ch of B.chunks)ch.size*=k;B.chunks=B.chunks.filter(c=>c.size>.06);}
function updateBlender(dt){

    if(B.spin>.6&&R()<dt*20)addPart('foam',L.bl.cx+rr(-30,30),blenderSurfaceY()-4,rr(-20,20),rr(-40,-10),.6,2+R()*3,lighten(B.c,.7));

function blenderSurfaceY(){const b=L.bl;const ih=b.bot-b.top-14;return b.bot-6-Math.min(1,S.bl.amt/2.0)*ih;}
function glassSurfaceY(){const g=L.gl;if(!S.gl.present||S.hand)return L.step.y-4;const ih=g.h-11;return g.bot-7-Math.min(1,S.gl.vol)*ih;}

/* ---------------- gutter / wheel / lottery ---------------- */
function updateFlow(dt){
  const out=Math.min(S.G,S.G*2.2*dt+.02*dt);S.G-=out;
  const rate=out/Math.max(dt,1e-4);S.ovRate=lerp(S.ovRate,rate,clamp(dt*8,0,1));
  S.sauc=lerp(S.sauc,clamp(S.G*6,0,1),clamp(dt*6,0,1));
  const w=S.wheel;
  const tq=rate*(TAU/.4);
  w.vel=lerp(w.vel,tq,clamp(dt*3,0,1));
  if(tq<w.vel)w.vel=Math.max(tq,w.vel-dt*2.2);
  const da=w.vel*dt;w.ang+=da;w.acc+=da;
  if(da>0.0005&&!S.disc.wheel&&w.acc>.4)logDisc('wheel',{vel:+w.vel.toFixed(2)});
  S.gar.ang+=da*.35;S.gar.jolt=Math.max(0,S.gar.jolt-dt*3);
  if(w.vel>.3){S._clk=(S._clk||0)+da;if(S._clk>TAU/8){S._clk=0;sfxTick(500+w.vel*60);}}
  if(w.acc>=TAU){w.acc-=TAU;releasePrize();}
  // gutter drops onto wheel
  if(out>0&&R()<dt*60*clamp(rate*3,0,1)){const gu=L.gutter[1];addPart('drop',gu[0]+rr(-2,2),gu[1]+2,rr(20,60),rr(10,60),.5,rr(1.5,3),S.ovC||S.bl.c);}
  // balls
  for(const b of S.balls){b.t+=dt;b.vy+=900*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;const ty=L.lot.gy+L.lot.gr*1.25;if(b.y>ty&&b.vy>0){b.y=ty;b.vy*=-.35;b.vx*=.6;}
    if(b.t>.9&&!b.done){b.done=true;S.prizes.push(newPrize(b.c,b.c2,b.pat,false,b.x,b.y));if(S.prizes.length>10){S.prizes[0].leave=true;}sfxPrize();S.dirty=true;logDisc('prize',{n:S.prizes.length});}}
  S.balls=S.balls.filter(b=>!b.done);
  const lo=L.lot.line;const live=S.prizes.filter(p=>!p.leave);const n=Math.max(live.length,1);
  live.forEach((p,i)=>{p.tx=lo.x0+(lo.x1-lo.x0)*(n===1?.5:i/(n-1));p.ty=lo.y+8+Math.sin(Math.PI*(n===1?.5:i/(n-1)))*8+22;});
  for(const p of S.prizes){
    p.t+=dt;
    if(p.leave){p.y-=dt*60;p.x+=Math.sin(p.t)*dt*20;continue;}
    p.inf=Math.min(1,p.inf+dt*1.6);
    const k=clamp(dt*3,0,1);p.x=lerp(p.x,p.tx,k);p.y=lerp(p.y,p.ty,k);
    p.sw+=dt*(1.6+p.inf);
  }
  S.prizes=S.prizes.filter(p=>p.y>-400);
}

function updateCustomers(dt){

      const k=((c.t*2.2)|0)%L.shelf.n;c.gx=clamp((shelfSlotX(k)-c.x)/40,-2.5,2.5);c.gy=-2;
      if(c.t>1.5){
        let best=-1,bs=-1;S.shelf.forEach((gs,i)=>{if(!gs)return;const sc=prefScore(gs,c.pref);if(sc>bs){bs=sc;best=i;}});
        if(best<0){c.state='stroll';c.path=[{x:(c.face>0||!L.portrait)?L.spawnR:L.spawnL,y:L.street}];continue;}
        c.pickI=best;c.state='pick';c.t=0;c.hv=260;c.path=[{x:shelfSlotX(best),y:L.street}];

        const gs=S.shelf[c.pickI];if(!gs){c.state='look';c.t=0;continue;}

    }
    if(c.state==='swapwait'){c.gx=c.face*2;if(c.partner&&(c.partner.state==='swapmeet'||c.partner.state==='swapmeetw')&&Math.abs(c.partner.x-c.x)<70){doSwap(c,c.partner);}else if(!c.partner||c.partner.dead){c.state='go';const qp=queuePos(c.dest,S.queues[c.dest].length);routeTo(c,qp.x,qp.y);}continue;}

      if(q.length>L.q[c.dest].n+3){const old=q.shift();old.state='leave';old.path=[{x:L.q[c.dest].x+(L.q[c.dest].dx>0?-1:1)*30,y:L.paradeY},{x:L.q[c.dest].dx>0?L.spawnL-200:L.spawnR+200,y:L.paradeY}];}}

}
function walkStep(c,dt){

  const mx=clamp(c.x+(fromL?-60:60),L.portrait?40:L.shelf.x0,L.DW-40);p.path=[{x:mx,y:L.street}];p.partner=c;

function fakeGlass(t,col){

/* ---------------- handing glass to ojisan ---------------- */

/* ---------------- flyers (fruit, ice) ---------------- */

  S.flyers.push({k:'fruit',type:cr.type,x0:p.x,y0:p.y,x1:L.bl.cx+rr(-10,10),y1:L.bl.top-10,t:0,dur:.5,x:p.x,y:p.y,rot:0});

function launchIce(fromX,fromY){
  const k=L.kaki;const p=fromX==null?{x:k.mx+30,y:k.my-40}:{x:fromX,y:fromY};
  const ty=S.gl.present&&!S.hand?glassSurfaceY()-6:L.step.y-10;
  S.flyers.push({k:'ice',x0:p.x,y0:p.y,x1:L.gl.cx,y1:ty,t:0,dur:.6,x:p.x,y:p.y,rot:0});

/* ---------------- particles ---------------- */

/* ---------------- lanterns / stalls update ---------------- */

/* ---------------- ojisan / invite / hints ---------------- */
function invitePos(inv){
  if(!inv)return null;
  if(inv.k==='button')return{x:L.btn.x,y:L.btn.y,r:L.btn.r};
  if(inv.k==='fruit'){const p=crateSlot(inv.i);return{x:p.x,y:p.y,r:34};}
  if(inv.k==='ice')return{x:L.kaki.mx,y:L.kaki.my-70,r:62};
  if(inv.k==='glass')return{x:L.gl.cx,y:L.gl.bot-L.gl.h/2,r:62};
  return null;
}
function chooseInvite(){
  const B=S.bl,gs=S.gl;

  const fruitInv=()=>{
    const top=gs.layers.length?gs.layers[gs.layers.length-1].c:null;let best=-1,bd=-1;
    S.crate.forEach((c,i)=>{if(!c||c.state!=='in')return;const d=top?cdist(FRUITS[c.type].juice,top):100+((i*37+((S.t/6)|0))%5);if(d>bd){bd=d;best=i;}});
    return best>=0?{k:'fruit',i:best}:null;
  };
  if(gs.vol>=.995){
    if(B.amt>.06&&(S.dyeCount===0||!S.disc.wheel))return{k:'button'};
    return{k:'glass'};
  }

  if(gs.vol<.02&&gs.ices.length===0&&S.sold+S.shelf.filter(Boolean).length>=1&&!S.disc.iceFirst)return{k:'ice'};

  if(gs.layers.length>=2&&gs.ices.length===0&&!S.disc.iceMid&&S.disc.iceFirst&&gs.vol<.6)return{k:'ice'};

  else if(S.btn.down){tx=L.bl.cx;ty=L.bl.top+40;}
  else if(ip){tx=ip.x;ty=ip.y;}
  const dx=tx-L.oji.x,dy=ty-L.oji.y;const d=Math.hypot(dx,dy)||1;

  o.sway=o.cheer*Math.sin(S.t*8.5)*.16+Math.sin(S.t*1.3)*.03;

  o.nextBlink-=dt;if(o.nextBlink<=0){o.blink=.14;o.nextBlink=rr(2,5);}o.blink=Math.max(0,o.blink-dt);

/* ---------------- audio ---------------- */
const AU={c:null,master:null,sfx:null,bgm:null,noise:null,motor:null,beat:0,next:0};
function auInit(){
  if(AU.c){if(AU.c.state==='suspended'&&!document.hidden)AU.c.resume().catch(()=>{});return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    const a=new AC();AU.c=a;
    const comp=a.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(a.destination);
    AU.master=a.createGain();AU.master.gain.value=.8;AU.master.connect(comp);

    AU.bgm=a.createGain();AU.bgm.gain.value=.22;AU.bgm.connect(AU.master);
    const nb=a.createBuffer(1,a.sampleRate,a.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=nb;
    // motor

    m.n=a.createBufferSource();m.n.buffer=nb;m.n.loop=true;m.bp=a.createBiquadFilter();m.bp.type='bandpass';m.bp.frequency.value=900;m.bp.Q.value=1.2;
    m.ng=a.createGain();m.ng.gain.value=0;m.n.connect(m.bp);m.bp.connect(m.ng);m.ng.connect(AU.sfx);
    m.p=a.createBufferSource();m.p.buffer=nb;m.p.loop=true;m.pf=a.createBiquadFilter();m.pf.type='bandpass';m.pf.frequency.value=600;m.pf.Q.value=2.5;
    m.pg=a.createGain();m.pg.gain.value=0;m.p.connect(m.pf);m.pf.connect(m.pg);m.pg.connect(AU.sfx);
    m.w=a.createBufferSource();m.w.buffer=nb;m.w.loop=true;m.wf=a.createBiquadFilter();m.wf.type='highpass';m.wf.frequency.value=2500;
    m.wg=a.createGain();m.wg.gain.value=0;m.w.connect(m.wf);m.wf.connect(m.wg);m.wg.connect(AU.sfx);
    m.o1.frequency.value=60;m.o2.frequency.value=60;
    m.o1.start();m.o2.start();m.n.start();m.p.start();m.w.start();AU.motor=m;
    AU.next=a.currentTime+.3;
    const s=a.createBufferSource();s.buffer=a.createBuffer(1,1,22050);s.connect(a.destination);s.start(0);
    if(a.state==='suspended')a.resume().catch(()=>{});
  }catch(e){AU.c=null;}
}
const auOK=()=>AU.c&&AU.c.state==='running';
function auMotor(on){if(!AU.c||!AU.motor)return;const t=AU.c.currentTime,m=AU.motor;
  if(!on){m.g.gain.cancelScheduledValues(t);m.g.gain.setTargetAtTime(0,t,.025);m.ng.gain.cancelScheduledValues(t);m.ng.gain.setTargetAtTime(0,t,.03);m.pg.gain.setTargetAtTime(0,t,.04);}}
function auUpdate(dt){
  if(!auOK()||!AU.motor)return;const a=AU.c,t=a.currentTime,m=AU.motor,B=S.bl;
  if(S.btn.down){
    const sp=B.spin;m.o1.frequency.setTargetAtTime(55+sp*120+B.pressure*60,t,.05);m.o2.frequency.setTargetAtTime(55+sp*120+B.pressure*60,t,.05);

function wobbleAt(p){
  for(const l of LANS){if(dist(p.x,p.y,l.x,l.y)<l.r*1.5){l.swv=1;l.sw+=.8;l.flash=Math.max(l.flash,.4);sfxWob();return true;}}

  for(const pz of S.prizes){if(dist(p.x,p.y,pz.x,pz.y)<22){pz.sw+=1.5;sfxWob();return true;}}
  for(let i=0;i<S.shelf.length;i++){const gs=S.shelf[i];if(gs&&Math.abs(p.x-shelfSlotX(i))<30&&p.y>L.shelf.y-70&&p.y<L.shelf.y+10){gs.wob=1;sfxWob();return true;}}

function onDown(e){
  e.preventDefault();

  const p=toWorld(e.clientX,e.clientY);
  PTR.set(e.pointerId,{x:p.x,y:p.y});
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  S.idle=0;S.anyInput=true;if(S.hint)S.hint=null;
  if(S.btn.pid==null&&hitButton(p)){S.btn.pid=e.pointerId;pressStart();return;}
  if(drag)return;
  const fi=hitFruit(p);
  if(fi>=0){drag={k:'fruit',i:fi,pid:e.pointerId,sx:p.x,sy:p.y,x:p.x,y:p.y,moved:false};S.crate[fi].wob=1;return;}
  if(hitGlass(p)){drag={k:'glass',pid:e.pointerId,sx:p.x,sy:p.y,x:p.x,y:p.y,moved:false};S.gl.wob=1;return;}
  if(hitKaki(p)){drag={k:'ice',pid:e.pointerId,sx:p.x,sy:p.y,x:p.x,y:p.y,moved:false};crank();return;}
  wobbleAt(p);
}
function crank(){S.kaki.cv=14;S.kaki.snow=1;sfxCrank();}
function onMove(e){
  if(!PTR.has(e.pointerId))return;
  e.preventDefault();
  const p=toWorld(e.clientX,e.clientY);PTR.set(e.pointerId,{x:p.x,y:p.y});
  if(drag&&drag.pid===e.pointerId){drag.x=p.x;drag.y=p.y;if(!drag.moved&&dist(p.x,p.y,drag.sx,drag.sy)>14){drag.moved=true;
    if(drag.k==='fruit'&&S.crate[drag.i])S.crate[drag.i].state='drag';}}
}
function onUp(e,cancel){
  PTR.delete(e.pointerId);
  try{cv.releasePointerCapture(e.pointerId);}catch(_){}
  if(S.btn.pid===e.pointerId){pressEnd();}
  if(drag&&drag.pid===e.pointerId){
    const d=drag;drag=null;const p={x:d.x,y:d.y};
    if(d.k==='fruit'){const cr=S.crate[d.i];if(!cr)return;
      if(cancel){if(cr.state==='drag')cr.state='in';return;}
      if(!d.moved){cr.state='in';launchFruit(d.i);}
      else if(overJar(p)){launchFruit(d.i,p.x,p.y);S.flyers[S.flyers.length-1].dur=.25;}
      else{cr.state='in';cr.wob=1;}
    }else if(d.k==='glass'){
      if(cancel)return;
      if(!d.moved||overOji(p)||p.y<L.gl.bot-L.gl.h-40){if(S.gl.vol>=.1)startHand();else{S.gl.wob=1;sfxWob();}}
    }else if(d.k==='ice'){
      if(cancel)return;
      if(!d.moved){launchIce();}
      else if(overGlass(p)){launchIce(p.x,p.y);S.flyers[S.flyers.length-1].dur=.3;}
    }
  }
  S.idle=0;
}
function releaseAll(){
  if(S&&S.btn.pid!=null)pressEnd();
  if(drag&&S&&drag.k==='fruit'&&S.crate[drag.i]&&S.crate[drag.i].state==='drag')S.crate[drag.i].state='in';
  drag=null;PTR.clear();
}

let running=false,rafId=0,lastT=0,perfN=0,perfAcc=1/60,dprCap=2;
function update(dt){
  S.t+=dt;
  const B=S.btn;
  // button spring
  const target=B.down?1:0;B.v+=((target-B.d)*900-B.v*28)*dt;B.d+=B.v*dt;if(!S.hint||S.hint.k!=='button')B.demo=Math.max(0,B.demo-dt*5);
  if(B.down&&B.d>1)B.d=1;
  updateBlender(dt);updateFlow(dt);updateLanterns(dt);updateFlyers(dt);updateHand(dt);updateCustomers(dt);updateParade(dt);updateParts(dt);
  // glass mixing
  const gs=S.gl;
  if(gs.present)gs.slide=Math.min(1,gs.slide+dt*2.2);
  if(gs.present){for(let i=1;i<gs.layers.length;i++){const l=gs.layers[i],lo=gs.layers[i-1];const mx=l.iced?.012:Math.min(.6*(lo.a+l.a),.35);l.blur+=(mx-l.blur)*dt*.06;}
    gs.foam=Math.max(0,gs.foam-dt*.002);}
  if(gs.present&&gs.layers.length>=2&&!S.disc.iceCompare){
    // record the moment both a sharp (iced) and a blurred (non-iced) boundary have been observed in any glass
    for(let i=1;i<gs.layers.length;i++){const l=gs.layers[i];if(cdist(l.c,gs.layers[i-1].c)<40)continue;if(l.iced&&l.blur<.03)S._sawSharp=true;if(!l.iced&&l.blur>.08)S._sawBlur=true;}
    if(S._sawSharp&&S._sawBlur)logDisc('iceCompare',{});
  }
  // kakigori machine
  const K=S.kaki;K.crank+=K.cv*dt;K.cv=Math.max(0,K.cv-dt*18);K.snow=Math.max(0,K.snow-dt*1.5);K.wob=Math.max(0,K.wob-dt*3);
  if(S.festival>0&&R()<dt*.05)K.cv=Math.max(K.cv,5);
  // camera
  if(cam.zoomAt&&S.t>=cam.zoomAt){cam.zt=L.portrait?.7:.74;cam.zoomAt=0;}
  if(cam.until&&S.t>cam.until){cam.zt=1;cam.until=0;}
  cam.z=lerp(cam.z,cam.zt,clamp(dt*2.2,0,1));if(Math.abs(cam.z-cam.zt)<.0005)cam.z=cam.zt;
  S.inv=chooseInvite();
  updateOji(dt);updateHints(dt);auUpdate(dt);
  if(S.dirty&&S.t-S.lastSave>1.2){S.lastSave=S.t;saveNow();}
}

function drawStallLights(g){
  const m=L.main;const n=Math.max(6,Math.round((m.x1-m.x0)/34));
  for(let i=0;i<=n;i++){const x=m.x0+(m.x1-m.x0)*i/n;const y=m.awn+46+Math.sin(i/n*Math.PI)*8;const c=BULB[(i+((S.t*1.5)|0)*(S.festival?1:0))%3];
    g.fillStyle=cs(c);g.beginPath();g.arc(x,y,4.5,0,TAU);g.fill();glow(g,x,y,13,c,.5);}
  const k=L.kaki;for(let i=0;i<=5;i++){const x=k.x0+10+(k.x1-k.x0-20)*i/5;const y=k.roof+40;const c=BULB[(i+1)%3];g.fillStyle=cs(c);g.beginPath();g.arc(x,y,4,0,TAU);g.fill();glow(g,x,y,15,c,.4);}
  const lo=L.lot;for(let i=0;i<=4;i++){const x=lo.x0+10+(lo.x1-lo.x0-20)*i/4;const y=lo.roof+32;const c=BULB[(i+2)%3];g.fillStyle=cs(c);g.beginPath();g.arc(x,y,4,0,TAU);g.fill();glow(g,x,y,15,c,.4);}
  // warm work light over counter
  glow(g,(m.x0+m.x1)/2,m.counter-60,(m.x1-m.x0)*.55,[255,200,140],.16);
}
function frame(now){
  if(!running)return;
  rafId=requestAnimationFrame(frame);
  let dt=(now-lastT)/1000;lastT=now;
  if(!(dt>0))dt=0;
  if(dt<.25){perfN++;perfAcc=perfAcc*.95+dt*.05;if(perfN>120&&perfAcc>.026&&dprCap>1.01){dprCap=Math.max(1,dprCap-.35);perfN=0;perfAcc=1/60;resize();}}
  if(dt>.05)dt=.05;
  update(dt);render();
}
function start(){if(running)return;running=true;lastT=performance.now();perfN=0;rafId=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(rafId);}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){releaseAll();stop();if(AU.c&&AU.c.state==='running')AU.c.suspend().catch(()=>{});if(S&&S.dirty)saveNow();}
  else{releaseAll();if(AU.c){AU.c.resume().catch(()=>{});AU.next=AU.c.currentTime+.2;}start();}
});
window.addEventListener('pagehide',()=>{if(S&&S.dirty)saveNow();});

/* ---------------- resize ---------------- */
let resizeT=0;
function resize(){
  const prevPortrait=L?L.portrait:null;
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);DPR=Math.min(dprCap,window.devicePixelRatio||1);
  const portrait=H>=W;L=portrait?layoutPortrait():layoutLandscape();
  const s=getSafe();const sw=Math.max(1,W-s.l-s.r),sh=Math.max(1,H-s.t-s.b);
  FIT=Math.min(sw/L.DW,sh/L.DH);OX=s.l+(sw-L.DW*FIT)/2;OY=s.t+(sh-L.DH*FIT)/2;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  buildLanterns();buildCaches();
  if(prevPortrait!==null&&prevPortrait!==portrait)relayout();
  if(!running&&S)render();
}
function relayout(){
  releaseAll();
  S.flyers=[];if(S.hand){S.shelf[S.hand.slot]=S.hand.gs;S.hand=null;S.gl=newGlass();}
  S.parade=[];
  for(const c of S.cust){if(c.state==='queue'){const p=queuePos(c.dest,S.queues[c.dest].indexOf(c));c.x=p.x;c.y=p.y;c.s=depthS(c.y);}else c.dead=true;}
  S.cust=S.cust.filter(c=>!c.dead);
  for(const k in S.queues)S.queues[k]=S.queues[k].filter(c=>!c.dead);
  while(S.shelf.length>L.shelf.n)S.shelf.pop();
  S.prizes.forEach(p=>{p.x=(L.lot.line.x0+L.lot.line.x1)/2;p.y=L.lot.line.y+30;});
  S.balls=[];
}
window.addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(resize,60);});
window.addEventListener('orientationchange',()=>{clearTimeout(resizeT);resizeT=setTimeout(resize,200);});

/* ---------------- boot ---------------- */
function boot(){
  S=newState();
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  L=(H>=W)?layoutPortrait():layoutLandscape();
  loadSaved();
  // initial piece in the blender
  S.bl.amt=.3;S.bl.c=FRUITS[0].juice.slice();
  for(let i=0;i<4;i++)S.bl.chunks.push({type:0,ang:R()*TAU,rad:rr(.15,.7),h:rr(.05,.4),size:rr(.8,1.1),rot:R()*TAU,vy:0,y:0});
  for(let i=0;i<4;i++)fillCrate(i,0);
  // ensure the first suggested fruit differs from strawberry
  if(S.crate.every(c=>c.type===0))S.crate[1].type=2;
  resize();
  if(S.dyeColor){for(const l of LANS)l.c=S.dyeColor.slice();}
  for(const k in S.queues){S.queues[k].forEach((c,i)=>{const p=queuePos(k,i);c.x=p.x;c.y=p.y;c.s=depthS(c.y);});}
  S.prizes.forEach(p=>{p.x=(L.lot.line.x0+L.lot.line.x1)/2;p.y=L.lot.line.y+30;});
  S.spawnT=2.5;
  start();
}
boot();
