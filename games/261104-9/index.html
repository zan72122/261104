<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>いちご山</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2a1d14;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ===== util =====
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const rnd=(a,b)=>a+Math.random()*(b-a);
const sgn=v=>v<0?-1:1;

// ===== audio (Web Audio synth, started on first touch) =====
const AU={ctx:null,master:null,noise:null,played:0,state:'none',lastStep:0};
window.__audio=AU;
function audioInit(){
  if(AU.ctx){ if(AU.ctx.state==='suspended') AU.ctx.resume().catch(()=>{}); return; }
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC){AU.state='unsupported';return;}
    const ctx=new AC(); AU.ctx=ctx;
    const m=ctx.createGain(); m.gain.value=0.8;
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    m.connect(comp); comp.connect(ctx.destination); AU.master=m;
    const len=ctx.sampleRate*1; const b=ctx.createBuffer(1,len,ctx.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    AU.noise=b;
    // unlock with a silent blip
    const o=ctx.createOscillator(),g=ctx.createGain(); g.gain.value=0.0001; o.connect(g); g.connect(m); o.start(); o.stop(ctx.currentTime+0.02);
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    AU.state=ctx.state;
    ctx.onstatechange=()=>{AU.state=ctx.state;};
  }catch(e){AU.state='error';}
}
function aOK(){return AU.ctx&&AU.ctx.state==='running';}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
function tone(type,f0,f1,dur,vol,delay=0,att=0.004){
  if(!aOK())return; const c=AU.ctx,t=c.currentTime+delay;
  const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  env(g,t,att,vol,dur); o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+dur+att+0.05); AU.played++;
}
function noise(ftype,freq,q,dur,vol,delay=0,f1){
  if(!aOK())return; const c=AU.ctx,t=c.currentTime+delay;
  const s=c.createBufferSource(); s.buffer=AU.noise; s.playbackRate.value=1;
  const f=c.createBiquadFilter(); f.type=ftype; f.frequency.setValueAtTime(freq,t); f.Q.value=q;
  if(f1) f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=c.createGain(); env(g,t,0.003,vol,dur);
  s.connect(f); f.connect(g); g.connect(AU.master); s.start(t,Math.random()*0.5); s.stop(t+dur+0.05); AU.played++;
}
const SND={
  step(kind,speed,load){
    if(!aOK())return; const now=AU.ctx.currentTime; if(now-AU.lastStep<0.06)return; AU.lastStep=now;
    const p=1+clamp(speed/170,0,1)*0.25-(load||0)*0.12;
    switch(kind){
      case 'cookie': noise('highpass',2600*p,0.7,0.06,0.22); noise('bandpass',900*p,2,0.04,0.12,0.012); break;
      case 'sugar': for(let i=0;i<3;i++) noise('bandpass',4200*p+i*500,4,0.025,0.12,i*0.018); break;
      case 'spoon': tone('sine',2300*p,2250*p,0.18,0.07); tone('sine',3480*p,3400*p,0.1,0.03); noise('highpass',5000,1,0.02,0.06); break;
      case 'ceramic': tone('triangle',1650*p,1600*p,0.09,0.09); noise('highpass',3500,1,0.02,0.07); break;
      case 'cream': noise('lowpass',520*p,1,0.09,0.18,0,260); break;
      case 'lemon': noise('lowpass',900*p,2,0.06,0.15,0,400); tone('sine',300*p,220,0.06,0.05); break;
      case 'berry': noise('lowpass',700*p,3,0.07,0.15); tone('sine',420*p,330,0.07,0.05); break;
      default: tone('sine',520*p,300*p,0.06,0.16); noise('bandpass',1300*p,3,0.03,0.12); // wood "kotsu"
    }
  },
  crack(big){ noise('highpass',1800,0.8,big?0.22:0.1,big?0.5:0.3); noise('bandpass',700,1.5,0.12,0.25,0.01);
    tone('sine',150,60,0.14,big?0.35:0.18); for(let i=0;i<(big?6:3);i++) noise('highpass',3000+Math.random()*3000,2,0.02,0.15,0.03+i*0.035); },
  plop(){ tone('sine',900,180,0.18,0.35); tone('sine',420,900,0.12,0.12,0.12); for(let i=0;i<3;i++) tone('sine',600+i*240,1300+i*300,0.07,0.08,0.2+i*0.08); noise('lowpass',1200,1,0.25,0.1,0.02,300); },
  sugar(){ for(let i=0;i<4;i++) noise('bandpass',3000+i*700,5,0.03,0.1,i*0.025); },
  slide(){ noise('bandpass',700,1.2,0.5,0.18,0,1700); tone('sine',500,900,0.4,0.05); },
  metal(up){ tone('sine',up?1400:1700,up?1900:1200,0.35,0.08); tone('sine',up?2900:3300,up?3600:2600,0.25,0.03); },
  fling(){ tone('triangle',500,1400,0.18,0.12); noise('highpass',4000,1,0.06,0.08); },
  hop(){ tone('sine',380,620,0.1,0.07); },
  land(){ tone('sine',260,140,0.07,0.12); },
  tick(){ tone('sine',1200,1100,0.04,0.05); },
  thud(){ tone('sine',110,55,0.3,0.45); noise('lowpass',400,1,0.15,0.25); tone('triangle',1500,1450,0.25,0.12,0.06); tone('triangle',1980,1950,0.2,0.08,0.09); },
  clatter(){ for(let i=0;i<5;i++){ tone('triangle',1500+Math.random()*900,1400,0.12,0.09,i*0.09); } },
  success(){ const n=[523.25,659.25,783.99,1046.5,1318.5]; n.forEach((f,i)=>{tone('sine',f,f,0.9,0.16,i*0.11,0.01);tone('sine',f*2.01,f*2,0.5,0.05,i*0.11,0.01);});
    tone('sine',1568,1568,1.4,0.08,0.6,0.02); for(let i=0;i<8;i++) tone('sine',2600+Math.random()*1800,3000,0.12,0.04,0.5+i*0.07); },
  bridge(){ [784,988,1175].forEach((f,i)=>tone('sine',f,f,0.5,0.1,i*0.07,0.01)); },
  whoosh(){ noise('bandpass',400,0.8,0.6,0.12,0,1400); },
  swish(){ noise('bandpass',1500,0.7,0.5,0.12,0,500); },
};
// ===== world constants (world units, y up, table = 0) =====
const STEP=16, HOP=36, GRAV=1100;
const BOARD={x1:210,x2:520,y:56};
const CUP={x1:548,x2:700,cx:624,rx:76,rim:125,tea:112};
const CH={x1:521,x2:548,y:70}; // cup handle top
const BOWLX=290, SPOON_L=266, WALLX=548, RIMY=129;
const CK={cx:115,r:75,top:26};
const CAKE={px1:702,px2:1072,lx1:706,lx2:1060,ly:100,uy:190};
const FACES=[
  {u1:860,u2:960,berry:910,left:{type:'ramp',x1:742},right:{type:'ramp',x1:1052}},
  {u1:880,u2:980,berry:930,left:{type:'steps',x1:778},right:{type:'ramp',x1:1050}},
  {u1:830,u2:930,berry:880,left:{type:'none'},right:{type:'ramp',x1:1054}},
];
const BIN=10;
let S=null, cycleNo=0;

function newCycle(){
  cycleNo++;
  const hx=350+rnd(-12,12); const prevDemo=S?S.demoDone:{};
  S={
    t:0, cycle:cycleNo,
    cookie:{x1:40,x2:190,leftCrumb:false,half:false,ramp:false,stairs:false,cracks:[],hits:{L:0,C:0,R:0},wob:0},
    crumbs:[], // decorative pieces {x,y,pts,rot,col}
    supports:[{kind:'hashi',x:hx,w:26,h:24,vx:0,wob:0}],
    cubes:[
      {id:0,x:256+rnd(-2,4),y:56,vx:0,vy:0,air:false,gone:false,fall:null,wob:0,rot:0},
      {id:1,x:500+rnd(-6,4),y:0,vx:0,vy:0,air:false,gone:false,fall:null,wob:0,rot:0,initSpoon:true},
      {id:2,x:378+rnd(-4,6),y:0,vx:0,vy:0,air:false,gone:false,fall:null,wob:0,rot:0,initSpoon:true},
    ],
    teaSugar:[], ripples:[],
    spoon:{th:0,vth:0,hooked:false,px:hx,py:84,wasHooked:false,wob:0,thRest:0},
    lemon:{x:640+rnd(0,30),vx:0,wedged:false,wob:0},
    cake:null, // {face, ruts:[[[],[]]...], prints:[], rot:null}
    hand:null, // event
    doll:{x:48,y:CK.top,vx:0,air:false,vy:0,hop:null,face:1,phase:0,stride:0,squash:0,eyesRound:0,wave:0,
      look:{x:1,y:0},idle:0,slide:null,lastStepPhase:0,freeze:0,peek:0,lastKind:'cookie',landT:0},
    reachedBoard:false, reachedRim:false, bridgeEver:false, summit:false, homeArmed:false,
    lastInput:-99, demoDone:prevDemo, demo:null, rotTimer:0, fade:0, fadeDir:0, candle:0, clatter:0,
    log:[], // discovery log for testing
  };
  S.spoon.th=S.spoon.thRest=spoonRestAngle(hx,84);
  for(const c of S.cubes){ if(c.initSpoon){ c.y=spoonY(c.x); } }
  S.lastInput=0;
}
const ALLLOG=[]; window.__allLog=ALLLOG;
function logD(k,info){ const e={k,t:+S.t.toFixed(2),c:S.cycle,info}; if(S.log.length<400) S.log.push(e); if(ALLLOG.length<3000) ALLLOG.push(e); }

// ----- spoon geometry -----
// at rest the handle leans down to the cup handle, but the bowl never rises above reach (sugar can be pushed in, the doll can hop in)
function spoonRestAngle(px,py){ return Math.max(Math.atan2(74-py,530-px),Math.atan2(py-86,px-BOWLX)); }
function spoonLineY(x){ const sp=S.spoon; return sp.py+(x-sp.px)*Math.tan(sp.th); }
function spoonEnd(){ return S.spoon.hooked?WALLX+1:WALLX-2; }
function spoonY(x){ return x<314? spoonLineY(x)-3 : spoonLineY(x)+1; }

// ----- cake geometry per face -----
function cakeFaceSurfs(fi,out){
  const f=FACES[fi];
  out.push({x1:CAKE.px1,x2:CAKE.px2,y1:8,y2:8,solid:true,bot:0,kind:'ceramic'});
  out.push({x1:CAKE.lx1,x2:CAKE.lx2,y1:CAKE.ly,y2:CAKE.ly,solid:true,bot:8,kind:'cream'});
  out.push({x1:f.u1,x2:f.u2,y1:CAKE.uy,y2:CAKE.uy,solid:false,kind:'cream',upper:true});
  const b=f.berry;
  out.push({x1:b-34,x2:b-13,y1:CAKE.uy,y2:212,solid:false,kind:'berry'});
  out.push({x1:b-13,x2:b+13,y1:212,y2:212,solid:false,kind:'berry',summit:true});
  out.push({x1:b+13,x2:b+34,y1:212,y2:CAKE.uy,solid:false,kind:'berry'});
  for(const side of ['left','right']){
    const L=f[side];
    if(L.type==='ramp'){
      if(side==='left') out.push({x1:L.x1,x2:f.u1,y1:CAKE.ly,y2:CAKE.uy,solid:false,kind:'cream',ramp:{side:0},climb:true});
      else out.push({x1:f.u2,x2:L.x1,y1:CAKE.uy,y2:CAKE.ly,solid:false,kind:'cream',ramp:{side:1},climb:true});
    } else if(L.type==='steps'){
      const n=6, w=(f.u1-L.x1)/n;
      for(let i=0;i<n-0;i++){ const top=CAKE.ly+(i+1)*(CAKE.uy-CAKE.ly)/n;
        out.push({x1:L.x1+i*w,x2:f.u1,y1:top,y2:top,solid:false,kind:'cream',dollop:i,climb:true}); }
    }
  }
}
function rampGeom(fi,side){ const f=FACES[fi]; const L=side===0?f.left:f.right;
  if(L.type!=='ramp')return null;
  return side===0?{x1:L.x1,x2:f.u1,y1:CAKE.ly,y2:CAKE.uy}:{x1:f.u2,x2:L.x1,y1:CAKE.uy,y2:CAKE.ly}; }
function rampBins(g){ return Math.ceil((g.x2-g.x1)/BIN); }

// ----- surfaces -----
let SURF=[];
function buildSurfaces(){
  const o=[]; SURF=o;
  o.push({x1:-400,x2:1500,y1:0,y2:0,solid:false,kind:'wood',table:true});
  o.push({x1:BOARD.x1,x2:BOARD.x2,y1:BOARD.y,y2:BOARD.y,solid:true,bot:0,kind:'wood',board:true});
  const ck=S.cookie;
  if(!ck.half){ o.push({x1:ck.x1,x2:ck.x2,y1:CK.top,y2:CK.top,solid:true,bot:0,kind:'cookie',cookie:true}); }
  else { o.push({x1:ck.x1,x2:110,y1:CK.top,y2:CK.top,solid:true,bot:0,kind:'cookie',cookie:true});
    if(ck.ramp) o.push({x1:136,x2:213,y1:0,y2:59,solid:false,kind:'cookie',cookieRamp:true}); }
  if(ck.leftCrumb) o.push({x1:16,x2:ck.x1+2,y1:13,y2:13,solid:true,bot:0,kind:'cookie'});
  if(ck.stairs){ o.push({x1:ck.half?186:ck.x2-2,x2:211,y1:42,y2:42,solid:true,bot:0,kind:'cookie',stairs:true});
    if(ck.half) o.push({x1:160,x2:188,y1:20,y2:20,solid:true,bot:0,kind:'cookie',stairs:true}); }
  for(const s of S.supports) if(!s.fly) o.push({x1:s.x-s.w/2,x2:s.x+s.w/2,y1:BOARD.y+s.h,y2:BOARD.y+s.h,solid:true,bot:BOARD.y,kind:s.kind==='hashi'?'wood':'cookie',sup:s});
  o.push({x1:CH.x1,x2:CH.x2,y1:CH.y,y2:CH.y,solid:false,kind:'ceramic',cupHandle:true});
  o.push({x1:CUP.x1,x2:CUP.x2,y1:CUP.rim,y2:CUP.rim,solid:true,bot:0,kind:'ceramic',rim:true});
  if(S.lemon.wedged) o.push({x1:525,x2:WALLX,y1:100,y2:100,solid:false,kind:'lemon',lemonLedge:true});
  // spoon
  const e=spoonEnd();
  o.push({x1:SPOON_L,x2:314,y1:spoonY(SPOON_L),y2:spoonY(314),solid:true,bot:-1,kind:'spoon',spoon:true,bowl:true});
  o.push({x1:314,x2:e,y1:spoonY(314),y2:spoonY(e),solid:true,bot:-1,kind:'spoon',spoon:true});
  for(const c of S.cubes){ if(c.gone||c.air||c.fall)continue; o.push({x1:c.x-9,x2:c.x+9,y1:c.y+18,y2:c.y+18,solid:true,bot:c.y,kind:'sugar',cube:c}); }
  if(S.cake&&S.cake.placed){ const fi=S.cake.rot&&S.cake.rot.swapped===false?S.cake.face:S.cake.face; cakeFaceSurfs(fi,o); }
}
function surfY(s,x){ if(s.x2===s.x1)return s.y1; return s.y1+(s.y2-s.y1)*clamp((x-s.x1)/(s.x2-s.x1),0,1); }
function surfBot(s,x){ return s.bot===-1? surfY(s,x)-7 : s.bot; }
// highest surface at x whose top <= ymax (pad = snap tolerance)
function groundAt(x,ymax,excl,pad=4){
  let best=null,by=-1e9;
  for(const s of SURF){ if(s===excl||(excl&&s.cube&&s.cube===excl))continue;
    if(x<s.x1-pad||x>s.x2+pad)continue; const y=surfY(s,x); if(y<=ymax+0.01&&y>by){by=y;best=s;} }
  return best?{s:best,y:by}:{s:SURF[0],y:0};
}
// solid obstacle at x for a body standing at y (height h)
function wallAt(x,y,h,excl){
  let best=null;
  for(const s of SURF){ if(!s.solid||s===excl||(excl&&s.cube===excl))continue;
    if(x<=s.x1||x>=s.x2)continue; const top=surfY(s,x);
    if(top>y+STEP&&surfBot(s,x)<y+h){ if(!best||top<best.top) best={s,top}; } }
  return best;
}
// ===== particles =====
const PMAX=170; const P=[];
function puff(x,y,n,kind,vx0=0,vy0=0,spread=1){
  for(let i=0;i<n;i++){ if(P.length>=PMAX) P.shift();
    const a=rnd(0,TAU),sp=rnd(30,130)*spread;
    P.push({x,y,vx:vx0+Math.cos(a)*sp,vy:vy0+Math.abs(Math.sin(a))*sp*1.2,life:rnd(0.5,1.1),age:0,kind,sz:rnd(1.5,4),rot:rnd(0,TAU),vr:rnd(-8,8),floor:y-40}); }
}
function updParticles(dt){
  for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.age+=dt; if(p.age>p.life){P.splice(i,1);continue;}
    if(p.kind==='star'||p.kind==='glint'){ p.x+=p.vx*dt*0.4; p.y+=p.vy*dt*0.4; continue; }
    p.vy-=GRAV*0.8*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
    const g=groundAt(p.x,p.y+6,null,0).y; if(p.y<g){p.y=g;p.vy*=-0.25;p.vx*=0.5;p.vr*=0.5;} }
}

// ===== spoon physics =====
function spoonLoads(){
  const L=[]; const d=S.doll;
  if(onSpoon(d.x,d.y)&&!d.air&&!d.hop) L.push({x:d.x,w:1,doll:true});
  for(const c of S.cubes){ if(c.gone||c.air||c.fall)continue; if(onSpoon(c.x,c.y)) L.push({x:c.x,w:0.8,cube:c}); }
  return L;
}
function onSpoon(x,y){ return x>=SPOON_L-7&&x<=spoonEnd()+2&&Math.abs(y-spoonY(x))<4; }
function updSpoon(dt){
  const sp=S.spoon;
  // pivot = leftmost support under the spoon
  // the spoon rests on the tallest support under it (cookie chunks are taller than the rest), nearest the bowl on ties
  let piv=null; for(const s of S.supports){ if(s.fly||s.x<318)continue; if(!piv||s.h>piv.h||(s.h===piv.h&&s.x<piv.x)) piv=s; }
  const npx=piv.x, npy=BOARD.y+piv.h+4;
  // keep loads riding while pivot shifts
  sp.px=lerp(sp.px,npx,1-Math.exp(-10*dt)); sp.py=npy;
  const b=WALLX-sp.px;
  const thMax=Math.atan2(sp.py-64,sp.px-BOWLX);
  const thRest=spoonRestAngle(sp.px,sp.py); sp.thRest=thRest;
  let thCap=thMax; const yW=th=>sp.py+b*Math.tan(th);
  if(yW(thCap)>RIMY) thCap=Math.atan2(RIMY-sp.py,b);
  let T=0; const loads=spoonLoads();
  for(const l of loads){ const arm=sp.px-l.x; if(arm>0) T+=l.w*arm; else if(!sp.hooked&&-arm<110) T+=l.w*arm; }
  const need=0.18*b; const r=T/need;
  let f=sstep((r-0.3)/0.6);
  if(sp.hooked&&r>=0.55) f=1;
  sp.r=r; sp.f=f;
  const target=thRest+(thCap-thRest)*f;
  const prev=sp.th;
  sp.vth+=(target-sp.th)*70*dt; sp.vth*=Math.exp(-11*dt); sp.th+=sp.vth*dt;
  if(sp.th>thCap+0.002){sp.th=thCap; if(sp.vth>0) sp.vth*=-0.2;}
  const was=sp.hooked; sp.hooked=yW(sp.th)>=112;
  if(sp.hooked&&!was){ SND.metal(true); if(!sp.wasHooked){ sp.wasHooked=true; } if(!S.bridgeEver){S.bridgeEver=true;} logD('bridgeUp',{px:Math.round(sp.px),r:+r.toFixed(2),loads:loads.map(l=>l.doll?'doll':'cube'+l.cube.id)}); }
  if(!sp.hooked&&was){ SND.metal(false); logD('bridgeDown',{r:+r.toFixed(2)}); }
  // track lift for discovery 5 (doll alone)
  const dth=(sp.th-prev)/Math.max(dt,1e-4);
  if(dth>0.9){ // fast swing up -> fling cubes near the tip
    for(const c of S.cubes){ if(c.gone||c.air||c.fall)continue;
      if(onSpoon(c.x,c.y)&&c.x>sp.px+90){ launchCube(c,'fling'); } }
  }
  sp.wob*=Math.exp(-6*dt);
}
function launchCube(c,why){
  const tx=rnd(640,676), ty=CUP.tea;
  const dur=0.7; c.fall={t:0,dur,x0:c.x,y0:c.y,x1:tx,y1:ty,h:90,why};
  SND.fling(); logD('fling',{cube:c.id});
}

// ===== cubes =====
function cubeTryMove(c,d){
  const nx=c.x+d; const lead=nx+sgn(d)*9;

  if(onSpoon(c.x,c.y)&&c.x<316&&c.x>262&&(nx>312||nx<270)) return false;

    if(top>c.y+lim&&surfBot(s,lead)<c.y+18) return false; }

  else { if(g.y>c.y+3){ c.hopv=1; SND.sugar(); } c.y=g.y; }
  return true;
}
function updCubes(dt){
  for(const c of S.cubes){ if(c.gone)continue;
    c.wob*=Math.exp(-6*dt);
    if(c.fall){ const f=c.fall; f.t+=dt; const k=clamp(f.t/f.dur,0,1);
      c.x=lerp(f.x0,f.x1,k); c.y=lerp(f.y0,f.y1,k)+Math.sin(k*Math.PI)*f.h; c.rot+=dt*9;
      if(k>=1){ c.gone=true; c.fall=null; teaDrop(c.x,f.why); }

    let nx=s.x+s.vx*dt; s.vx*=Math.exp(-3.2*dt); if(Math.abs(s.vx)<12) s.vx=0;
    if(nx<224){nx=224;s.vx=0;} if(nx>506){nx=506;s.vx=0;}
    for(const o of sp){ if(o===s)continue; const md=(o.w+s.w)/2; if(Math.abs(o.x-nx)<md&&sgn(o.x-s.x)===sgn(s.vx)){

    for(const c of S.cubes){ if(c.gone||c.air||c.fall)continue; if(Math.abs(c.y-BOARD.y)<2&&Math.abs(c.x-nx)<9+s.w/2&&sgn(c.x-s.x)===sgn(s.vx)){ const want=nx+sgn(s.vx)*(9+s.w/2)-c.x; if(!cubeTryMove(c,want)){ nx=c.x-sgn(c.x-s.x)*(9+s.w/2); s.vx=0; } } }

// ===== cookie & stomp =====

  let g=ctx.createLinearGradient(0,0,0,H*0.22); g.addColorStop(0,'rgba(40,26,16,0.45)'); g.addColorStop(1,'rgba(40,26,16,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.22);
  g=ctx.createLinearGradient(0,H*0.86,0,H); g.addColorStop(0,'rgba(30,18,10,0)'); g.addColorStop(1,'rgba(30,18,10,0.4)'); ctx.fillStyle=g; ctx.fillRect(0,H*0.86,W,H*0.14);
  if(S.fade>0){ ctx.fillStyle=`rgba(255,244,228,${S.fade})`; ctx.fillRect(0,0,W,H); }
}
let last=0, running=true, rafId=0;
function frame(ts){
  if(!running) return; rafId=requestAnimationFrame(frame);
  if(!last){ last=ts; }
  let dt=(ts-last)/1000; last=ts; if(dt<=0) return; if(dt>0.05) dt=0.05;
  try{ update(dt); draw(); }catch(err){ console.error(err); running=false; }
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ running=false; cancelAnimationFrame(rafId); release(); if(AU.ctx&&AU.ctx.state==='running') AU.ctx.suspend().catch(()=>{}); }
  else { if(!running){ running=true; last=0; rafId=requestAnimationFrame(frame);} if(AU.ctx) AU.ctx.resume().catch(()=>{}); }
});
window.addEventListener('pageshow',()=>{ if(!running&&!document.hidden){ running=true; last=0; rafId=requestAnimationFrame(frame);} });
let rzT=0; function onResize(){ clearTimeout(rzT); rzT=setTimeout(()=>{ layout(); camX=camTarget(); },60); }
window.addEventListener('resize',onResize); window.addEventListener('orientationchange',onResize);
// boot
newCycle(); layout(); buildTextures(); camX=camTarget(); buildSurfaces();
window.__game={get S(){return S;},drag,toScreen:(x,y)=>({x:X(x),y:Y(y)}),SURF:()=>SURF,step:(n,dt)=>{for(let i=0;i<n;i++)update(dt||1/60);draw();}};
rafId=requestAnimationFrame(frame);
</script>
