<style>

#sa{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);visibility:hidden;pointer-events:none}

<body>
<canvas id="c"></canvas><div id="sa"></div>
<script>
(function(){
'use strict';
/* ===== palette (16 fixed colors) ===== */
const PAL=['#0b1030','#1d2b5e','#05060f','#f4f4f4','#8a93a8','#e8323c','#8a1a2a','#ff9ec8','#6cd4ff','#2a6ad8','#ffd23a','#e88a1a','#8a5426','#4a2a12','#3cc85a','#f2b98a'];
const BG=0,NAVY=1,INK=2,WHITE=3,GRAY=4,RED=5,DRED=6,PINK=7,AQUA=8,BLUE=9,YEL=10,ORA=11,MUD=12,DMUD=13,GRN=14,SKIN=15;
const RAIN=[RED,ORA,YEL,GRN,AQUA,BLUE,PINK];
const PARTS=['brush','foam','water','wind'];
const PCOL={brush:YEL,foam:PINK,water:AQUA,wind:WHITE};
const BASE={water:0,brush:3,foam:7,wind:9};
const WNOTE=[[5,7],[6,9],[7,10],[9,12]];
const HAIR=[INK,MUD,ORA,YEL], CLOTH=[GRN,RED,PINK,ORA];
const CAR_CELLS=[{x:17,y:0},{x:31,y:0},{x:3,y:13},{x:15,y:14},{x:27,y:15},{x:39,y:14},{x:49,y:12}];
const STEP=60/108/2;
const PMAX=150;

const cv=document.getElementById('c');
const cx=cv.getContext('2d',{alpha:false});
const saEl=document.getElementById('sa');
const buf=document.createElement('canvas');
const g=buf.getContext('2d');
let DPR=1,K=6,LW=120,LH=200,DW=1,DH=1,MINHIT=16;
let SA={t:0,r:0,b:0,l:0};
let curFill=-1;
let gameTime=0;

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry(((Date.now()&0xffffffff)^0x5bd1e995)>>>0);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=k=>1-Math.pow(1-clamp(k,0,1),3);
function pf(i){const o=Math.floor(i/5),d=[0,2,4,7,9][((i%5)+5)%5];return 261.63*Math.pow(2,(o*12+d)/12);}

/* ===== pixel drawing primitives (integer only, no AA) ===== */
function fs(c){if(c!==curFill){g.fillStyle=PAL[c];curFill=c;}}
function R(x,y,w,h,c){x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);if(w<=0||h<=0)return;fs(c);g.fillRect(x,y,w,h);}
function P(x,y,c){fs(c);g.fillRect(Math.round(x),Math.round(y),1,1);}
function disc(x,y,r,c){x=Math.round(x);y=Math.round(y);r=Math.round(r);if(r<=0){P(x,y,c);return;}fs(c);for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy)+0.4);g.fillRect(x-w,y+dy,w*2+1,1);}}
function ball(x,y,r,f,o){disc(x,y,r,o);if(r>=1)disc(x,y,r-1,f);}
function box(x,y,w,h,f,o){x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);if(w<3||h<3){R(x,y,w,h,o);return;}R(x+1,y,w-2,h,o);R(x,y+1,w,h-2,o);R(x+1,y+1,w-2,h-2,f);}
function frm(x,y,w,h,c){R(x,y,w,1,c);R(x,y+h-1,w,1,c);R(x,y,1,h,c);R(x+w-1,y,1,h,c);}
function line(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);fs(c);const dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1;let err=dx+dy,n=0;for(;;){g.fillRect(x0,y0,1,1);if((x0===x1&&y0===y1)||++n>500)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx;}if(e2<=dx){err+=dx;y0+=sy;}}}
function arcTop(x,y,r,c){x=Math.round(x);y=Math.round(y);let py=null;for(let dx=-r;dx<=r;dx++){const yy=y-Math.round(Math.sqrt(Math.max(0,r*r-dx*dx)));if(py===null)P(x+dx,yy,c);else{const a=Math.min(py,yy),b=Math.max(py,yy);R(x+dx,a,1,Math.max(1,b-a),c);}py=yy;}}
function makePat(c){const p=document.createElement('canvas');p.width=2;p.height=2;const q=p.getContext('2d');q.fillStyle=PAL[c];q.fillRect(0,0,1,1);q.fillRect(1,1,1,1);return g.createPattern(p,'repeat');}
let patY=null,patW=null;
function patRow(pat,x,y,w){if(w<=0)return;g.fillStyle=pat;curFill=-1;g.fillRect(Math.round(x),Math.round(y),Math.round(w),1);}
function star(x,y,c){P(x,y,WHITE);P(x-1,y,c);P(x+1,y,c);P(x,y-1,c);P(x,y+1,c);}
function note(x,y,c){R(x+3,y,1,5,c);R(x+3,y,2,1,c);P(x+5,y+1,c);R(x+1,y+4,3,2,c);P(x,y+5,c);}
function dropShape(x,y){x=Math.round(x);y=Math.round(y);P(x,y,AQUA);R(x-1,y+1,3,2,AQUA);P(x,y+3,AQUA);P(x-1,y+1,WHITE);}

/* ===== mini icons (8x8) ===== */
function icon(p,x,y,mono){
  const c=k=>mono==null?k:mono;
  x=Math.round(x);y=Math.round(y);
  if(p==='brush'){R(x+3,y,2,3,c(MUD));R(x+1,y+3,6,2,c(YEL));for(let i=0;i<3;i++)R(x+1+i*2,y+5,1,3,c(YEL));R(x+1,y+4,6,1,c(ORA));}
  else if(p==='foam'){disc(x+3,y+5,2,c(PINK));disc(x+6,y+5,1,c(PINK));disc(x+5,y+2,1,c(PINK));P(x+2,y+4,c(WHITE));}
  else if(p==='water'){P(x+3,y,c(AQUA));R(x+2,y+1,3,2,c(AQUA));R(x+1,y+3,5,3,c(AQUA));R(x+2,y+6,3,1,c(AQUA));P(x+2,y+3,c(WHITE));}
  else {R(x,y+1,5,1,c(WHITE));P(x+5,y,c(WHITE));R(x+1,y+4,6,1,c(WHITE));P(x+7,y+3,c(WHITE));R(x,y+7,4,1,c(WHITE));P(x+4,y+6,c(WHITE));}
}

/* ===== audio (Web Audio synthesis) ===== */
let AC=null,MG=null,NB=null,voices=0;
function audioInit(){
  if(AC){if(AC.state!=='running'&&!document.hidden){try{AC.resume();}catch(e){}}return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{
    AC=new C();MG=AC.createGain();MG.gain.value=0.5;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
    MG.connect(comp);comp.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0);
    if(AC.state!=='running'){const pr=AC.resume();if(pr&&pr.catch)pr.catch(()=>{});}
  }catch(e){AC=null;}
}
function aok(){return AC&&AC.state==='running'&&voices<52;}
function now(){return AC?AC.currentTime+0.005:0;}
function at(T){return AC?Math.max(AC.currentTime+0.002,AC.currentTime+(T-gameTime)):0;}
function tone(t,f,d,type,v,o){
  if(!aok())return;o=o||{};
  try{
    const os=AC.createOscillator(),ga=AC.createGain();os.type=type;os.frequency.setValueAtTime(f,t);
    if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
    const a=o.a||0.005;ga.gain.setValueAtTime(0.0001,t);ga.gain.exponentialRampToValueAtTime(v,t+a);ga.gain.exponentialRampToValueAtTime(0.0001,t+d);
    let out=ga;if(o.lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;ga.connect(fl);out=fl;}
    os.connect(ga);out.connect(MG);
    let lfo=null;if(o.vib){lfo=AC.createOscillator();const lg=AC.createGain();lfo.frequency.value=o.vib;lg.gain.value=f*0.025;lfo.connect(lg);lg.connect(os.frequency);lfo.start(t);lfo.stop(t+d+0.05);}
    os.start(t);os.stop(t+d+0.05);voices++;
    os.onended=()=>{voices--;try{out.disconnect();ga.disconnect();}catch(e){}};
  }catch(e){}
}
function noise(t,d,v,ft,f0,f1,q){
  if(!aok())return;
  try{
    const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const fl=AC.createBiquadFilter();fl.type=ft;fl.frequency.setValueAtTime(f0,t);
    if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t+d);fl.Q.value=q||1;
    const ga=AC.createGain();ga.gain.setValueAtTime(0.0001,t);ga.gain.exponentialRampToValueAtTime(v,t+0.01);ga.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(fl);fl.connect(ga);ga.connect(MG);s.start(t,Math.random()*0.5);s.stop(t+d+0.05);voices++;
    s.onended=()=>{voices--;try{ga.disconnect();}catch(e){}};
  }catch(e){}
}
const SND={
  bubble(t,f,v){v=v||0.22;tone(t,f,0.09,'sine',v,{to:f*1.9});tone(t+0.045,f*1.5,0.07,'sine',v*0.6,{to:f*2.3});},
  shaka(t,v){v=v||0.22;noise(t,0.05,v,'bandpass',4200,0,1.3);noise(t+0.08,0.05,v*0.8,'bandpass',3400,0,1.3);},
  pluck(t,f,v){v=v||0.22;tone(t,f,0.28,'triangle',v);tone(t,f*2,0.07,'square',v*0.12,{lp:2200});},
  streak(t){tone(t,116,0.16,'sawtooth',0.14,{to:92,lp:650});noise(t,0.16,0.1,'lowpass',800,300);tone(t+0.19,110,0.12,'sawtooth',0.11,{to:86,lp:600});},
  squeak(t){tone(t,1700,0.1,'sine',0.1,{to:2600});tone(t+0.11,2000,0.08,'sine',0.08,{to:2900});},
  splash(t,v){noise(t,0.38,v||0.22,'lowpass',2600,450);},
  marimba(t,f,v){v=v||0.3;tone(t,f,0.42,'sine',v);tone(t,f*4,0.06,'sine',v*0.3);},
  whoosh(t,v){noise(t,0.45,v||0.18,'bandpass',450,2200,0.8);},
  whistle(t,f,v){tone(t,f,0.22,'sine',v||0.15,{to:f*1.12,vib:9,a:0.02});},
  drum(t,f,v){tone(t,f,0.24,'sine',v,{to:f*0.45});noise(t,0.04,v*0.25,'lowpass',1400);},
  chime(t){[1,1.25,1.5,2].forEach((m,i)=>tone(t+i*0.07,784*m,0.38,'triangle',0.15));tone(t+0.3,784*3,0.45,'sine',0.07);},
  fanfare(t){[523,659,784,1047,784,1047,1319].forEach((f,i)=>{tone(t+i*0.1,f,0.24,'square',0.06,{lp:2400});tone(t+i*0.1,f,0.28,'triangle',0.12);});},
  horn(t,v){v=v||0.15;tone(t,392,0.15,'square',v,{lp:1300});tone(t,494,0.15,'square',v*0.8,{lp:1300});},
  hey(t,f1,f2,v){v=v||0.12;tone(t,f1,0.11,'square',v,{lp:1900});tone(t+0.12,f2,0.16,'square',v,{lp:1900});},
  rewind(t){tone(t,900,0.42,'triangle',0.14,{to:200});noise(t,0.35,0.07,'bandpass',2000,400);},
  tick(t){tone(t,1300,0.04,'square',0.04,{lp:3000});},
  giggle(t){[880,988,880,1175].forEach((f,i)=>tone(t+i*0.06,f,0.06,'sine',0.09));},
  pip(t,f){tone(t,f,0.08,'square',0.06,{lp:2500});}
};
function playPartNote(t,p,f,v){
  if(p==='brush'){SND.shaka(t,0.16*v);SND.pluck(t,f,0.22*v);}
  else if(p==='foam')SND.bubble(t,f,0.22*v);
  else if(p==='water')SND.marimba(t,f,0.3*v);
  else SND.whistle(t,f,0.15*v);
}

/* ===== state ===== */
const S={
  phase:'car',pt:0,cycle:0,time:0,
  car:{cells:[],init:null,drops:[],initDrops:[],off:0,rain:0,jumpT:9,blink:3,blinkT:0,tiltT:9,happyT:9},
  bus:{wins:[],init:null,drops:[],off:0,target:0,order:[],rain:0,hornT:9,jumpT:9,driverHonk:9},
  seq:[],used:new Set(),lastTapT:-9,songFormed:false,song:null,performDone:false,
  stage:0,stageTarget:0,mem:null,
  wheel:{flow:0,ang:0,spd:0,thump:0},packets:[],
  parts:{},idle:0,demo:null,demoArmed:true,hint:null,
  deco:{lamp0:9,lamp1:9,cone:9},slotFlash:[0,0,0,0,0,0,0,0],spk:0,vstep:0,
  nozzleX:null,touched:false,parade:null,mini:{wave:[9,9,9,9]},
  stat:{firstTap:null,foamBrush:0,hardOff:0,streakMade:0,streakFixed:0,waterOnFoam:0,maxWheel:0,drumHits:0,whistles:0,windDry:0,songs:0,windows:0,horns:0,cycles:0,returns:0,songLog:[]}
};
PARTS.forEach(p=>S.parts[p]={press:0,hitT:9,beat:0});
const E=[];      // effects
const PT=[];     // particles
let VQ=[];       // visual queue synced to music

function makeCarDirt(){
  const lv=[3,3,2,2,2,1,1];
  for(let i=lv.length-1;i>0;i--){const j=(rnd()*(i+1))|0;const t=lv[i];lv[i]=lv[j];lv[j]=t;}
  return CAR_CELLS.map((c,i)=>({x:c.x+((rnd()*3)|0)-1,y:c.y+((rnd()*2)|0),mud:lv[i],foam:0,streak:false,sd:(rnd()*1000)|0,pop:0,shine:0}));
}
function makeDrops(n,x0,x1,y0,y1){const a=[];for(let i=0;i<n;i++)a.push({x:x0+((rnd()*(x1-x0))|0),y:y0+((rnd()*(y1-y0))|0)});return a;}
function makeWins(){
  const lv=[3,2,3,2];for(let i=3;i>0;i--){const j=(rnd()*(i+1))|0;const t=lv[i];lv[i]=lv[j];lv[j]=t;}
  return lv.map((m,i)=>({mud:m,foam:0,streak:false,washed:false,sd:(rnd()*1000)|0,waveT:9,pop:0}));
}
const clone=o=>JSON.parse(JSON.stringify(o));
function newCar(){S.car.cells=makeCarDirt();S.car.init=clone(S.car.cells);S.car.drops=makeDrops(2+((rnd()*2)|0),6,54,15,21);S.car.initDrops=clone(S.car.drops);}
function newBus(){S.bus.wins=makeWins();S.bus.init=clone(S.bus.wins);S.bus.drops=[];S.bus.order=[];S.bus.target=0;}
newCar();newBus();

/* ===== layout ===== */
const L={part:{}};
let STARS=[];
function computeLayout(){
  const sx=SA.l+2,sy=SA.t+2,sw=LW-SA.l-SA.r-4,sh=LH-SA.t-SA.b-4;
  L.sx=sx;L.sy=sy;L.sw=sw;L.sh=sh;
  L.portrait=sh>sw*1.15;
  L.wr=L.portrait?12:10;
  const ph=clamp(Math.round(sh*0.15),Math.max(24,MINHIT+4),36);
  L.ph=ph;L.partsY=sy+sh-ph;
  let aw;
  if(L.portrait){
    // stack: sky(>=20) | head(<=38) | beam..floor (busH+26) | gap(wheel) | parts
    const avail=L.partsY-(sy+20);const core=38+L.busH+26;
    const minGap=L.wr*2+14;const extra=Math.max(0,avail-core-minGap);
    const gap=minGap+Math.round(extra*0.55);
    L.wr=clamp(Math.round((gap-12)/2.6),12,17);
    L.floorY=L.partsY-gap;L.wheelX=sx+sw-L.wr-3;L.wheelY=L.floorY+Math.round((gap-2*L.wr)/2)+L.wr+2;aw=sw;
  }else{
    L.floorY=L.partsY-9;L.wheelX=sx+sw-L.wr-2;L.wheelY=Math.min(L.partsY+Math.round(ph/2),sy+sh-L.wr-3);aw=sw-L.wr*2-8;
  }
  const gp=3,pw=Math.min(40,Math.floor((aw-gp*3)/4)),tot=pw*4+gp*3,px0=sx+Math.floor((aw-tot)/2);
  PARTS.forEach((p,i)=>{L.part[p]={x:px0+i*(pw+gp),y:L.partsY,w:pw,h:ph};});
  L.busW=Math.min(sw-6,104);L.busH=38;
  L.cx=Math.round(L.portrait?sx+sw/2:sx+(sw-L.wr*2-6)/2);
  L.gw=L.busW+10;L.gx0=L.cx-Math.round(L.gw/2);L.gx1=L.gx0+L.gw;
  L.beamY=L.portrait?Math.max(sy+22,L.floorY-L.busH-26):Math.max(sy,L.floorY-L.busH-26);
  L.headY=Math.max(sy+20,L.beamY-38);L.head=L.portrait&&(L.beamY-L.headY)>=16;
  L.pan={x:L.cx-42,y:L.head?L.headY+3:L.beamY+1,w:84,h:L.head?12:10};
  const rs=Math.max(14,MINHIT);L.ret={x:SA.l+2,y:SA.t+2,w:rs,h:rs};
  L.mini=L.portrait?{x:sx+sw-31,y:sy+1}:{x:Math.min(L.gx1+7,sx+sw-31),y:L.floorY-14};
  L.lamps=[{x:L.gx0+9,y:L.beamY+12},{x:L.gx1-9,y:L.beamY+12}];
  L.cone=L.portrait?{x:L.wheelX-L.wr-13,y:L.wheelY+L.wr-9}:(L.gx0-6-sx>=12?{x:sx+2,y:L.floorY-9}:null);
  L.dx0=L.cx-Math.round(L.busW/2);L.dy=L.floorY+4;L.spX=L.wheelX-Math.round(L.wr*0.5);L.spY=L.wheelY-L.wr-1;
  L.plen=(L.spX-L.dx0)+(L.spY-L.dy);
  const sr=mulberry(77);STARS=[];const top=L.head?L.headY:L.beamY;
  for(let i=0;i<18;i++)STARS.push({x:(sr()*LW)|0,y:(sr()*Math.max(4,top-2))|0,p:sr()*6});
}
function pathPos(s){const a=L.spX-L.dx0;if(s<=a)return{x:L.dx0+s,y:L.dy};return{x:L.spX,y:L.dy+Math.min(s-a,L.spY-L.dy)};}
function carRect(){const j=S.car.jumpT<0.3?-Math.round(Math.sin(S.car.jumpT/0.3*Math.PI)*3):0;
  let sway=0;if(S.phase==='car'&&S.idle>1.5)sway=Math.round(Math.sin(S.time*2.4));
  return{x:Math.round(L.cx-30+S.car.off)+sway,y:L.floorY-28+j,w:60,h:28};}
function busGeom(){
  const W=L.busW,H=L.busH,j=S.bus.jumpT<0.3?-Math.round(Math.sin(S.bus.jumpT/0.3*Math.PI)*3):0;
  const bx=Math.round(L.cx-W/2+S.bus.off),by=L.floorY-H+j,dw=12,ww=Math.floor((W-4-dw-6-9)/4);
  const wins=[];for(let i=0;i<4;i++)wins.push({x:bx+4+i*(ww+3),y:by+4,w:ww,h:13});
  return{bx,by,W,H,dw,ww,wins};
}
function tgtRect(t){if(t.kind==='car')return carRect();const b=busGeom();return b.wins[t.i];}
function partTop(p){const r=L.part[p];return{x:r.x+r.w/2,y:r.y+2};}

/* ===== particles ===== */
function addP(o){if(PT.length>=PMAX)PT.shift();PT.push(o);}
function bubbleStream(src,dst,n){for(let i=0;i<n;i++){const T=0.22+rnd()*0.12,G=60,tx=dst.x+(rnd()-0.5)*dst.w*0.8,ty=dst.y+(rnd()-0.5)*dst.h*0.6;
  addP({k:'b',x:src.x+(rnd()-0.5)*6,y:src.y,vx:(tx-src.x)/T,vy:(ty-src.y)/T-0.5*G*T,gr:G,life:T,max:T,r:rnd()<0.4?2:1,c:PINK});}}
function bubbles(x,y,n){for(let i=0;i<n;i++)addP({k:'b',x,y,vx:(rnd()-0.5)*40,vy:-10-rnd()*30,gr:-10,life:0.5+rnd()*0.4,max:0.9,r:rnd()<0.3?2:1,c:PINK});}
function mudBurst(x,y,n){for(let i=0;i<n;i++)addP({k:'m',x:x+(rnd()-0.5)*6,y,vx:(rnd()-0.5)*50,vy:-20-rnd()*40,gr:160,life:0.6+rnd()*0.4,max:1,c:rnd()<0.5?MUD:DMUD,s:rnd()<0.4?2:1});}
function sparkles(x,y,w,h,n){for(let i=0;i<n;i++)addP({k:'s',x:x+rnd()*w,y:y+rnd()*h,vx:(rnd()-0.5)*20,vy:-10-rnd()*20,gr:0,life:0.6+rnd()*0.5,max:1.1,c:RAIN[(rnd()*7)|0]});}
function drops(x,y,n,vx){for(let i=0;i<n;i++)addP({k:'d',x:x+(rnd()-0.5)*8,y,vx:(vx||0)+(rnd()-0.5)*40,vy:-30-rnd()*30,gr:200,life:0.5+rnd()*0.3,max:0.8,c:AQUA});}
function noteP(x,y,c){addP({k:'n',x,y,vx:(rnd()-0.5)*12,vy:-22,gr:0,life:1.1,max:1.1,c});}

/* ===== effects (part -> target) ===== */
function startBrush(tgt){
  for(const e of E)if(e.type==='brush'&&!e.fin)finishBrush(e);
  E.push({type:'brush',t:0,tgt,applied:[],succ:0,streak:0,polish:0,fin:false,dur:0.64});
}
function brushApplyUpTo(e,bx){
  const r=tgtRect(e.tgt);
  if(e.tgt.kind==='car'){
    S.car.cells.forEach((c,i)=>{if(e.applied[i])return;if(bx===Infinity||r.x+c.x+5<=bx){e.applied[i]=true;brushCell(c,e,r);}});
  }else if(!e.applied[0]&&(bx===Infinity||bx>=r.x+r.w/2)){e.applied[0]=true;brushWin(e.tgt.i,e,r);}
}
function finishBrush(e){if(e.fin)return;brushApplyUpTo(e,Infinity);e.fin=true;
  if(e.succ>0){if(e.tgt.kind==='car'||e.bigWin){SND.chime(now());const r=tgtRect(e.tgt);sparkles(r.x,r.y,r.w,r.h,10);if(e.tgt.kind==='car'){S.car.happyT=0;S.car.jumpT=0;miniCheer();}}}
}
function brushCell(c,e,r){
  const x=r.x+c.x+5,y=r.y+c.y+3;
  if(c.foam>0&&(c.mud>0||c.streak)){
    const hard=c.mud>=3;if(c.streak)S.stat.streakFixed++;
    c.mud=0;c.streak=false;c.foam=Math.max(0,c.foam-1);e.succ++;c.pop=0.3;
    mudBurst(x,y,hard?9:5);bubbles(x,y,2);
    tone(now(),pf(9+e.succ),0.2,'triangle',0.13);
    addPacket(0.25,MUD,x);S.stat.foamBrush++;if(hard)S.stat.hardOff++;
  }else if(c.foam===0&&c.mud>=2){
    if(!c.streak)S.stat.streakMade++;c.streak=true;e.streak++;
    for(let i=0;i<3;i++)addP({k:'m',x:x-4+i*4,y:y+2,vx:(i-1)*30,vy:-5,gr:40,life:0.4,max:0.4,c:MUD,s:1});
    if(e.streak===1)SND.streak(now());
  }else if(c.foam===0&&c.mud===1){
    c.mud=0;mudBurst(x,y,3);SND.pluck(now(),pf(3+e.polish),0.12);e.polish++;
  }else if(c.foam>0){
    c.foam=Math.max(0,c.foam-1);bubbles(x,y,2);if(e.polish++===0)SND.bubble(now(),pf(10),0.1);
  }else{c.shine=1;if(e.polish++===0)SND.squeak(now());}
}
function brushWin(i,e,r){
  const w=S.bus.wins[i],x=r.x+r.w/2,y=r.y+r.h/2;
  if(w.foam>0&&(w.mud>0||w.streak)){w.mud=0;w.streak=false;e.succ++;mudBurst(x,y,6);tone(now(),pf(10),0.2,'triangle',0.12);addPacket(0.3,MUD,x);}
  else if(w.foam===0&&w.mud>0){if(!w.streak)S.stat.streakMade++;w.streak=true;e.streak++;SND.streak(now());}
  else if(w.foam>0){w.foam=Math.max(0,w.foam-1);bubbles(x,y,3);SND.bubble(now(),pf(10),0.1);}
  else{SND.squeak(now());w.waveT=0;}
  checkWin(i);
}

function addPacket(vol,col,x){const a=L.spX-L.dx0;S.packets.push({s:clamp(x-L.dx0,0,a),vol,col});if(S.packets.length>24)S.packets.shift();}
function wheelLevel(){const f=S.wheel.flow;return f<0.4?0:f<1.4?1:f<2.6?2:f<3.8?3:4;}

function carClean(){return S.car.cells.every(c=>c.mud===0&&!c.streak&&c.foam===0);}
function cleanRatio(){const cs=S.car.cells;let n=0;cs.forEach(c=>{if(c.mud===0&&!c.streak)n++;});return n/cs.length;}

/* ===== actions ===== */
function doFoam(tgt,t){
  const r=tgtRect(tgt),src=partTop('foam');
  bubbleStream(src,r,9);
  E.push({type:'foamfx',t:0,dur:0.3,tgt});
  if(tgt.kind==='car'){
    let mx=0;S.car.cells.forEach(c=>{c.foam=Math.min(3,c.foam+1);c.pop=0.25;mx=Math.max(mx,c.foam);});
    SND.bubble(t,pf(6+mx));SND.bubble(t+0.08,pf(8+mx),0.14);
  }else{const w=S.bus.wins[tgt.i];w.foam=Math.min(3,w.foam+1);w.pop=0.25;SND.bubble(t,pf(6+w.foam));SND.bubble(t+0.08,pf(8+w.foam),0.14);checkWin(tgt.i);}
}
function doWater(tgt,t){
  const r=tgtRect(tgt);
  E.push({type:'jet',t:0,dur:0.38,tgt});
  let vol=0.9,col=AQUA;
  if(tgt.kind==='car'){
    let mf=0,mud=false;S.car.cells.forEach(c=>{mf=Math.max(mf,c.foam);if(c.mud>0||c.streak)mud=true;});
    S.car.cells.forEach(c=>{if(c.foam>0){c.foam--;c.pop=0.2;}});
    if(mf>0){bubbles(r.x+r.w/2,r.y+r.h-4,4);S.stat.waterOnFoam++;}
    vol=0.9+0.55*Math.min(mf,2);col=mf>0?PINK:(mud?MUD:AQUA);
    const nd=makeDrops(4,4,56,6,22);S.car.drops=S.car.drops.concat(nd).slice(-12);
  }else{
    const w=S.bus.wins[tgt.i];
    if(w.foam>0){vol=0.9+0.55*Math.min(w.foam,2);col=PINK;w.foam=0;w.mud=0;w.streak=false;S.stat.waterOnFoam++;bubbles(r.x+r.w/2,r.y+r.h,4);}
    else if(w.mud>0){col=MUD;for(let i=0;i<4;i++)addP({k:'m',x:r.x+2+rnd()*(r.w-4),y:r.y+r.h,vx:0,vy:10,gr:60,life:0.5,max:0.5,c:MUD,s:1});}
    const b=busGeom();S.bus.drops=S.bus.drops.concat(makeDrops(3,r.x-b.bx,r.x-b.bx+r.w,r.y-b.by,r.y-b.by+r.h+8)).slice(-14);
    checkWin(tgt.i);
  }
  drops(r.x+r.w/2,r.y+r.h/2,5);
  addPacket(vol,col,r.x+r.w/2);
  SND.splash(t);SND.marimba(t,pf(0+wheelLevel()+(col===PINK?2:0)));
}
function doWind(tgt,t){
  const r=tgtRect(tgt);
  E.push({type:'wind',t:0,dur:0.5,tgt});
  SND.whoosh(t);
  let list,ox,oy;
  if(tgt.kind==='car'){list=S.car.drops;ox=r.x;oy=r.y;S.car.drops=[];S.car.tiltT=0;
    if(S.car.cells.some(c=>c.foam>0))for(let i=0;i<3;i++)addP({k:'b',x:r.x+rnd()*r.w,y:r.y+rnd()*r.h,vx:60+rnd()*40,vy:-10,gr:0,life:0.6,max:0.6,r:1,c:PINK});
  }else{const b=busGeom();list=S.bus.drops;ox=b.bx;oy=b.by;S.bus.drops=[];}
  if(list.length===0){S.stat.windDry++;return;}
  list.forEach((d,i)=>{addP({k:'d',x:ox+d.x,y:oy+d.y,vx:70+rnd()*50,vy:-20-rnd()*20,gr:40,life:0.7,max:0.7,c:AQUA});
    SND.whistle(t+0.05+i*0.065,pf(9+(i%7)));S.stat.whistles++;
    const T=gameTime+0.05+i*0.065;VQ.push({t:T,fn:()=>noteP(ox+d.x,oy+d.y-4,WHITE)});});
}
function checkWin(i){
  const w=S.bus.wins[i];
  if(w.mud===0&&!w.streak&&w.foam===0){
    const b=busGeom(),r=b.wins[i];
    if(!w.washed){
      w.washed=true;w.waveT=0;S.bus.order.push(i);S.stat.windows++;
      const t=now();SND.chime(t);SND.horn(t+0.32);S.bus.hornT=0;S.stat.horns++;
      SND.hey(t+0.55,pf(WNOTE[i][0]),pf(WNOTE[i][1]));
      sparkles(r.x,r.y,r.w,r.h,10);
      if(rnd()<0.35){SND.horn(t+0.9);SND.horn(t+1.1);VQ.push({t:gameTime+0.9,fn:()=>{S.bus.hornT=0;}});}
      setTrack(buildTrack(S.song,S.bus.order),'loop');
    }else if(w.waveT>1){w.waveT=0;SND.hey(now(),pf(WNOTE[i][0]),pf(WNOTE[i][1]),0.08);}
  }
}
function recordSeq(p){
  if(S.songFormed)return;
  const last=S.seq[S.seq.length-1];
  if(last&&last.p===p&&gameTime-S.lastTapT<1.5&&last.n<4)last.n++;
  else{S.seq.push({p,n:1});if(S.seq.length>8)S.seq.shift();}
  S.lastTapT=gameTime;S.used.add(p);
}
function formSong(){
  S.songFormed=true;S.song=S.seq.map(e=>({p:e.p,n:e.n}));S.stageTarget=1;S.performDone=false;S.stat.songs++;
  S.stat.songLog.push(S.song.map(e=>e.p[0]+e.n).join(''));
  SND.fanfare(now());
  const r=carRect();sparkles(r.x-10,r.y-20,r.w+20,r.h+20,16);
  setTrack(buildTrack(S.song,[]),'perform');
}
function act(p){
  const st=S.parts[p];st.hitT=0;
  if(S.stat.firstTap===null)S.stat.firstTap={part:p,t:performance.now()};
  const ph=S.phase,t=now();
  const wash=ph==='car'||ph==='carIn'||ph==='bus';
  if(!wash){playPartNote(t,p,pf(BASE[p]+((rnd()*3)|0)),0.9);const s=partTop(p);noteP(s.x-3,s.y-6,PCOL[p]);return;}
  S.touched=true;
  const tgt=ph==='bus'?{kind:'win',i:S.bus.target}:{kind:'car'};
  if(ph!=='bus')recordSeq(p);
  if(p==='foam')doFoam(tgt,t);else if(p==='water')doWater(tgt,t);else if(p==='wind')doWind(tgt,t);
  else{SND.shaka(t);startBrush(tgt);}
  if(ph!=='bus'&&!S.songFormed&&S.used.size===4)formSong();
}
function doReturn(){
  const t=now();SND.rewind(t);S.stat.returns++;
  for(const e of E)e.fin=true;E.length=0;
  if(S.phase==='car'||S.phase==='carIn'){
    const r=carRect();
    S.car.cells=clone(S.car.init);S.car.drops=clone(S.car.initDrops);S.seq=[];S.used=new Set();S.songFormed=false;S.song=null;S.performDone=false;S.stageTarget=0;
    for(let i=0;i<10;i++)addP({k:'m',x:r.x+rnd()*r.w,y:r.y-14-rnd()*10,vx:0,vy:40,gr:80,life:0.35,max:0.35,c:MUD,s:2});
    setTrack(S.mem?buildTrack(S.mem.song,S.mem.order):null,S.mem?'ghost':'none');
  }else if(S.phase==='bus'){
    S.bus.wins=clone(S.bus.init);S.bus.order=[];S.bus.drops=[];S.bus.target=0;
    setTrack(buildTrack(S.song,[]),'loop');
  }
  S.touched=false;S.car.jumpT=0;S.bus.jumpT=0;
}

/* ===== music sequencer (drums from water wheel + recorded song) ===== */
const M={nextT:0.1,step:0,track:null,pos:0,mode:'none',pend:null,loops:0};
function buildTrack(song,order){
  if(!song)return null;
  const ev=[];song.forEach((e,i)=>{ev.push({k:'part',p:e.p,n:e.n,i});ev.push(null);});
  (order||[]).forEach((w,j)=>{ev.push({k:'pass',w,j});ev.push(null);});
  while(ev.length%4)ev.push(null);
  return ev;
}
function setTrack(track,mode){M.pend={track,mode};}
function musicUpdate(){
  if(M.nextT<gameTime-0.3)M.nextT=gameTime+0.02;
  let guard=0;
  while(M.nextT<gameTime+0.1&&guard++<8){doStep(M.step,M.nextT);M.step++;M.nextT+=STEP;}
}
function doStep(step,T){
  const b=step%8;
  if(b%4===0&&M.pend){M.track=M.pend.track;M.mode=M.pend.mode;M.pos=0;M.loops=0;M.pend=null;}
  VQ.push({t:T,fn:()=>{S.vstep=step;}});
  const lv=wheelLevel();let f=0,v=0;
  if(lv>=1&&b===0){f=98;v=0.55;}
  else if(lv>=2&&b===4){f=98;v=0.5;}
  else if(lv>=3&&(b===2||b===6)){f=147;v=0.38;}
  else if(lv>=4&&b%2===1){f=196;v=0.26;}
  if(v>0){SND.drum(at(T),f,v);S.stat.drumHits++;VQ.push({t:T,fn:()=>{S.wheel.thump=1;drops(L.wheelX,L.wheelY+L.wr-2,2,-10);}});}
  if(lv>=4&&b===7){SND.drum(at(T+STEP/2),220,0.18);}
  if(!M.track)return;
  const e=M.track[M.pos];
  const vol=M.mode==='perform'||M.mode==='parade'?1:M.mode==='loop'?0.5:0.38;
  if(e){
    if(e.k==='part'){
      for(let j=0;j<e.n;j++)playPartNote(at(T+j*STEP/2),e.p,pf(BASE[e.p]+j),vol);
      const mode=M.mode,i=e.i,p=e.p;
      VQ.push({t:T,fn:()=>{
        if(mode==='ghost'){S.slotFlash[i]=0.6;}else{S.slotFlash[i]=1;S.spk=1;S.parts[p].beat=1;}
        if(mode!=='ghost'){const pa=L.head?{x:L.cx,y:L.headY+18}:{x:L.cx,y:L.beamY+6};noteP(pa.x+(rnd()-0.5)*40,pa.y,PCOL[p]===WHITE?YEL:PCOL[p]);
          if(S.phase==='car')S.car.jumpT=0;}
      }});
    }else if(e.k==='pass'){
      const w=e.w,mode=M.mode;SND.hey(at(T),pf(WNOTE[w][0]),pf(WNOTE[w][1]),0.12*vol+0.03);
      VQ.push({t:T,fn:()=>{if(mode==='ghost')S.mini.wave[w]=0;else{S.bus.wins[w].waveT=0;}}});
    }
  }
  M.pos++;
  if(M.pos>=M.track.length){M.pos=0;M.loops++;
    if(M.mode==='perform'){M.mode='loop';VQ.push({t:T+STEP,fn:()=>{S.performDone=true;}});}
  }
}

/* ===== hint / guidance ===== */
function computeHint(){
  const ph=S.phase;
  if(ph==='car'){
    const cs=S.car.cells;
    const anyFoam=cs.some(c=>c.foam>0),foamOnMud=cs.some(c=>c.foam>0&&(c.mud>0||c.streak)),mudNoFoam=cs.some(c=>c.foam===0&&(c.mud>0||c.streak));
    if(!S.songFormed){
      if(!S.used.has('foam')&&!anyFoam)return{kind:'part',p:'foam'};
      if(foamOnMud&&!S.used.has('brush'))return{kind:'part',p:'brush'};
      if(!S.used.has('brush'))return{kind:'part',p:'brush'};
      if(!S.used.has('water'))return{kind:'part',p:'water'};
      if(!S.used.has('wind'))return{kind:'part',p:'wind'};
    }
    if(foamOnMud)return{kind:'part',p:'brush'};
    if(mudNoFoam)return{kind:'part',p:'foam'};
    if(anyFoam)return{kind:'part',p:'water'};
    return null;
  }
  if(ph==='bus'){
    const w=S.bus.wins[S.bus.target];
    if(w.mud===0&&!w.streak&&w.foam===0){
      for(let k=1;k<=4;k++){const j=(S.bus.target+k)%4;if(!S.bus.wins[j].washed||S.bus.wins[j].foam>0)return{kind:'win',i:j};}
      return null;
    }
    if(w.foam>0)return{kind:'part',p:'water'};
    return{kind:'part',p:'foam'};
  }
  return null;
}
function hintCenter(h){
  if(!h)return null;
  if(h.kind==='part'){const r=L.part[h.p];return{x:r.x+r.w/2,y:r.y+r.h/2};}
  const r=busGeom().wins[h.i];return{x:r.x+r.w/2,y:r.y+r.h/2};
}

/* ===== input ===== */
function inR(x,y,r,pad){const pw=Math.max(0,(MINHIT-r.w)/2),ph=Math.max(0,(MINHIT-r.h)/2);pad=pad||0;return x>=r.x-pw-pad&&x<r.x+r.w+pw+pad&&y>=r.y-ph-pad&&y<r.y+r.h+ph+pad;}
function retVisible(){return (S.phase==='car'&&(S.touched||S.songFormed))||(S.phase==='bus'&&S.touched);}
function hitTest(x,y){
  if(retVisible()&&inR(x,y,L.ret))return{kind:'ret'};
  for(const p of PARTS)if(inR(x,y,L.part[p],1))return{kind:'part',p};
  const ph=S.phase;
  if(ph==='bus'||ph==='busIn'||ph==='busLeave'||ph==='parade'){
    const b=busGeom();
    if(x>=b.bx-1&&x<b.bx+b.W+1&&y>=b.by-2&&y<b.by+b.H+1){
      if(ph==='bus'){
        if(x>=b.wins[3].x+b.ww+2)return{kind:'driver'};
        let best=0,bd=1e9;b.wins.forEach((w,i)=>{const d=Math.abs(x-(w.x+w.w/2));if(d<bd){bd=d;best=i;}});
        return{kind:'win',i:best};
      }
      return{kind:'busbody'};
    }
  }
  if(ph==='car'||ph==='carIn'||ph==='carLeave'||ph==='parade'){
    const r=carRect();if(x>=r.x-2&&x<r.x+r.w+2&&y>=r.y-2&&y<r.y+r.h+1)return{kind:'car'};
  }
  for(let i=0;i<2;i++){const l=L.lamps[i];if(inR(x,y,{x:l.x-3,y:l.y,w:7,h:9}))return{kind:'lamp',i};}
  if(L.cone&&inR(x,y,{x:L.cone.x,y:L.cone.y,w:8,h:9}))return{kind:'cone'};
  if(Math.hypot(x-L.wheelX,y-L.wheelY)<=L.wr+2)return{kind:'wheel'};
  return null;
}
const lastAct={};
function onTap(h){
  S.demo=null;
  if(!h)return;
  const t=now();
  if(h.kind==='part'){
    const tt=performance.now();if(lastAct[h.p]&&tt-lastAct[h.p]<80){S.parts[h.p].hitT=0;return;}
    lastAct[h.p]=tt;S.idle=0;S.demoArmed=true;act(h.p);return;
  }
  if(h.kind==='ret'){S.idle=0;S.demoArmed=true;doReturn();return;}
  if(h.kind==='win'){
    S.idle=0;S.demoArmed=true;S.touched=true;
    if(S.bus.target!==h.i){S.bus.target=h.i;SND.pip(t,pf(5+h.i*2));}else SND.pip(t,pf(5+h.i*2));
    const w=S.bus.wins[h.i];if(w.washed&&w.mud===0&&w.foam===0&&!w.streak){w.waveT=0;SND.hey(t+0.05,pf(WNOTE[h.i][0]),pf(WNOTE[h.i][1]),0.08);}
    return;
  }
  if(h.kind==='driver'||h.kind==='busbody'){SND.horn(t);SND.horn(t+0.2);S.bus.hornT=0;S.bus.jumpT=0;return;}
  if(h.kind==='car'){if(S.phase==='parade')SND.horn(t);else SND.giggle(t);S.car.jumpT=0;return;}
  if(h.kind==='lamp'){S.deco['lamp'+h.i]=0;SND.tick(t);return;}
  if(h.kind==='cone'){S.deco.cone=0;SND.tick(t);return;}
  if(h.kind==='wheel'){S.wheel.thump=0.5;SND.tick(t);return;}
}
const PTRS=new Map();

function updatePhase(dt){

    case 'carIn':S.car.off=-(LW*0.75+40)*(1-ease(pt/1.4));if(pt>=1.4){S.car.off=0;setPhase('car');S.car.jumpT=0;}break;

      break;
    case 'carLeave':

      if(pt>1.5){const k=pt-1.5;S.car.off=k*k*90+k*25;if(rnd()<0.3){const r=carRect();addP({k:'f',x:r.x-2,y:r.y+22,vx:-20,vy:-6,gr:0,life:0.5,max:0.5,c:WHITE});}}
      if(L.cx-30+S.car.off>LW+4){S.bus.off=-(LW+L.busW);setPhase('busIn');setTrack(buildTrack(S.song,[]),'loop');}
      break;
    case 'busIn':S.bus.off=-(LW*0.6+L.busW)*(1-ease(pt/1.6));if(pt>=1.6){S.bus.off=0;setPhase('bus');S.bus.jumpT=0;SND.horn(now());S.bus.hornT=0;}break;
    case 'bus':S.bus.off=0;
      if(S.bus.wins.every(w=>w.washed&&w.mud===0&&w.foam===0&&!w.streak)&&E.length===0){setPhase('busLeave');SND.fanfare(now());S.bus.rain=0.001;}
      break;
    case 'busLeave':

      if(pt>1.6){const k=pt-1.6;S.bus.off=k*k*80+k*20;}
      if(L.cx-L.busW/2+S.bus.off>LW+4){
        const tr=buildTrack(S.song,S.bus.order);setTrack(tr,'parade');

  }
}

/* ===== update ===== */
function update(dt){
  S.time+=dt;gameTime+=dt;S.pt+=dt;
  if(VQ.length){const keep=[];for(const v of VQ){if(v.t<=gameTime)v.fn();else keep.push(v);}VQ=keep;if(VQ.length>200)VQ=VQ.slice(-200);}
  musicUpdate();
  updatePhase(dt);
  // effects
  for(let i=E.length-1;i>=0;i--){const e=E[i];e.t+=dt;
    if(e.type==='brush'){
      if(!e.fin){if(e.t>=0.08){const r=tgtRect(e.tgt),k=clamp((e.t-0.08)/0.4,0,1);brushApplyUpTo(e,r.x-3+(r.w+6)*k);}if(e.t>=0.48)finishBrush(e);}
    }
    if(e.t>=e.dur){if(e.type==='brush')finishBrush(e);E.splice(i,1);}
  }
  // water packets
  for(let i=S.packets.length-1;i>=0;i--){const p=S.packets[i];p.s+=58*dt;if(p.s>=L.plen){S.wheel.flow=Math.min(5,S.wheel.flow+p.vol);S.packets.splice(i,1);drops(L.spX,L.spY+2,3,-20);}}
  const w=S.wheel;w.flow=Math.max(0,w.flow-dt*0.15);S.stat.maxWheel=Math.max(S.stat.maxWheel,wheelLevel());
  const tgtSpd=w.flow>0.05?0.6+w.flow*1.5:0;w.spd+=(tgtSpd-w.spd)*Math.min(1,dt*2);w.ang+=w.spd*dt;w.thump=Math.max(0,w.thump-dt*4);
  // misc timers
  PARTS.forEach(p=>{const s=S.parts[p];s.hitT+=dt;s.beat=Math.max(0,s.beat-dt*5);});
  S.car.jumpT+=dt;S.car.tiltT+=dt;S.car.happyT+=dt;S.bus.jumpT+=dt;S.bus.hornT+=dt;
  S.car.cells.forEach(c=>{c.pop=Math.max(0,c.pop-dt);c.shine=Math.max(0,c.shine-dt);});
  S.bus.wins.forEach(x=>{x.waveT+=dt;x.pop=Math.max(0,x.pop-dt);});
  for(let i=0;i<4;i++)S.mini.wave[i]+=dt;
  for(let i=0;i<8;i++)S.slotFlash[i]=Math.max(0,S.slotFlash[i]-dt*3);
  S.spk=Math.max(0,S.spk-dt*4);
  S.deco.lamp0+=dt;S.deco.lamp1+=dt;S.deco.cone+=dt;
  S.stage+=(S.stageTarget-S.stage)*Math.min(1,dt*3);
  S.car.blink-=dt;if(S.car.blink<0){S.car.blinkT=0.12;S.car.blink=2.5+rnd()*3;}S.car.blinkT=Math.max(0,S.car.blinkT-dt);
  // guidance
  S.hint=computeHint();
  if((S.phase==='car'||S.phase==='bus')&&S.hint){
    S.idle+=dt;
    if(S.idle>4&&S.demoArmed&&!S.demo){S.demo={t:0,h:S.hint};S.demoArmed=false;}
  }else S.idle=0;
  if(S.demo){S.demo.t+=dt;if(S.demo.t>2.1)S.demo=null;}
  // particles
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.life-=dt;if(p.life<=0){PT.splice(i,1);continue;}p.vy+=(p.gr||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  // cleanliness sparkles
  if(S.phase==='car'&&cleanRatio()>0.7&&rnd()<dt*2){const r=carRect();addP({k:'s',x:r.x+10+rnd()*40,y:r.y+rnd()*8,vx:0,vy:-6,gr:0,life:0.5,max:0.5,c:YEL});}
}
