<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(() => {
'use strict';
/* ============================================================
   ずるるっ！テレビうらのコードとおめざめハウス
   style_id: blueprint / subject: no_animal_princess
   濃青の方眼、白・薄水色の製図線のみ。文字UIなし。
   ============================================================ */
const COL = { bg: '#0c2c63', bg2: '#08214d', w: '#f3fbff', p: '#a9dcff' };
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const saEl = document.getElementById('sa');
let W = 0, H = 0, DPR = 1, U = 1, LW = 1.5, land = true;
let SA = { t: 0, r: 0, b: 0, l: 0 };
const gridCv = document.createElement('canvas');
const snapCv = document.createElement('canvas');

const qs = new URLSearchParams(location.search);
let seed = qs.has('seed') ? (parseInt(qs.get('seed'), 10) | 0) : ((Date.now() ^ (Math.random() * 1e9)) | 0);
const forceRare = qs.get('rare') === '1';
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(seed);

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const nrm = (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; };

/* ---------------- sound (Web Audio 合成) ---------------- */
let AC = null, master = null, noiseBuf = null, hum = null;
function audioInit() {
  try {
    if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    AC = new A();
    master = AC.createGain(); master.gain.value = 0.55;
    const comp = AC.createDynamicsCompressor();
    master.connect(comp); comp.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (AC.state === 'suspended') AC.resume().catch(() => {});
  } catch (e) { AC = null; }
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function noise(dur, vol, ft, freq, q, delay = 0) {
  if (!AC || !noiseBuf) return;
  try {
    const t = AC.currentTime + delay;
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = ft; f.frequency.value = freq; f.Q.value = q;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.02, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  } catch (e) {}
}
const sfx = {
  squish() { tone('sine', 330, 170, 0.09, 0.22); },
  loosen(n) { tone('triangle', 420 + n * 70, 600 + n * 70, 0.12, 0.17); },
  stretch(p) { tone('triangle', 240 + p * 560, 280 + p * 600, 0.06, 0.07); },
  unwind(i) { const f = 440 * Math.pow(1.26, i); tone('sine', f, f * 1.5, 0.18, 0.24); tone('sine', f * 2, f * 2.6, 0.1, 0.07, 0.05); },
  zururu() { for (let k = 0; k < 6; k++) tone('triangle', 180 + k * 45, 240 + k * 45, 0.07, 0.07, k * 0.045); },
  clink() { tone('square', 2400, 2300, 0.035, 0.1); tone('square', 3300, 3150, 0.03, 0.08, 0.045); noise(0.025, 0.18, 'highpass', 3000, 1); },
  chime() { [523, 659, 784, 1047].forEach((f, i) => { tone('sine', f, f, 0.4, 0.14, 0.08 + i * 0.07); tone('triangle', f * 2, f * 2, 0.2, 0.03, 0.08 + i * 0.07); }); },
  chika() { tone('sine', 1800, 2500, 0.05, 0.15); tone('sine', 2300, 2700, 0.05, 0.12, 0.08); },
  buun() { tone('sawtooth', 70, 120, 0.9, 0.06); tone('sine', 110, 140, 0.9, 0.12); },
  gust() { noise(0.8, 0.12, 'lowpass', 700, 0.7); tone('sine', 120, 160, 0.6, 0.08); },
  pop() { tone('sine', 700, 230, 0.13, 0.3); noise(0.05, 0.14, 'bandpass', 1300, 2); },
  shuu() { noise(1.0, 0.12, 'bandpass', 2400, 0.8); },
  slurp() { tone('sine', 900, 1500, 0.07, 0.05); },
  tick() { tone('triangle', 900, 720, 0.04, 0.07); },
  fold() { noise(0.035, 0.14, 'bandpass', 800 + Math.random() * 700, 3); tone('square', 260 + Math.random() * 120, 200, 0.03, 0.03); },
  clap() { for (let i = 0; i < 18; i++) noise(0.05, 0.22, 'bandpass', 1400 + Math.random() * 900, 1.2, i * 0.065 + Math.random() * 0.03); },
  reveal() { tone('triangle', 660, 990, 0.18, 0.13); tone('triangle', 880, 1320, 0.2, 0.1, 0.12); },
  tvOn() { tone('sine', 300, 1300, 0.45, 0.1); },
  fanfare() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => { tone('sine', f, f, 0.45, 0.13, i * 0.11); tone('triangle', f / 2, f / 2, 0.3, 0.05, i * 0.11); }); },
};
function startHum() {
  if (!AC || hum) return;
  try {
    const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'sawtooth'; o.frequency.value = 74; f.type = 'lowpass'; f.frequency.value = 240;
    g.gain.setValueAtTime(0.0001, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.025, AC.currentTime + 0.8);
    o.connect(f); f.connect(g); g.connect(master); o.start();
    hum = { o, g };
  } catch (e) { hum = null; }
}
function stopHum() {
  if (!hum || !AC) { hum = null; return; }
  try { hum.g.gain.setTargetAtTime(0.0001, AC.currentTime, 0.1); hum.o.stop(AC.currentTime + 0.6); } catch (e) {}
  hum = null;
}

/* ---------------- layout tables ---------------- */
const LT = {
  floor: .62, fan: .085, fanS: 1, shelf: [.165, .405, -125], toaster: .225, plate: .35, plateRW: 42,
  stand: [.585, 300, 95], tv: [230, 150], lamp: .865, lampS: 1, vac: [.935, 32],
  sock: { blue: [.77, -58], red: [.15, -58], yellow: [.29, -58], vac: [.975, -58] }, fsock: [.45, .66, 34],
  blue: { K: [.50, .75], H: [.505, .835] }, yellow: { K: [.468, .765], H: [.37, .86] }, redOff: 100, redK: 28,
  tvSpots: [{ K: [.66, .80], H: [.73, .87] }, { K: [.29, .80], H: [.22, .88] }, { K: [.62, .89], H: [.70, .93] }],
};
const PT = {
  floor: .58, fan: .13, fanS: .8, shelf: [.03, .47, -225], toaster: .13, plate: .37, plateRW: 34,
  stand: [.57, 170, 80], tv: [120, 100], lamp: .925, lampS: 1, vac: [.80, 34],
  sock: { blue: [.965, -150], red: [.30, -48], yellow: [.40, -150], vac: [.045, -48] }, fsock: [.38, .54, 36],
  blue: { K: [.50, .70], H: [.50, .785] }, yellow: { K: [.44, .71], H: [.25, .80] }, redOff: 58, redK: 18,
  tvSpots: [{ K: [.80, .69], H: [.70, .76] }, { K: [.06, .72], H: [.16, .66] }, { K: [.30, .95], H: [.36, .88] }],
};
const STY = {
  blue: { w: 6, k: 'solid', shape: 'circle', r: 25 },
  red: { w: 7, k: 'tube', shape: 'oval', r: 26 },
  yellow: { w: 5, k: 'dash', shape: 'tear', r: 25 },
  vac: { w: 4.5, k: 'dot', shape: 'square', r: 22 },
  tv: { w: 8, k: 'core', shape: 'double', r: 26 },
};
const IDS = ['blue', 'yellow', 'red', 'vac', 'tv'];
const APP_OF = { blue: 'lamp', red: 'fan', yellow: 'toaster', vac: 'vac', tv: 'tv' };
const WRAP = 40, PLUGLEN = 46;

/* ---------------- state ---------------- */
let mode = 'flat', T = 0, round = 0, R = null, G = null;
let cords = {}, AP = {};
let parts = []; const MAXP = 140;
let streaks = []; const MAXS = 26;
let crumbs = []; const MAXC = 36;
let toasts = [], fly = [];
let gust = 0, flapT = 0, sock = null;
let order = [];
let ptr = null;
let lastInput = 0, hintDone = false, hint = null;
let foldT = 0, HS = null, finaleAt = -1;
let wobbles = {};
let rareDone = false;

function X(f) { return SA.l + f * (W - SA.l - SA.r); }
function Y(f) { return SA.t + f * (H - SA.t - SA.b); }

function newConfig() {
  const wraps = { blue: 2, yellow: rnd() < .5 ? 2 : 3, red: rnd() < .4 ? 3 : 2, vac: 2, tv: rnd() < .5 ? 2 : 3 };
  let rare = null;
  if (forceRare && round === 0) rare = 'blue';
  else if (round > 0 && rnd() < 0.18) rare = ['blue', 'yellow', 'red', 'vac'][(rnd() * 4) | 0];
  if (rare) wraps[rare] = 4;
  return { blueTop: rnd() < .5, redSide: rnd() < .5 ? -1 : 1, sockF: rnd(), tvSpot: (rnd() * 3) | 0, wraps, rare };
}

function newRound() {
  R = newConfig();
  cords = {};
  for (const id of IDS) {
    cords[id] = {
      id, wraps: R.wraps[id], progress: 0, loose: 0, state: 'tangled', plugT: 0, flowT: 0, powered: false,
      h: { x: 0, y: 0 }, hv: { x: 0, y: 0 }, grab: false, sq: 0, sqv: 0, pop: 0, shift: 0, aside: 0,
      reveal: (id === 'blue' || id === 'yellow') ? 1 : 0, retrigAcc: 0, cd: 0, rushing: false, long: R.rare === id,
      lastQ: 0, act: false, g: null,
    };
  }
  AP = {
    lamp: { on: false, act: 1, light: 0, ang: 0.4, flash: 0, wob: 0 },
    fan: { on: false, act: 1, spin: 0, ang: 0, twitch: 0, tilt: 0, wob: 0 },
    toaster: { on: false, act: 1, lever: 0, jump: 0, timer: -1, wob: 0 },
    vac: { on: false, act: 1, xf: 0, mode: 'idle', nz: 0, wob: 0, suck: 0 },
    tv: { on: false, act: 1, t: 0, wob: 0 },
  };
  parts = []; streaks = []; crumbs = []; toasts = []; fly = [];
  gust = 0; flapT = 0; order = []; finaleAt = -1; rareDone = false;
  sock = { revealed: false, lift: 0, pulse: 0 };
  hint = null; hintDone = false; lastInput = T;
  buildGeo(true);
}

function buildGeo(resetHandles) {
  const t = land ? LT : PT, u = U, g = {};
  const fy = g.floorY = Y(t.floor);
  g.fan = { x: X(t.fan), y: fy, s: u * t.fanS };
  g.shelf = { x1: X(t.shelf[0]), x2: X(t.shelf[1]), y: fy + t.shelf[2] * u };
  g.toaster = { x: X(t.toaster), y: g.shelf.y, s: u };
  g.plate = { x: X(t.plate), y: g.shelf.y - 3 * u, rw: t.plateRW * u };
  g.stand = { x: X(t.stand[0]), w: t.stand[1] * u, h: t.stand[2] * u }; g.stand.top = fy - g.stand.h;
  g.tv = { x: g.stand.x, y: g.stand.top, w: t.tv[0] * u, h: t.tv[1] * u };
  g.lamp = { x: X(t.lamp), y: fy, s: u * t.lampS };
  g.vacPark = { x: X(t.vac[0]), y: fy + t.vac[1] * u }; g.vacS = u * 0.9;
  g.under = { x1: g.stand.x - g.stand.w / 2 + 13 * u, x2: g.stand.x + g.stand.w / 2 - 13 * u, y1: g.stand.top + 20 * u, y2: fy - 3 * u };
  g.sockets = {};
  for (const k in t.sock) g.sockets[k] = { x: X(t.sock[k][0]), y: fy + t.sock[k][1] * u };
  g.fs = { x: X(t.fsock[0] + (t.fsock[1] - t.fsock[0]) * R.sockF), y: fy + t.fsock[2] * u };
  const a = (land ? 240 : 215) * u + SA.r + SA.b;
  g.flap = { a, C: { x: W, y: H }, B1: { x: W - a, y: H }, B2: { x: W, y: H - a }, Cp: { x: W - a, y: H - a } };
  const P = f => ({ x: X(f[0]), y: Y(f[1]) });
  const cg = {};
  cg.blue = { K: P(t.blue.K), H: P(t.blue.H) };
  cg.yellow = { K: P(t.yellow.K), H: P(t.yellow.H) };
  cg.red = { K: { x: g.stand.x - R.redSide * t.redK * u, y: fy - 36 * u }, H: { x: g.stand.x + R.redSide * t.redOff * u, y: fy - 30 * u } };
  cg.vac = { K: { x: W - SA.r - 58 * u, y: H - SA.b - 38 * u }, H: { x: W - SA.r - 98 * u, y: H - SA.b - 72 * u } };
  const sp = t.tvSpots[R.tvSpot];
  cg.tv = { K: P(sp.K), H: P(sp.H) };
  for (const id of IDS) {
    const c = cg[id];
    c.dir = nrm(c.H.x - c.K.x, c.H.y - c.K.y);
    c.perp = { x: -c.dir.y, y: c.dir.x };
    c.P0 = { x: c.K.x + c.perp.x * 26 * u, y: c.K.y + c.perp.y * 26 * u };
    c.S = id === 'tv' ? g.fs : g.sockets[id];
    c.r = STY[id].r * u * (R.rare === id ? 1.3 : 1);
  }
  g.c = cg;
  G = g;
  if (AP.vac && AP.vac.xf === 0) AP.vac.xf = (g.vacPark.x - SA.l) / Math.max(1, W - SA.l - SA.r);
  for (const id of IDS) {
    const c = cords[id]; if (!c) continue; c.g = cg[id];
    if (resetHandles || !c.grab) { const r = restPos(c); c.h.x = r.x; c.h.y = r.y; c.hv.x = c.hv.y = 0; }
  }
}

function vacX() { return X(AP.vac.xf); }
function anchor(id) {
  const g = G, u = U;
  switch (id) {
    case 'blue': return { x: g.lamp.x - 18 * g.lamp.s, y: g.floorY - 4 * u };
    case 'red': return { x: g.fan.x + 26 * g.fan.s, y: g.floorY - 4 * u };
    case 'yellow': return { x: g.toaster.x + 36 * u, y: g.shelf.y - 14 * u };
    case 'vac': return { x: vacX() + 28 * G.vacS, y: g.vacPark.y - 22 * G.vacS };
    case 'tv': return { x: g.tv.x + g.tv.w * 0.32, y: g.stand.top - 8 * u };
  }
}
function pairInfo(c) {
  if (c.id !== 'blue' && c.id !== 'yellow') return null;
  const top = R.blueTop ? 'blue' : 'yellow';
  return { partner: cords[c.id === 'blue' ? 'yellow' : 'blue'], isTop: c.id === top };
}
function restPos(c) {
  const g = c.g; let x = g.H.x, y = g.H.y;
  const pi = pairInfo(c);
  if (pi && c.state !== 'conn') {
    if (!pi.isTop) { x += (g.dir.x * 16 * U) * c.shift; y += (g.dir.y * 16 * U + 16 * U) * c.shift; }
    else { x += g.perp.x * 16 * U * c.aside; y += g.perp.y * 16 * U * c.aside; }
  }
  return { x, y };
}
function knotPos(c) {
  const g = c.g; let x = g.K.x, y = g.K.y;
  const pi = pairInfo(c);
  if (pi && !pi.isTop) { y += 8 * U * c.shift; }
  // tension pulls knot slightly toward the handle
  if (c.grab) { const dx = c.h.x - restPos(c).x, dy = c.h.y - restPos(c).y; x += dx * 0.08; y += dy * 0.08; }
  return { x, y };
}
function plugPos(c) {
  const g = c.g, P0 = g.P0, S = g.S;
  if (c.state === 'conn') return { x: S.x, y: S.y };
  const t = ease(clamp(c.plugT, 0, 1));
  const cx = (P0.x + S.x) / 2, cy = Math.min(P0.y, S.y) - 60 * U;
  const u = 1 - t;
  return { x: u * u * P0.x + 2 * u * t * cx + t * t * S.x, y: u * u * P0.y + 2 * u * t * cy + t * t * S.y };
}
function isActive(c) {
  switch (c.id) {
    case 'blue': case 'yellow': return true;
    case 'red': return AP.lamp.light > 0.7;
    case 'vac': return flapT > 0.72;
    case 'tv': return sock.revealed;
  }
}
function grabbable(c) {
  if (c.state === 'snap') return false;
  if (c.state === 'conn') return c.powered && c.id !== 'tv';
  return isActive(c) && c.reveal > 0.4;
}
function hitScale(c) {
  const pi = pairInfo(c);
  if (pi && !pi.isTop && c.state !== 'conn') return 0.75 + 0.4 * c.shift;
  return c.state === 'conn' ? 0.85 : 1;
}

/* ---------------- resize ---------------- */
function readSafe() {
  const cs = getComputedStyle(saEl);
  SA = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
function resize() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  readSafe();
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  land = W > H * 1.05;
  const sw = W - SA.l - SA.r, sh = H - SA.t - SA.b;
  U = Math.min(sw / (land ? 1000 : 380), sh / (land ? 700 : 800));
  LW = Math.max(1.2, 1.5 * U);
  buildGrid();
  if (R) buildGeo(false);
}
function buildGrid() {
  gridCv.width = cv.width; gridCv.height = cv.height;
  const g = gridCv.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = COL.bg; g.fillRect(0, 0, W, H);
  const step = Math.max(10, 20 * U);
  g.strokeStyle = COL.p; g.lineWidth = 1;
  g.globalAlpha = 0.09; g.beginPath();
  for (let x = (W / 2) % step; x < W; x += step) { g.moveTo(x, 0); g.lineTo(x, H); }
  for (let y = (H / 2) % step; y < H; y += step) { g.moveTo(0, y); g.lineTo(W, y); }
  g.stroke();
  g.globalAlpha = 0.2; g.beginPath();
  const big = step * 5;
  for (let x = (W / 2) % big; x < W; x += big) { g.moveTo(x, 0); g.lineTo(x, H); }
  for (let y = (H / 2) % big; y < H; y += big) { g.moveTo(0, y); g.lineTo(W, y); }
  g.stroke();
  g.globalAlpha = 1;
}

/* ---------------- drawing helpers ---------------- */
function ell(x, y, rx, ry, rot = 0) { ctx.moveTo(x + Math.cos(rot) * rx, y + Math.sin(rot) * rx); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2); }
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function ln(x1, y1, x2, y2) { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); }
function quadPts(a, c, b, n, out, skipFirst) {
  for (let i = skipFirst ? 1 : 0; i <= n; i++) { const t = i / n, u = 1 - t; out.push(u * u * a.x + 2 * u * t * c.x + t * t * b.x, u * u * a.y + 2 * u * t * c.y + t * t * b.y); }
}
function polyPath(p) { ctx.beginPath(); ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); }
function addPart(x, y, vx, vy, life, kind, extra) {
  if (parts.length >= MAXP) parts.shift();
  parts.push({ x, y, vx, vy, life, max: life, kind, ...(extra || {}) });
