(()=>{
'use strict';
/* =========================================================
   constants & utils
   ========================================================= */
const W=720,H=1240,G=1500,RB=34,RBIG=42,TW=46,STEP=4;
const PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, hyp=Math.hypot;
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const eo=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t);};
const eo3=t=>{t=clamp(t,0,1);return 1-Math.pow(1-t,3);};
const qs=new URLSearchParams(location.search);
let seed=qs.has('seed')?(parseInt(qs.get('seed'),10)||1):((Math.random()*2147483647)|0);
function rnd(){seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;}
const rr=(a,b)=>a+(b-a)*rnd();
const angDiff=(a,b)=>{let d=a-b;while(d>PI)d-=TAU;while(d<-PI)d+=TAU;return d;};

/* =========================================================
   canvas / layout
   ========================================================= */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
const saEl=document.getElementById('sa');
let SW=1,SH=1,DPR=1,dprCap=2,slowFrames=0;
const base={s:1,x:0,y:0}, cam={s:1,x:0,y:0}, safe={t:0,r:0,b:0,l:0};
let marginL=0, landscape=false;
function readSafe(){try{const cs=getComputedStyle(saEl);safe.t=parseFloat(cs.paddingTop)||0;safe.r=parseFloat(cs.paddingRight)||0;safe.b=parseFloat(cs.paddingBottom)||0;safe.l=parseFloat(cs.paddingLeft)||0;}catch(e){}}
function resize(){
  SW=Math.max(1,window.innerWidth|0);SH=Math.max(1,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1,dprCap);
  cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);
  cv.style.width=SW+'px';cv.style.height=SH+'px';
  readSafe();
  const pad=6;
  const aw=Math.max(50,SW-safe.l-safe.r-pad*2), ah=Math.max(50,SH-safe.t-safe.b-pad*2);
  const s=Math.min(aw/W,ah/H);
  base.s=s;base.x=safe.l+pad+(aw-W*s)/2;base.y=safe.t+pad+(ah-H*s)/2;
  marginL=base.x/s;landscape=SW>SH;
  initBgStars();
}

/* =========================================================
   tracks (ball-centre paths)
   ========================================================= */
const TRK={};
function mkTrack(id,ctrl,o){
  const P=ctrl.map(p=>[p[0],p[1],p.length>2?p[2]:1]);const n=P.length;
  const E=[[2*P[0][0]-P[1][0],2*P[0][1]-P[1][1],P[0][2]],...P,[2*P[n-1][0]-P[n-2][0],2*P[n-1][1]-P[n-2][1],P[n-1][2]]];
  const dense=[];
  for(let i=1;i<E.length-2;i++){
    const p0=E[i-1],p1=E[i],p2=E[i+1],p3=E[i+2];
    const m=Math.max(4,Math.ceil(hyp(p2[0]-p1[0],p2[1]-p1[1])/1.5));
    for(let k=0;k<m;k++){const t=k/m,t2=t*t,t3=t2*t;
      const f=(a,b,c,d)=>0.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      dense.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1]),p1[2]+(p2[2]-p1[2])*t]);}
  }
  dense.push(P[n-1]);
  const cum=[0];for(let i=1;i<dense.length;i++)cum.push(cum[i-1]+hyp(dense[i][0]-dense[i-1][0],dense[i][1]-dense[i-1][1]));
  const L=cum[cum.length-1],N=Math.max(2,Math.round(L/STEP)+1),st=L/(N-1);
  const x=new Float32Array(N),y=new Float32Array(N),d=new Float32Array(N),tx=new Float32Array(N),ty=new Float32Array(N),nx=new Float32Array(N),ny=new Float32Array(N);
  let j=0;
  for(let i=0;i<N;i++){const s=i*st;while(j<cum.length-2&&cum[j+1]<s)j++;const seg=(cum[j+1]-cum[j])||1;const f=clamp((s-cum[j])/seg,0,1);
    x[i]=lerp(dense[j][0],dense[j+1][0],f);y[i]=lerp(dense[j][1],dense[j+1][1],f);d[i]=lerp(dense[j][2],dense[j+1][2],f);}
  for(let i=0;i<N;i++){const a=Math.max(0,i-1),b=Math.min(N-1,i+1);let dx=x[b]-x[a],dy=y[b]-y[a];const l=hyp(dx,dy)||1;dx/=l;dy/=l;tx[i]=dx;ty[i]=dy;nx[i]=-dy;ny[i]=dx;}
  const tr=Object.assign({id,N,st,len:L,x,y,d,tx,ty,nx,ny,lit:new Float32Array(N),sensors:[],mu:70,tube:true,back:false,guide:false,next:null,onEnd:null,onStart:null,snap:true},o||{});
  // rail outlines: a thin double rail beneath the ball; steep parts get side walls
  const A=()=>new Float32Array(N);
  tr.nbx=A();tr.nby=A();tr.r1x=A();tr.r1y=A();tr.r2x=A();tr.r2y=A();tr.wax=A();tr.way=A();tr.wbx=A();tr.wby=A();
  tr.bm=new Uint8Array(N);tr.wm=new Uint8Array(N);
  let px=0,py=1;
  const side=tr.side||0;
  for(let i=0;i<N;i++){let bx=nx[i],by=ny[i];
    if(side){bx*=side;by*=side;}else{if(by<0){bx=-bx;by=-by;}if(Math.abs(tx[i])<0.3){bx=px;by=py;}}
    px=bx;py=by;tr.nbx[i]=bx;tr.nby[i]=by;
    const k=d[i];tr.r1x[i]=x[i]+bx*(RB+3)*k;tr.r1y[i]=y[i]+by*(RB+3)*k;tr.r2x[i]=x[i]+bx*(RB+10)*k;tr.r2y[i]=y[i]+by*(RB+10)*k;
    const w=(RB+8)*k;tr.wax[i]=x[i]+nx[i]*w;tr.way[i]=y[i]+ny[i]*w;tr.wbx[i]=x[i]-nx[i]*w;tr.wby[i]=y[i]-ny[i]*w;
    if(side){tr.bm[i]=1;tr.wm[i]=(tr.wallTo&&i*st<tr.wallTo)?1:0;}
    else{tr.bm[i]=Math.abs(tx[i])>=0.3?1:0;tr.wm[i]=Math.abs(tx[i])<0.5?1:0;}}
  TRK[id]=tr;return tr;
}
const TP={x:0,y:0,d:1,tx:1,ty:0,nx:0,ny:1,i:0,bx:0,by:1,w:1};
function tpos(tr,s){
  const f=clamp(s,0,tr.len)/tr.st;let i=Math.floor(f);if(i>=tr.N-1)i=tr.N-2;if(i<0)i=0;const u=f-i;
  TP.x=tr.x[i]+(tr.x[i+1]-tr.x[i])*u;TP.y=tr.y[i]+(tr.y[i+1]-tr.y[i])*u;TP.d=tr.d[i]+(tr.d[i+1]-tr.d[i])*u;
  TP.tx=tr.tx[i];TP.ty=tr.ty[i];TP.nx=tr.nx[i];TP.ny=tr.ny[i];TP.i=i;TP.bx=tr.nbx[i];TP.by=tr.nby[i];TP.w=clamp((Math.abs(tr.tx[i])-0.3)/0.25,0,1);return TP;
}

mkTrack('N',[[498,790],[500,826],[512,852],[530,866],[550,864],[570,850],[588,826],[602,796],[612,762],[618,730],[622,708]],{mu:55,side:1,wallTo:44});
mkTrack('D2',[[622,708],[628,690],[640,684],[652,694],[660,720],[664,760],[664,800]],{tube:false,guide:true,mu:8,snap:false});
mkTrack('RT',[[664,800],[666,860],[656,920],[630,970],[584,1012],[520,1044],[440,1058]],{side:-1});
mkTrack('BO',[[400,612,.55],[398,680,.6],[388,760,.68],[372,850,.78],[364,920,.9],[360,978,1]],{back:true,mu:30,snap:false});
mkTrack('P0',[[303,1115],[276,1142],[248,1160],[228,1168]],{side:-1});
mkTrack('P1',[[360,1138],[360,1154],[360,1170]]);
mkTrack('P2',[[417,1115],[444,1142],[472,1160],[492,1168]],{side:1});
TRK.R1.next='N';TRK.X.next='N';TRK.F.next='BL';TRK.D.next='LR';TRK.N.next='D2';TRK.D2.next='RT';
const SNAP_IDS=Object.keys(TRK).filter(k=>TRK[k].snap);
const DRAW_IDS=['BO','L','F','BL','X','LR','R1','N','RT','P0','P1','P2','D','D2'];
// notch on N
let NOTCH_S=0;{const t=TRK.N;let best=-1;for(let i=0;i<t.N;i++){if(t.y[i]>best){best=t.y[i];NOTCH_S=i*t.st;}}}
let notchBall=null;
// crest sensor on D2 (highest point)
let CREST_S=0;{const t=TRK.D2;let best=1e9;for(let i=0;i<t.N;i++){if(t.y[i]<best){best=t.y[i];CREST_S=i*t.st;}}}

/* wires (dotted, for causal pulses) */
function mkWire(pts){const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+hyp(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,cum,len:cum[cum.length-1],glow:0};}
const WIRES={
  L:mkWire([[184,452],[212,410],[212,300],[203,270]]),
  R:mkWire([[540,452],[508,410],[508,300],[517,270]]),
  btn:mkWire([[186,572],[246,478],[340,470]]),
  sw:mkWire([[700,600],[700,296],[606,272],[580,262]]),
  lev:mkWire([[190,962],[120,930],[70,880],[62,836]]),
  bell:mkWire([[466,560],[506,470],[500,330],[410,284]])
};
function wirePt(w,s){let i=1;while(i<w.pts.length-1&&w.cum[i]<s)i++;const a=w.pts[i-1],b=w.pts[i];const seg=(w.cum[i]-w.cum[i-1])||1;const f=clamp((s-w.cum[i-1])/seg,0,1);return[lerp(a[0],b[0],f),lerp(a[1],b[1],f)];}

/* =========================================================
   play state
   ========================================================= */
const ST={omega:0,flow:0,lastRail:null,bellCharged:false,history:[],visited:[],usedL:false,usedR:false,gateEver:false,leverUsed:false,dialUsed:false,
  bellCount:0,switchCount:0,launches:0,landings:0,winTheta:0,starKick:0,driveFlash:0,lamps:[0,0,0],dest:null};
const ship={state:'cockpit',t:0};
let flight=null;
let boot=0,T=0;

/* window stars */
const WSTARS=[];const WR=hyp(WIN.hw,WIN.hh);
function seedWindowStars(pattern){
  WSTARS.length=0;
  for(let i=0;i<86;i++){
    let u,v;
    if(pattern==='L'&&i<54){const arm=i%3,k=(i/3)|0;const a=arm*TAU/3+k*0.34;const r=14+k*11;u=Math.cos(a)*r*1.25;v=Math.sin(a)*r*0.95;}
    else if(pattern==='R'&&i<50){const a=i/50*TAU;u=Math.cos(a)*170;v=Math.sin(a)*48+(rnd()-.5)*8;}
    else{u=rr(-WR,WR);v=rr(-WR,WR);}
    WSTARS.push({u,v,z:rr(0.35,1),tw:rr(0,TAU),sz:rr(2.4,5.2)});
  }
}

/* background (outside) stars – screen space */
const BGS=[];
function initBgStars(){BGS.length=0;for(let i=0;i<120;i++)BGS.push({x:rnd()*SW,y:rnd()*SH,z:rr(0.2,1),tw:rr(0,TAU)});}

/* =========================================================
   balls
   ========================================================= */
const balls=[];
function newBall(i,r,slot){return{i,r,state:'cradle',slot,x:0,y:0,d:1,tr:null,s:0,v:0,caught:false,noCap:0,rest:0,
  ox:0,oy:0,sq:0,sqv:0,sqA:-PI/2,hopY:0,hopV:0,rot:0,wob:rnd()*TAU,still:0,ptr:null,fly:null,trail:[],trailT:0,
  lx:0,ly:0,dT:0,dfx:0,dfy:0,padT:0,padI:0,tp:0,tv:0,launchable:false,tick:0,stretch:0,stA:0,heldT:0};}
function slotPos(k,r){return[CRADLE.slots[k],CRADLE.y-r-3];}

/* =========================================================
   particles / rings / pulses
   ========================================================= */
const PARTS=[],RINGS=[],PULSES=[];const MAXP=170;
function spark(x,y,n,spd,life,o){o=o||{};for(let k=0;k<n;k++){if(PARTS.length>=MAXP)PARTS.shift();
  const a=o.dir==null?rnd()*TAU:o.dir+(rnd()-.5)*(o.spread==null?1:o.spread);const v=spd*(0.35+rnd()*0.85);const l=life*(0.6+rnd()*0.6);
  PARTS.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l,sz:o.sz||(2+rnd()*3),kind:o.kind||0,g:o.g||0,sp:o.sp||0,rot:rnd()*TAU});}}
function ring(x,y,r0,r1,life,w,o){o=o||{};if(RINGS.length>=26)RINGS.shift();RINGS.push({x,y,r0,r1,life,max:life,w:w||4,sp:o.sp||0,star:o.star||0,dash:o.dash||0});}
function pulse(id){if(PULSES.length>=14)PULSES.shift();PULSES.push({w:WIRES[id],t:0});WIRES[id].glow=1;}

/* =========================================================
   audio (Web Audio synthesis)
   ========================================================= */
let AC=null,MG=null,NB=null,voices=0,tickBudget=0;
function initAudio(){
  if(AC){if(AC.state==='suspended'&&!document.hidden){AC.resume().catch(()=>{});}return;}
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();
    MG=AC.createGain();MG.gain.value=0.55;const comp=AC.createDynamicsCompressor();MG.connect(comp);comp.connect(AC.destination);
    NB=AC.createBuffer(1,Math.floor(AC.sampleRate*2),AC.sampleRate);const dd=NB.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
    const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0);
    if(AC.state==='suspended')AC.resume().catch(()=>{});
  }catch(e){AC=null;}
}
function tone(type,f0,f1,dur,vol,delay,attack){
  if(!AC||voices>34||AC.state!=='running')return;
  try{const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type;
    o.frequency.setValueAtTime(Math.max(20,f0),t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    const at=attack||0.005;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+at);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+0.03);voices++;o.onended=()=>{voices--;};}catch(e){}
}
function noise(dur,vol,type,f0,f1,q,delay){
  if(!AC||!NB||voices>34||AC.state!=='running')return;
  try{const t=AC.currentTime+(delay||0);const src=AC.createBufferSource();src.buffer=NB;
    const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f0,t);if(f1!==f0)fl.frequency.exponentialRampToValueAtTime(f1,t+dur);fl.Q.value=q||1;
    const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+Math.min(0.012,dur*0.3));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(fl);fl.connect(g);g.connect(MG);
    if(dur>1.6){src.loop=true;src.start(t);}else{src.start(t,Math.random()*(1.9-dur),dur+0.05);}
    src.stop(t+dur+0.06);voices++;src.onended=()=>{voices--;};}catch(e){}
}
const SND={
  pop(){tone('sine',480,760,0.1,0.16);},
  grab(x){const f=420+x*0.4;tone('sine',f,f*1.5,0.08,0.14);noise(0.03,0.05,'bandpass',2400,2400,2);},
  roll(){noise(0.36,0.11,'lowpass',1100,260,0.7);tone('triangle',150,110,0.28,0.05);},
  knock(spd,x){const f=clamp(360+spd*0.38,360,1150)*(0.85+0.3*(x/W));const v=clamp(0.07+spd/2400,0.07,0.32);tone('triangle',f,f*0.8,0.09,v);noise(0.025,v*0.6,'bandpass',f*3,f*2,3);},
  click(){noise(0.018,0.3,'highpass',3200,3200,1);tone('square',2300,1900,0.025,0.05);noise(0.016,0.22,'highpass',2600,2600,1,0.055);},
  catchIt(){tone('sine',320,210,0.13,0.24);noise(0.04,0.09,'lowpass',900,400,1);},
  bell(v){const b=560+clamp(v,0,1000)*0.12;[[1,0.22,2.4],[2.76,0.09,1.4],[5.4,0.05,0.9],[8.93,0.025,0.5],[0.5,0.07,2.6]].forEach(p=>tone('sine',b*p[0],b*p[0]*0.998,p[2],p[1]));},
  boing(){tone('sine',330,110,0.32,0.26);tone('triangle',660,220,0.18,0.07);},
  success(){[0,4,7,12,16].forEach((n,i)=>{const f=523.25*Math.pow(2,n/12);tone('triangle',f,f,0.36,0.14,i*0.075);tone('sine',f*2,f*2,0.2,0.04,i*0.075);});},
  gate(up){tone('square',up?110:170,up?175:105,0.3,0.045);noise(0.28,0.05,'bandpass',600,1300,2);},
  lever(){tone('square',190,120,0.06,0.09);noise(0.03,0.18,'bandpass',1500,1500,2);},
  tick(v){if(tickBudget<=0)return;tickBudget--;noise(0.012,v,'highpass',4200,4200,1);},

/* =========================================================
   init / reset
   ========================================================= */
function init(){
  const bigSlot=rnd()<0.7?1:0;
  for(let k=0;k<3;k++){const big=(k===bigSlot);const b=newBall(k,big?RBIG:RB,k);b.big=big;const p=slotPos(k,b.r);b.x=p[0];b.y=p[1];balls.push(b);}
  gate.open=rnd()<0.28;gate.y=gate.open?1:0;
  dial.idx=(rnd()*3)|0;dial.ang=EX[dial.idx];
  seedWindowStars(null);
}

/* =========================================================
   ball placement helpers
   ========================================================= */
function setVisualJump(b,nx,ny){b.ox+=b.x-nx;b.oy+=b.y-ny;b.x=nx;b.y=ny;}
function attach(b,id,s,v){
  const tr=TRK[id];b.state='track';b.tr=id;b.s=clamp(s,0,tr.len);b.v=v;b.caught=false;b.rest=0;b.noCap=0;b.fly=null;
  const p=tpos(tr,b.s);setVisualJump(b,p.x,p.y);b.d=p.d;
}
function moveTo(b,id,s,v){attach(b,id,s,v);}
function freeSlots(except){
  const used=new Set();
  for(const o of balls){if(o===except)continue;if(o.state==='cradle')used.add(o.slot);if(o.state==='fly'&&o.fly&&o.fly.slot!=null)used.add(o.fly.slot);}
  return[0,1,2].filter(k=>!used.has(k));
}
function flyArc(b,x1,y1,cx,cy,dur,then,o){
  if(b.caught){b.caught=false;if(notchBall===b)notchBall=null;}
  b.state='fly';b.fly=Object.assign({kind:'arc',x0:b.x+b.ox,y0:b.y+b.oy,cx,cy,x1,y1,t:0,dur,then,slot:null,dots:false},o||{});
  b.x=b.fly.x0;b.y=b.fly.y0;b.ox=0;b.oy=0;b.d=1;b.trail.length=0;
}
function toSlot(b,k,dur,dots){
  const fs=freeSlots(b);if(k==null||fs.indexOf(k)<0)k=fs.length?fs[0]:0;
  const p=slotPos(k,b.r);const sx=b.x+b.ox,sy=b.y+b.oy;
  const cx=(sx+p[0])/2,cy=Math.min(sy,p[1])-80;
  flyArc(b,p[0],p[1],cx,cy,dur||0.35,()=>{b.state='cradle';b.slot=k;b.sq=0.9;b.sqv=0;b.sqA=-PI/2;b.d=1;SND.catchIt();ring(p[0],p[1]+b.r,10,60,0.4,3);},{slot:k,dots:!!dots});
}
function flyToCradleFrom(b,side){
  const fs=freeSlots(b);const k=fs.length?(side<0?fs[0]:fs[fs.length-1]):0;
  const p=slotPos(k,b.r);const sx=b.x+b.ox,sy=b.y+b.oy;
  const cx=side<0?-40-marginL*0.3:(side>0?W+40+marginL*0.3:(sx+p[0])/2);const cy=Math.min(sy,p[1])-260;
  flyArc(b,p[0],p[1],(cx+(sx+p[0])/2)/2,cy,1.05,()=>{b.state='cradle';b.slot=k;b.sq=1;b.sqv=0;b.sqA=-PI/2;SND.catchIt();ring(p[0],p[1]+b.r,10,70,0.45,3);spark(p[0],p[1]+b.r,6,120,0.4);},{slot:k,dots:true});
}
function dropIntoFunnel(b,f){
  const tr=TRK[f.tr];const p=tpos(tr,6);const sx=b.x+b.ox,sy=b.y+b.oy;
  flyArc(b,p.x,p.y,(sx+p.x)/2,Math.min(sy,p.y)-50,0.22,()=>{attach(b,f.tr,6,90);b.sq=0.8;b.sqv=0;b.sqA=-PI/2;},{dots:true});
  f.glow=1;SND.roll();
}
function nearestTrack(x,y,maxD){
  let best=null,bd=maxD;
  for(const id of SNAP_IDS){const tr=TRK[id];for(let i=0;i<tr.N;i+=2){const d=hyp(tr.x[i]-x,tr.y[i]-y);if(d<bd){bd=d;best={id,s:i*tr.st,d};}}}
  return best;
}
function findBelow(x,y){
  let best=null,bestY=1e9;
  for(const id of SNAP_IDS){const tr=TRK[id];
    for(let i=0;i<tr.N-1;i++){const x0=tr.x[i],x1=tr.x[i+1];if(x0===x1)continue;if((x0-x)*(x1-x)<=0){const f=(x-x0)/(x1-x0);const yy=tr.y[i]+(tr.y[i+1]-tr.y[i])*f;if(yy>y-8&&yy<bestY){bestY=yy;best={id,s:(i+f)*tr.st,x,y:yy};}}}}
  return best;
}
function placeBall(b,x,y,vx,vy){
  for(const f of FUN){if(hyp(x-f.x,y-(f.y+6))<f.r+56&&y<f.y+86){dropIntoFunnel(b,f);return;}}
  if(x>CRADLE.x0-14&&x<CRADLE.x1+14&&y>CRADLE.y-120&&y<CRADLE.y+28){const fs=freeSlots(b);let k=fs[0],bd=1e9;for(const s of fs){const d=Math.abs(CRADLE.slots[s]-x);if(d<bd){bd=d;k=s;}}toSlot(b,k,0.22);return;}
  if(hyp(x-DIAL.x,y-DIAL.y)<DIAL.R-10){b.state='held';enterDial(b);SND.roll();return;}
  const nt=nearestTrack(x,y,74);
  if(nt){const tr=TRK[nt.id];const p=tpos(tr,nt.s);const v=clamp((vx*p.tx+vy*p.ty)*0.45,-520,520);
    const sx=x,sy=y;flyArc(b,p.x,p.y,(sx+p.x)/2,(sy+p.y)/2-10,0.12,()=>{attach(b,nt.id,nt.s,v);b.sq=0.6;b.sqv=0;b.sqA=-PI/2;});SND.roll();return;}
  const bl=findBelow(x,y);
  if(bl){const tr=TRK[bl.id];const p=tpos(tr,bl.s);const dy=Math.max(10,p.y-y);const dur=clamp(Math.sqrt(2*dy/G)*0.9,0.12,0.75);
    b.state='fly';b.fly={kind:'fall',x0:x,y0:y,x1:p.x,y1:p.y,t:0,dur,then:()=>{const vl=Math.sqrt(2*G*dy)*0.55;attach(b,bl.id,bl.s,clamp(vl*p.ty+vx*p.tx*0.3,-600,600));b.sq=1;b.sqv=0;b.sqA=-PI/2;SND.knock(Math.min(600,vl),b.x);},slot:null,dots:true};
    b.ox=0;b.oy=0;b.trail.length=0;SND.roll();return;}
  toSlot(b,null,0.5,true);
}

/* tunnel to the bell (depth) */
function tunnelXY(p){const f=1-(1-ALC.f)*p;const fx=lerp(306,370,sm(p*1.2));const fy=598;return[ALC.vx+(fx-ALC.vx)*f,ALC.vy+(fy-ALC.vy)*f,f];}

  ST.bellCount++;ST.bellCharged=true;bell.swv+=clamp(sp/90,3,9);bell.ring=1;SND.bell(sp);pulse('bell');
  const bx=406,by=566;spark(bx,by,14,200,0.6,{kind:1});ring(bx,by,10,120,0.8,3);ring(bx,by,10,190,1.1,2);
  const now=T;bell.hits=bell.hits.filter(t=>now-t<0.6);

function padFire(i,b){

const HULL=[
  [[205,30],[360,-210]],[[515,30],[360,-210]],[[360,-210],[360,-120]],[[290,-40],[430,-40]],[[250,-10],[470,-10]],
  [[155,90],[40,300]],[[565,90],[680,300]],

  [[-50,1120],[90,1300]],[[770,1120],[630,1300]],[[90,1300],[630,1300]],

const ENG=[[220,1370],[360,1390],[500,1370]];
function buildPath(pad){
  const seq=[pad].concat(ST.history.slice(-5));
  let x=0,y=0,h=-PI/2;const pts=[[x,y]];
  for(let k=0;k<8;k++){y-=22;pts.push([x,y]);}
  const lr=ST.lastRail||'L';
  for(let n=0;n<seq.length;n++){const idx=seq[n];const turn=(idx-1)*0.5;for(let k=0;k<12;k++){h+=turn/12;x+=Math.cos(h)*34;y+=Math.sin(h)*34;pts.push([x,y]);}
    if(n===0){ // the last rail shapes the flight: L = a full spin, R = a side-to-side sway
      if(lr==='L'){for(let k=0;k<26;k++){h+=TAU/26;x+=Math.cos(h)*30;y+=Math.sin(h)*30;pts.push([x,y]);}}
      else{for(let k=0;k<28;k++){const sw=Math.sin(k/28*TAU*2)*0.16;h+=sw;x+=Math.cos(h)*30;y+=Math.sin(h)*30;pts.push([x,y]);}}}}
  for(let k=0;k<10;k++){x+=Math.cos(h)*30;y+=Math.sin(h)*30;pts.push([x,y]);}
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+hyp(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  return{pts,cum,len:cum[cum.length-1],endH:h,end:[x,y]};
}
function pathAt(P,s){s=clamp(s,0,P.len);let i=1;while(i<P.pts.length-1&&P.cum[i]<s)i++;const a=P.pts[i-1],b=P.pts[i];const seg=(P.cum[i]-P.cum[i-1])||1;const f=(s-P.cum[i-1])/seg;return[lerp(a[0],b[0],f),lerp(a[1],b[1],f),Math.atan2(b[1]-a[1],b[0]-a[0])];}
function startLaunch(pad,b){
  for(const [id,p] of ptrs){releasePtr(id,p,true);}
  const P=buildPath(pad);const dest=ST.lastRail||'L';
  const R=360;const dc=[P.end[0]+Math.cos(P.endH)*(R+260),P.end[1]+Math.sin(P.endH)*(R+260)];
  const sh=ST.launches>0?1.3:0; // later flights travel a little quicker
  const FLx={IGN:FL0.IGN,DEP:FL0.DEP,TRV:FL0.TRV-sh,LND:FL0.LND-sh,RET:FL0.RET-sh};
  flight={t:0,pad,dest,P,R,dc,landed:false,trail:[],shipPos:[0,0],shipH:-PI/2,camX:0,camY:0,engine:false,flash:0,FL:FLx};
  ST.launches++;
  SND.engine();SND.whoosh();
  flyToCradleFrom(b,pad===0?-1:pad===2?1:1);

  const dest=flight.dest;flight=null;ship.state='cockpit';ship.t=0;
  ST.bellCharged=false;ST.landings++;ST.visited.push(dest);if(ST.visited.length>4)ST.visited.shift();ST.dest=dest;
  seedWindowStars(dest);ST.starKick=1.2;

function pickBall(x,y,id){

  for(const b of balls){if(b.ptr!=null&&b.ptr!==id)continue;if(b.state==='fly'&&b.fly&&b.fly.kind==='arc'&&b.fly.dots&&b.fly.dur>0.8)continue;

  if(x>WIN.x-WIN.hw&&x<WIN.x+WIN.hw&&y>WIN.y-WIN.hh&&y<WIN.y+WIN.hh){ST.winWob=1;SND.wob();return;}
  for(const w of WINGS){if(Math.abs(x-(w.hx+w.side*30))<60&&y>w.hy-230&&y<w.hy+10){wings.wob=1;SND.wob();return;}}

  for(const p of PADS){if(hyp(x-p.x,y-(p.y+30))<60){p.wob=1;SND.wob();return;}}

function onDown(e){

   hints & demo
   ========================================================= */
let hint=null,demo=null;const demoDone={};let lastNudge=0;
function cradleBall(){let best=null;for(const b of balls){if(b.state==='cradle'){if(!best||b.big)best=b;}}return best;}
function computeHint(){
  if(flight||ship.state==='morph')return null;
  const carry=to=>{const b=cradleBall();if(!b)return null;return{kind:'carry',to,b,key:'carry'+to};};
  if(ship.state==='ship')return carry('L');
  if(!ST.usedL)return carry('L');
  if(!ST.usedR)return carry('R');
  if(!ST.gateEver&&!gate.open)return{kind:'tap',obj:'button',key:'button'};
  if(!ST.bellCharged)return gate.open?carry('L'):{kind:'tap',obj:'button',key:'button'};
  if(!ST.leverUsed)return{kind:'tap',obj:'lever',key:'lever'};
  if(!ST.dialUsed)return{kind:'rotate',obj:'dial',key:'dial'};
  if(wings.level<1)return carry('R');
  if(!driveOn())return carry('L');
  return carry('L');
}
function anyMoving(){for(const b of balls){if(b.state==='track'&&Math.abs(b.v)>20)return true;if(b.state==='fly'||b.state==='tunnel'||b.state==='dial'||b.state==='pad')return true;}return false;}
function demoCancel(){if(demo){demo=null;}}
function updateHint(dt){
  hint=computeHint();

  if(demo){demo.t+=dt;if(demo.t>demo.dur)demo=null;return;}
  if(!hint||ptrs.size>0||boot<1.2)return;
  if(idle>4&&!anyMoving()){
    if(!demoDone[hint.key]){demoDone[hint.key]=1;startDemo(hint);lastNudge=T;}
    else if(T-lastNudge>4){lastNudge=T;nudge(hint);}
  }
}
function startDemo(h){
  if(h.kind==='carry'){const p=ballDrawPos(h.b);const f=FUN[h.to==='L'?0:1];demo={kind:'carry',t:0,dur:2.8,x0:p[0],y0:p[1],x1:f.x,y1:f.y+14,r:h.b.r};}
  else if(h.obj==='button'){demo={kind:'tap',t:0,dur:2.2,x0:BTN.x,y0:BTN.y};}
  else if(h.obj==='lever'){const lx=LEV.x+Math.cos(LEV.a)*LEV.len,ly=LEV.y+Math.sin(LEV.a)*LEV.len;demo={kind:'tap',t:0,dur:2.2,x0:lx,y0:ly};}
  else if(h.obj==='dial'){demo={kind:'rotate',t:0,dur:2.6,x0:DIAL.x,y0:DIAL.y};}
}
function nudge(h){
  if(h.kind==='carry'){h.b.hopV=-420;h.b.hopY=0.01;const f=FUN[h.to==='L'?0:1];f.glow=1;f.wob=1;}
  else if(h.obj==='button'){BTN.hop=1;BTN.glow=1;}
  else if(h.obj==='lever'){LEV.av+=LEV.down?-6:6;LEV.glow=1;}
  else if(h.obj==='dial'){dial.wob=1;dial.glow=1;}

function stepTrackBall(b,h){

  if(b.tr==='N'&&!b.caught&&b.noCap<=0&&notchBall==null&&((s0<NOTCH_S&&b.s>=NOTCH_S)||(s0>NOTCH_S&&b.s<=NOTCH_S))){
    b.caught=true;b.s=NOTCH_S;const sp=Math.abs(b.v);b.v=0;notchBall=b;SND.catchIt();b.sq=clamp(sp/700,0.4,1);b.sqv=0;b.sqA=-PI/2;

  else if(b.s<=0){b.s=0;if(b.v<0&&tr.onStart)tr.onStart(b);}
}
function pairPos(b1,b2){

  if(t1.next===b2.tr)return[b1.s-t1.len,b2.s];

}
function collide(){

    for(let j=i+1;j<balls.length;j++){const b=balls[j];if(b.state!=='track')continue;
      const pp=pairPos(a,b);if(!pp)continue;
      const d=pp[1]-pp[0];const minD=(a.r+b.r)*0.97;if(Math.abs(d)>=minD)continue;

function updateStars(dt){

function update(dt){
  boot+=dt;tickBudget=Math.min(6,tickBudget+dt*30);

    updateBalls(dt);

    if(ship.state==='morph'){ship.t+=dt/3.6;if(ship.t>=1){ship.t=1;ship.state='ship';SND.success();

    updateHint(dt);

  updateStars(dt);
  updateFX(dt);
  // bg stars

  if(!flight){const cx=SW/2,cy=SH/2;const ca=Math.cos(spinB*dt),sa=Math.sin(spinB*dt);

}
function wrapStar(s){if(s.x<-10)s.x+=SW+20;else if(s.x>SW+10)s.x-=SW+20;if(s.y<-10)s.y+=SH+20;else if(s.y>SH+10)s.y-=SH+20;}

/* flight */
const FL0={IGN:1.3,DEP:2.3,TRV:7.6,LND:9.6,RET:11.2};
function flightCam(){const fz=Math.min(SW,SH)/1000;return fz;}
function updateFlight(dt){
  const f=flight;f.t+=dt;const FL=f.FL;
  // keep the cradle-bound ball moving
  for(const b of balls){if(b.state==='fly'){const fl=b.fly;fl.t+=dt;const u=clamp(fl.t/fl.dur,0,1);const v=1-u;b.x=v*v*fl.x0+2*v*u*fl.cx+u*u*fl.x1;b.y=v*v*fl.y0+2*v*u*fl.cy+u*u*fl.y1;if(u>=1){b.fly=null;const th=fl.then;b.state='idle';if(th)th();if(b.state==='idle')b.state='cradle';}}
    else if(b.state==='cradle'){const p=slotPos(b.slot,b.r);b.x=p[0];b.y=p[1];}
    b.sqv+=(-260*b.sq-11*b.sqv)*dt;b.sq+=b.sqv*dt;}
  updateDevices(dt);
  const u=clamp((f.t-FL.DEP)/(FL.TRV-FL.DEP),0,1);
  const pu=u<1?(u*u*(3-2*u))*0.15+u*0.85:1;
  const p=pathAt(f.P,f.P.len*pu);
  if(f.t<FL.TRV){f.shipPos=[p[0],p[1]];f.shipH=p[2];}
  else{const lu=clamp((f.t-FL.TRV)/(FL.LND-0.5-FL.TRV),0,1);const end=f.P.end;const off=f.dest==='L'?f.R*0.12+90:f.R*0.62+122;
    const lp=[f.dc[0]-Math.cos(f.P.endH)*off,f.dc[1]-Math.sin(f.P.endH)*off];
    const e=eo3(lu);f.shipPos=[lerp(end[0],lp[0],e),lerp(end[1],lp[1],e)];f.shipH=f.P.endH;f.flip=sm(lu*1.4);
    if(lu>=1&&!f.landed){f.landed=true;SND.land();f.flash=1;f.bob=1;}}
  f.bob=Math.max(0,(f.bob||0)-dt*1.6);
  if(f.t>FL.IGN-0.3&&!f.engine){f.engine=true;}
  f.trailT=(f.trailT||0)+dt;if(f.t>FL.DEP&&f.t<FL.TRV&&f.trailT>0.05){f.trailT=0;f.trail.push([f.shipPos[0],f.shipPos[1]]);if(f.trail.length>80)f.trail.shift();}
  f.flash=Math.max(0,f.flash-dt*1.2);
  // background stars stream opposite to motion
  const fz=flightCam();
  const sp=(f.t>FL.DEP&&f.t<FL.TRV)?560:(f.t<FL.DEP?lerp(0,560,clamp((f.t-FL.IGN)/(FL.DEP-FL.IGN),0,1)):lerp(560,0,clamp((f.t-FL.TRV)/1.4,0,1)));

  const cx=SW/2,cy=SH/2;const spin=ST.omega*0.3*dt;const ca=Math.cos(spin),sa=Math.sin(spin);
  for(const s of BGS){s.x+=vx*dt*s.z*1.4+ST.flow*0.5*dt*s.z;s.y+=vy*dt*s.z*1.4;const dx=s.x-cx,dy=s.y-cy;s.x=cx+dx*ca-dy*sa;s.y=cy+dx*sa+dy*ca;wrapStar(s);}
  if(f.t>=FL.RET){endFlight();}
}

function roadPoints(){

function drawTracks(){

  for(let n=0;n<DRAW_IDS.length;n++){const tr=TRK[DRAW_IDS[n]];const a=ba(3+n*0.4);if(a<=0)continue;const N=tr.N;

function drawFunnels(){

    else if(t<2.05){const u=sm((t-0.85)/1.2);const cx=(d.x0+d.x1)/2,cy=Math.min(d.y0,d.y1)-120;const w=1-u;hx=w*w*d.x0+2*w*u*cx+u*u*d.x1;hy=w*w*d.y0+2*w*u*cy+u*u*d.y1;press=1;gb=[hx,hy,1];}

    if(gb){ctx.save();ctx.strokeStyle='#fff';ctx.globalAlpha=fade*0.9*gb[2];circ(gb[0],gb[1],d.r);ctx.setLineDash([5,6]);ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);ctx.restore();}
    if(t>0.85){ctx.save();ctx.fillStyle='#fff';const cx=(d.x0+d.x1)/2,cy=Math.min(d.y0,d.y1)-120;const um=clamp((t-0.85)/1.2,0,1);for(let k=0;k<=14;k++){const u=k/14;if(u>um)break;const w=1-u;ctx.globalAlpha=fade*0.6;circ(w*w*d.x0+2*w*u*cx+u*u*d.x1,w*w*d.y0+2*w*u*cy+u*u*d.y1,3);ctx.fill();}ctx.restore();}
    if(t>0.6&&t<0.9){ctx.save();ctx.strokeStyle='#fff';ctx.globalAlpha=fade*(0.9-(t-0.6)*3);circ(d.x0,d.y0,d.r+(t-0.6)*120);ctx.lineWidth=3;ctx.stroke();ctx.restore();}
    drawHand(hx+8,hy+8,press,fade);
  }else if(d.kind==='tap'){
    const ph=(t%1.0);const press=ph>0.35&&ph<0.55?1:0;
    if(press){ctx.save();ctx.strokeStyle='#fff';ctx.globalAlpha=fade*0.8;circ(d.x0,d.y0,30+(ph-0.35)*200);ctx.lineWidth=3;ctx.stroke();ctx.restore();}
    drawHand(d.x0+6,d.y0+6+(press?0:-14),press,fade);
  }else{
    const u=t/d.dur;const a=lerp(EX[0]+0.4,EX[2]-0.4,0.5+0.5*Math.sin(u*TAU*1.2-PI/2));const R=DIAL.R+4;
    const hx=d.x0+Math.cos(a)*R,hy=d.y0+Math.sin(a)*R;
    ctx.save();ctx.strokeStyle='#fff';ctx.globalAlpha=fade*0.5;ctx.beginPath();ctx.arc(d.x0,d.y0,R,EX[2]-0.4,EX[0]+0.4);ctx.setLineDash([3,7]);ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);ctx.restore();
    drawHand(hx+6,hy+6,1,fade);
  }
}
function drawBalls(layer){
  for(const b of balls){const back=(b.state==='tunnel')||(b.state==='track'&&TRK[b.tr].back);if((layer==='back')!==back)continue;if(b.state==='held'||b.state==='fly')continue;drawBall(b);}
  if(layer==='front'){for(const b of balls){if(b.state==='fly')drawBall(b);}for(const b of balls){if(b.state==='held')drawBall(b);}}
}
function drawBoard(morphT){
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#fff';ctx.fillStyle='#fff';
  drawWalls(morphT);
  drawWindow();
  drawWings();
  drawWires();
  drawTracks();
  drawBalls('back');
  drawGateAlcove();
  drawFunnels();
  drawCradle();
  drawButton();
  drawLeverBoard();
  drawNotchSwitch();
  drawDial();
  drawPads();
  drawBalls('front');
  drawTapPreview();
  drawFX(0);
  drawDemo();
}

/* =========================================================
   render
   ========================================================= */
function shipCamParams(){
  const k=landscape?0.8:0.68;const s=base.s*k;const cx=SW/2,cy=SH/2+SH*(landscape?0.06:0.07);
  return{s,x:cx-360*s,y:cy-620*s};
}
function drawBgStars(alpha){
  if(alpha<=0)return;ctx.fillStyle='#fff';
  for(const s of BGS){const tw=0.6+0.4*Math.sin(s.tw);ctx.globalAlpha=alpha*(0.25+0.75*s.z)*tw;const r=(1+s.z*2)*Math.min(2,DPR)*0.8;ctx.fillRect(s.x*DPR-r/2,s.y*DPR-r/2,r,r);}
  ctx.globalAlpha=1;
}
function setBoardXf(px,py,s,rot){ // place logical (360,620) at screen (px,py)
  const c=Math.cos(rot)*s*DPR,sn=Math.sin(rot)*s*DPR;
  ctx.setTransform(c,sn,-sn,c,px*DPR,py*DPR);ctx.translate(-360,-620);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  if(flight){renderFlight();return;}
  const mt=sm(ship.t);const sc=shipCamParams();
  cam.s=lerp(base.s,sc.s,mt);cam.x=lerp(base.x,sc.x,mt);cam.y=lerp(base.y,sc.y,mt);
  drawBgStars(mt);
  ctx.setTransform(cam.s*DPR,0,0,cam.s*DPR,cam.x*DPR,cam.y*DPR);
  if(ship.t>0){const avail=(SW/2)/cam.s;const wk=clamp((avail-400)/380,0.45,1);drawHull(ship.t,0,wk);}
  drawBoard(mt);
}
function renderFlight(){
  const f=flight,t=f.t,FL=f.FL;const fz=flightCam();
  // camera follows ship
  const sh=f.shipPos;const tgtX=sh[0]+Math.cos(f.shipH)*160,tgtY=sh[1]+Math.sin(f.shipH)*160;
  if(!f.camInit){f.camX=tgtX;f.camY=tgtY;f.camInit=true;}else{f.camX=lerp(f.camX,tgtX,0.08);f.camY=lerp(f.camY,tgtY,0.08);}
  const sx0=SW/2,sy0=SH*0.52;
  const w2s=(x,y)=>[sx0+(x-f.camX)*fz,sy0+(y-f.camY)*fz];
  const spaceA=t<FL.DEP?clamp((t-FL.IGN)/(FL.DEP-FL.IGN),0,1):(t>FL.LND?clamp(1-(t-FL.LND)/(FL.RET-FL.LND)*1.4,0,1):1);
  drawBgStars(t>FL.LND+0.4?1-sm((t-FL.LND-0.4)/(FL.RET-FL.LND-0.4)):1);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.strokeStyle='#fff';ctx.fillStyle='#fff';ctx.lineCap='round';
  // destination
  if(spaceA>0){
    const dc=w2s(f.dc[0],f.dc[1]);const R=f.R*fz;ctx.globalAlpha=spaceA;
    if(f.dest==='L'){ // spiral galaxy
      for(let arm=0;arm<3;arm++){ctx.beginPath();for(let k=0;k<=60;k++){const a=t*(0.3+ST.omega*0.3)+arm*TAU/3+k*0.11;const rr2=R*0.08+k*R*0.015;const px=dc[0]+Math.cos(a)*rr2,py=dc[1]+Math.sin(a)*rr2*0.8;if(k)ctx.lineTo(px,py);else ctx.moveTo(px,py);}ctx.lineWidth=2.5;ctx.stroke();
        for(let k=0;k<60;k+=4){const a=t*(0.3+ST.omega*0.3)+arm*TAU/3+k*0.11+0.2;const rr2=R*0.1+k*R*0.015;ctx.fillRect(dc[0]+Math.cos(a)*rr2-2,dc[1]+Math.sin(a)*rr2*0.8-2,4,4);}}
      circ(dc[0],dc[1],R*0.12);ctx.fill();circ(dc[0],dc[1],R*0.2);ctx.lineWidth=2;ctx.stroke();
    }else{ // ringed planet
      circ(dc[0],dc[1],R*0.62);ctx.fillStyle='#000';ctx.fill();ctx.lineWidth=4;ctx.stroke();
      ctx.beginPath();for(let k=-3;k<=3;k++){const yy=dc[1]+k*R*0.15;const hw=Math.sqrt(Math.max(0,(R*0.62)**2-(k*R*0.15)**2));ctx.moveTo(dc[0]-hw,yy);ctx.lineTo(dc[0]+hw,yy);}ctx.lineWidth=1.5;ctx.globalAlpha=spaceA*0.5;ctx.stroke();ctx.globalAlpha=spaceA;
      for(let k=0;k<3;k++){ctx.beginPath();ctx.ellipse(dc[0],dc[1],R*(1.0+k*0.12),R*(0.26+k*0.03),-0.3+ST.flow*0.001,0,TAU);ctx.lineWidth=k===0?3.5:2;ctx.stroke();}
      ctx.fillStyle='#fff';for(let k=0;k<3;k++){const a=t*(0.4+k*0.2)+k*2;circ(dc[0]+Math.cos(a)*R*1.5,dc[1]+Math.sin(a)*R*0.6,5+k*2);ctx.fill();}
    }
    // road ahead (dotted) & trail
    ctx.fillStyle='#fff';const P=f.P;const ph=(t*120)%40;
    for(let s=ph;s<P.len;s+=40){const q=pathAt(P,s);const sp=w2s(q[0],q[1]);ctx.globalAlpha=spaceA*0.55;circ(sp[0],sp[1],3.2);ctx.fill();}
    for(let i=0;i<f.trail.length;i++){const tp=f.trail[i];if(hyp(tp[0]-sh[0],tp[1]-sh[1])<120)continue;const q=w2s(tp[0],tp[1]);ctx.globalAlpha=spaceA*(i/f.trail.length);circ(q[0],q[1],4.5);ctx.fill();}
  }
  ctx.globalAlpha=1;
  // ship placement (interpolates from cockpit-ship view to flight view and back)
  const sc=shipCamParams();
  const P0={x:sc.x+360*sc.s,y:sc.y+620*sc.s,s:sc.s,r:0};
  const shs=w2s(sh[0],sh[1]);let shipS=fz*0.3;if(t>FL.TRV){shipS*=lerp(1,f.dest==='L'?0.45:0.6,eo3((t-FL.TRV)/(FL.LND-0.5-FL.TRV)));}
  const bob=(f.bob||0)*Math.sin((1-(f.bob||0))*PI*3)*8;
  const P1={x:shs[0]+Math.cos(f.shipH)*bob,y:shs[1]+Math.sin(f.shipH)*bob,s:shipS,r:f.shipH+PI/2+PI*(f.flip||0)};
  const B={x:base.x+360*base.s,y:base.y+620*base.s,s:base.s,r:0};
  let X;
  if(t<FL.IGN){const sk=(t>0.3)?Math.sin(t*70)*2*t:0;X={x:P0.x+sk,y:P0.y,s:P0.s,r:0};}
  else if(t<FL.DEP){const u=sm((t-FL.IGN)/(FL.DEP-FL.IGN));X={x:lerp(P0.x,P1.x,u),y:lerp(P0.y,P1.y,u),s:lerp(P0.s,P1.s,u),r:lerp(0,P1.r,u)};}
  else if(t<FL.LND+0.4){X=P1;}
  else{const u=sm((t-FL.LND-0.4)/(FL.RET-FL.LND-0.4));let r1=P1.r;while(r1>PI)r1-=TAU;while(r1<-PI)r1+=TAU;X={x:lerp(P1.x,B.x,u),y:lerp(P1.y,B.y,u),s:lerp(P1.s,B.s,u),r:lerp(r1,0,u)};}
  const hullA=t>FL.LND+0.4?1-sm((t-FL.LND-0.4)/(FL.RET-FL.LND-0.4)):1;
  const flame=t<FL.IGN?clamp((t-0.3)/0.8,0,1):(t<FL.TRV?1:(t<FL.LND-0.5?0.55+0.25*Math.sin(t*30):clamp(1-(t-FL.LND+0.5)/0.5,0,1)*0.5));
  setBoardXf(X.x,X.y,X.s,X.r);
  ctx.globalAlpha=hullA;drawHull(hullA>0.01?1:0,flame*hullA);ctx.globalAlpha=1;
  // keep the cam used for input consistent
  drawBoard(hullA);
  // landing flash
  if(f.flash>0){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.strokeStyle='#fff';for(let k=0;k<3;k++){ctx.globalAlpha=f.flash*(1-k*0.25);circ(shs[0],shs[1],(1-f.flash)*Math.max(SW,SH)*0.7+k*30);ctx.lineWidth=4;ctx.stroke();}
    ctx.fillStyle='#fff';for(let k=0;k<24;k++){const a=k*TAU/24;const r=(1-f.flash)*Math.min(SW,SH)*0.45;ctx.globalAlpha=f.flash;ctx.fillRect(shs[0]+Math.cos(a)*r-3,shs[1]+Math.sin(a)*r-3,6,6);}}
  ctx.globalAlpha=1;
}

/* =========================================================
   loop
   ========================================================= */
let last=performance.now(),running=true,rafId=0;
function frame(now){
  rafId=0;if(!running)return;
  let dt=(now-last)/1000;last=now;const raw=dt;if(!(dt>0))dt=0.016;if(dt>0.05)dt=0.05;
  T+=dt;
  const c0=performance.now();
  try{update(dt);render();}catch(err){if(!frame.err){frame.err=1;console.warn(err);}}
  frame.cpu=(frame.cpu||0)*0.95+(performance.now()-c0)*0.05;
  // adaptive resolution: if frames stay slow, render fewer pixels (never below 1.25x on hi-dpi)
  if(raw>0.021&&raw<0.25)slowFrames++;else slowFrames=Math.max(0,slowFrames-2);
  if(slowFrames>90&&DPR>1.3){dprCap=Math.max(1.25,DPR-0.25);slowFrames=0;resize();}
  rafId=requestAnimationFrame(frame);
}
function onVis(){
  if(document.hidden){running=false;if(rafId){cancelAnimationFrame(rafId);rafId=0;}for(const [id,p] of [...ptrs])releasePtr(id,p,false);if(AC&&AC.state==='running')AC.suspend().catch(()=>{});}
  else{if(!running){running=true;last=performance.now();if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});if(!rafId)rafId=requestAnimationFrame(frame);}}
}
document.addEventListener('visibilitychange',onVis);
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));

/* test hooks (read-only helpers for automated checks) */
window.__T={
  st:()=>({mode:ship.state,morph:ship.t,flight:!!flight,flightT:flight?flight.t:0,omega:ST.omega,flow:ST.flow,lastRail:ST.lastRail,bell:ST.bellCharged,bellCount:ST.bellCount,
    gate:gate.open,lever:LEV.down,dial:dial.idx,wings:wings.level,switchCount:ST.switchCount,history:ST.history.slice(),launches:ST.launches,landings:ST.landings,
    notch:notchBall?notchBall.i:-1,starRings:ST.starRings||0,hint:hint?(hint.key):null,demo:demo?demo.kind:null,visited:ST.visited.slice(),
    balls:balls.map(b=>({i:b.i,state:b.state,tr:b.tr,s:Math.round(b.s),v:Math.round(b.v),caught:b.caught,sq:+b.sq.toFixed(3),x:Math.round(b.x),y:Math.round(b.y),big:!!b.big}))}),
  toScreen:(x,y)=>[cam.x+x*cam.s,cam.y+y*cam.s],
  ball:(i)=>{const b=balls[i];const p=ballDrawPos(b);return[cam.x+p[0]*cam.s,cam.y+p[1]*cam.s,b.r*cam.s];},
  obj:(n)=>{const m={funL:[FUN[0].x,FUN[0].y],funR:[FUN[1].x,FUN[1].y],button:[BTN.x,BTN.y],lever:[LEV.x+Math.cos(LEV.a)*LEV.len,LEV.y+Math.sin(LEV.a)*LEV.len],dial:[DIAL.x,DIAL.y],dialRim:[DIAL.x+DIAL.R,DIAL.y],cradle:[360,CRADLE.y-40],window:[WIN.x,WIN.y],
    notch:(()=>{const q=tpos(TRK.N,NOTCH_S);return[q.x,q.y];})(),Lmid:(()=>{const q=tpos(TRK.L,TRK.L.len*0.5);return[q.x,q.y];})(),R1mid:(()=>{const q=tpos(TRK.R1,TRK.R1.len*0.6);return[q.x,q.y];})()};
    const p=m[n];return[cam.x+p[0]*cam.s,cam.y+p[1]*cam.s];},
  cam:()=>({s:cam.s,x:cam.x,y:cam.y,SW,SH,safe:Object.assign({},safe)}),
  parts:()=>PARTS.length,
  cpu:()=>frame.cpu,
  dpr:()=>DPR
};

resize();init();
rafId=requestAnimationFrame(frame);
})();
</script>
