<body>
<canvas id="c"></canvas>

<script>
(function(){
'use strict';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let X=ctx;
const saEl=document.getElementById('sa');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const eob=t=>{t=clamp(t,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const bez=(a,b,c,t)=>(1-t)*(1-t)*a+2*(1-t)*t*b+t*t*c;
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;}
const MR=Math.random;
const seed0=(Date.now()^0x5bd1e995)>>>0;
function rngMake(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=rngMake(seed0);
const rr=(a,b)=>a+(b-a)*R();
const pick=a=>a[Math.floor(R()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

// ---------- palette (焦げ茶の部屋 + 赤・黄・緑・青・白の練り込み粘土) ----------
const P={
  wall:'#4b2d1d',wallD:'#3a2216',wallL:'#5f3b27',
  floor:'#5b3723',floorD:'#452919',floorL:'#734a31',
  base:'#2f1c10',
  red:['#c4402b','#8f2a1b','#e06c50'],
  yel:['#e3ad27','#a97b12','#f5d067'],
  grn:['#4e9b37','#326a22','#82c45b'],
  blu:['#2f6db4','#1f4a80','#5f97d6'],
  wht:['#efe6d2','#c4b8a0','#fffaf0'],
  brn:['#7a4e32','#563420','#98694a'],
  ink:'#24140b'
};
const LEAF={grass:P.grn,vine:P.yel,round:P.blu};
const POTC={grass:P.red,vine:P.yel,round:P.wht};

// ---------- clay drawing helpers ----------
const _pts=new Float32Array(64);
function blobPath(x,y,rx,ry,sd,wob,n,rot){
  n=n||12; if(wob==null)wob=0.07;
  const cr=Math.cos(rot||0),sr=Math.sin(rot||0);
  for(let i=0;i<n;i++){
    const a=i/n*TAU;
    const k=1+wob*(Math.sin(a*2+sd)*0.5+Math.sin(a*3+sd*2.3)*0.35+Math.sin(a*5+sd*0.7)*0.15);
    const px=Math.cos(a)*rx*k,py=Math.sin(a)*ry*k;
    _pts[2*i]=x+px*cr-py*sr;_pts[2*i+1]=y+px*sr+py*cr;
  }
  X.beginPath();
  X.moveTo((_pts[2*(n-1)]+_pts[0])/2,(_pts[2*(n-1)+1]+_pts[1])/2);
  for(let i=0;i<n;i++){const j=(i+1)%n;X.quadraticCurveTo(_pts[2*i],_pts[2*i+1],(_pts[2*i]+_pts[2*j])/2,(_pts[2*i+1]+_pts[2*j+1])/2);}
  X.closePath();
}
function clay(x,y,rx,ry,col,sd,o){
  o=o||{};const rot=o.rot||0,wob=o.wob==null?0.07:o.wob;
  if(!o.noShadow){X.fillStyle=col[1];blobPath(x+rx*0.05,y+ry*0.12,rx,ry,sd,wob,o.n,rot);X.fill();}
  X.fillStyle=col[0];blobPath(x,y,rx*0.96,ry*0.92,sd,wob,o.n,rot);X.fill();
  const hl=o.hl==null?0.42:o.hl;
  if(hl>0){X.globalAlpha=hl;X.fillStyle=col[2];blobPath(x-rx*0.24,y-ry*0.3,rx*0.48,ry*0.34,sd+1.3,wob*1.5,9,rot);X.fill();X.globalAlpha=1;}
  if(o.prints&&rx>5){
    X.strokeStyle=col[1];X.globalAlpha=0.32;X.lineWidth=Math.max(0.7,rx*0.035);
    const fx=x+Math.cos(sd)*rx*0.3,fy=y+Math.sin(sd*1.7)*ry*0.25;
    for(let k=1;k<=3;k++){X.beginPath();X.arc(fx,fy,rx*0.09*k,sd,sd+2.1);X.stroke();}
    X.globalAlpha=1;
  }
}
function ellipse(x,y,rx,ry,col){X.fillStyle=col;X.beginPath();X.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,TAU);X.fill();}
function shadow(x,y,rx,ry,a){X.fillStyle='rgba(18,9,4,'+(a==null?0.28:a)+')';X.beginPath();X.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,TAU);X.fill();}

// ---------- audio (Web Audio 合成) ----------
const AU={c:null,m:null,nb:null,spin:null,sw:null,rl:{}};
function auInit(){
  if(AU.c){if(AU.c.state!=='running'){try{AU.c.resume().catch(()=>{});}catch(e){}}return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let c;try{c=new AC();}catch(e){return;}
  AU.c=c;
  try{
    const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=5;comp.attack.value=0.004;comp.release.value=0.2;comp.connect(c.destination);
    const m=c.createGain();m.gain.value=0.75;m.connect(comp);AU.m=m;
    const n=Math.floor(c.sampleRate);const nb=c.createBuffer(1,n,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;AU.nb=nb;
    const o1=c.createOscillator();o1.type='triangle';o1.frequency.value=100;
    const o2=c.createOscillator();o2.type='sine';o2.frequency.value=201;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;lp.Q.value=2;
    const g=c.createGain();g.gain.value=0;
    o1.connect(lp);o2.connect(lp);lp.connect(g);g.connect(m);o1.start();o2.start();
    AU.spin={o1,o2,lp,g};
    const ns=c.createBufferSource();ns.buffer=nb;ns.loop=true;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2400;bp.Q.value=0.7;
    const sg=c.createGain();sg.gain.value=0;
    ns.connect(bp);bp.connect(sg);sg.connect(m);ns.start();
    AU.sw={g:sg,bp};
    const ub=c.createBuffer(1,1,22050);const us=c.createBufferSource();us.buffer=ub;us.connect(c.destination);us.start(0);
    if(c.state!=='running')c.resume().catch(()=>{});
  }catch(e){}
}
function okA(){return !!(AU.c&&AU.m&&AU.c.state==='running');}
function tone(f0,f1,dur,type,vol,dl,att){
  if(!okA())return;const c=AU.c,t=c.currentTime+(dl||0);
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const a=att||0.006;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+dur+0.05);
}
function nz(dur,freq,q,vol,dl,type,f1){
  if(!okA()||!AU.nb)return;const c=AU.c,t=c.currentTime+(dl||0);
  const s=c.createBufferSource();s.buffer=AU.nb;const f=c.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(freq,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q||1;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(AU.m);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);
}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
let now=0;
function rl(k,gap){if((AU.rl[k]==null?-99:AU.rl[k])>now-gap)return false;AU.rl[k]=now;return true;}
function sfx(k,a){
  if(!okA())return;
  switch(k){
  case 'pop':if(!rl('pop',0.05))return;tone(640+(a||0)*70,180,0.15,'sine',0.28);nz(0.04,1800,1.5,0.07);break;
  case 'step':if(!rl('step',0.08))return;nz(0.03,800+Math.random()*600,2,0.03);break;
  case 'pick':if(!rl('pick',0.06))return;tone(520,780,0.07,'triangle',0.08);break;
  case 'drop':if(!rl('drop',0.05))return;tone(880+(a||0)*45,1250+(a||0)*45,0.09,'triangle',0.08);tone(1700,1700,0.05,'sine',0.035,0.05);break;
  case 'tick':if(!rl('tick',0.035))return;tone(260+(a||0),260+(a||0),0.03,'square',0.018);break;
  case 'boing':if(!rl('boing',0.28))return;tone(320,170,0.28,'sine',0.14);tone(335,180,0.25,'triangle',0.05,0.02);break;
  case 'squeak':if(!rl('squeak',0.16))return;tone(1500+Math.random()*400,1950+Math.random()*300,0.08,'sine',0.032);break;
  case 'fall':if(!rl('fall',0.1))return;tone(1100,320,0.34,'triangle',0.06);nz(0.08,600,1,0.06,0.33,'lowpass');break;
  case 'land':if(!rl('land',0.06))return;nz(0.07,500,1,0.07,0,'lowpass');tone(300,180,0.08,'sine',0.06);break;
  case 'thud':tone(110,45,0.38,'sine',0.36);nz(0.2,300,0.8,0.18,0,'lowpass');break;
  case 'rumble':if(!rl('rumble',0.24))return;nz(0.26,140,0.8,0.09,0,'lowpass');break;
  case 'swap':tone(400,820,0.12,'triangle',0.12);tone(820,620,0.1,'sine',0.08,0.11);break;
  case 'ripple':if(!rl('ripple',0.08))return;tone(250,210,0.06,'sine',0.05);break;
  case 'wobble':if(!rl('wobble',0.12))return;tone(500,420,0.12,'sine',0.055);tone(530,460,0.12,'sine',0.035,0.05);break;
  case 'climb':if(!rl('climb',0.14))return;tone(600,900,0.07,'triangle',0.035);break;
  case 'pass':if(!rl('pass',0.05))return;tone(700+(a||0)*60,900+(a||0)*60,0.05,'sine',0.05);break;
  case 'success':{const b=a||72;[0,4,7,12].forEach((s,i)=>{tone(NOTE(b+s),NOTE(b+s),0.34,'triangle',0.12,i*0.09);tone(NOTE(b+s+12),NOTE(b+s+12),0.2,'sine',0.045,i*0.09);});break;}
  case 'big':{[0,7,12,16,19].forEach((s,i)=>tone(NOTE(67+s),NOTE(67+s),0.42,'triangle',0.12,i*0.08));nz(0.5,3000,0.5,0.035,0,'highpass');break;}
  case 'brig':{[0,5,9].forEach((s,i)=>tone(NOTE(79+s),NOTE(79+s),0.18,'square',0.035,i*0.07));break;}
  case 'chain':{[0,3,7,10].forEach((s,i)=>tone(NOTE(70+s),NOTE(70+s),0.16,'triangle',0.08,i*0.05));break;}
  case 'swish':nz(0.32,1200,0.7,0.12,0,'bandpass',3600);tone(500,900,0.25,'sine',0.05);break;
  case 'peel':nz(1.6,300,0.6,0.1,0,'bandpass',2400);tone(200,800,1.6,'triangle',0.08);break;
  case 'roll':nz(1.4,2400,0.6,0.07,0,'bandpass',300);tone(700,250,1.3,'triangle',0.05);break;
  case 'plant':{const sc=[0,2,4,7,9,12,14,16];const n=sc[(a||0)%sc.length];tone(NOTE(67+n),NOTE(67+n),0.5,'sine',0.18);tone(NOTE(79+n),NOTE(79+n),0.25,'triangle',0.05,0.02);break;}
  case 'party':{const mel=[72,76,79,84,79,76,81,84,88,84,79,76,72,79,84];mel.forEach((n,i)=>{tone(NOTE(n),NOTE(n),0.22,'triangle',0.1,i*0.16);if(i%2===0)tone(NOTE(n-24),NOTE(n-24),0.3,'sine',0.08,i*0.16);});break;}
  case 'peek':tone(300,620,0.15,'sine',0.1);tone(620,300,0.18,'sine',0.08,0.18);break;
  case 'gma':tone(NOTE(76),NOTE(79),0.14,'sine',0.07);tone(NOTE(79),NOTE(83),0.16,'sine',0.06,0.13);break;
  case 'shine':if(!rl('shine',0.12))return;tone(NOTE(96),NOTE(96),0.35,'sine',0.045);tone(NOTE(103),NOTE(103),0.28,'sine',0.035,0.07);break;
  case 'gift':[0,4,7,11,14].forEach((s,i)=>tone(NOTE(84+s),NOTE(84+s),0.2,'sine',0.07,i*0.06));break;
  case 'full':tone(300,300,0.12,'sine',0.05);break;
  }
}
function auUpdate(spin,brm){
  if(!okA()||!AU.spin)return;const t=AU.c.currentTime;
  const s=Math.min(1,spin/14);
  AU.spin.o1.frequency.setTargetAtTime(85+s*280,t,0.05);
  AU.spin.o2.frequency.setTargetAtTime((85+s*280)*2.01,t,0.05);
  AU.spin.lp.frequency.setTargetAtTime(380+s*1700,t,0.05);
  AU.spin.g.gain.setTargetAtTime(s>0.03?0.018+s*0.07:0,t,0.06);
  const b=Math.min(1,brm);
  AU.sw.g.gain.setTargetAtTime(b*0.13,t,0.04);
  AU.sw.bp.frequency.setTargetAtTime(1500+b*1900,t,0.05);
}

// ---------- layout ----------
let W=0,H=0,dpr=1,U=4,portrait=true;
const SA={t:0,r:0,b:0,l:0};
const L={};
let bgC=null,gbgC=null,grC=null,grX=null;
function readSA(){const cs=getComputedStyle(saEl);SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}
function computeLayout(){
  readSA();
  W=Math.max(200,window.innerWidth);H=Math.max(200,window.innerHeight);
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';
  portrait=H>=W*1.02;
  const x0=SA.l,x1=W-SA.r,y0=SA.t,y1=H-SA.b,iw=x1-x0,ih=y1-y0;
  L.x0=x0;L.x1=x1;L.y0=y0;L.y1=y1;L.iw=iw;L.ih=ih;
  if(portrait){
    L.hz=y0+ih*0.40;
    const r=Math.min(iw*0.25,ih*0.125);
    L.disc={x:x0+iw*0.60,y:y0+ih*0.685,r};
    L.win={x:x0+iw*0.56,y:y0+ih*0.055,w:iw*0.37,h:(L.hz-y0)*0.48};
    L.shelf={x:x0+iw*0.06,y:y0+(L.hz-y0)*0.46,w:iw*0.33,h:(L.hz-y0)*0.25};
    L.gma={x:x0+iw*0.16,y:y0+ih*0.655};
    L.slots=[{x:x0+iw*0.85,y:y0+ih*0.885},{x:x0+iw*0.62,y:y0+ih*0.915}];
    L.pan={x:x1-iw*0.11,y:L.hz+ih*0.075};
  }else{
    L.hz=y0+ih*0.43;
    const r=Math.min(iw*0.15,ih*0.2);
    L.disc={x:x0+iw*0.52,y:y0+ih*0.70,r};
    L.win={x:x0+iw*0.64,y:y0+ih*0.05,w:iw*0.25,h:(L.hz-y0)*0.6};
    L.shelf={x:x0+iw*0.06,y:y0+(L.hz-y0)*0.42,w:iw*0.2,h:(L.hz-y0)*0.3};
    L.gma={x:x0+iw*0.15,y:y0+ih*0.80};
    L.slots=[{x:x0+iw*0.775,y:y0+ih*0.85},{x:x0+iw*0.895,y:y0+ih*0.85}];
    L.pan={x:x1-iw*0.07,y:L.hz+ih*0.1};
  }
  U=L.disc.r/25;
  L.fh=L.y1-L.hz;L.wh=L.hz-L.y0;
}
const wx=u=>L.x0+u*L.iw, wy=v=>L.y0+v*L.wh, fx=u=>L.x0+u*L.iw, fy=v=>L.hz+v*L.fh;

// ---------- static background (粘土の部屋) ----------
function buildBG(){
  bgC=document.createElement('canvas');bgC.width=cv.width;bgC.height=cv.height;
  const g=bgC.getContext('2d');const s=dpr;g.setTransform(s,0,0,s,0,0);
  const rnd=rngMake(12345);
  // wall
  g.fillStyle=P.wall;g.fillRect(0,0,W,L.hz+2);
  for(let i=0;i<220;i++){
    const x=rnd()*W,y=rnd()*L.hz,l=(4+rnd()*14)*U*0.25,a=rnd()*TAU;
    g.strokeStyle=rnd()<0.5?'rgba(110,70,45,0.16)':'rgba(25,12,6,0.16)';g.lineWidth=(1+rnd()*2.4)*U*0.25;g.lineCap='round';
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a)*l*0.6+rnd()*4,y+Math.sin(a)*l*0.6+rnd()*4,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
  }
  for(let i=0;i<26;i++){// finger dents
    const x=rnd()*W,y=rnd()*L.hz,r=(0.8+rnd()*1.6)*U;
    g.fillStyle='rgba(25,12,6,0.18)';g.beginPath();g.ellipse(x,y,r,r*0.8,0,0,TAU);g.fill();
    g.fillStyle='rgba(120,80,55,0.14)';g.beginPath();g.ellipse(x-r*0.25,y-r*0.3,r*0.6,r*0.4,0,0,TAU);g.fill();
  }
  // wall vertical clay slabs joints
  for(let i=1;i<6;i++){const x=W*i/6+(rnd()-0.5)*20;g.strokeStyle='rgba(25,12,6,0.22)';g.lineWidth=U*0.45;g.beginPath();g.moveTo(x,0);for(let y=0;y<=L.hz;y+=L.hz/8)g.lineTo(x+(rnd()-0.5)*U*0.8,y);g.stroke();}
  // floor
  g.fillStyle=P.floor;g.fillRect(0,L.hz,W,H-L.hz);
  const gr=g.createLinearGradient(0,L.hz,0,H);gr.addColorStop(0,'rgba(20,10,5,0.32)');gr.addColorStop(0.3,'rgba(20,10,5,0)');gr.addColorStop(1,'rgba(120,80,50,0.12)');g.fillStyle=gr;g.fillRect(0,L.hz,W,H-L.hz);
  // slab seams (継ぎ目)
  let yy=L.hz+U*6,st=U*7;
  while(yy<H){g.strokeStyle='rgba(28,14,6,0.3)';g.lineWidth=U*0.5;g.beginPath();g.moveTo(0,yy);for(let x=0;x<=W;x+=W/10)g.lineTo(x,yy+(rnd()-0.5)*U*0.7);g.stroke();
    g.strokeStyle='rgba(140,95,62,0.18)';g.lineWidth=U*0.3;g.beginPath();g.moveTo(0,yy+U*0.5);g.lineTo(W,yy+U*0.5);g.stroke();
    const n=3+Math.floor(rnd()*3);for(let k=0;k<n;k++){const x=rnd()*W;g.strokeStyle='rgba(28,14,6,0.26)';g.lineWidth=U*0.45;g.beginPath();g.moveTo(x,yy);g.lineTo(x+(rnd()-0.5)*U*2,yy+st);g.stroke();}
    yy+=st;st*=1.22;}
  for(let i=0;i<160;i++){
    const x=rnd()*W,y=L.hz+rnd()*(H-L.hz),l=(3+rnd()*10)*U*0.3,a=rnd()*TAU;
    g.strokeStyle=rnd()<0.5?'rgba(130,88,58,0.14)':'rgba(25,12,6,0.14)';g.lineWidth=(1+rnd()*2)*U*0.25;g.lineCap='round';
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l*0.5);g.stroke();
  }
  // baseboard
  g.fillStyle=P.base;g.beginPath();g.moveTo(0,L.hz-U*1.6);for(let x=0;x<=W;x+=W/16)g.lineTo(x,L.hz-U*1.6+(rnd()-0.5)*U*0.6);g.lineTo(W,L.hz+U*1.2);g.lineTo(0,L.hz+U*1.2);g.closePath();g.fill();
  g.fillStyle='rgba(120,80,52,0.35)';g.fillRect(0,L.hz-U*1.7,W,U*0.5);
  // unsafe top area slightly darker (not interactive)
  // grooves canvas
  grC=document.createElement('canvas');grC.width=cv.width;grC.height=cv.height;grX=grC.getContext('2d');grX.drawImage(bgC,0,0);grX.setTransform(dpr,0,0,dpr,0,0);
}

function winCell(i){const c=i%win.cols,r=(i/win.cols)|0,m=1.4*U,w=L.win.w-2*m,h=L.win.h-2*m;return{x:L.win.x+m+(c+0.5)*w/win.cols,y:L.win.y+m+(r+0.5)*h/win.rows,w:w/win.cols,h:h/win.rows};}
function cleanFrac(){let s=0;for(let i=0;i<win.dirt.length;i++)s+=1-win.dirt[i];return s/win.dirt.length;}

}
function grab(d){const p=dpos(d);return{x:p.x,y:p.y+p.h};}
function floorOK(x,y,r){
  if(x<L.x0+r+U||x>L.x1-r-U||y<L.hz+r+1.5*U||y>L.y1-r-1.5*U)return false;
  if(dist(x,y,disc.x,disc.y)<disc.r+r+3.5*U)return false;
  if(Math.abs(x-L.gma.x)<9*U&&y>L.gma.y-34*U&&y<L.gma.y+4*U)return false;
  if(Math.abs(x-giftPos().x)<5*U&&Math.abs(y-giftPos().y)<4*U)return false;
  if(dist(x,y,broom.rx,broom.ry)<5*U)return false;
  for(const s of L.slots)if(dist(x,y,s.x,s.y)<8*U)return false;
  if(dist(x,y,pan.x,pan.y)<10*U)return false;
  return true;
}
function mkItem(kind,x,y){const k=IK[kind];return{id:uid++,kind,x,y,r:k.r*U,st:'floor',res:0,foot:0,wob:0,sd:MR()*20,rot:MR()*TAU,col:pick([P.red,P.yel,P.blu,P.wht,P.grn]),shape:Math.floor(MR()*3),push:[],moving:false,moved:0,fly:null,pushed:0};}

// ---------- round generation (毎周ちがう散らかり方) ----------
function genItems(){
  let pat=roundN===1?0:Math.floor(R()*3);if(roundN>1&&pat===MEM.lastPat)pat=(pat+1)%3;MEM.lastPat=pat;
  const centers=[];
  for(let i=0;i<4;i++){for(let t=0;t<60;t++){const x=rr(L.x0+8*U,L.x1-8*U),y=rr(L.hz+4*U,L.y1-6*U);if(!floorOK(x,y,5*U))continue;if(t<50&&centers.some(c=>dist(c.x,c.y,x,y)<Math.min(L.iw,L.fh)*0.4))continue;centers.push({x,y});break;}}
  if(!centers.length)centers.push({x:L.x0+L.iw*0.2,y:L.hz+L.fh*0.2});
  const trail=[];const ta=rr(0,TAU);
  function posFor(r){
    for(let t=0;t<60;t++){
      let x,y;
      if(pat===0){x=rr(L.x0,L.x1);y=rr(L.hz,L.y1);}
      else if(pat===1){const c=centers[Math.floor(R()*Math.min(3,centers.length))];const a=R()*TAU,d=Math.sqrt(R())*18*U;x=c.x+Math.cos(a)*d;y=c.y+Math.sin(a)*d*0.7;}
      else{const k=R();x=lerp(L.x0+6*U,L.x1-6*U,k);y=L.hz+L.fh*(0.18+0.5*k)+Math.sin(k*7+ta)*L.fh*0.16+(R()-0.5)*6*U;}
      if(floorOK(x,y,r))return{x,y};
    }
    for(let t=0;t<200;t++){const x=rr(L.x0,L.x1),y=rr(L.hz,L.y1);if(floorOK(x,y,r))return{x,y};}
    return{x:L.x0+L.iw*0.3,y:L.hz+L.fh*0.15};
  }
  const nConf=roundN===1?22:20+Math.floor(R()*5);
  for(let i=0;i<nConf;i++){const p=posFor(IK.confetti.r*U);items.push(mkItem('confetti',p.x,p.y));}
  for(let i=0;i<6;i++){const p=posFor(IK.crumb.r*U);items.push(mkItem('crumb',p.x,p.y));}
  for(let i=0;i<3;i++){const p=posFor(IK.big.r*U);items.push(mkItem('big',p.x,p.y));}
  for(let i=0;i<2;i++){const p=posFor(IK.heavy.r*U);items.push(mkItem('heavy',p.x,p.y));}
  const ng=roundN===1?1:1+Math.floor(R()*2);
  for(let i=0;i<ng;i++){const p=posFor(IK.present.r*U);items.push(mkItem('present',p.x,p.y));}
}
function genDecor(){
  decor.push({id:uid++,kind:'banner',u:0,v:0,w:0,h:0,on:true,wob:0,claim:0,grp:[],tower:null,sd:R()*9,col:P.red});
  const placed=[];const sh=L.shelf;
  placed.push({x0:sh.x-2*U,x1:sh.x+sh.w+2*U,y0:sh.y-2*U,y1:sh.y+sh.h+3*U});
  const kinds=shuffle(['garland','garland','ornament','ornament']);
  for(const k of kinds){
    const w=k==='garland'?(portrait?17:20):5.5,h=k==='garland'?6.5:(portrait?9:11);
    for(let t=0;t<80;t++){
      const u=rr(0.05+w*U/2/L.iw,0.95-w*U/2/L.iw),v=rr(0.06,0.34);
      const x=wx(u),y=wy(v),x0=x-w*U/2-U,x1=x+w*U/2+U,y0=y-U,y1=y+h*U+U;
      if(L.wh-(y+h*U-L.y0)<L.wh*0.3)continue;
      let ok=true;for(const p of placed)if(x1>p.x0&&x0<p.x1&&y1>p.y0&&y0<p.y1){ok=false;break;}
      // ornaments must not cover the glass too much
      if(ok&&k==='ornament'){const wn=L.win;if(x1>wn.x&&x0<wn.x+wn.w&&y1>wn.y+wn.h*0.3&&y0<wn.y+wn.h)ok=false;}
      if(!ok&&t<79)continue;
      placed.push({x0,x1,y0,y1});
      decor.push({id:uid++,kind:k,u,v,w,h,on:true,wob:0,claim:0,grp:[],tower:null,sd:R()*9,col:pick([P.red,P.blu,P.yel])});
      break;
    }
  }
}
function genSeam(){
  for(let t=0;t<80;t++){
    const w=portrait?0.34:0.2,h=portrait?0.09:0.11;
    const u=rr(0.05,0.92-w),v=rr(0.03,0.28);
    const x=fx(u),y=fy(v),pw=w*L.iw,ph=h*L.fh;
    const cx=clamp(disc.x,x,x+pw),cy=clamp(disc.y,y,y+ph);
    if(dist(cx,cy,disc.x,disc.y)<disc.r+3*U)continue;
    if(x<L.gma.x+6*U&&y+ph>L.gma.y-14*U)continue;
    if(dist(clamp(pan.x,x,x+pw),clamp(pan.y,y,y+ph),pan.x,pan.y)<9*U)continue;
    seam.u=u;seam.v=v;seam.w=w;seam.h=h;return;
  }
  seam.u=0.3;seam.v=0.04;seam.w=0.25;seam.h=0.08;
}
function potHome(p){
  if(p.home==='disc')return{x:disc.x,y:disc.y-0.4*U};
  if(p.home==='shelf')return{x:L.shelf.x+L.shelf.w*0.5,y:L.shelf.y+L.shelf.h*0.72};
  return L.slots[p.home]||L.slots[0];
}
function mkPot(type,home){const p={type,home,x:0,y:0,anim:null,drag:false,sd:MR()*9,wig:0,hop:0};const h=potHome(p);p.x=h.x;p.y=h.y;return p;}
function setupPots(){
  const types=['grass','vine','round'].filter(t=>MEM.found[t]);
  let start;
  if(roundN===1)start='grass';
  else{const o=types.filter(t=>t!==MEM.lastStart);start=pick(o.length?o:types);}
  MEM.lastStart=start;
  const rest=shuffle(types.filter(t=>t!==start));
  pots=[mkPot(start,'disc')];
  rest.forEach((t,i)=>pots.push(mkPot(t,i)));
  if(!MEM.found.round)pots.push(mkPot('round','shelf'));
  curType=start;MEM.potOrder.push(start);
}
function newRound(){
  roundN++;
  R=rngMake((seed0+roundN*104729)>>>0);
  items=[];decor=[];babies=[];chains=[];fallers=[];leafMem=[];brig=null;bridge=null;ending=null;
  RG={grass:0,vine:0,round:0};vineStreak=0;lightOn=false;lightK=0;roundGifts=0;cleanDelay=0;
  placeStatics();
  setupPots();
  MEM.broomP=roundN===1?0:Math.min(7,Math.floor(MEM.broomP*0.3));
  broom.power=MEM.broomP;broom.lvl=broomLvl();broom.flower=roundN>1;broom.drag=false;broom.hx=broom.rx;broom.hy=broom.ry;broom.pop=1;
  pan.fill=0;
  for(let i=0;i<win.dirt.length;i++){win.dirt[i]=0.72+R()*0.28;win.cl[i]=0;win.wig[i]=0;}
  win.half=0;
  shelf.revealed=false;shelf.content=MEM.found.round?'present':'pot';
  seam.peek=0;seam.lit=0;
  genSeam();genDecor();genItems();
  clearGrooves();
  MEM.cleaned={floor:0,wall:0,window:0};
  if(typeof buildWinView==='function')buildWinView();
  ev('round'+roundN);
}
function broomLvl(){const p=broom.power;return p<8?1:p<20?2:3;}
function broomW(){const p=broom.power;return U*(p<8?7+p*0.45:p<20?12.5+(p-8)*0.38:Math.min(23,17.5+(p-20)*0.25));}

// ---------- particles / ripples ----------
function addPart(x,y,vx,vy,life,size,col,kind){if(parts.length>=MAXP)parts.shift();parts.push({x,y,vx,vy,life,max:life,size,col,kind:kind||0,rot:MR()*TAU,vr:(MR()-0.5)*8});}
function burst(x,y,n,cols,spd,size,kind,up){for(let i=0;i<n;i++){const a=MR()*TAU,s=spd*(0.4+MR()*0.8);addPart(x,y,Math.cos(a)*s,Math.sin(a)*s-(up==null?spd*0.6:up),0.45+MR()*0.5,size*(0.6+MR()*0.7),cols[i%cols.length],kind);}}
function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.kind===0)p.vy+=U*40*dt;else if(p.kind===1){p.vy+=U*6*dt;p.vx+=Math.sin(now*5+p.rot)*U*20*dt;p.vx*=0.97;p.vy=Math.min(p.vy,U*14);}else{p.vy+=U*3*dt;p.vx*=0.97;}
    p.rot+=p.vr*dt;}
  for(let i=ripples.length-1;i>=0;i--){ripples[i].t+=dt;if(ripples[i].t>0.5)ripples.splice(i,1);}
}
function look(x,y,t){gma.ov={x,y};gma.ovT=t||1;}

// ---------- babies ----------
function mkBaby(type,x,y){return{id:uid++,type,x,y,z:0,vz:0,st:'idle',t:0,face:1,walk:0,mv:0,sc:1,sd:MR()*20,carry:null,it:null,d:null,h:null,cell:-1,wall:false,chain:null,jump:0,tend:null,sx:0,sy:0,ex:0,ey:0,dur:0,gx:0,gy:0,spot:null,sq:0,dead:false};}
function clampFloor(b){if(!b.wall){b.x=clamp(b.x,L.x0+1.5*U,L.x1-1.5*U);b.y=clamp(b.y,L.hz+1.5*U,L.y1-1*U);}}
function avoidDiscPt(o,rad){const dx=o.x-disc.x,dy=o.y-disc.y,d=Math.hypot(dx,dy),m=disc.r+rad;if(d<m){const k=d>0.01?1/d:0;o.x=disc.x+(d>0.01?dx*k:0)*m;o.y=disc.y+(d>0.01?dy*k:1)*m;return true;}return false;}
function moveTo(b,tx,ty,spd,dt,noAvoid){
  const dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy);
  if(d<=spd*dt||d<0.3){b.x=tx;b.y=ty;return true;}
  b.x+=dx/d*spd*dt;b.y+=dy/d*spd*dt;if(Math.abs(dx)>0.5)b.face=dx<0?-1:1;b.walk+=dt*spd/(2.4*U);b.mv=1;
  if(!noAvoid&&!b.wall){
    const ex=b.x-disc.x,ey=b.y-disc.y,ed=Math.hypot(ex,ey),m=disc.r+2.2*U;
    if(ed<m&&ed>0.01){b.x=disc.x+ex/ed*m;b.y=disc.y+ey/ed*m;const t1=-ey/ed,t2=ex/ed;const sg=(t1*dx+t2*dy)>=0?1:-1;b.x+=t1*sg*spd*dt*0.9;b.y+=t2*sg*spd*dt*0.9;}
  }
  if(b.walk>1){b.walk-=1;if(MR()<0.25)sfx('step');}
  return false;
}
function toFloorDrop(b){b.wall=false;b.tend=null;const fy0=clamp(Math.max(b.y,L.hz+2*U),L.hz+2*U,L.y1-1.5*U);b.z=Math.max(0,fy0-b.y)+b.z;b.y=fy0;b.st='drop';b.vz=0;b.t=0;}
function release(b){
  if(b.it){if(b.it.res===b.id)b.it.res=0;if(b.it.foot===b.id)b.it.foot=0;}
  if(b.carry){const it=b.carry;it.st='floor';it.res=0;it.z=0;it.x=b.x;it.y=clamp(b.y,L.hz+it.r+1.5*U,L.y1-it.r-1*U);b.carry=null;}
  if(b.d){const d=b.d;if(d.claim===b.id)d.claim=0;const k=d.grp.indexOf(b.id);if(k>=0)d.grp.splice(k,1);if(d.tower&&d.tower.m.indexOf(b)>=0)finishTower(d,b);}
  if(b.h){const k=b.h.push.indexOf(b.id);if(k>=0)b.h.push.splice(k,1);}
  if(b.cell>=0&&win.cl[b.cell]===b.id)win.cl[b.cell]=0;
  if(brig){const k=brig.m.indexOf(b);if(k>=0)brig.m.splice(k,1);}
  if(b.chain)leaveChain(b);
  if(bridge){const k=bridge.m.indexOf(b);if(k>=0)bridge.m.splice(k,1);}
  b.it=null;b.d=null;b.h=null;b.cell=-1;b.tend=null;b.wall=false;b.z=0;b.spot=null;
}
function leaveChain(b){
  const ch=b.chain;b.chain=null;if(!ch)return;
  const k=ch.m.indexOf(b);if(k>=0)ch.m.splice(k,1);
  if(ch.task==='ladder'){if(ch.m.length<3)ladderDown(ch);}
  else if(ch.m.length<2)dissolve(ch);
}
function dissolve(ch){
  for(const m of ch.m){m.chain=null;if(m.st==='gather'||m.st==='follow')m.st='idle';if(m.st==='ladder'){toFloorDrop(m);}}
  if(ch.lad&&ch.lad.d&&ch.lad.d.claim==='L')ch.lad.d.claim=0;
  ch.m=[];const k=chains.indexOf(ch);if(k>=0)chains.splice(k,1);
}
function nearestLightFrom(x,y){let best=null,bd=1e9;for(const it of items){if(it.st!=='floor'||it.res||it.foot||!IK[it.kind].light)continue;const d=dist(x,y,it.x,it.y);if(d<bd){bd=d;best=it;}}return best;}
function lightCount(){let n=0;for(const it of items)if(it.st==='floor'&&IK[it.kind].light)n++;return n;}
function pickHeavy(){let best=null,bs=0;for(const it of items){if(it.kind!=='heavy'||it.st!=='floor')continue;const s=it.push.length<6?it.push.length+1:0;if(s>bs){bs=s;best=it;}}return best;}
function giftPos(){return{x:L.gma.x-5*U,y:L.gma.y+1.5*U};}
function toRest(b){
  b.st='rest';b.t=0;b.dur=1.2+MR()*1.6;
  if(b.type==='grass'){
    if(lightOn){const s=seamPx();b.gx=s.x+MR()*s.w;b.gy=s.y+s.h+1.5*U+MR()*2*U;}
    else{b.gx=L.gma.x+(5+MR()*12)*U;b.gy=L.gma.y+(MR()*6-1)*U;}
  }else if(b.type==='vine'){
    if(bridge&&bridge.ph==='stay'){b.st='hangGo';b.gx=wx(0.08+MR()*0.84);b.gy=wy(bridgeV(MR()*8))+3*U;return;}
    b.gx=wx(0.1+MR()*0.8);b.gy=L.hz+2*U+MR()*3*U;
  }else{toSill(b);return;}
  b.gx=clamp(b.gx,L.x0+3*U,L.x1-3*U);b.gy=clamp(b.gy,L.hz+2*U,L.y1-2*U);
  if(dist(b.gx,b.gy,disc.x,disc.y)<disc.r+4*U)b.gy=L.hz+3*U;
}
function toSill(b){b.st='sill';b.t=0;b.gx=L.win.x+L.win.w*(0.1+MR()*0.8);}
function think(b){
  b.t=0;
  if(mode!=='room'){if(b.wall){toFloorDrop(b);return;}b.st='party';b.gx=0;return;}
  if(b.wall&&b.type!=='round'){toFloorDrop(b);return;}
  if(b.chain&&!b.chain.task){b.st='gather';return;}
  if(b.type==='grass')grassThink(b);else if(b.type==='vine')vineThink(b);else roundThink(b);
}
function joinBrig(b){release(b);b.st='brig';b.t=0;const B=brig,n=B.m.length;const dx=pan.x-B.hx,dy=pan.y-B.hy,l=dx*dx+dy*dy||1;const t=clamp(((b.x-B.hx)*dx+(b.y-B.hy)*dy)/l,0,1);B.m.splice(clamp(Math.round(t*n),1,n),0,b);}

// 円盤を回り込む道すじ（床からはみ出さない側を選ぶ）
function routeAround(ax,ay,bx,by,m,bnd){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;const t=clamp(((disc.x-ax)*dx+(disc.y-ay)*dy)/l2,0,1);

      if(y<L.hz+bnd||y>L.y1-bnd||x<L.x0+bnd||x>L.x1-bnd)bad++;pts.push([clamp(x,L.x0+bnd,L.x1-bnd),clamp(y,L.hz+bnd,L.y1-bnd)]);}

// 重いものを押して運ぶ（円盤を回り込む）

}
function heavyDir(h){if(h.dirx==null){const p=routeAround(h.x,h.y,pan.x,pan.y,disc.r+h.r+1.7*U,h.r);let q=p[1];if(p.length>2&&dist(h.x,h.y,q[0],q[1])<2.5*U)q=p[2];const dx=q[0]-h.x,dy=q[1]-h.y,d=Math.hypot(dx,dy)||1;return[dx/d,dy/d];}return[h.dirx,h.diry];}
function separateHeavy(){

    for(let j=i+1;j<items.length;j++){const b=items[j];if(b.st!=='floor'||(b.kind!=='heavy'&&b.kind!=='big'))continue;
      let dx=b.x-a.x,dy=b.y-a.y;if(Math.abs(dx)+Math.abs(dy)<0.01){dx=(MR()-0.5)*0.2;dy=(MR()-0.5)*0.2;}const d=Math.hypot(dx,dy)||0.01,m=(a.r+b.r)*0.85;
      if(d<m){const k=Math.min(m-d,4*U*0.016*60)/2;const ux=dx/d,uy=dy/d;if(!a.moving){a.x-=ux*k;a.y-=uy*k;}if(!b.moving){b.x+=ux*k;b.y+=uy*k;}

}
function updItems(dt){
  let gone=false;

      if(!it.roll&&it.pk>14&&broomLvl()>=2){it.roll=1;ev('big_roll');sfx('success',69);look(it.x,it.y,1);}

// ---------- brigade (一列のバケツリレー) ----------
function maybeBrig(){
  if(brig||mode!=='room')return;
  let free=0;for(const it of items)if(it.st==='floor'&&IK[it.kind].light&&!it.foot)free++;
  if(free<4)return;
  const gr=babies.filter(b=>!b.dead&&b.type==='grass'&&!b.chain&&b.st!=='drag'&&b.st!=='home'&&b.st!=='atHeavy');
  if(gr.length<5)return;
  const av=gr.filter(b=>!b.carry&&(b.st==='idle'||b.st==='rest'||b.st==='fetch'||b.st==='poke'||b.st==='toHeavy'));
  if(av.length<3)return;
  av.sort((a,b)=>dist(b.x,b.y,pan.x,pan.y)-dist(a.x,a.y,pan.x,pan.y));
  const m=av.slice(0,8);
  for(const b of m){release(b);b.st='brig';b.t=0;}
  brig={m,hx:m[0].x,hy:m[0].y,tgt:null,pass:[]};
  ev('brigade');sfx('brig');look(m[0].x,m[0].y,1.2);
}
function endBrig(){
  if(!brig)return;
  for(const ps of brig.pass){ps.it.st='floor';ps.it.z=0;ps.it.y=clamp(ps.it.y,L.hz+ps.it.r+1.5*U,L.y1-ps.it.r);}
  if(brig.tgt&&brig.tgt.res===-1)brig.tgt.res=0;
  for(const b of brig.m)if(b.st==='brig')b.st='idle';
  brig=null;brigCheck=3;
}
// 列は円盤の縁を回り込んで並ぶ
function brigPath(ax,ay,bx,by){return routeAround(ax,ay,bx,by,disc.r+3.2*U,2*U);}
function updBrig(dt){
  const B=brig;B.m=B.m.filter(b=>!b.dead&&b.st==='brig');const n=B.m.length;
  if(n<3){endBrig();return;}
  if(B.tgt&&B.tgt.st!=='floor'){B.tgt=null;}
  if(!B.tgt){let bd=1e9;for(const it of items){if(it.st!=='floor'||!IK[it.kind].light||it.foot)continue;const d=dist(B.hx,B.hy,it.x,it.y);if(d<bd){bd=d;B.tgt=it;}}
    if(B.tgt){const t=B.tgt;if(t.res>0){const o=byId(t.res);if(o&&o.it===t){o.it=null;if(o.st==='fetch')o.st='idle';}}t.res=-1;}}
  if(!B.tgt&&!B.pass.length){endBrig();return;}
  if(B.tgt){const it=B.tgt,dx=it.x-B.hx,dy=it.y-B.hy,d=Math.hypot(dx,dy),sp=15*U;
    if(d<it.r+1.8*U){it.st='brig';it.res=0;B.pass.push({it,seg:0,t:0});B.tgt=null;sfx('pick');B.m[0].sq=0.4;}
    else{const s=Math.min(d,sp*dt);B.hx+=dx/d*s;B.hy+=dy/d*s;}}
  const path=brigPath(B.hx,B.hy,pan.x-6.5*U,pan.y+1.2*U);
  let tot=0;const segL=[];for(let i=1;i<path.length;i++){const l=dist(path[i-1][0],path[i-1][1],path[i][0],path[i][1]);segL.push(l);tot+=l;}
  for(let i=0;i<n;i++){const b=B.m[i];let sL=tot*i/(n-1),j=0;while(j<segL.length-1&&sL>segL[j]){sL-=segL[j];j++;}
    const k=segL[j]>0?clamp(sL/segL[j],0,1):0;const tx=lerp(path[j][0],path[j+1][0],k),ty=lerp(path[j][1],path[j+1][1],k)+Math.sin(i*1.3)*0.6*U;
    moveTo(b,tx,ty,i===0?20*U:17*U,dt);clampFloor(b);if(i<n-1){const nb=B.m[i+1];b.face=nb.x>b.x?1:-1;}}
  for(let j=B.pass.length-1;j>=0;j--){const ps=B.pass[j];ps.t+=dt/0.15;
    if(ps.t>=1){ps.t=0;ps.seg++;sfx('pass',ps.seg);const mb=B.m[Math.min(ps.seg,n-1)];if(mb)mb.sq=0.35;
      if(ps.seg>=n-1){const lb=B.m[n-1];throwToPan(ps.it,lb.x,lb.y-7*U);B.pass.splice(j,1);continue;}}
    const a=B.m[Math.min(ps.seg,n-1)],c=B.m[Math.min(ps.seg+1,n-1)];
    ps.it.x=lerp(a.x,c.x,ps.t);ps.it.y=lerp(a.y,c.y,ps.t);ps.it.z=7.5*U+Math.sin(ps.t*Math.PI)*4*U;}
}

// ---------- chains (連なり) ----------
function nearestFreeDecorX(x){let best=null,bd=1e9;for(const d of decor){if(!d.on||d.claim||d.tower)continue;const s=Math.abs(grab(d).x-x);if(s<bd){bd=s;best=d;}}return best;}
function assignChain(ch){

  if(t==='vine'&&ch.m.length>=3){const d=nearestFreeDecorX(ch.m[0].x);if(d){d.claim='L';ch.task='ladder';ch.lad={d,ph:'go',t:0,x:clamp(grab(d).x,L.x0+3*U,L.x1-3*U),step:0,p:null};ch.m.forEach(b=>{b.st='ladder';});ev('ladder');return;}}
  if(t==='round'&&winDirty()&&ch.m.length>=2){ch.task='row';ch.row=dirtiestRow();ch.m.forEach(b=>{b.st='idle';});ev('chain_row');return;}

function updChains(dt){

      if(ch.m.length<2){if(now-ch.lastAdd>0.9)dissolve(ch);continue;}
      if(now-ch.lastAdd>0.75&&ch.m.every(b=>b.st!=='born'))assignChain(ch);

    }
    if(ch.task==='ladder')updLadder(ch,dt);
    else if(ch.task==='row'&&!winDirty())dissolve(ch);

function ladSlot(Ld,i){return{x:Ld.x+Math.sin(i*1.9+now*2.5)*0.9*U,y:L.hz+1.6*U-i*Ld.step};}
function ladderDown(ch){

  if(ch.lad&&ch.lad.d&&ch.lad.d.claim==='L')ch.lad.d.claim=0;

function updLadder(ch,dt){
  const Ld=ch.lad,m=ch.m,n=m.length;Ld.t+=dt;

  const by=L.hz+1.6*U;

    const lead=m[0];const arrived=moveTo(lead,Ld.x,by,SPD.vine*U*1.3,dt);clampFloor(lead);
    for(let i=1;i<n;i++){const p=m[i-1],b=m[i];if(dist(b.x,b.y,p.x,p.y)>2.6*U)moveTo(b,p.x,p.y,SPD.vine*U*1.4,dt);clampFloor(b);}
    if(arrived&&Ld.t>0.3){Ld.ph='form';Ld.t=0;Ld.p=m.map(b=>[b.x,b.y]);Ld.step=(by-grab(Ld.d).y)/(n-0.6);sfx('chain');}

    if(Ld.d.on)Ld.d.wob=1;sfx('climb');
    if(Ld.t>=0.45){if(Ld.d.on)detachDecor(Ld.d,'ladder');const nd=nearestFreeDecorX(Ld.x);
      if(nd){nd.claim='L';Ld.d=nd;Ld.ph='move';Ld.t=0;Ld.fx=Ld.x;Ld.tx=clamp(grab(nd).x,L.x0+3*U,L.x1-3*U);Ld.fs=Ld.step;Ld.ts=(by-grab(nd).y)/(n-0.6);}
      else ladderDown(ch);}
    return;
  }
  if(Ld.ph==='move'){const k=ease(Ld.t/0.9);Ld.x=lerp(Ld.fx,Ld.tx,k);Ld.step=lerp(Ld.fs,Ld.ts,k);
    for(let i=0;i<n;i++){const s=ladSlot(Ld,i);m[i].x=s.x;m[i].y=s.y-Math.sin(k*Math.PI)*1.5*U*(i%2?1:-1);}

}

// ---------- vine tower (支え合い) ----------
function startTower(d,m){
  const g=grab(d);d.claim='T';d.tower={m,t:0,x:clamp(g.x,L.x0+3*U,L.x1-3*U),p:m.map(b=>[b.x,b.y]),climb:false};
  for(const b of m){const k=d.grp.indexOf(b.id);if(k>=0)d.grp.splice(k,1);b.st='tower';b.t=0;}
  ev('tower_start');sfx('chain');look(g.x,g.y,1.2);
}
function finishTower(d,except){
  const T=d.tower;if(!T)return;d.tower=null;if(d.claim==='T')d.claim=0;
  for(const b of T.m){if(b===except||b.dead)continue;b.d=null;b.tend=null;if(b.wall||b.z>0){b.wall=false;const fy0=L.hz+2*U;b.z=Math.max(b.z,fy0-b.y);b.y=fy0;b.x=T.x+(MR()-0.5)*4*U;b.st='drop';b.vz=0;}else b.st='idle';}
}
function updTower(d,dt){
  const T=d.tower;T.t+=dt;const [a,b,c]=T.m;
  if(!alive(a)||!alive(b)||!alive(c)||a.st!=='tower'||b.st!=='tower'||c.st!=='tower'){finishTower(d);return;}
  const by=L.hz+2*U,bx=T.x,hs=5.4*U,t=T.t;const g=grab(d);
  if(!d.on&&t<2.5){finishTower(d);return;}
  const k0=ease(t/0.3);a.x=lerp(T.p[0][0],bx,k0);a.y=lerp(T.p[0][1],by,k0);a.z=0;a.sq=t>0.3&&t<2.9?0.15:0;
  if(t<0.65){const k=ease((t-0.3)/0.35);b.x=lerp(T.p[1][0],bx,k);b.y=lerp(T.p[1][1],by,k);b.z=k*hs+Math.sin(k*Math.PI)*3*U;}
  else if(t<2.9){b.x=bx;b.y=by;b.z=hs;b.sq=0.1;}
  const ct=hs*2;
  if(t<1.0){const k=ease((t-0.6)/0.4);c.x=lerp(T.p[2][0],bx,k);c.y=lerp(T.p[2][1],by,k);c.z=k*ct+Math.sin(k*Math.PI)*3*U;}
  else if(t<2.1){if(!T.climb){T.climb=true;c.wall=true;c.sx=bx;c.sy=by-ct;c.ex=g.x;c.ey=g.y;c.tend=true;c.z=0;}const k=ease((t-1.0)/1.1);c.x=lerp(c.sx,c.ex,k);c.y=lerp(c.sy,c.ey,k);sfx('climb');}
  else if(t<2.5){d.wob=1;c.x=c.ex+Math.sin(t*40)*0.5*U;c.y=c.ey;}
  else if(t<3.0){if(d.on)detachDecor(d,'tower');const k=ease((t-2.5)/0.5);c.x=lerp(c.ex,c.sx,k);c.y=lerp(c.ey,c.sy,k);}
  else{c.wall=false;c.tend=null;c.x=bx;c.y=by;c.z=ct;finishTower(d);}
}
function updDecors(dt){
  for(const d of decor){

// ---------- bridge (壁いっぱいのつる橋) ----------
function bridgeU(i,n){return 0.05+0.9*(n<=1?0.5:i/(n-1));}
function bridgeV(i){return 0.3+Math.sin(i*1.4)*0.04;}
function checkBridge(){
  if(bridge||mode!=='room')return;
  const left=decor.filter(d=>d.on);
  if(vineStreak<9||left.length<2)return;
  const ok=['idle','rest','toBase','baseWait','toFoot','gather','hangGo','born'];
  const vs=babies.filter(b=>!b.dead&&b.type==='vine'&&ok.indexOf(b.st)>=0);
  if(vs.length<5)return;
  const m=vs.slice(0,9);
  for(const b of m){release(b);b.st='bridge';b.t=0;b.sx=b.x;b.sy=b.y;b.z=0;}
  m.sort((a,b)=>a.x-b.x);
  bridge={m,ph:'gather',t:0,n:m.length,wave:-1};
  ev('bridge');sfx('chain');sfx('success',77);look(L.x0+L.iw/2,wy(0.3),2);
}
function updBridge(dt){
  const B=bridge;B.t+=dt;B.m=B.m.filter(b=>!b.dead&&b.st==='bridge');const m=B.m,n=m.length;
  if(n>0)B.n=n;
  if(B.ph==='gather'){const k=ease(B.t/1.3);m.forEach((b,i)=>{const tx=wx(bridgeU(i,n)),ty=L.hz+2*U;b.x=lerp(b.sx,tx,k);b.y=lerp(b.sy,ty,k);b.z=Math.abs(Math.sin(k*Math.PI*3))*2*U;b.face=tx>b.sx?1:-1;});

// ---------- ending → garden ----------
function leaderType(){let best='grass',bv=-1;for(const t of ['grass','vine','round']){const v=RG[t]+(t===curType?0.5:0);if(v>bv){bv=v;best=t;}}return best;}

function spotPx(s){return{x:fx(s.u),y:fy(s.v)};}

function buildGarden(){

  const ok=[];
  for(const c of C){const x=fx(c[0]),y=fy(c[1]);

    for(const o of ok)if(dist(x,y,fx(o.u),fy(o.v))<11*U)bad=true;

function drawFloorObjects(){

function drawRoll(y,col,r){

    else if(p.kind===2){X.fillStyle=p.col;const r=p.size;X.beginPath();X.moveTo(p.x-r,p.y);X.lineTo(p.x,p.y-r*0.3);X.lineTo(p.x+r,p.y);X.lineTo(p.x,p.y+r*0.3);X.fill();X.beginPath();X.moveTo(p.x,p.y-r);X.lineTo(p.x+r*0.3,p.y);X.lineTo(p.x,p.y+r);X.lineTo(p.x-r*0.3,p.y);X.fill();}
    else if(p.kind===3){X.fillStyle=p.col;X.beginPath();X.ellipse(p.x,p.y,p.size,p.size*0.6,p.rot,0,TAU);X.fill();}
    else{X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y,p.size,0,TAU);X.fill();}}

  for(const r of ripples){const k=r.t/0.5;X.strokeStyle='rgba(30,15,7,'+(0.45*(1-k)).toFixed(3)+')';X.lineWidth=U*0.6*(1-k)+0.5;X.beginPath();X.ellipse(r.x,r.y,(1+k*3.5)*U,(0.7+k*2.4)*U,0,0,TAU);X.stroke();
    X.strokeStyle='rgba(150,105,70,'+(0.3*(1-k)).toFixed(3)+')';X.beginPath();X.ellipse(r.x,r.y+U*0.4,(1+k*3.5)*U,(0.7+k*2.4)*U,0,0,TAU);X.stroke();}
  drawFocus();drawHand();
}
function drawFocus(){
  const f=focus;if(!f)return;let x=f.x,y=f.y;
  if(f.k==='baby'&&f.o){x=f.o.x;y=f.o.y-f.o.z-4*U;}

function handPoint(){

// ---------- guidance (いまの誘いは一つだけ) ----------
let focusBounce=1.2;
function calcFocus(){
  const DISC={k:'disc',x:disc.x,y:disc.y,r:disc.r*1.12};
  if(mode==='garden'){
    if(!G||G.party)return null;
    const free=G.spots.filter(s=>!s.deco&&!s.res);if(!free.length)return null;
    let held=null;for(const r of PT.values())if(r.role==='baby'&&r.o&&!r.o.dead)held=r.o;
    if(held){let best=null,bd=1e9;for(const s of free){const p=spotPx(s);const d=dist(held.x,held.y,p.x,p.y);if(d<bd){bd=d;best=p;}}return{k:'spot',x:best.x,y:best.y,r:6.5*U};}
    const bs=babies.filter(b=>!b.dead&&(b.st==='party'||b.st==='drop'));
    if(!bs.length)return DISC;
    const sp=spotPx(free[0]);let bb=null,bd=1e9;for(const b of bs){const d=dist(b.x,b.y,sp.x,sp.y);if(d<bd){bd=d;bb=b;}}
    return{k:'baby',o:bb,x:bb.x,y:bb.y-4*U,r:6*U,to:sp};
  }
  if(mode!=='room')return null;
  const cnt={grass:0,vine:0,round:0};for(const b of babies)if(!b.dead)cnt[b.type]++;
  const nb=cnt.grass+cnt.vine+cnt.round;
  const light=lightCount()>0;let big=false,heavy=false;for(const i of items){if(i.st==='floor'){if(i.kind==='big')big=true;if(i.kind==='heavy')heavy=true;}}
  const dec=decor.some(d=>d.on),wd=winDirty(),lv=broomLvl();
  const PT_=t=>{const p=pots.find(q=>q.type===t&&q.home!=='disc');if(!p)return null;if(p.home==='shelf'&&!shelf.revealed)return null;return{k:'pot',o:p,x:p.x,y:p.y-4*U,r:7*U};};
  const BROOM={k:'broom',x:broom.hx,y:broom.hy,r:Math.max(6*U,broomW()*0.65)};
  if(nb<3)return DISC;
  if(curType==='grass'&&light&&cnt.grass<5)return DISC;
  if(big&&lv>=2)return BROOM;
  if(dec&&curType!=='vine'&&(cnt.grass>=5||!light))return PT_('vine')||DISC;
  if(curType==='vine'&&dec&&cnt.vine<6)return DISC;
  if(shelf.revealed&&wd&&curType!=='round'&&PT_('round'))return PT_('round');
  if(curType==='round'&&wd&&cnt.round<5)return DISC;
  if((light||heavy)&&curType!=='grass'&&cnt.grass<5)return PT_('grass')||DISC;
  if(heavy&&cnt.grass<4)return DISC;
  if(big)return lv>=2?BROOM:(curType==='grass'?DISC:(PT_('grass')||DISC));
  if(heavy)return curType==='grass'?DISC:(PT_('grass')||DISC);
  if(wd){if(curType==='round')return DISC;return PT_('round')||DISC;}
  if(light)return curType==='grass'?DISC:(PT_('grass')||DISC);
  if(lightOn){const s=seamPx();return{k:'seam',x:s.x+s.w/2,y:s.y+s.h/2,r:Math.max(s.w,s.h)*0.6};}
  return DISC;
}
function bounceFocus(){
  const f=focus;if(!f)return;
  if(f.k==='disc')disc.wig=0.55;
  else if(f.k==='pot'&&f.o){f.o.wig=1;f.o.hop=1;}
  else if(f.k==='broom')broom.pop=0.7;
  else if(f.k==='baby'&&f.o)f.o.jump=1;
}
function updHand(dt){
  if(hand){hand.t+=dt;if(hand.t>hand.dur)hand=null;return;}
  if(MEM.handShown)return;
  if((mode==='room'||mode==='garden')&&now-lastInput>4&&focus&&PT.size===0){hand={k:focus.k,f:focus,t:0,dur:focus.k==='disc'?3.0:2.4};MEM.handShown=true;ev('hand_'+focus.k);}
}

// ---------- input (Pointer Events, 一本指で完結) ----------
const PT=new Map();
function ptPos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function hitTest(x,y){
  if(mode==='peel'||mode==='back')return{role:'none'};
  for(const p of pots){if(p.home==='disc'||p.anim)continue;if(p.home==='shelf'&&!shelf.revealed)continue;if(dist(x,y,p.x,p.y-3.5*U)<Math.max(26,6.5*U))return{role:'pot',o:p};}
  if(mode==='room'&&broomHit(x,y))return{role:'broom'};
  if(dist(x,y,disc.x,disc.y)<disc.r*1.12+4)return{role:'disc'};
  let bb=null,bd=1e9;
  for(const b of babies){if(b.dead||b.st==='born'||b.st==='home'||b.st==='tower'||b.st==='ladder'||b.st==='bridge')continue;const d=dist(x,y,b.x,b.y-b.z-3*U);if(d<Math.max(22,5*U)&&d<bd){bd=d;bb=b;}}
  if(bb)return{role:'baby',o:bb};
  if(mode==='garden'){
    const tp=treePx();if(dist(x,y,tp.x,tp.y-(12+G.tree.lvl*4)*U)<(7+G.tree.lvl)*U||Math.abs(x-tp.x)<2.5*U&&y<tp.y&&y>tp.y-16*U)return{role:'tree'};
    for(const s of G.spots){const p=spotPx(s);if(!s.deco&&dist(x,y,p.x,p.y)<6*U)return{role:'spot',o:s};}
    if(Math.abs(x-L.gma.x)<7*U&&y<L.gma.y+2*U&&y>L.gma.y-32*U)return{role:'gma'};
    return{role:'none'};
  }
  const s=seamPx();if(x>s.x-2*U&&x<s.x+s.w+2*U&&y>s.y-2*U&&y<s.y+s.h+2*U)return{role:'seam'};
  const w=L.win;if(x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h)return{role:'win'};
  for(const d of decor){if(!d.on)continue;const p=dpos(d);if(Math.abs(x-p.x)<p.w/2+U&&y>p.y-2*U&&y<p.y+p.h+2*U)return{role:'decor',o:d};}
  for(const it of items){if(it.st==='floor'&&(it.kind==='big'||it.kind==='heavy')&&dist(x,y,it.x,it.y)<it.r+2*U)return{role:'item',o:it};}
  if(Math.abs(x-L.gma.x)<7*U&&y<L.gma.y+2*U&&y>L.gma.y-32*U)return{role:'gma'};
  return{role:'none'};
}
function discDown(rec){
  const a=Math.atan2(rec.y-disc.y,rec.x-disc.x),d=dist(rec.x,rec.y,disc.x,disc.y);
  rec.la=a;rec.ld=d;disc.ptrs.push(rec.id);disc.held=disc.ptrs.length;
  addDent(d>disc.r*0.45?a:Math.PI*0.35,d>disc.r*0.45?0.14:0.09);disc.sqv-=3.2;disc.fa=a;disc.fd=d>disc.r*0.5?1:0.35;
  if(Math.abs(disc.av)<2)disc.av+=(disc.av>=0?1:-1)*1.6;
  if(now-disc.lastTap>0.22){disc.lastTap=now;discSpawn(d>disc.r*0.4?a:null,true);disc.acc=0;}
  if(disc.ptrs.length===2){const r1=PT.get(disc.ptrs[0]);if(r1)disc.twoA=Math.atan2(rec.y-r1.y,rec.x-r1.x);ev('two_finger');}
}
function discMove(rec,p){
  rec.x=p.x;rec.y=p.y;
  const tn=performance.now(),dtm=clamp((tn-rec.lt)/1000,0.008,0.1);rec.lt=tn;
  let delta=0;
  if(disc.ptrs.length>=2){
    if(rec.id!==disc.ptrs[0]&&rec.id!==disc.ptrs[1])return;
    const a=PT.get(disc.ptrs[0]),b=PT.get(disc.ptrs[1]);if(!a||!b)return;
    const ang=Math.atan2(b.y-a.y,b.x-a.x);delta=angDiff(ang,disc.twoA);disc.twoA=ang;
  }else{
    const d=dist(p.x,p.y,disc.x,disc.y),a=Math.atan2(p.y-disc.y,p.x-disc.x);
    if(d>disc.r*0.3&&rec.ld>disc.r*0.3)delta=angDiff(a,rec.la);
    rec.la=a;rec.ld=d;disc.fa=a;disc.fd=clamp(1-Math.abs(d-disc.r*0.9)/(disc.r*0.6),0.2,1);
  }
  delta=clamp(delta,-0.9,0.9);
  if(delta!==0){disc.ang+=delta;addSpin(Math.abs(delta));const inst=clamp(delta/dtm,-22,22);disc.av=disc.av*0.55+inst*0.45;disc.lastMove=now;}
}
function begin(rec){
  switch(rec.role){
  case 'disc':discDown(rec);break;
  case 'pot':{const q=rec.o;q.drag=true;rec.ox=q.x-rec.x;rec.oy=q.y-rec.y;q.wig=1;sfx('pick');look(q.x,q.y,0.6);break;}
  case 'broom':broom.drag=true;rec.ox=broom.hx-rec.x;rec.oy=broom.hy-rec.y;broom.tx=broom.hx;broom.ty=broom.hy;sfx('pick');break;
  case 'baby':{const b=rec.o;release(b);b.st='drag';b.wall=false;b.z=0;rec.ox=b.x-rec.x;rec.oy=b.y-rec.y;sfx('pick');b.sq=0.4;break;}
  case 'seam':seam.peek=Math.max(seam.peek,0.9);sfx('peek');ev(lightOn?'seam_peek_lit':'seam_peek');{const s=seamPx();look(s.x+s.w/2,s.y,0.8);}break;
  case 'win':{const w=L.win;const c=clamp(Math.floor((rec.x-w.x)/w.w*win.cols),0,win.cols-1),r=clamp(Math.floor((rec.y-w.y)/w.h*win.rows),0,win.rows-1);win.wig[r*win.cols+c]=1;sfx('squeak');break;}
  case 'decor':rec.o.wob=1;sfx('wobble');break;
  case 'item':rec.o.wob=1;sfx('wobble');break;
  case 'gma':gma.laugh=Math.max(gma.laugh,0.6);sfx('gma');break;
  case 'tree':G.tree.shake=1;{const tp=treePx();burst(tp.x,tp.y-(14+G.tree.lvl*4)*U,10,[P.red[0],P.yel[0],P.wht[2]],12*U,0.9*U,3);}sfx('shine');ev('tree_shake');break;
  case 'spot':{const s=rec.o;let bb=null,bd=1e9;for(const b of babies){if(b.dead||b.st!=='party')continue;const p=spotPx(s);const d=dist(b.x,b.y,p.x,p.y);if(d<bd){bd=d;bb=b;}}if(bb&&!s.res){s.res=bb.id;bb.spot=s;bb.st='toSpot';bb.t=0;sfx('pick');}else{ripples.push({x:rec.x,y:rec.y,t:0});sfx('ripple');}break;}
  default:ripples.push({x:rec.x,y:rec.y,t:0});sfx('ripple');
  }
}
function onDown(e){
  if(e.cancelable)e.preventDefault();
  auInit();lastInput=now;if(hand){hand=null;}
  if(PT.size>=6)return;
  const p=ptPos(e);const h=hitTest(p.x,p.y);
  const rec={id:e.pointerId,role:h.role,o:h.o,x:p.x,y:p.y,sx:p.x,sy:p.y,t0:now,moved:0,la:0,ld:0,lt:performance.now(),ox:0,oy:0};
  if(rec.role==='pot'&&rec.o.drag)rec.role='none';
  if(rec.role==='broom'&&broom.drag)rec.role='none';
  if(rec.role==='baby'&&rec.o.st==='drag')rec.role='none';
  if(rec.role==='disc'&&disc.ptrs.length>=2)rec.role='none';
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  PT.set(e.pointerId,rec);
  begin(rec);
  focusT=0;
}
function onMove(e){
  const rec=PT.get(e.pointerId);if(!rec)return;if(e.cancelable)e.preventDefault();
  const p=ptPos(e);rec.moved=Math.max(rec.moved,dist(p.x,p.y,rec.sx,rec.sy));
  switch(rec.role){
  case 'disc':discMove(rec,p);break;
  case 'pot':{const q=rec.o;if(!q.drag){rec.role='none';break;}q.x=clamp(p.x+rec.ox,L.x0+3*U,L.x1-3*U);q.y=clamp(p.y+rec.oy,L.y0+8*U,L.y1);break;}
  case 'broom':broom.tx=p.x+rec.ox;broom.ty=p.y+rec.oy;break;
  case 'baby':{const b=rec.o;if(b.dead||b.st!=='drag'){rec.role='none';break;}b.x=clamp(p.x+rec.ox,L.x0+2*U,L.x1-2*U);b.y=clamp(p.y+rec.oy,L.y0+6*U,L.y1-1*U);break;}
  }
  rec.x=p.x;rec.y=p.y;
}
function roomDrop(b){
  const w=L.win;
  if(b.type==='round'&&winDirty()&&b.x>w.x-6*U&&b.x<w.x+w.w+6*U&&b.y>w.y-6*U&&b.y<w.y+w.h+9*U){b.wall=true;b.x=clamp(b.x,w.x+U,w.x+w.w-U);b.y=clamp(b.y,w.y+U,w.y+w.h-U);roundThink(b);ev('drop_window');sfx('squeak');return;}
  const fy0=clamp(b.y,L.hz+2*U,L.y1-1.5*U);b.z=Math.max(0,fy0-b.y)+3*U;b.y=fy0;b.st='drop';b.vz=0;b.t=0;avoidDiscPt(b,2.4*U);clampFloor(b);
}
function endPtr(id,cancel){
  const rec=PT.get(id);if(!rec)return;PT.delete(id);
  try{if(cv.hasPointerCapture&&cv.hasPointerCapture(id))cv.releasePointerCapture(id);}catch(_){}
  switch(rec.role){
  case 'disc':{const k=disc.ptrs.indexOf(id);if(k>=0)disc.ptrs.splice(k,1);disc.held=disc.ptrs.length;
    if(disc.held>=1){const r2=PT.get(disc.ptrs[0]);if(r2){r2.la=Math.atan2(r2.y-disc.y,r2.x-disc.x);r2.ld=dist(r2.x,r2.y,disc.x,disc.y);r2.lt=performance.now();}}
    if(disc.held===2){const a=PT.get(disc.ptrs[0]),b=PT.get(disc.ptrs[1]);if(a&&b)disc.twoA=Math.atan2(b.y-a.y,b.x-a.x);}
    if(!disc.held){disc.sqv+=3;if(cancel)disc.av*=0.5;}break;}
  case 'pot':{const q=rec.o;q.drag=false;
    if(cancel){potAnim(q);break;}
    if(rec.moved<12&&now-rec.t0<0.6)swapPot(q);
    else if(dist(q.x,q.y,disc.x,disc.y)<disc.r*1.35)swapPot(q);
    else{potAnim(q);sfx('wobble');}break;}
  case 'broom':broom.drag=false;break;
  case 'baby':{const b=rec.o;if(b.dead||b.st!=='drag')break;if(mode==='garden'&&G)gardenDrop(b,rec.moved<12&&!cancel);else roomDrop(b);break;}
  }
  focusT=0;
}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',e=>{if(e.cancelable)e.preventDefault();auInit();endPtr(e.pointerId,false);},{passive:false});
document.addEventListener('touchend',()=>auInit(),{passive:true});
cv.addEventListener('pointercancel',e=>endPtr(e.pointerId,true),{passive:false});
cv.addEventListener('lostpointercapture',e=>{if(PT.has(e.pointerId))endPtr(e.pointerId,false);});
window.addEventListener('pointerup',e=>{if(PT.has(e.pointerId))endPtr(e.pointerId,false);});
window.addEventListener('blur',()=>{for(const id of Array.from(PT.keys()))endPtr(id,true);});
const stop=e=>{if(e.cancelable)e.preventDefault();};
['touchstart','touchmove','touchend','gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart'].forEach(n=>document.addEventListener(n,stop,{passive:false}));
document.addEventListener('wheel',stop,{passive:false});

// ---------- main update ----------
function update(dt){
  now+=dt;
  updDisc(dt);updPots(dt);updGma(dt);
  if(mode==='room'){
    updBroom(dt);updItems(dt);updFallers(dt);updDecors(dt);updChains(dt);
    if(brig)updBrig(dt);else{brigCheck-=dt;if(brigCheck<0){brigCheck=0.5;maybeBrig();}}
    if(bridge)updBridge(dt);
    updWindow(dt);
    if(!broom.drag&&lightCount()===0&&broomLvl()<2&&items.some(i=>i.st==='floor'&&i.kind==='big')){broom.power=8;levelUp(2);}
    if(roomClean()){cleanDelay+=dt;if(cleanDelay>1.0)startEnding();}else cleanDelay=0;
  }else if(mode==='peel')updPeel(dt);
  else if(mode==='garden')updGarden(dt);
  else if(mode==='back')updBack(dt);
  for(const b of babies)if(!b.dead)updBaby(b,dt);
  let anyDead=false;for(const b of babies)if(b.dead){anyDead=true;break;}
  if(anyDead)babies=babies.filter(b=>!b.dead);
  for(const p of pots)if(p.hop>0)p.hop=Math.max(0,p.hop-dt*2.5);
  seam.peek=Math.max(0,seam.peek-dt*1.1);
  updParts(dt);
  focusT-=dt;if(focusT<=0){focusT=0.5;focus=calcFocus();}
  focusBounce-=dt;if(focusBounce<=0){focusBounce=2.2;bounceFocus();}
  updHand(dt);
  auUpdate(Math.abs(disc.av),broom.spd||0);
}

// ---------- resize / boot / loop ----------
function relayout(){
  const old={x0:L.x0,iw:L.iw,hz:L.hz,fh:L.fh};
  computeLayout();placeStatics();buildBG();buildWinView();if(G)buildGardenBG();
  if(!old.iw)return;
  const mx=x=>L.x0+(x-old.x0)/old.iw*L.iw,my=y=>L.hz+(y-old.hz)/old.fh*L.fh;
  for(const id of Array.from(PT.keys()))endPtr(id,true);
  if(brig)endBrig();
  for(const ch of chains.slice()){if(ch.task==='ladder')ladderDown(ch);else dissolve(ch);}
  for(const d of decor){if(d.tower)finishTower(d);d.claim=0;d.grp=[];}
  for(const it of items){it.r=IK[it.kind].r*U;if(it.st==='floor'||it.st==='carried'){it.x=mx(it.x);it.y=my(it.y);const o={x:it.x,y:it.y};avoidDiscPt(o,it.r+U);it.x=clamp(o.x,L.x0+it.r,L.x1-it.r);it.y=clamp(o.y,L.hz+it.r+U,L.y1-it.r);}}
  for(const f of fallers){f.x=mx(f.x);f.ty=my(f.ty);}
  for(const b of babies){if(b.dead||b.st==='bridge')continue;const wasWall=b.wall||b.y<old.hz;release(b);b.x=mx(b.x);b.y=wasWall?L.hz+2*U:my(b.y);b.z=0;b.st='idle';clampFloor(b);avoidDiscPt(b,2.4*U);}
  for(const p of pots){p.anim=null;p.drag=false;const h=potHome(p);p.x=h.x;p.y=h.y;}
  disc.ptrs=[];disc.held=0;broom.drag=false;
}
let resizeQ=false;
function onResize(){if(resizeQ)return;resizeQ=true;requestAnimationFrame(()=>{resizeQ=false;relayout();});}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);
let running=true,rafId=0,lastT=0;
function frame(t){
  rafId=0;if(!running)return;
  let dt=(t-lastT)/1000;lastT=t;if(!(dt>0))dt=1/60;if(dt>0.05)dt=0.05;
  update(dt);render();
  rafId=requestAnimationFrame(frame);
}
function pause(){running=false;if(rafId){cancelAnimationFrame(rafId);rafId=0;}for(const id of Array.from(PT.keys()))endPtr(id,true);if(AU.c&&AU.c.state==='running'){try{AU.c.suspend().catch(()=>{});}catch(e){}}}
function resume(){if(running&&rafId)return;running=true;lastT=performance.now();if(!rafId)rafId=requestAnimationFrame(frame);if(AU.c){try{AU.c.resume().catch(()=>{});}catch(e){}}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else resume();});
window.addEventListener('pagehide',pause);
window.addEventListener('pageshow',()=>{if(!document.hidden)resume();});

computeLayout();placeStatics();buildBG();
newRound();
lastT=performance.now();rafId=requestAnimationFrame(frame);

// 検証用の読み取りフック（画面には何も出さない）
window.__kk={
  st:()=>{const ty={grass:0,vine:0,round:0};for(const b of babies)if(!b.dead)ty[b.type]++;const ik={};for(const i of items)if(i.st==='floor')ik[i.kind]=(ik[i.kind]||0)+1;
    return{mode,round:roundN,babies:liveCount(),types:ty,items:ik,decor:decor.filter(d=>d.on).length,win:Math.round(cleanFrac()*100)/100,light:lightOn,broom:broom.power,lvl:broomLvl(),cur:curType,chains:chains.length,brig:!!brig,bridge:bridge?bridge.ph:null,shelf:shelf.revealed,focus:focus?focus.k:null,hand:!!hand,running,parts:parts.length,dents:disc.dents.length,now:Math.round(now*10)/10,garden:G?{spots:G.spots.length,planted:G.planted,lead:G.lead,party:!!G.party}:null,inp:{pt:PT.size,held:disc.held,bd:broom.drag,pd:pots.some(p=>p.drag),bdrag:babies.filter(b=>!b.dead&&b.st==='drag').length},audio:AU.c?AU.c.state:'none',mem:{order:MEM.potOrder.slice(),grown:Object.assign({},MEM.grown),found:Object.assign({},MEM.found),gardens:MEM.gardens.length,presents:MEM.presents}};},
  ev:()=>EV.slice(),
  geo:()=>({W,H,U,disc:{x:disc.x,y:disc.y,r:disc.r},pots:pots.map(p=>({type:p.type,home:p.home,x:p.x,y:p.y})),broom:{x:broom.hx,y:broom.hy,rx:broom.rx,ry:broom.ry,w:broomW()},win:Object.assign({},L.win),shelf:Object.assign({},L.shelf),seam:seamPx(),pan:{x:pan.x,y:pan.y},gma:Object.assign({},L.gma),hz:L.hz,sa:Object.assign({},SA),
    spots:G?G.spots.map(s=>Object.assign(spotPx(s),{deco:!!s.deco})):[],tree:G?treePx():null,
    babies:babies.filter(b=>!b.dead).map(b=>({id:b.id,x:b.x,y:b.y-b.z,type:b.type,st:b.st,wall:b.wall})),
    items:items.filter(i=>i.st==='floor').map(i=>({kind:i.kind,x:i.x,y:i.y,r:i.r})),decor:decor.filter(d=>d.on).map(d=>Object.assign(grab(d),{kind:d.kind}))}),
  step:(sec)=>{const n=Math.round(sec*60);for(let i=0;i<n;i++)update(1/60);render();},
  place:(kind,k,x,y)=>{const it=items.filter(i=>i.kind===kind&&i.st==='floor')[k];if(it){it.x=x;it.y=y;}return !!it;}
};
})();
