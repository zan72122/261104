<style>

canvas{position:fixed;left:0;top:0;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none}
#sa{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);visibility:hidden;pointer-events:none}

<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function(){
'use strict';
// =====================================================================
//  かつん、くるん！チョーク仕立屋の変身ステージ   (gf-261104-13)
//  衣装をおじさんへドラッグ → その場で能力を披露 → 痕跡（水・足跡・走路）が
//  次の衣装の反応を変える → 三か所そろって舞台へ → 色つき公演
// =====================================================================
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const easeOut=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t)*(1-t);};
const rnd=(a,b)=>a+Math.random()*(b-a);
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function hash(a,b){let h=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}

const cv=document.getElementById('c');
let ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');

// ---------- chalk colours (accent: yellow + cyan only) ----------
const RGB={w:[244,242,231],y:[247,222,106],c:[138,214,234],p:[238,196,170],d:[24,48,39]};
const BOARD='#1f4034';
function makeGrain(rgb,holes,seed,streak){
  const n=96,c=document.createElement('canvas');c.width=c.height=n;
  const g=c.getContext('2d'),id=g.createImageData(n,n),d=id.data;
  for(let i=0;i<n*n;i++){
    const x=i%n,y=(i/n)|0;
    const r=hash(i,seed),r2=hash(i*7+3,seed+11);
    let a=r<holes?0:(0.42+0.58*r2);
    const s=Math.sin(x*0.55+y*(streak||0.3)+hash(y>>2,seed)*5);
    if(s>0.86)a*=0.25;
    if(hash(x>>3,(y>>3)+seed*13)<0.12)a*=0.55;
    d[i*4]=rgb[0];d[i*4+1]=rgb[1];d[i*4+2]=rgb[2];d[i*4+3]=Math.round(a*255);
  }
  g.putImageData(id,0,0);
  return ctx.createPattern(c,'repeat');
}
const PAT={},RUB={};
for(const k of ['w','y','c','p','d']){PAT[k]=makeGrain(RGB[k],0.2,k.charCodeAt(0),0.3);RUB[k]=makeGrain(RGB[k],0.58,k.charCodeAt(0)+40,1.2);}

// ---------- layout ----------
let W=0,H=0,DPR=1,DPRcap=2,portrait=false;
const SA={t:0,r:0,b:0,l:0};
const L={};
function readSA(){
  try{const s=getComputedStyle(saEl);SA.t=parseFloat(s.paddingTop)||0;SA.r=parseFloat(s.paddingRight)||0;SA.b=parseFloat(s.paddingBottom)||0;SA.l=parseFloat(s.paddingLeft)||0;}catch(e){}
}
function layout(){
  W=Math.max(200,window.innerWidth||document.documentElement.clientWidth||390);
  H=Math.max(200,window.innerHeight||document.documentElement.clientHeight||844);
  DPR=Math.min(2,DPRcap,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  readSA();
  portrait=H>W*1.05;
  const fr=Math.max(9,Math.min(W,H)*0.018);L.fr=fr;
  const ix=Math.max(SA.l,fr)+6,iy=Math.max(SA.t,fr)+6,ir=W-Math.max(SA.r,fr)-6,ib=H-Math.max(SA.b,fr*1.6)-6;
  const iw=ir-ix,ih=ib-iy;
  L.in={x:ix,y:iy,w:iw,h:ih};
  if(portrait){
    L.rail={x:ix,y:iy,w:iw,h:ih*0.17};
    L.stage={x:ix+iw*0.05,y:iy+ih*0.19,w:iw*0.9,h:ih*0.25};
    L.floor={x:ix,y:iy+ih*0.44,w:iw,h:ih*0.56};
    L.U=Math.min(ih*0.315/300,iw*0.8/300);
    L.P={puddle:[0.27,0.66],boots:[0.12,0.47],home:[0.5,0.7],bucket:[0.87,0.42]};
    L.vMin=0.3;
    L.kF=0.8;
  }else{
    L.rail={x:ix,y:iy,w:iw*0.44,h:ih*0.4};
    L.stage={x:ix+iw*0.48,y:iy,w:iw*0.52,h:ih*0.47};
    L.floor={x:ix,y:iy+ih*0.47,w:iw,h:ih*0.53};
    L.U=Math.min(ih*0.45/300,iw*0.5/300);
    L.P={puddle:[0.2,0.62],boots:[0.075,0.52],home:[0.31,0.64],bucket:[0.43,0.42]};
    L.vMin=0.18;
    L.kF=0.72;
  }
  const sp=L.rail.w/6;L.sp=sp;
  L.itemS=Math.min(L.U*1.2,sp/70);
  L.railY=L.rail.y+Math.max(10,L.rail.h*0.08);
  L.puddleRx=72*L.U;L.puddleRy=19*L.U;
  // fountain on stage apron
  L.fount={x:L.stage.x+L.stage.w*0.5,y:L.stage.y+L.stage.h-8*L.U};
  buildBG();
}
function fl(u,v,R){R=R||L.floor;return [R.x+u*R.w,R.y+v*R.h];}
function toUV(x,y,R){R=R||L.floor;return [(x-R.x)/R.w,(y-R.y)/R.h];}

// ---------- blackboard background (cached) ----------
let BGC=null;
function buildBG(){
  const c=document.createElement('canvas');c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);
  const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle=BOARD;g.fillRect(0,0,W,H);
  // rubbed clouds (eraser swipes)
  g.lineCap='round';g.lineJoin='round';
  for(let i=0;i<18;i++){
    g.strokeStyle=RUB.w;g.globalAlpha=0.035+Math.random()*0.035;g.lineWidth=30+Math.random()*70;
    g.beginPath();let x=Math.random()*W,y=Math.random()*H;g.moveTo(x,y);
    for(let k=0;k<5;k++){x+=rnd(-160,160);y+=rnd(-60,60);g.lineTo(x,y);}g.stroke();
  }
  // dark patches
  for(let i=0;i<10;i++){g.strokeStyle=RUB.d;g.globalAlpha=0.25;g.lineWidth=40+Math.random()*60;g.beginPath();const x=Math.random()*W,y=Math.random()*H;g.moveTo(x,y);g.lineTo(x+rnd(-200,200),y+rnd(-40,40));g.stroke();}
  // ghost scribbles (old erased chalk)
  for(let i=0;i<9;i++){
    g.strokeStyle=PAT.w;g.globalAlpha=0.05;g.lineWidth=2+Math.random()*2;
    g.beginPath();let cx=Math.random()*W,cy=Math.random()*H;
    for(let a=0;a<TAU*1.6;a+=0.3){const r=14+a*6;g.lineTo(cx+Math.cos(a)*r+a*8,cy+Math.sin(a)*r*0.6);}g.stroke();
  }
  // speckles
  g.globalAlpha=1;
  const n=Math.min(14000,(W*H/80)|0);
  for(let i=0;i<n;i++){const x=Math.random()*W,y=Math.random()*H;g.fillStyle=Math.random()<0.55?'rgba(255,255,255,0.045)':'rgba(0,0,0,0.07)';g.fillRect(x,y,1+Math.random()*1.6,1+Math.random()*1.6);}
  // wooden frame
  const fr=L.fr;
  g.fillStyle='#4b3423';
  g.fillRect(0,0,W,fr);g.fillRect(0,H-fr*1.6,W,fr*1.6);g.fillRect(0,0,fr,H);g.fillRect(W-fr,0,fr,H);
  g.strokeStyle='rgba(120,86,56,0.55)';g.lineWidth=1;
  for(let i=0;i<40;i++){
    const t=Math.random();g.beginPath();
    if(i%4===0){g.moveTo(0,H*t);g.lineTo(fr,H*t+rnd(-30,30));}
    else if(i%4===1){g.moveTo(W-fr,H*t);g.lineTo(W,H*t+rnd(-30,30));}
    else if(i%4===2){g.moveTo(W*t,rnd(1,fr-1));g.lineTo(W*t+rnd(40,160),rnd(1,fr-1));}
    else {const yy=H-rnd(1,fr*1.6-1);g.moveTo(W*t,yy);g.lineTo(W*t+rnd(40,160),yy+rnd(-1,1));}
    g.stroke();
  }
  g.strokeStyle='rgba(0,0,0,0.45)';g.lineWidth=2;g.strokeRect(fr,fr,W-fr*2,H-fr*2.6);
  // tray: chalk sticks + eraser
  const ty=H-fr*1.6;
  g.fillStyle='rgba(30,20,12,0.5)';g.fillRect(fr,ty,W-fr*2,fr*0.35);
  const sticks=[['w',0.62],['y',0.68],['c',0.72],['w',0.3]];
  for(const [k,px] of sticks){g.fillStyle=PAT[k];g.globalAlpha=0.95;g.fillRect(W*px,ty+fr*0.25,fr*2.4,fr*0.55);}
  g.globalAlpha=1;g.fillStyle='#6b5038';g.fillRect(W*0.82,ty+fr*0.05,fr*4,fr*0.8);g.fillStyle=RUB.w;g.globalAlpha=0.6;g.fillRect(W*0.82,ty+fr*0.6,fr*4,fr*0.3);
  g.globalAlpha=1;
  BGC=c;
}

// ---------- chalk drawing kit ----------
let REV=1,SEED=1,NI=0;
function sd(s){SEED=s;NI=0;}
function nz(){NI++;return hash(NI,SEED)-0.5;}
// wobbly straight stroke appended to the current path
function wl(x1,y1,x2,y2,amp,k,cont){
  if(amp===undefined)amp=1.1;k=k||3;
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,px=-dy/len,py=dx/len;
  const n0=nz()*amp;
  if(REV<=0){for(let i=1;i<=k;i++)nz();return;}
  if(cont)ctx.lineTo(x1+px*n0,y1+py*n0);else ctx.moveTo(x1+px*n0,y1+py*n0);
  let stop=false;
  for(let i=1;i<=k;i++){
    const t=i/k,n=nz()*amp*(i===k?0.6:1);
    if(stop)continue;
    if(t>REV){ctx.lineTo(x1+dx*REV,y1+dy*REV);stop=true;continue;}
    ctx.lineTo(x1+dx*t+px*n,y1+dy*t+py*n);
  }
}
// wobbly polyline (flat array)
function wp(p,closed,amp){
  if(amp===undefined)amp=0.8;
  const n=p.length>>1;if(n<2)return;
  const m=closed?n:n-1,lim=REV>=1?m:REV*m;
  const x=p[0]+nz()*amp,y=p[1]+nz()*amp;
  if(REV<=0){for(let s=1;s<=m;s++){nz();nz();}return;}
  ctx.moveTo(x,y);
  for(let s=1;s<=m;s++){
    const j=(s%n)*2,nx=nz()*amp,ny=nz()*amp;
    if(s>lim){if(s-1<lim){const f=lim-(s-1),pj=((s-1)%n)*2;ctx.lineTo(lerp(p[pj],p[j],f),lerp(p[pj+1],p[j+1],f));}continue;}
    ctx.lineTo(p[j]+nx,p[j+1]+ny);
  }
  if(closed&&REV>=1)ctx.closePath();
}
function ep(cx,cy,rx,ry,a0,a1,n,jit){
  n=n||16;if(jit===undefined)jit=0.05;const o=[];
  for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,r=1+nz()*jit;o.push(cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r);}
  return o;
}
function qp(x1,y1,cx,cy,x2,y2,n){const o=[];n=n||6;for(let i=0;i<=n;i++){const t=i/n,a=(1-t)*(1-t),b=2*(1-t)*t,c=t*t;o.push(a*x1+b*cx+c*x2,a*y1+b*cy+c*y2);}return o;}
function well(cx,cy,rx,ry,n,jit){wp(ep(cx,cy,rx,ry,0,TAU,n||18,jit),false,0.4);}
function ink(col,w,a){
  if(a===undefined)a=0.92;
  ctx.strokeStyle=PAT[col];ctx.lineWidth=w;ctx.globalAlpha=a;ctx.stroke();
  ctx.lineWidth=w*0.45;ctx.globalAlpha=Math.min(1,a*0.85);ctx.stroke();
}
function rub(col,a){if(REV<1)return;ctx.fillStyle=RUB[col];ctx.globalAlpha=a;ctx.fill();}
let TINT=0;
function tint(col,a){if(REV<1)return;ctx.fillStyle=RUB[col];ctx.globalAlpha=a;ctx.fill();if(TINT>0.01){ctx.fillStyle=PAT[col];ctx.globalAlpha=TINT*0.6;ctx.fill();}}
function shade(a){if(REV<1)return;ctx.fillStyle=BOARD;ctx.globalAlpha=a===undefined?0.92:a;ctx.fill();}
function dark(a){if(REV<1)return;ctx.fillStyle='#10241c';ctx.globalAlpha=a===undefined?0.95:a;ctx.fill();}
function dot(x,y,r,col,a){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=PAT[col];ctx.globalAlpha=a===undefined?0.95:a;ctx.fill();}

// ---------- items ----------
const ITEMS=[
  {id:'boots',slot:'shoe',kind:'boot',rail:-1,dh:52,sh:46},
  {id:'skates',slot:'shoe',kind:'skate',rail:0,dh:44,sh:34},
  {id:'tap',slot:'shoe',kind:'tap',rail:1,dh:20,sh:13},
  {id:'cape',slot:'coat',rail:2,dh:80},
  {id:'apron',slot:'coat',rail:3,dh:82},
  {id:'rain',slot:'hat',rail:4,dh:34},
  {id:'top',slot:'hat',rail:5,dh:52},
];
const IT={};
ITEMS.forEach((m,i)=>{m.seed=300+i*37;m.x=0;m.y=0;m.st='home';m.sqx=1;m.sqy=1;m.rot=0;m.t=0;m.wig=0;m.fx=0;m.fy=0;m.lift=0;m.tried=0;IT[m.id]=m;});

const BOOT=[-10,-46,-11,-8,-9,0,16,0,21,-4,19,-11,9,-15,9,-46];
const SKATE=[-10,-32,-11,-6,15,-6,21,-9,18,-17,7,-21,8,-32];
const TAPS=[-10,-12,-11,-1,16,-1,20,-4,17,-9,4,-12];
function drawShoe(kind,mirror,wet){
  ctx.save();if(mirror)ctx.scale(-1,1);
  if(kind==='boot'){
    ctx.beginPath();wp(BOOT,true,0.7);shade(0.95);rub('y',0.8);ink('w',3.2);
    ctx.beginPath();well(-0.5,-46,10,3,10);ink('w',2.4);
    ctx.beginPath();wl(-11,1,18,1,0.5,3);ink('w',3.8);
    ctx.beginPath();wl(-5,-40,-5,-16,0.5,2);ink('w',1.6,0.55);
    if(wet>0){ctx.beginPath();wl(-9,-6,17,-6,0.6,3);ink('c',2.2,0.7*Math.min(1,wet));}
  }else if(kind==='skate'){
    ctx.beginPath();wp(SKATE,true,0.7);shade(0.95);rub('w',0.55);ink('w',3);
    ctx.beginPath();wl(-12,-4,21,-4,0.5,3);ink('w',3.4);
    for(let i=0;i<3;i++){const x=-6+i*10.5;ctx.beginPath();well(x,1,4.6,4.6,9,0.06);rub('c',0.85);ink('w',1.8);}
    ctx.beginPath();wl(5,-28,11,-22,0.4,1);wl(11,-28,5,-22,0.4,1);wl(6,-22,12,-16,0.4,1);ink('y',1.6,0.9);
  }else{
    ctx.beginPath();wp(TAPS,true,0.6);dark(0.97);ink('w',2.8);
    ctx.beginPath();wl(-1,-11,6,-3,0.4,2);ink('y',2.6);
    ctx.beginPath();ctx.rect(4,-6,4,3.4);rub('y',0.9);
    ctx.beginPath();wl(-11,1.6,-3,1.6,0.3,1);wl(9,1.6,19,1.6,0.3,1);ink('w',2.4);
  }
  ctx.restore();
}
function drawCapeFlat(){
  ctx.beginPath();wp([-15,-38,-36,34,-20,40,-6,35,8,40,22,35,36,38,15,-38],true,0.8);shade();rub('c',0.7);ink('w',3);
  ctx.beginPath();wp([-15,-38,-4,-28,0,-38,4,-28,15,-38],false,0.5);ink('w',2.4);
  ctx.beginPath();wl(-14,-10,-24,30,0.8,3);wl(12,-10,22,30,0.8,3);ink('w',1.4,0.5);
  drawStar(0,-30,5);
}
function drawStar(x,y,r){
  const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.45:r;p.push(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
  ctx.beginPath();wp(p,true,0.3);rub('y',0.95);ink('y',1.4);
}
// apron in tailor coords (y from -218 to -80)
function drawApron(drum,colorA){
  ctx.beginPath();wp([-15,-202,15,-202,16,-152,25,-150,28,-84,0,-80,-28,-84,-25,-150,-16,-152],true,0.8);
  shade(0.9);rub('w',0.42+colorA*0.2);ink('w',3);
  ctx.beginPath();wl(-14,-201,-10,-220,0.5,2);wl(14,-201,10,-220,0.5,2);ink('w',2.2);
  ctx.beginPath();wl(-25,-151,-36,-146,0.5,1);wl(25,-151,36,-146,0.5,1);ink('w',2);
  // drum peeking / out of pocket
  if(drum>0.02){
    const dy=-122-drum*30;
    ctx.beginPath();ctx.rect(-10,dy-6,20,13);rub('c',0.85);ctx.beginPath();wp([-10,dy-6,-10,dy+7,10,dy+7,10,dy-6],false,0.4);ink('w',2);
    ctx.beginPath();well(0,dy-6,10,3.2,10);shade(0.6);ink('w',2);
    ctx.beginPath();wl(-10,dy-1,-3,dy+6,0.3,1);wl(-3,dy-1,4,dy+6,0.3,1);wl(4,dy-1,10,dy+5,0.3,1);ink('y',1.4);
  }
  ctx.beginPath();wp([-12,-140,12,-140,11,-113,-11,-113],true,0.6);shade(0.9);rub('y',0.85);ink('w',2.4);
  ctx.beginPath();wl(-9,-133,9,-133,0.4,2);ink('w',1.3,0.6);
  if(drum<=0.02){ctx.beginPath();well(0,-141,8,2.6,8);ink('c',2,0.8);}
}
function drawRainHat(){
  ctx.beginPath();wp(ep(0,4,37,8,0,TAU,18,0.03),false,0.4);shade(0.95);rub('y',0.85);ink('w',3);
  ctx.beginPath();wp([-19,3].concat(ep(0,3,19,23,Math.PI,TAU,10,0.03)),false,0.5);shade(0.95);rub('y',0.85);ink('w',3);
  ctx.beginPath();wl(0,-19,0,2,0.5,2);wl(-11,-15,-8,2,0.4,2);wl(11,-15,8,2,0.4,2);ink('w',1.3,0.55);
}
function drawTopHat(){
  ctx.beginPath();wp([-15,2,-17,-42,17,-42,15,2],true,0.6);dark(0.97);ink('w',3);
  ctx.beginPath();well(0,-42,17,4,12);dark(0.9);ink('w',2.4);
  ctx.beginPath();ctx.rect(-15.5,-9,31,7);rub('y',0.95);
  ctx.beginPath();wp(ep(0,3,29,6,0,TAU,16,0.03),false,0.4);dark(0.6);ink('w',3);
  ctx.beginPath();wl(-9,-36,-9,-14,0.4,2);ink('w',1.4,0.4);
}
function drawItemDisplay(it){
  sd(it.seed);
  switch(it.id){
    case 'boots':case 'skates':case 'tap':{
      const g=it.dh/2;ctx.save();ctx.translate(-14,g);drawShoe(it.kind,true,0);ctx.restore();
      ctx.save();ctx.translate(14,g);drawShoe(it.kind,false,0);ctx.restore();break;}
    case 'cape':drawCapeFlat();break;
    case 'apron':ctx.save();ctx.scale(0.62,0.62);ctx.translate(0,141);drawApron(0,0);ctx.restore();break;
    case 'rain':ctx.save();ctx.translate(0,6);drawRainHat();ctx.restore();break;
    case 'top':ctx.save();ctx.translate(0,20);drawTopHat();ctx.restore();break;
  }
}

// ---------- tailor drawing ----------
function limb(ax,ay,bx,by,l1,l2,side){
  let dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy)||1;const mx0=l1+l2-0.5;
  if(d>mx0){bx=ax+dx/d*mx0;by=ay+dy/d*mx0;dx=bx-ax;dy=by-ay;d=mx0;}
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const mx=ax+dx*a/d,my=ay+dy*a/d;

function tube(p,w1,w2,rc,ra,lw){
  const L1=[],R1=[];
  for(let i=0;i<3;i++){
    const x=p[i*2],y=p[i*2+1];
    let nx=0,ny=0;
    if(i>0){const dx=x-p[i*2-2],dy=y-p[i*2-1],l=Math.hypot(dx,dy)||1;nx+=-dy/l;ny+=dx/l;}
    if(i<2){const dx=p[i*2+2]-x,dy=p[i*2+3]-y,l=Math.hypot(dx,dy)||1;nx+=-dy/l;ny+=dx/l;}
    const l=Math.hypot(nx,ny)||1,w=lerp(w1,w2,i/2)/2;
    L1.push(x+nx/l*w,y+ny/l*w);R1.push(x-nx/l*w,y-ny/l*w);
  }
  const poly=L1.concat([R1[4],R1[5],R1[2],R1[3],R1[0],R1[1]]);
  ctx.beginPath();ctx.moveTo(poly[0],poly[1]);for(let i=2;i<poly.length;i+=2)ctx.lineTo(poly[i],poly[i+1]);ctx.closePath();
  shade(0.95);if(ra>0)tint(rc,ra);
  ctx.beginPath();wp(L1,false,0.6);wp(R1,false,0.6);ink('w',lw||2.6);
}

function polyLen(p){let l=0;for(let i=2;i<p.length;i+=2)l+=Math.hypot(p[i]-p[i-2],p[i+1]-p[i-1]);return l;}
function polyAt(p,t){

// ---------- wearing ----------
function grabItem(it){

  it.st='drag';it.sqy=0.68;it.sqx=1.25;it.tried=1;

function liftItem(it){

}
function wearItem(it,fromX,fromY){
  const slot=it.slot,old=T.worn[slot];
  if(old&&old!==it.id){const o=IT[old];const sp=slotPt(slot);o.st='fly';o.fx=sp[0];o.fy=sp[1];o.t=0;}
  it.st='snap';it.fx=fromX;it.fy=fromY;it.t=0;

}
function finishWear(it){
  it.st='worn';T.worn[it.slot]=it.id;
  const sp=slotPt(it.slot);
  // seams run around the item + powder
  for(let i=0;i<14;i++){const a=i/14*TAU;addPart({k:'dust',x:sp[0]+Math.cos(a)*30*L.U,y:sp[1]+Math.sin(a)*22*L.U,vx:-Math.sin(a)*90,vy:Math.cos(a)*60,life:-i*0.025,max:0.55,r:3.4,col:'y'});}

  if(it.id==='boots')note('boots');
  // ensemble-time hat swap
  if(it.slot==='hat'&&T.act&&T.act.type==='dance'&&T.worn.coat==='apron'){if(note('d5b'))success(sp[0],sp[1]);}
  onWear(it);
}
function onWear(it){
  const k=shoeKind();
  switch(it.id){
    case 'boots':setAct(inPuddle()?actJump(1):actHopTo(L.P.puddle[0],L.P.puddle[1]+0.02,()=>setAct(actJump(1))));break;
    case 'skates':setAct(actTwirl(1,0.7,'skate'));break;
    case 'tap':setAct(actDance());break;
    case 'cape':
      if(k==='skate'&&S.roads.length)setAct(actRoad(S.roads[S.roads.length-1]));
      else setAct(actTwirl(1,0.6,'cape'));break;
    case 'apron':
      if(k==='tap')setAct(actDance());else{drumPop();}break;
    case 'rain':case 'top':
      if(it.id==='top'){T.hatLV=-260;}
      if(k==='boot')setAct(actWait(0.9,()=>setAct(inPuddle()?actJump(1):actHopTo(L.P.puddle[0],L.P.puddle[1]+0.02,()=>setAct(actJump(1))))));
      break;
  }
}
function drumPop(){T.drumT=1.4;sfx('drum',1);setTimeoutG(0.25,()=>sfx('drum',0.6));const sp=slotPt('coat');dust(sp[0],sp[1]+20*L.U,8,'c',70,3);}
// game-time timers (pause with the loop)

// ---------- water ----------
function hatBrim(){
  const h=T.worn.hat;if(!h)return null;
  const y=(h==='rain'?276:331)+T.jy;
  return {x:T.sx+Math.sin(T.lean)*y*T.k,y:T.sy-Math.cos(T.lean)*y*T.k,hw:(h==='rain'?42:24)*T.k,kind:h};
}
function solveT(y0,vy0,ty,g){const a=0.5*g,b=vy0,c=y0-ty,disc=b*b-4*a*c;if(disc<0)return null;return(-b+Math.sqrt(disc))/(2*a);}
function aimDrop(d,tx,ty,apex){
  const g=G();let vy0=-Math.sqrt(2*g*Math.max(10,(d.y-ty)+apex));
  const t=solveT(d.y,vy0,ty,g)||0.6;d.vy=vy0;d.vx=(tx-d.x)/t;
}
function addDrop(d){if(S.drops.length>=MAXDROPS)S.drops.shift();S.drops.push(d);return d;}
function splash(x,y,power){
  const U=L.U,n=Math.max(3,Math.round(10*power)),br=hatBrim();
  const [bx,by]=bucketPos();
  for(let i=0;i<n;i++){
    const d={x:x+rnd(-12,12)*U,y:y-4*U,vx:0,vy:0,ground:y+rnd(-6,10)*U,hat:false,alt:i%2,defl:false,toF:false,py:y};
    if(br){
      const g=G(),apex=rnd(18,40)*U;const vy0=-Math.sqrt(2*g*Math.max(20,(d.y-br.y)+apex));
      const tu=solveTUp(d.y,vy0,br.y,g);d.vy=vy0;d.vx=(br.x+rnd(-0.6,0.6)*br.hw-d.x)/Math.max(0.05,tu);d.hat=true;
    }else{
      aimDrop(d,bx+rnd(-1.25,1.25)*20*U,by-40*U,rnd(110,170)*U);d.ground=by-2*U;
    }
    d.py=d.y;addDrop(d);
  }
  S.ripples.push({x,y,r:L.puddleRx*0.7,t:0,max:0.9});if(S.ripples.length>6)S.ripples.shift();
  dust(x,y,6,'c',120,3);
  sfx('splash',power);
}
function solveTUp(y0,vy0,ty,g){const a=0.5*g,b=vy0,c=y0-ty,disc=b*b-4*a*c;if(disc<0)return 0.2;return(-b-Math.sqrt(disc))/(2*a);}
function deflect(d,br){
  d.defl=true;d.hat=false;
  const U=L.U,tilt=T.tilt,F=L.floor;
  const [bx,by]=bucketPos();
  dust(d.x,d.y,1,'c',40,2);
  if(br.kind==='rain'){
    const dir=tilt!==0?tilt:(d.alt?1:-1);
    if(dir>0){aimDrop(d,bx+rnd(-0.8,0.8)*18*U,by-40*U,rnd(20,50)*U);d.ground=by;d.rainB=1;}
    else{const tx=Math.max(F.x+10,d.x-rnd(80,180)*U);d.ground=clamp(T.sy+rnd(-26,20)*U,F.y+8,F.y+F.h-6);aimDrop(d,tx,d.ground,rnd(20,50)*U);d.rainF=1;}
    sfx('drip');
  }else{
    const f=L.fount;
    if(tilt>0){aimDrop(d,f.x+rnd(-16,16)*U,f.y-4*U,rnd(120,170)*U);d.toF=true;d.ground=f.y+30*U;}
    else if(tilt<0){const tx=Math.max(F.x+10,d.x-rnd(200,320)*U);d.ground=clamp(T.sy+rnd(-30,20)*U,F.y+8,F.y+F.h-6);aimDrop(d,tx,d.ground,rnd(140,190)*U);d.rainF=1;}
    else{d.vy=-rnd(560,680)*U;d.vx=rnd(-40,40)*U;d.ground=T.sy;d.back=1;}
    sfx('pon');
  }
}
let plunkCD=0;
function updDrops(dt){
  const g=G(),U=L.U;const [bx,by]=bucketPos();const f=L.fount;const br=hatBrim();
  for(let i=S.drops.length-1;i>=0;i--){
    const d=S.drops[i];d.py=d.y;d.vy+=g*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;
    if(d.hat&&br&&d.vy<0&&d.y<=br.y&&d.py>br.y&&Math.abs(d.x-br.x)<br.hw*1.3){deflect(d,br);continue;}
    if(d.hat&&d.vy>0)d.hat=false;
    if(d.vy>0){
      const my=by-40*U;
      if(!FIN.on&&d.py<my&&d.y>=my&&Math.abs(d.x-bx)<22*U){
        S.drops.splice(i,1);catchBucket();if(d.rainB){if(note('d1b'))success(bx,my);}continue;}
      if(!FIN.on&&d.toF&&d.py<f.y-4*U&&d.y>=f.y-4*U&&Math.abs(d.x-f.x)<30*U){
        S.drops.splice(i,1);S.fburst=Math.min(1,S.fburst+0.1);S.fount=Math.min(1,S.fount+0.01);dust(f.x,f.y-6*U,3,'c',80,3);
        if(plunkCD<=0){sfx('plunk',1.4);plunkCD=0.08;}if(note('d1b'))success(f.x,f.y-40*U);continue;}
      if(d.y>=d.ground){
        S.drops.splice(i,1);
        const [u,v]=toUV(d.x,d.ground);
        if(d.back&&inPuddle()){S.puddleG=Math.min(1.45,S.puddleG+0.012);}
        else if(!FIN.on&&u>0&&u<1&&v>0&&v<1){addWet(u,v);if(d.rainF){if(note('d1b'))success(d.x,d.ground-30*U);}}
        dust(d.x,d.ground,2,'c',50,2.5);
        continue;
      }
    }
    if(d.y>H+40||d.x<-40||d.x>W+40)S.drops.splice(i,1);
  }
}
function catchBucket(){
  const [bx,by]=bucketPos();
  if(S.bucket>=1){ // overflow spills onto the floor
    const d={x:bx,y:by-40*L.U,vx:rnd(-160,160)*L.U,vy:-rnd(100,200)*L.U,ground:by+rnd(-4,14)*L.U,py:0};addDrop(d);
  }
  S.bucket=Math.min(1,S.bucket+0.017);S.bwig=1;
  if(S.blobs.length<24)S.blobs.push({t:0});
  if(plunkCD<=0){sfx('plunk',1);plunkCD=0.07;}
}
function addWet(u,v){
  for(const w of S.wet){if(Math.abs(w.u-u)<0.05&&Math.abs(w.v-v)<0.08){w.r=Math.min(30,w.r+1.6);return w;}}
  if(S.wet.length>=MAXWET)S.wet.shift();
  const w={u,v,r:9};S.wet.push(w);return w;
}
function wetAt(u,v){for(const w of S.wet){const [x,y]=fl(w.u,w.v);const [x2,y2]=fl(u,v);const r=w.r*L.U;if(((x-x2)/r)**2+((y-y2)/(r*0.45))**2<1)return w;}return null;}
function addPrint(u,v,a,side,wet){
  if(S.prints.length>=MAXPRINTS)S.prints.shift();
  const p={u,v,a,side,wet:wet?1:0,lit:0,t:S.time};S.prints.push(p);return p;

// ---------- actions ----------
S.bwig=0;S.geysers=[];S.cur.hold=0;
function setAct(a){T.act=a;if(a)a.t=0;}
function runAct(dt){const a=T.act;if(!a)return;const sc=(drag&&drag.kind==='item'&&a.type!=='jump'&&a.type!=='hop')?0.3:1;if(a.upd(dt*sc)&&T.act===a)T.act=null;}
function actWait(d,cb){return {type:'wait',t:0,upd(dt){this.t+=dt;if(this.t>=d){cb&&cb();return true;}return false;}};}
function actChain(list,cb){let i=-1,cur=null;return {type:'chain',t:0,upd(dt){
  if(!cur||cur.upd(dt)){i++;if(i>=list.length){cb&&cb();return true;}cur=list[i]();if(cur)cur.t=0;else return false;}return false;}};}
function actHopTo(u,v,cb){const u0=T.u,v0=T.v;return {type:'hop',t:0,upd(dt){
  this.t+=dt;const q=Math.min(1,this.t/0.5);T.u=lerp(u0,u,ease(q));T.v=lerp(v0,v,ease(q));T.jy=Math.sin(Math.PI*q)*42;

function updWorld(dt){

}

}
const SFXT={};

    case 'stitch':for(let i=0;i<6;i++)tone(900+i*130,0.03,'square',0.04,i*0.035);tone(1320,0.16,'triangle',0.14,0.24);noise(0.2,0.1,'lowpass',900,0.02);break;

let drag=null,guideTarget=null,lastInput=-10;

function tailorBox(){
  const U=T.k,top=tPt(T,0,T.worn.hat==='top'?-338:T.worn.hat?-306:-292)[1];

function hitTest(x,y){
  const U=L.U,s=L.itemS;

  let best=null,bd=1e9;
  for(const it of ITEMS){
    if(!(it.st==='home'||it.st==='lift'))continue;
    let ok=false;
    if(it.rail>=0){const bot=it.y+it.dh/2*s+14;ok=Math.abs(x-it.x)<L.sp/2&&y>L.railY-10&&y<Math.max(bot,L.railY+60);}
    else ok=Math.abs(x-it.x)<Math.max(32,40*s)&&Math.abs(y-it.y)<Math.max(32,36*s);
    if(ok){const d=dist(x,y,it.x,it.y);if(d<bd){bd=d;best=it;}}
  }
  if(best)return {kind:'item',it:best};
  const b=tailorBox();
  if(Math.abs(x-b.x)<b.hw&&y>b.top-8&&y<b.bot){
    const ly=(y-T.sy)/T.k+T.jy;
    return {kind:'tailor',part:ly<-222?'head':ly<-98?'body':'feet'};
  }
  for(let i=S.roads.length-1;i>=0;i--){const p=roadPx(S.roads[i],L.floor);for(let j=2;j<p.length;j+=2){if(segDist(x,y,p[j-2],p[j-1],p[j],p[j+1])<Math.max(22,14*U))return {kind:'road',r:S.roads[i]};}}
  const [bx,by]=bucketPos();if(dist(x,y,bx,by-20*U)<Math.max(30,34*U))return {kind:'wig',w:'bucket'};
  const [px,py]=puddlePos();if(((x-px)/(L.puddleRx*S.puddleG+10))**2+((y-py)/(L.puddleRy*S.puddleG+14))**2<1)return {kind:'wig',w:'puddle'};
  const f=L.fount;if(Math.abs(x-f.x)<34*U+10&&y<f.y+14*U&&y>f.y-60*U)return {kind:'wig',w:'fount'};

}

    const out=T.manual||T.R===FIN.FF;
    ctx.save();ctx.translate(B.x,B.y);ctx.scale(FIN.k,FIN.k);drawBoard(!out);ctx.restore();
    REV=1;drawProscenium(FIN.rev);
    if(FIN.ph!=='walk'&&FIN.ph!=='frame'&&FIN.ph!=='unframe')drawFront();
    if(out){REV=1;drawTailor(T);}
    drawParts();
  }else{
    FIN.box=finBox(1);
    drawBoard(true);
    drawParts();
  }
  drawHint();
  ctx.globalAlpha=1;REV=1;
}

// ---------- loop ----------
let lastTs=0,rafId=0,needLayout=false;
function update(dt){
  guideTarget=computeTarget();
  if(guideTarget&&guideTarget.kind==='road'&&!(T.act&&T.act.type==='road'))guideTarget.r.glow=0.5+0.5*Math.sin(S.time*5);
  // gaze
  let lp=null;
  if(drag&&drag.kind==='item')lp=[drag.it.x,drag.it.y];
  else if(FIN.on)lp=null;
  else if(guideTarget&&guideTarget.kind==='item')lp=guideTarget.pos;
  else if(guideTarget&&guideTarget.kind==='spot')lp=guideTarget.pos;
  if(lp){const hp=tPt(T,0,-252);T.lookT=[clamp((lp[0]-hp[0])/140,-1,1),clamp((lp[1]-hp[1])/140,-1,1)];}
  else if(!FIN.on)T.lookT=[Math.sin(S.time*0.7)*0.3,0.25];
  updDrag(dt);updFinale(dt);updTailor(dt);updItems(dt);updWorld(dt);updHint(dt);
}
function relayout(keepDrag){
  layout();
  if(FIN.on){FIN.FF=calcFF();if(T.R&&T.R!==L.floor)T.R=FIN.FF;}
  if(!keepDrag)cancelDrag();
}
// adaptive resolution: slow devices step down from DPR 2 toward 1
const PERF={acc:0,n:0};
function perfWatch(rawDt){
  if(rawDt>0.25||S.intro<2.4||FIN.on){PERF.acc=0;PERF.n=0;return;}
  PERF.acc+=rawDt;PERF.n++;
  if(PERF.acc>=1.2&&PERF.n>=20){const avg=PERF.acc/PERF.n;PERF.acc=0;PERF.n=0;
    PERF.slow=avg>1/48?(PERF.slow||0)+1:0;
    if(PERF.slow>=2&&DPR>1){PERF.slow=0;DPRcap=Math.max(1,DPR-0.5);relayout(true);}}
}
function frame(ts){
  rafId=requestAnimationFrame(frame);
  if(needLayout){needLayout=false;relayout();}
  let dt=(ts-lastTs)/1000;lastTs=ts;
  if(!(dt>0))return;
  perfWatch(dt);
  if(dt>0.05)dt=0.05;
  S.time+=dt;
  update(dt);render();
}
function stopLoop(){if(rafId){cancelAnimationFrame(rafId);rafId=0;}}
function startLoop(){if(!rafId){lastTs=performance.now();rafId=requestAnimationFrame(frame);}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopLoop();cancelDrag();scrapeLoop(0);try{if(AC&&AC.state==='running')AC.suspend().catch(()=>{});}catch(e){}}
  else{startLoop();try{if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}catch(e){}}
});
window.addEventListener('pagehide',()=>{cancelDrag();});
window.addEventListener('pageshow',()=>{cancelDrag();lastTs=performance.now();needLayout=true;startLoop();});
window.addEventListener('blur',()=>{cancelDrag();});
window.addEventListener('resize',()=>{needLayout=true;});
window.addEventListener('orientationchange',()=>{needLayout=true;});

// ---------- start ----------
layout();
T.u=L.P.home[0];T.v=L.P.home[1];
lastInput=0;
window.__GF={S,T,D,IT,FIN,L,hint,hit:hitTest,get dpr(){return DPR;},get audio(){return AC?AC.state:'none';},get target(){return guideTarget;},get drag(){return drag;}};
startLoop();
})();
</script>
