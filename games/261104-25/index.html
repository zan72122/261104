function tp(x,y,z,R,s){

}

function wpos(x,y,z){const m=T.m,k=T.s;return [T.x+(m[0]*x+m[1]*y+m[2]*z)*k,T.y+(m[3]*x+m[4]*y+m[5]*z)*k,T.z+(m[6]*x+m[7]*y+m[8]*z)*k];}

let ALPHA=1,BIAS=0;
const F_SH=1;
function B(x,y,z,hx,hy,hz,col,R,fx,fl){

function BZ(x,y,z0,hx,hy,hz,col,R,fx,fl){return B(x,y,z0+hz,hx,hy,hz,col,R,fx,fl);}
const CS=new Float64Array(16),FPT=new Float64Array(8);
let FQ=40,STROKE=false;
const FACES=[[0,1,5,4,1,-1],[3,2,6,7,1,1],[2,0,4,6,0,-1],[1,3,7,5,0,1],[0,2,3,1,2,-1],[4,5,7,6,2,1]];
function drawPart(p){
  const m=p.R,hx=p.hx,hy=p.hy,hz=p.hz;
  const ax=m[0]*hx,ay=m[3]*hx,az=m[6]*hx,bx=m[1]*hy,by=m[4]*hy,bz=m[7]*hy,cx=m[2]*hz,cy=m[5]*hz,cz=m[8]*hz;
  const ox=CAM.ox,oy=CAM.oy,exx=CAM.exx,exy=CAM.exy,eyx=CAM.eyx,eyy=CAM.eyy,ezy=CAM.ezy;
  for(let i=0;i<8;i++){

    const F=FACES[f],a=F[4],s=F[5];

    if(nx*CAM.d0+ny*CAM.d1+nz*CAM.d2>-0.01)continue;
    let l=nx*LX+ny*LY+nz*LZ;if(l<0)l=0;

// draw a sub quad of a face (u,v in 0..1)
function fq(P,u0,v0,u1,v1,col){
  const ax=P[0],ay=P[1],ux=P[2]-ax,uy=P[3]-ay,vx=P[6]-ax,vy=P[7]-ay;
  g.fillStyle=sc(col,FQ);

  g.moveTo(ax+ux*u0+vx*v0,ay+uy*u0+vy*v0);g.lineTo(ax+ux*u1+vx*v0,ay+uy*u1+vy*v0);
  g.lineTo(ax+ux*u1+vx*v1,ay+uy*u1+vy*v1);g.lineTo(ax+ux*u0+vx*v1,ay+uy*u0+vy*v1);

// shadows
const HP=new Float64Array(16),HI=new Int32Array(16),HU=new Int32Array(20);
function shadowOf(p){
  const m=p.R,hx=p.hx,hy=p.hy,hz=p.hz;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,z0=1e9,z1=-1e9;
  for(let i=0;i<8;i++){
    const sx=(i&1)?1:-1,sy=(i&2)?1:-1,sz=(i&4)?1:-1;
    const wx=p.x+(m[0]*hx*sx+m[1]*hy*sy+m[2]*hz*sz),wy=p.y+(m[3]*hx*sx+m[4]*hy*sy+m[5]*hz*sz),wz=p.z+(m[6]*hx*sx+m[7]*hy*sy+m[8]*hz*sz);
    if(wx<x0)x0=wx;if(wx>x1)x1=wx;if(wy<y0)y0=wy;if(wy>y1)y1=wy;if(wz<z0)z0=wz;if(wz>z1)z1=wz;
  }
  if(z0>1.6||z1<=0.001)return;
  if(z0<0)z0=0;

  const pts=[[x0+SHX*z0,y0+SHY*z0],[x1+SHX*z0,y0+SHY*z0],[x1+SHX*z0,y1+SHY*z0],[x0+SHX*z0,y1+SHY*z0],
    [x0+SHX*z1,y0+SHY*z1],[x1+SHX*z1,y0+SHY*z1],[x1+SHX*z1,y1+SHY*z1],[x0+SHX*z1,y1+SHY*z1]];
  for(let i=0;i<8;i++){HP[i*2]=PX(pts[i][0],pts[i][1]);HP[i*2+1]=PY(pts[i][0],pts[i][1],0);HI[i]=i;}
  // monotone chain hull
  const idx=Array.prototype.slice.call(HI,0,8).sort((a,b)=>HP[a*2]-HP[b*2]||HP[a*2+1]-HP[b*2+1]);
  let k=0;
  const cr=(o,a,b)=>(HP[a*2]-HP[o*2])*(HP[b*2+1]-HP[o*2+1])-(HP[a*2+1]-HP[o*2+1])*(HP[b*2]-HP[o*2]);
  for(let i=0;i<8;i++){while(k>=2&&cr(HU[k-2],HU[k-1],idx[i])<=0)k--;HU[k++]=idx[i];}
  for(let i=6,t=k+1;i>=0;i--){while(k>=t&&cr(HU[k-2],HU[k-1],idx[i])<=0)k--;HU[k++]=idx[i];}
  k--;

  for(let i=1;i<k;i++)g.lineTo(HP[HU[i]*2],HP[HU[i]*2+1]);
  g.closePath();
}
function flushList(withShadow){
  const n=RN;

let AC=null,MG=null,NB=null,audioOK=false;
function audioInit(){
  try{
    if(!AC){
      const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
      AC=new A();
      const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
      MG=AC.createGain();MG.gain.value=.55;MG.connect(comp);comp.connect(AC.destination);
      const len=AC.sampleRate*.5|0;NB=AC.createBuffer(1,len,AC.sampleRate);
      const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    }
    if(AC.state!=='running')AC.resume();
    // unlock with silent buffer (iOS)
    const b=AC.createBufferSource();b.buffer=AC.createBuffer(1,1,22050);b.connect(MG);b.start(0);
    audioOK=true;
  }catch(e){audioOK=false;}
}
function at(){return AC?AC.currentTime:0;}
function tone(f,t,dur,vol,type,opt){
  if(!audioOK||!AC||AC.state!=='running')return;
  try{
    const o=AC.createOscillator(),gn=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(opt&&opt.to)o.frequency.exponentialRampToValueAtTime(opt.to,t+(opt.tt||dur));
    if(opt&&opt.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=opt.vib;lg.gain.value=f*.012;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+.05);}
    const a=(opt&&opt.a)||.004;
    gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(vol,t+a);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    let out=gn;
    if(opt&&opt.lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=opt.lp;gn.connect(fl);out=fl;}
    o.connect(gn);out.connect(MG);o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}
function noise(t,dur,vol,freq,q,type){
  if(!audioOK||!AC||AC.state!=='running')return;

}

const TW=[];

  TW.push({o,k,from:o[k],to,t:-(delay||0),dur,e:ease||eio,st:false});
}
function tweenUpd(dt){
  for(let i=TW.length-1;i>=0;i--){
    const w=TW[i];w.t+=dt;if(w.t<0)continue;

}

  if(S.busy&&TASK&&!S.parade&&!S.atBarber)S.rolling=S.rolling||false;
  trainUpd(dt);musicUpd();partUpd(dt);boyUpd(dt);barberUpd(dt);fallUpd(dt);
  // balloon follow
  const bl=V.balloon;const tgt=bl.drag?[bl.dx,bl.dy,.35]:tiePoint(S.tie);
  if(!bl.drag&&S.tie==='chair'){tgt[2]=chairSeatZ()+.48;}
  const kf=Math.min(1,dt*12);bl.tx+=(tgt[0]-bl.tx)*kf;bl.ty+=(tgt[1]-bl.ty)*kf;bl.tz+=(tgt[2]-bl.tz)*kf;
  // hat
  const h=V.hat;if(h.t>=0&&!h.on){h.t+=dt/1.8;if(h.t>=1){h.on=true;h.t=-1;sPop();V.boy.cheer=1;anim(V.boy,'cheer',0,1,eo);stars(V.boy.x,V.boy.y,1,5);}}
  hintUpd(dt);handUpd(dt);
  BLT-=dt;if(BLT<0){BLINK=.13;BLT=rr(2.2,4.2);}if(BLINK>0)BLINK-=dt;
  if(V.shake>0)V.shake=Math.max(0,V.shake-dt*1.6);
  if(V.flash>0)V.flash=Math.max(0,V.flash-dt*2);
  const bb=V.barber;
  if(S.atBarber)bb.tilt=Math.sin(TIME*2.2)*.28;else bb.tilt*=Math.max(0,1-dt*5);
}
// ================= layout / loop =================
let needLayout=true;
function layout(){
  needLayout=false;
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  readSA();PORT=H>W*1.05;
  CAM.yaw=PORT?.08:.12;CAM.pitch=PORT?1.0:.9;CAM.sc=1;CAM.ox=0;CAM.oy=0;camUpd();
  const pts=[[-.1,-1.5,0],[6.72,-1.5,0],[-.1,6.45,0],[6.72,6.45,0],[-.1,6.45,1.9],[6.72,6.45,1.9],[-.1,-1.5,.7],[6.72,-1.5,.7]];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const p of pts){const x=PX(p[0],p[1]),y=PY(p[0],p[1],p[2]);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}
  const m=6,aw=W-SA.l-SA.r-2*m,ah=H-SA.t-SA.b-2*m;
  const s=Math.max(4,Math.min(aw/(x1-x0),ah/(y1-y0)));
  CAM.sc=s;
  const cx=SA.l+m+aw/2,cy=SA.t+m+ah/2;
  CAM.ox=cx-s*(x0+x1)/2;CAM.oy=cy-s*(y0+y1)/2;
  if(PORT)CAM.oy+=Math.max(0,ah-s*(y1-y0))*.3;
  camUpd();
  let wh=2.6;
  for(const x of[-10,14]){const need=(CAM.oy+x*CAM.exy+6.6*CAM.eyy+6)/(-CAM.ezy);wh=Math.max(wh,need);}
  WALLH=Math.min(60,wh+.2);
  buildStatic();
}
function render(){
  g=ctx;
  let ox=0,oy=0;if(V.shake>0){ox=(Math.random()-.5)*7*V.shake;oy=(Math.random()-.5)*7*V.shake;}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=COL.wood;ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR,0,0,DPR,ox*DPR,oy*DPR);
  ctx.drawImage(STC,0,0,W,H);
  drawFloor();drawScene();
  if(V.flash>0){ctx.fillStyle='rgba(255,250,235,'+(V.flash*.16).toFixed(3)+')';ctx.fillRect(-10,-10,W+20,H+20);}
}
let last=0,raf=0,FRAMES=0,COST=0,TAPT=0,TAPLAT=-1;
function frame(ts){
  raf=requestAnimationFrame(frame);
  if(needLayout)layout();
  let dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=0;if(dt>.05)dt=.05;
  const c0=performance.now();update(dt);render();COST=COST*.9+(performance.now()-c0)*.1;FRAMES++;if(TAPT&&V.dice.sq>.2){TAPLAT=performance.now()-TAPT;TAPT=0;}
}
window.addEventListener('resize',()=>{needLayout=true;});
window.addEventListener('orientationchange',()=>{needLayout=true;});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(raf){cancelAnimationFrame(raf);raf=0;}if(AC&&AC.state==='running'){try{AC.suspend();}catch(e){}}if(DRAG)endDrag(false);PTR=null;}
  else{last=performance.now();if(!raf)raf=requestAnimationFrame(frame);if(AC&&audioOK){try{AC.resume();}catch(e){}}}
});
// ================= start =================
newGame();
{const t=tilePos(0);V.boy.x=t[0];V.boy.y=t[1];const tp0=tiePoint('peg');V.balloon.tx=tp0[0];V.balloon.ty=tp0[1];V.balloon.tz=tp0[2];}
S.idleSince=0;
setEuler(Object.assign(V.dice,{ax:.0,ay:0,az:0}));
// test/inspection hook (no UI)
window.__gf={
  state:()=>({pos:S.pos,hist:S.hist.length,hair:V.hair.length,cakeCut:S.cakeCut,tower:S.tower,spill:S.spill,chairN:S.chairN,lift:S.lift,tie:S.tie,baseAt:S.baseAt,
    learned:S.learned.slice(),disc:Object.assign({},S.disc),atBarber:S.atBarber,busy:S.busy,parade:S.parade,lap:S.lap,hint:V.hint.key,
    boxes:V.boxes.map(b=>({b:b.b,inst:b.inst,slot:b.slot,open:b.open,zone:b.zone})),train:TR.on?TR.cars.map(c=>c.type==='music'?c.inst:c.type):null,
    notes:V.notes.map(n=>n.inst),particles:PS.length,cost:+COST.toFixed(2),tapLatency:+TAPLAT.toFixed(1),parts:RL.length,frames:FRAMES,dpr:DPR,scale:CAM.sc,log:S.log.slice(-40)}),
  at:(name)=>{
    const P=(x,y,z)=>[Math.round(PX(x,y)),Math.round(PY(x,y,z))];
    if(name==='dice')return P(V.dice.x,V.dice.y,.5);
    if(name==='scS')return P(SPOT.scS[0],SPOT.scS[1],.35);
    if(name==='scB')return P(SPOT.scB[0],SPOT.scB[1],.35);
    if(name==='base')return P(V.base.x,V.base.y,.5);
    if(name==='baseSlot')return P(SPOT.baseSlot[0],SPOT.baseSlot[1],.4);
    if(name==='baseRest')return P(SPOT.baseRest[0],SPOT.baseRest[1],.4);
    if(name==='knot')return P(V.balloon.tx,V.balloon.ty,V.balloon.tz);
    if(name==='chair'){const c=chairPos();return P(c[0],c[1]+.2,.3);}
    if(name==='towerTie'){const t=tiePoint('tower');return P(t[0],t[1],.3);}
    if(name==='peg')return P(SPOT.peg[0],SPOT.peg[1],.3);
    if(name.startsWith('box')){const b=V.boxes[+name.slice(3)];const p=boxPos(b);return P(p[0],p[1],p[2]+.22);}
    if(name.startsWith('slot:')){const p=slotPos(name.slice(5));return P(p[0],p[1],.45);}
    if(name==='boy')return P(V.boy.x,V.boy.y,V.boy.z+.45);
    return null;
  }
};
raf=requestAnimationFrame(frame);
})();
