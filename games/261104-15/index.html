<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>ぴっ、ぽん！おてんき八百屋とぐんぐん野菜タワー</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#ffffff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0);overscroll-behavior:none}
body{position:fixed;left:0;top:0;right:0;bottom:0}
#c{position:fixed;left:0;top:0;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none}
#sa{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);visibility:hidden;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="sa"></div>
<script>
(function(){
'use strict';
/* ===== 5 colors only (primaries) ===== */
const WH='#ffffff',RD='#e3231b',BL='#1f4bb8',YL='#ffd21f',BK='#141414';
const TAU=Math.PI*2;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
const saEl=document.getElementById('sa');
let W=390,H=844,DPR=1;
const SA={t:0,r:0,b:0,l:0};
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<0?0:k>1?1:(1-Math.pow(1-k,3));
const easeIO=k=>k<0?0:k>1?1:(k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2);
const back=k=>{if(k<=0)return 0;if(k>=1)return 1;const c=1.9;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};
let seed=(Date.now()%100000)+7;
function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function pick(a){return a[Math.floor(rnd()*a.length)%a.length];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ===== audio (Web Audio synth, starts on first touch) ===== */
const AU={c:null,m:null,nz:null};
function audioInit(){
  try{
    if(AU.c){if(AU.c.state!=='running')AU.c.resume().catch(()=>{});return;}
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    const c=new AC(); AU.c=c;
    const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=6;
    AU.m=c.createGain(); AU.m.gain.value=0.55; AU.m.connect(comp); comp.connect(c.destination);
    const n=c.createBuffer(1,Math.floor(c.sampleRate*0.6),c.sampleRate); const d=n.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; AU.nz=n;
    const b=c.createBuffer(1,1,22050),s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(0);
    if(c.state!=='running')c.resume().catch(()=>{});
  }catch(e){AU.c=null;}
}
function aok(){return AU.c&&AU.c.state==='running';}
function tone(f,dur,o){
  if(!aok())return; o=o||{};
  try{
    const c=AU.c,t0=c.currentTime+(o.at||0);
    const os=c.createOscillator(),g=c.createGain();
    os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t0);
    if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+(o.ft||dur));
    const v=(o.vol==null?0.25:o.vol);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+(o.att||0.006));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    os.connect(g); g.connect(AU.m); os.start(t0); os.stop(t0+dur+0.03);
  }catch(e){}
}
function noise(dur,o){
  if(!aok()||!AU.nz)return; o=o||{};
  try{
    const c=AU.c,t0=c.currentTime+(o.at||0);
    const s=c.createBufferSource(); s.buffer=AU.nz;
    const f=c.createBiquadFilter(); f.type=o.ft||'bandpass'; f.frequency.setValueAtTime(o.f||1200,t0);
    if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t0+dur); f.Q.value=o.q||1;
    const g=c.createGain(); const v=o.vol||0.2;
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f); f.connect(g); g.connect(AU.m); s.start(t0); s.stop(t0+dur+0.02);
  }catch(e){}
}
const NOTE=[523.25,587.33,659.25,783.99,880,1046.5,1174.7,1318.5,1568,1760,2093];
const SND={
  pi(){tone(1760,0.07,{type:'square',vol:0.09});tone(2640,0.05,{vol:0.06,at:0.01});},
  pon(h,w){ // landing: pitch by height & weather
    const i=clamp(h,0,9); let f=NOTE[i]*0.5;
    if(w==='rain'){tone(f*0.9,0.22,{f2:f*0.6,vol:0.32});noise(0.06,{f:900,vol:0.05});}
    else if(w==='sun'){tone(f,0.2,{type:'triangle',f2:f*0.7,vol:0.32});tone(f*2,0.12,{vol:0.07});}
    else if(w==='snow'){tone(f*1.5,0.3,{f2:f*1.2,vol:0.22});tone(f*3,0.25,{vol:0.06,at:0.02});}
    else tone(f,0.2,{f2:f*0.65,vol:0.3});
  },
  chime(){[0,2,4,5].forEach((n,i)=>{tone(NOTE[n+2],0.4,{type:'triangle',vol:0.17,at:i*0.07});tone(NOTE[n+2]*2,0.22,{vol:0.05,at:i*0.07});});},
  big(){[0,2,4,7,9].forEach((n,i)=>tone(NOTE[Math.min(10,n)],0.5,{type:'triangle',vol:0.17,at:i*0.08}));tone(NOTE[10],0.7,{vol:0.07,at:0.42});},
  rainbow(){for(let i=0;i<7;i++)tone(NOTE[i+2],0.35,{vol:0.12,at:i*0.05,type:i%2?'sine':'triangle'});},
  cloud(){for(let i=0;i<4;i++)tone(1200+i*180,0.05,{vol:0.05,at:i*0.09});},
  sun(){tone(NOTE[0],0.5,{type:'triangle',vol:0.12});tone(NOTE[2],0.5,{type:'triangle',vol:0.12,at:0.04});tone(NOTE[4],0.5,{type:'triangle',vol:0.12,at:0.08});},
  spin(){tone(500,0.35,{type:'triangle',f2:1400,vol:0.12});},
  snow(){for(let i=0;i<5;i++)tone(NOTE[6+(i%3)]*1.0,0.25,{vol:0.05,at:i*0.08});},
  pile(){noise(0.18,{ft:'lowpass',f:700,vol:0.18});tone(300,0.15,{f2:200,vol:0.1});},
  drip(){tone(1400,0.08,{f2:500,vol:0.12});},
  splash(){noise(0.35,{f:1800,f2:500,vol:0.22,q:0.7});tone(700,0.15,{f2:300,vol:0.08});},
  open(){tone(260,0.18,{f2:420,vol:0.15,type:'triangle'});noise(0.12,{f:3000,vol:0.06});},
  fall(){tone(900,0.45,{f2:220,vol:0.16,type:'triangle'});tone(180,0.15,{vol:0.12,at:0.42});},
  wig(){tone(700+rnd()*200,0.06,{vol:0.07,type:'triangle'});},
  nope(){tone(330,0.08,{vol:0.08});tone(294,0.1,{vol:0.08,at:0.08});},
  ring(){tone(2093,0.5,{vol:0.13});tone(2637,0.6,{vol:0.1,at:0.08});},
  back(){tone(880,0.12,{f2:600,vol:0.1,type:'triangle'});},
  step(i){tone(NOTE[i%11]*0.5,0.16,{type:'triangle',vol:0.18});},
  shutter(){noise(0.05,{f:4000,vol:0.2,q:0.5});noise(0.07,{f:2500,vol:0.15,at:0.08,q:0.5});},
  whee(){tone(400,0.5,{f2:1200,vol:0.1,type:'triangle'});},
  slide(){tone(1200,0.5,{f2:300,vol:0.1,type:'triangle'});},
  hop(){tone(600,0.1,{f2:900,vol:0.07});}
};
/* ===== items ===== */
const IT={st:{w:.56,h:.6,sh:'s'},ba:{w:1.0,h:.48,sh:'l'},ca:{w:.92,h:.82,sh:'r'},co:{w:1.04,h:.44,sh:'l'},wm:{w:1.14,h:.96,sh:'b'},da:{w:1.14,h:.42,sh:'l'}};
const SHELF=['st','ba','ca','co','wm','da'];
const SLOTC={st:WH,ba:BL,ca:YL,co:RD,wm:WH,da:BL};
const HALOC={st:YL,ba:YL,ca:RD,co:YL,wm:YL,da:YL};

/* ===== layout ===== */
const L={slots:[],cards:[],bench:[]};
function readSA(){
  try{const cs=getComputedStyle(saEl);
    SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;
  }catch(e){SA.t=SA.r=SA.b=SA.l=0;}
}
function layout(){
  W=Math.max(200,window.innerWidth||390);H=Math.max(200,window.innerHeight||844);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  readSA();
  const land=W>H*1.05;L.land=land;
  const cols=land?6:3,rows=land?1:2;
  const x0=SA.l+8,x1=W-SA.r-8;L.x0=x0;L.x1=x1;
  const shelfH=land?clamp(H*0.27,92,260):clamp(H*0.31,170,340);
  const sb=H-SA.b-6,st=sb-shelfH;
  L.shelfTop=st;L.shelfBot=sb;
  const gap=6,sw=(x1-x0-gap*(cols-1))/cols,sh=(shelfH-gap*(rows+1))/rows;
  L.slots.length=0;
  for(let i=0;i<6;i++){const c=i%cols,r=Math.floor(i/cols);L.slots.push({x:x0+c*(sw+gap),y:st+gap+r*(sh+gap),w:sw,h:sh,k:SHELF[i]});}
  L.su=Math.min(sw/1.3,sh/1.12);
  L.ground=st;
  L.counterH=clamp(H*(land?0.09:0.072),34,96);
  L.counterTop=st-L.counterH;
  L.pu=clamp(Math.min(Math.min(W,H)*0.115,H*0.088),26,74);
  L.top=SA.t;
  L.awnH=clamp(H*0.032,18,32);
  L.benchH=clamp(L.pu*1.55,46,84);
  L.benchY=L.top+L.awnH+L.benchH-4;
  L.zoneTop=L.top+L.awnH+L.benchH+4;
  L.zoneH=L.counterTop-L.zoneTop;
  L.bw=clamp(Math.min(Math.min(W,H)*0.3,H*0.24),84,230);L.bh=L.bw*0.6;
  L.bagX=land?W*0.44:W*0.45;
  L.bagY=L.counterTop+2;
  L.girlX=L.bagX-L.bw*0.5-L.pu*1.45;
  L.custX=Math.min(L.bagX+L.bw*0.5+L.pu*1.75,W-SA.r-L.pu*0.95);
  L.underX=L.bagX+L.bw*0.5+L.pu*0.55;
  // card wall + bench (top row)
  const ch=L.benchH*0.84,cw=ch*0.78;L.cardN=land?4:3;L.cards.length=0;
  for(let i=0;i<L.cardN;i++)L.cards.push({x:x0+i*(cw+6),y:L.top+L.awnH+4,w:cw,h:ch});
  const bx0=x0+L.cardN*(cw+6)+8,dx=(x1-bx0)/4;L.bench.length=0;
  for(let i=0;i<4;i++)L.bench.push({x:bx0+dx*(i+0.3),y:L.benchY,dx:dx});
  L.bs=clamp(L.benchH/(L.pu*3.15),0.28,0.6);
  // tower
  L.towerX=W/2;L.Pw=Math.min(W-SA.l-SA.r-24,560);L.Tw=L.Pw*0.72;
  L.Lh=clamp(H*0.105,54,104);L.pedH=L.Lh*0.42;L.plT=clamp(L.Lh*0.16,9,16);
  L.ts=clamp(Math.min(L.Pw/(L.pu*7.2),H*0.2/(L.pu*2.95)),0.5,1);
}

/* ===== drawing primitives ===== */
function P(){ctx.beginPath();}
function circle(x,y,r,c){ctx.fillStyle=c;P();ctx.arc(x,y,Math.max(0.1,r),0,TAU);ctx.fill();}
function ell(x,y,rx,ry,c,rot){ctx.fillStyle=c;P();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);ctx.fill();}
function rrect(x,y,w,h,r){if(w<0){x+=w;w=-w;}if(h<0){y+=h;h=-h;}r=Math.max(0,Math.min(r,w/2,h/2));P();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function frr(x,y,w,h,r,c){ctx.fillStyle=c;rrect(x,y,w,h,r);ctx.fill();}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function band(cx,cy,r0,r1,a0,a1,c){ctx.fillStyle=c;P();ctx.arc(cx,cy,r1,a0,a1);ctx.arc(cx,cy,Math.max(0.1,r0),a1,a0,true);ctx.closePath();ctx.fill();}
function rays(x,y,r0,r1,n,w,rot,c){ctx.fillStyle=c;for(let i=0;i<n;i++){const a=rot+i*TAU/n;ctx.save();ctx.translate(x,y);ctx.rotate(a);rrect(r0,-w/2,r1-r0,w,w/2);ctx.fill();ctx.restore();}}

/* item art, centered, unit u */
function drawItem(k,u){
  switch(k){
  case 'st':{const w=.56*u,h=.6*u;
    ctx.fillStyle=RD;P();ctx.moveTo(0,h*.5);ctx.bezierCurveTo(-w*.9,h*.2,-w*.66,-h*.52,0,-h*.34);ctx.bezierCurveTo(w*.66,-h*.52,w*.9,h*.2,0,h*.5);ctx.fill();
    const sd=[[-.26,-.06],[.24,-.1],[0,.1],[-.13,.3],[.15,.27]];for(const s of sd)ell(s[0]*w,s[1]*h,.032*u,.048*u,YL);
    ell(0,-h*.36,w*.38,h*.1,BK);rrect(-.03*u,-h*.58,.06*u,.15*u,.03*u);ctx.fill();break;}
  case 'ba':{const w=1.0*u,h=.48*u;
    ctx.fillStyle=YL;P();ctx.moveTo(-w*.5,-h*.25);ctx.quadraticCurveTo(0,h*1.2,w*.5,-h*.25);ctx.lineTo(w*.42,-h*.36);ctx.quadraticCurveTo(0,h*.55,-w*.44,-h*.34);ctx.closePath();ctx.fill();
    circle(-w*.48,-h*.3,.045*u,BK);frr(w*.4,-h*.62,.08*u,.2*u,.03*u,BK);break;}
  case 'ca':{
    ell(0,0,.46*u,.41*u,BL);ell(-.05*u,-.04*u,.35*u,.3*u,WH);ell(.02*u,.0,.3*u,.27*u,BL);ell(-.03*u,-.07*u,.15*u,.11*u,WH);ell(-.01*u,-.05*u,.09*u,.07*u,BL);break;}
  case 'co':{
    frr(-.36*u,-.22*u,.88*u,.44*u,.22*u,YL);rect(.06*u,-.2*u,.035*u,.4*u,WH);rect(.24*u,-.19*u,.035*u,.38*u,WH);
    ctx.fillStyle=BL;P();ctx.moveTo(-.52*u,0);ctx.quadraticCurveTo(-.2*u,-.44*u,.14*u,-.14*u);ctx.quadraticCurveTo(-.2*u,-.12*u,-.52*u,0);ctx.fill();
    P();ctx.moveTo(-.52*u,0);ctx.quadraticCurveTo(-.2*u,.44*u,.14*u,.14*u);ctx.quadraticCurveTo(-.2*u,.12*u,-.52*u,0);ctx.fill();break;}
  case 'wm':{
    ell(0,0,.57*u,.48*u,BL);ctx.save();P();ctx.ellipse(0,0,.57*u,.48*u,0,0,TAU);ctx.clip();
    for(const sx of [-.34,-.08,.18,.42]){ctx.fillStyle=BK;P();ctx.ellipse(sx*u,0,.065*u,.52*u,.12,0,TAU);ctx.fill();}
    ctx.restore();frr(-.03*u,-.56*u,.06*u,.12*u,.03*u,BK);break;}
  case 'da':{
    ctx.fillStyle=BK;for(const a of [-.55,0,.55]){P();ctx.ellipse(-.42*u-Math.cos(a)*.12*u,Math.sin(a)*.14*u,.17*u,.065*u,a,0,TAU);ctx.fill();}
    ctx.fillStyle=WH;P();ctx.moveTo(-.34*u,-.19*u);ctx.quadraticCurveTo(.22*u,-.2*u,.58*u,.02*u);ctx.quadraticCurveTo(.22*u,.21*u,-.34*u,.19*u);ctx.quadraticCurveTo(-.44*u,0,-.34*u,-.19*u);ctx.closePath();ctx.fill();
    ctx.strokeStyle=BK;ctx.lineWidth=Math.max(1.5,.035*u);ctx.lineJoin='round';ctx.stroke();break;}
  }
}
/* weather / feature icons, centered, size s */
function cloudShape(x,y,s,c){circle(x-.2*s,y+.02*s,.2*s,c);circle(x+.04*s,y-.08*s,.26*s,c);circle(x+.26*s,y+.03*s,.18*s,c);frr(x-.4*s,y,.82*s,.22*s,.11*s,c);}
function drawIcon(n,x,y,s,t){
  t=t||0;
  switch(n){
  case 'rain':case 'cloud':cloudShape(x,y-.1*s,s,BL);for(let i=0;i<3;i++)frr(x-.25*s+i*.24*s,y+.2*s+((t*1.5+i*.3)%1)*.12*s,.07*s,.16*s,.035*s,BL);break;
  case 'sun':case 'spin':circle(x,y,.25*s,YL);rays(x,y,.31*s,.46*s,8,.09*s,n==='spin'?t*3:0,YL);break;
  case 'snow':case 'pile':{frr(x-.45*s,y-.45*s,.9*s,.9*s,.12*s,BL);
    if(n==='pile'){ctx.fillStyle=WH;P();ctx.moveTo(x-.45*s,y+.3*s);ctx.quadraticCurveTo(x,y-.25*s,x+.45*s,y+.3*s);ctx.lineTo(x+.45*s,y+.33*s);ctx.arcTo(x+.45*s,y+.45*s,x,y+.45*s,.12*s);ctx.lineTo(x-.33*s,y+.45*s);ctx.arcTo(x-.45*s,y+.45*s,x-.45*s,y+.3*s,.12*s);ctx.fill();}
    for(let i=0;i<3;i++){ctx.save();ctx.translate(x,y-(n==='pile'?.12*s:0));ctx.rotate(i*Math.PI/3+t*.5);frr(-.27*s,-.04*s,.54*s,.08*s,.04*s,WH);ctx.restore();}
    break;}
  case 'rainbow':{const cy=y+.22*s;band(x,cy,.34*s,.46*s,Math.PI,TAU,RD);band(x,cy,.22*s,.34*s,Math.PI,TAU,YL);band(x,cy,.1*s,.22*s,Math.PI,TAU,BL);break;}
  case 'bridge':{const cy=y+.36*s;band(x,cy,.3*s,.48*s,Math.PI,TAU,RD);band(x,cy,.18*s,.3*s,Math.PI,TAU,YL);band(x,cy,.06*s,.18*s,Math.PI,TAU,BL);rect(x-.5*s,y+.34*s,s,.08*s,BK);break;}
  case 'umbrella':{band(x,y+.05*s,0,.44*s,Math.PI,TAU,BL);ell(x,y+.05*s,.44*s,.06*s,BL);band(x-.02*s,y+.05*s,.12*s,.2*s,Math.PI*1.05,Math.PI*1.7,WH);frr(x-.03*s,y,.06*s,.42*s,.03*s,YL);break;}
  case 'parasol':{frr(x-.03*s,y-.05*s,.06*s,.5*s,.03*s,YL);band(x,y,0,.46*s,Math.PI,TAU,BL);band(x,y,0,.38*s,Math.PI,TAU,RD);for(const a of [1.25,1.5,1.75])ell(x+Math.cos(a*Math.PI)*.22*s,y+Math.sin(a*Math.PI)*.22*s,.025*s,.04*s,BK);break;}
  case 'melt':case 'puddle':{ell(x,y+.2*s,.44*s,.14*s,BL);circle(x-.2*s,y-.05*s,.06*s,BL);circle(x+.18*s,y-.12*s,.05*s,BL);circle(x,y-.2*s,.07*s,BL);break;}
  }
}
/* demo hand: fingertip at x,y */
function drawHand(x,y,s,press){
  ctx.save();ctx.translate(x,y+press*s*.12);ctx.rotate(-0.35);
  ctx.lineWidth=Math.max(2,s*.07);ctx.strokeStyle=BK;ctx.fillStyle=WH;ctx.lineJoin='round';
  rrect(-s*.12,0,s*.24,s*.7,s*.12);ctx.fill();ctx.stroke();
  rrect(-s*.36,s*.42,s*.72,s*.62,s*.22);ctx.fill();ctx.stroke();
  rrect(-s*.12,s*.02,s*.24,s*.6,s*.12);ctx.fill();
  ctx.restore();
}
/* ===== people (no faces: head silhouettes, gestures show feelings) ===== */
const PCOL={girl:[BL],umb:[BL,RD],hat:[RD,BL],kid:[YL,RD]};
function mkP(type,v){return {type:type,v:v||0,x:0,y:0,s:1,face:-1,walk:0,moving:false,act:'idle',at:0,ad:0,seg:[],wig:0,sit:false,

let lastGK='';
function update(dt){
  T+=dt;S.pt+=dt;if(S.lock>0)S.lock-=dt;S.idle+=dt;
  S.benchPulse=Math.max(0,S.benchPulse-dt);S.flash=Math.max(0,S.flash-dt*3.2);
  for(const k of SHELF){const q=SLQ[k];q.v+=(-260*q.q-14*q.v)*dt;q.q+=q.v*dt;q.wig=Math.max(0,q.wig-dt*2.5);}
  for(let i=0;i<CWIG.length;i++)CWIG[i]=Math.max(0,CWIG[i]-dt*2.5);
  if(S.phase==='shop'){updateShop(dt);updateGirl(dt);}else updateTower(dt);
  if(S.cardFly){S.cardFly.t+=dt;if(S.cardFly.t>=1.1)S.cardFly=null;}
  if(S.exiting){for(const p of S.exiting)updateP(p,dt,T);S.exiting=S.exiting.filter(p=>p.seg.length||p.x<W+L.pu*2);if(!S.exiting.length)S.exiting=null;}

    f.x=lerp(f.x0,f.x1,k);f.y=lerp(f.y0,f.y1,k)-Math.sin(Math.PI*k)*f.h;f.u=lerp(f.u0,f.u1,k);f.r=f.spin*k;
    if(k>=1){S.flyers.splice(i,1);if(f.cb)f.cb();}}
  for(let i=S.parts.length-1;i>=0;i--){const p=S.parts[i];p.l-=dt;if(p.l<=0){S.parts.splice(i,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  let ct=0;if(S.phase!=='shop'&&S.tw){ct=Math.max(0,H*(L.land?0.58:0.56)-PS());}
  S.cam+=(ct-S.cam)*Math.min(1,dt*4.5);if(Math.abs(ct-S.cam)<0.3)S.cam=ct;
  S.guide=computeGuide();
  const gk=S.guide?S.guide.t+(S.guide.k||S.guide.id||''):'';if(gk!==lastGK){lastGK=gk;S.idle=Math.min(S.idle,0.5);}

  else if(S.guide&&S.idle>4&&!S.demoDone[S.guide.t]){S.demoDone[S.guide.t]=true;S.demo={t:0,g:S.guide};}

    if(e.type==='pointerup'){
      if(pd.type==='handle'&&S.phase==='shop'&&Math.hypot(e.clientX-pd.x,e.clientY-pd.y)<pd.r*1.7)handOver();
      else if(pd.type==='basket'&&S.phase==='picnic'&&Math.hypot(e.clientX-pd.x,e.clientY-pd.y)<pd.r*1.7){SND.chime();startClose();}}
    else if(pd.type==='add')revertAdd(pd);
    S.hPress=0;}
  if(e.pointerId===activeId)activeId=null;try{if(cv.hasPointerCapture&&cv.hasPointerCapture(e.pointerId))cv.releasePointerCapture(e.pointerId);}catch(_){}}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove);cv.addEventListener('pointerup',onEnd);cv.addEventListener('pointercancel',onEnd);cv.addEventListener('lostpointercapture',e=>{if(e.pointerId===activeId)activeId=null;});
const stopEv=e=>{if(e.cancelable)e.preventDefault();};
document.addEventListener('touchstart',stopEv,{passive:false});document.addEventListener('touchmove',stopEv,{passive:false});
document.addEventListener('touchend',e=>{audioInit();if(e.cancelable)e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',stopEv,{passive:false});document.addEventListener('gesturechange',stopEv,{passive:false});
document.addEventListener('contextmenu',stopEv);document.addEventListener('dblclick',stopEv,{passive:false});
document.addEventListener('selectstart',stopEv);
/* ===== loop ===== */
let raf=0,running=false,lastTs=0;
function frame(ts){raf=0;if(!running)return;const dt=Math.min(0.05,Math.max(0,(ts-lastTs)/1000));lastTs=ts;
  try{update(dt);draw();}catch(err){if(!frame.err){frame.err=1;try{console.warn(err);}catch(_){}}}
  raf=requestAnimationFrame(frame);}
function start(){if(running)return;running=true;lastTs=performance.now();raf=requestAnimationFrame(frame);}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();try{if(AU.c&&AU.c.state==='running')AU.c.suspend();}catch(_){}}else{try{if(AU.c)AU.c.resume();}catch(_){}start();}});
window.addEventListener('pagehide',stop);window.addEventListener('pageshow',()=>{if(!document.hidden)start();});
let rzT=0;function onResize(){layout();if(S.bag){S.bag.x=L.bagX;S.bag.y=L.bagY;}
  if(S.cust&&S.cust.arrived&&!S.cust.seg.length){S.cust.x=S.cust.tx=L.custX;S.cust.y=L.ground;}
  if(S.phase==='shop'&&S.girl&&!S.girl.seg.length){S.girl.x=L.girlX;S.girl.y=L.counterTop+L.counterH*.62;}
  S.benchP.forEach((bp,i)=>{bp.p.x=L.bench[i].x;bp.p.y=L.benchY;});
  if(S.tw){for(const p of S.tw.people){if(!p.seg.length&&p.zone==='plaza'){p.x=clamp(p.x,L.towerX-L.Pw/2+10,L.towerX+L.Pw/2-10);p.y=PS();}else if(!p.seg.length&&p.zone==='island'){const ig=islandGeo();p.x=ig.x;p.y=ig.y;}}}
}
window.addEventListener('resize',()=>{onResize();clearTimeout(rzT);rzT=setTimeout(onResize,250);});
window.addEventListener('orientationchange',()=>{setTimeout(onResize,120);setTimeout(onResize,500);});
/* ===== boot ===== */
layout();S.cards=loadCards();startSession(true);start();
window.__gf={S:S,L:L,keysOf:keysOf,slotOf:slotOf,handlePos:handlePos,featPos:featPos,basketPos:basketPos,PS:PS,stab:stab,evalFeat:evalFeat,islandGeo:islandGeo,bridgeGeo:bridgeGeo,fallGeo:fallGeo,parX:parX,startOpen:startOpen,evalFeat2:evalFeat};
})();
</script>
