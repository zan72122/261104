  for(let i=0;i<pts.length;i++){const px=pts[i][0]*s*m,py=pts[i][1]*s;const X=x+px*c-py*sn,Y=y+px*sn+py*c;if(i)ctx.lineTo(X,Y);else ctx.moveTo(X,Y);}

function tone(f,d,o){
  if(!live())return;o=o||{};

function cumLen(o){const n=o.length,c=new Array(n+1);c[0]=0;for(let i=0;i<n;i++){const a=o[i],b=o[(i+1)%n];c[i+1]=c[i]+hyp(b[0]-a[0],b[1]-a[1]);}return c;}
const TPL=TDEF.map(t=>{const o=t.sm?spline(t.o,true,t.sm):t.o.map(p=>p.slice());return {o:o,c:cumLen(o),d:t.d,dots:t.dots,top:t.top};});

  spline([[0,0.46],[0.56,-0.04],[0.42,-0.5],[0,-0.24],[-0.42,-0.5],[-0.56,-0.04]],true,4),
  starPts(0,0,0.62,0.26,5),
  spline([[0,-0.64],[0.36,0.04],[0.3,0.4],[0,0.5],[-0.3,0.4],[-0.36,0.04]],true,4)

function ptAt(o,c,s){const n=o.length,T=c[n];s=((s%T)+T)%T;let i=0;while(i<n-1&&c[i+1]<=s)i++;const a=o[i],b=o[(i+1)%n],sl=(c[i+1]-c[i])||1,t=(s-c[i])/sl;return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}

function buildShape(sp){
  const n=sp.cols.length,U=sp.units,per=unitCounts(n,U),T=TPL[sp.type];
  const SPC=2.3,Ls=SPC*(U-1),th=sp.bend*1.4,ca=Math.cos(sp.ang),sa=Math.sin(sp.ang);
  const stars=[],segs=[],deco=[],dots=[],links=[],tops=[],units=[];

  for(let u=0;u<U;u++){

    if(U===1)tilt=sp.bend*0.42;
    else if(Math.abs(th)>0.01){const R=Ls/th,ph=s/R;px=R*Math.sin(ph);py=R*(1-Math.cos(ph));tilt=ph*0.45;}
    const cx=px*ca-py*sa,cy=px*sa+py*ca,ct=Math.cos(tilt),st=Math.sin(tilt);
    const tf=p=>[cx+p[0]*ct-p[1]*st,cy+p[0]*st+p[1]*ct];
    const k=per[u],us=[];
    for(let j=0;j<k;j++){const q=tf(ptAt(T.o,T.c,j/k*Tot));stars.push({x:q[0],y:q[1],c:sp.cols[si]});us.push(si);si++;}
    for(let j=0;j<k;j++)segs.push({p:subPath(T.o,T.c,j/k*Tot,(j+1)/k*Tot).map(tf),c:sp.cols[us[j]],s:us[j]});
    const uc=sp.cols[us[0]];
    for(const d of T.d)deco.push({p:d.p.map(tf),c:d.k!=null?d.k:uc,cl:!!d.cl});
    if(T.dots)for(const d of T.dots)dots.push({p:tf(d),c:sp.type===0?1:uc});
    const tv=clamp(sp.v|0,0,2);
    tops.push({p:TOPS[tv].map(q=>tf([T.top[0]+q[0]*0.27,T.top[1]+q[1]*0.27])),c:tv});
    units.push(us);
  }
  for(let u=1;u<U;u++){let best=1e9,ba=0,bb=0;for(const a of units[u-1])for(const b of units[u]){const d=hyp(stars[a].x-stars[b].x,stars[a].y-stars[b].y);if(d<best){best=d;ba=a;bb=b;}}links.push([ba,bb]);}
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  const acc=p=>{if(p[0]<mnx)mnx=p[0];if(p[0]>mxx)mxx=p[0];if(p[1]<mny)mny=p[1];if(p[1]>mxy)mxy=p[1];};
  for(const g of segs)for(const p of g.p)acc(p);for(const d of deco)for(const p of d.p)acc(p);for(const d of tops)for(const p of d.p)acc(p);
  const ox=(mnx+mxx)/2,oy=(mny+mxy)/2,sh=p=>{p[0]-=ox;p[1]-=oy;};
  for(const g of segs)g.p.forEach(sh);for(const d of deco)d.p.forEach(sh);for(const d of tops)d.p.forEach(sh);for(const d of dots)sh(d.p);
  for(const s of stars){s.x-=ox;s.y-=oy;}
  return {stars,segs,deco,dots,links,tops,w:Math.max(0.5,mxx-mnx),h:Math.max(0.5,mxy-mny)};

  if(!o||typeof o!=='object'||o.v!==1){try{localStorage.removeItem(SKEY);}catch(e){}return;}
  try{
    const roof=Array.isArray(o.roof)?o.roof.map(vSpec).filter(Boolean).slice(0,4):[];
    const gar=Array.isArray(o.gar)?o.gar.map(vSpec).filter(Boolean).slice(0,5):[];

// ================= trace (collect star grains) =================

function moveTrace(x,y){

  else{for(const g of tr.caps){g.st='float';g.ft=0;g.hx=g.x;g.hy=g.y;}if(tr.caps.length===1)tone(700,0.12,{to:520,v:0.05});}

function makeConst(tr){

// ================= songs =================
function stopSinging(o){for(let i=S.players.length-1;i>=0;i--)if(S.players[i].o===o)S.players.splice(i,1);o.singing=false;}

function updPlayers(dt){

// ================= bike (rare) =================
function spawnBike(){
  S.bikeSeen++;

function bikeR(){return L.m*0.045;}
function updBike(dt){
  const b=S.bike;if(!b)return;
  b.t+=dt;b.hop=Math.max(0,b.hop-dt);
  const r=L.sky,ry=r.y+r.h*0.12,parkX=r.x+bikeR()*1.6,parkY=r.y+bikeR()*0.9;
  if(b.st==='pop'){const p=clamp(b.t/0.7,0,1);b.x=lerp(L.jx,L.jx,p);b.y=lerp(L.jTop,ry,eob(p));if(p>=1){b.st='ride';b.t=0;}}
  else if(b.st==='ride'||b.st==='lap'){
    const v=L.m*(b.st==='lap'?0.55:0.32);b.x+=b.dir*v*dt;b.y=lerp(b.y,ry+Math.sin(b.x*0.03)*6,Math.min(1,dt*6));b.wh+=b.dir*v*dt/(bikeR()*0.5);

    if(b.x<r.x+bikeR()*1.5&&b.dir<0){b.dir=1;b.laps++;}
    if(b.laps>=(b.st==='lap'?1:2)&&b.dir<0&&b.x<parkX+bikeR()*2){b.st='park';b.t=0;}
  }else if(b.st==='park'){b.x=lerp(b.x,parkX,Math.min(1,dt*4));b.y=lerp(b.y,parkY,Math.min(1,dt*4));b.dir=1;}
  else if(b.st==='leave'){b.x+=L.m*0.5*dt;b.wh+=L.m*0.5*dt/(bikeR()*0.5);if(b.x>W+bikeR()*4)S.bike=null;}

function drawBike(x,y,s,wh,dir,a){
  a=a==null?1:a;const m=dir<0?-1:1,wr=s*0.48;
  const rx=x-s*0.9*m,fx=x+s*0.9*m,wy=y+s*0.38;

    for(let k=0;k<2;k++){const an=wh+k*PI/2;seg(cx-Math.cos(an)*wr*0.9,wy-Math.sin(an)*wr*0.9,cx+Math.cos(an)*wr*0.9,wy+Math.sin(an)*wr*0.9);neon(COL[2],LW*0.4,a*0.6,true);}}

  seg(seat[0]-s*0.2*m,seat[1]-s*0.04,seat[0]+s*0.14*m,seat[1]-s*0.04);neon(COL[1],LW,a,true);
  seg(hd[0]-s*0.12*m,hd[1]-s*0.12,hd[0]+s*0.12*m,hd[1]+s*0.02);neon(COL[1],LW,a,true);
  spr(WSTAR,hd[0]+s*0.14*m,hd[1]-s*0.1,s*0.22,a*(0.5+0.5*Math.sin(S.t*6)));

// ================= finale =================
const ZF=0.84;
function startFinale(){
  endAct(true);S.finPending=0;S.pressing=false;
  const f={ph:'open',t:0,parts:[],cust:[],served:0,beatT:0,beatI:0,cups:[]};
  S.roof.forEach((r,i)=>{f.parts.push({r:r,i:i,x:L.slotX[i],y:L.slotY,sz:r.szs||1,sang:false,fired:false,burst:false,lx:0,ly:0});});

function marchGeo(){const top=L.y0-L.h*0.06,bot=L.jTop-L.m*0.06;return {cx:L.x0+L.w/2,cy:(top+bot)/2,rx:L.w*(L.port?0.36:0.4),ry:Math.max(L.m*0.12,(bot-top)/2-L.m*0.1)};}

function nextPh(f,ph){f.ph=ph;f.t=0;}
function updFinale(dt){
  const f=S.fin;f.t+=dt;
  const M=marchGeo(),np=f.parts.length,hasBike=!!S.bike,gap=0.62;
  if(f.ph==='march'||f.ph==='fire'){B.danceT=Math.max(B.danceT,0.3);B.danceDir=Math.sin(S.t*0.8)>=0?1:-1;}
  if(f.ph==='open'){
    const e=eio(clamp(f.t/1.8,0,1));S.roofOpen=e;S.cam.s=lerp(1,ZF,e);
    if(f.t>=1.9){nextPh(f,'march');[523.25,659.25,783.99,1046.5].forEach((q,i)=>tone(q,0.5,{type:'triangle',v:0.08,at:i*0.1}));if(S.bike){S.bike.st='march';SFX.bike();}}
  }else if(f.ph==='march'){

      const k=i+(hasBike?1:0),q=pos(k);

      else{p.x=q[0];p.y=q[1];p.sz=partSize(p);}

    });
    if(hasBike){const q=pos(0),b=S.bike;b.wh+=dt*8;b.dir=1;b.x=lerp(b.x,q[0],Math.min(1,dt*(f.t<lead?3:12)));b.y=lerp(b.y,q[1],Math.min(1,dt*(f.t<lead?3:12)));if(Math.floor(f.t/2.4)!==Math.floor((f.t-dt)/2.4))SFX.bike();}

      if(p.fired&&!p.burst){const q=clamp((f.t-t0)/0.65,0,1);p.x=lerp(p.lx,p.tx,eo(q));p.y=lerp(p.ly,p.ty,eo(q));
        if(S.sparks.length<SPARK_MAX)S.sparks.push({x:p.x,y:p.y+4,vx:rr(-10,10),vy:rr(20,50),g:0,life:0.4,max:0.4,c:p.r.sp.cols[0],r:L.gr*0.7});
        if(q>=1){p.burst=true;SFX.burst();

          const cs=p.r.sp.cols;for(let j=0;j<40;j++)addSpark(p.x,p.y,cs[j%cs.length],1,L.m*0.6,1.7,L.gr*1.25,L.m*0.14);

    });

    if(f.t>=np*0.36+1.9){nextPh(f,'serve');spawnCustomers(f);}
  }else if(f.ph==='serve'){
    for(const c of f.cust){c.wt+=dt;const q=clamp(f.t/1.5,0,1);c.x=lerp(c.x0,c.tx,eo(q));c.walk=q<1;c.raise=Math.max(0,c.raise-dt*0)+0;}

function cueFruit(){

  for(const k of [1,2,0]){const it=S.tray[k];if(it.st==='on'&&it.g>=1)return it;}
  return null;
}
function computeCue(){
  if(S.fin||S.finPending)return null;
  if(S.presses===0)return {k:'button'};
  if(S.pressing)return {k:'button'};
  const fl=floatGrains();
  if(fl>=3||(fl>=2&&(S.fruits.length===0||S.juice>=0.9)))return {k:'grains'};
  const fresh=S.consts.filter(c=>c.form>=1&&c.leave==null&&!c.back&&(!S.cup||c.sp.type!==S.cup.sp.type));
  if(fresh.length&&((!S.cup&&S.made>=2)||(S.cup&&S.made-S.cupMade>=2))){
    const c=fresh[fresh.length-1];if(new Set(c.sp.cols).size>=2||S.made>=4)return {k:'const',o:c};
  }
  const mk=new Set(S.fruits.map(f=>f.k));
  let same=false;
  if(S.lastMade){const cs=new Set(S.lastMade.sp.cols);same=cs.size===mk.size&&[...cs].every(c=>mk.has(c));}
  if(S.fruits.length===0||(same&&S.fruits.length<3&&S.fly.length===0)){const it=cueFruit();if(it)return {k:'fruit',o:it};}
  if(S.fruits.length>0||S.fly.length>0)return {k:'button'};
  const it=cueFruit();if(it)return {k:'fruit',o:it};
  return {k:'button'};
}
function cuePos(){

  return null;
}

  for(const it of S.tray){if(it.st!=='on'||it.g<0.6)continue;const p=trayPos(it);if(hyp(x-p.x,y-p.y)<L.fr*1.4)return {k:'fruit',f:it};}

    const hw=C.shape.w*C.sz*0.5+L.gr,hh=C.shape.h*C.sz*0.5+L.gr;

    }

    if(S.cup){sing(S.cup);S.cupWob=0.6;}else{SFX.tink();S.cupWob=0.6;}return {k:'tap'};

// ================= update =================
function update(dt){
  S.t+=dt;S.frames++;
  // button spring, spin, squash
  const k=360,dmp=19;S.btnV+=(k*((S.pressing?1:0)-S.btnD)-dmp*S.btnV)*dt;S.btnD+=S.btnV*dt;
  if(S.pressing)S.spin+=(1-S.spin)*Math.min(1,dt*6);else S.spin=Math.max(0,S.spin-dt*0.6);
  S.spinAng+=S.spin*dt*13;
  S.squash+=(0-S.squash)*Math.min(1,dt*9);if(S.pressing)S.squash=Math.max(S.squash,0.55);
  S.jarWob=Math.max(0,S.jarWob-dt*2.5);S.cupWob=Math.max(0,S.cupWob-dt*2.5);S.lid=Math.max(0,S.lid-dt*5);S.nudge=Math.max(0,S.nudge-dt);
  S.mimPulse=Math.max(0,S.mimPulse-dt*4);
  // emission
  if(canEmit()){if(S.spin>0.04)S.emitAcc+=dt*S.spin*3.0;while(S.emitAcc>=1&&canEmit()){S.emitAcc-=1;emitGrain();}}
  else S.emitAcc=Math.min(S.emitAcc,0.95);
  if(S.drain>0){const q=Math.min(S.drain,dt*0.6);S.drain-=q;S.juice=Math.max(0,S.juice-q);}
  S.juiceVis+=(S.juice-S.juiceVis)*Math.min(1,dt*5);
  for(const f of S.fruits)f.s=Math.min(1,f.s+dt*3);
  // flying fruits
  for(let i=S.fly.length-1;i>=0;i--){const f=S.fly[i];f.t+=dt/f.dur;if(f.t>=1){S.fly.splice(i,1);fruitArrive(f);}}
  // tray
  for(const it of S.tray){
    if(it.st==='gone'){it.t-=dt;if(it.t<=0){it.st='on';it.g=0;}}
    else if(it.st==='on'){it.g=Math.min(1,it.g+dt*2.2);}
    else if(it.st==='back'){it.bt+=dt/0.45;if(it.bt>=1){it.st='on';it.g=1;}}
  }
  if(S.tray[0].t===Infinity&&S.fruits.length===0&&S.fly.length===0&&!S.fin)S.tray[0].t=0.6;
  // grains
  for(let i=S.grains.length-1;i>=0;i--){
    const g=S.grains[i];g.t+=dt;g.tw+=dt;if(g.st==='float')g.ft+=dt;
    if(g.st==='fade'){g.fa-=dt*1.5;g.y-=dt*20;if(g.fa<=0){S.grains.splice(i,1);continue;}}
    else grainPos(g,dt);
  }
  // constellations

  for(let i=S.consts.length-1;i>=0;i--){
    const C=S.consts[i];
    if(C.form<1){const w=C.form;C.form=Math.min(1,C.form+dt/0.6);if(C.form>=1&&w<1)onFormed(C);}
    for(let j=0;j<C.flash.length;j++)C.flash[j]=Math.max(0,C.flash[j]-dt*3.2);
    C.bounce=Math.max(0,C.bounce-dt*2);
    if(C.leave!=null){C.leave+=dt/1.1;if(C.leave>=1){stopSinging(C);S.consts.splice(i,1);continue;}}
    const A=C.sz*0.55;
    if(C.singing){const ph=C.singT/STEP;C.danceX=C.sp.dir*A*Math.sin(ph*PI*0.5);C.tilt=C.sp.dir*0.14*Math.sin(ph*PI*0.5);C.hop=-A*0.3*Math.abs(Math.sin(ph*PI));C.slide=clamp(C.slide+C.sp.dir*A*0.55*dt/STEP,-A*2.2,A*2.2);}
    else{C.danceX*=1-Math.min(1,dt*5);C.tilt*=1-Math.min(1,dt*5);C.hop*=1-Math.min(1,dt*5);C.slide*=1-Math.min(1,dt*0.9);}
    if(C.back){C.back.t+=dt/0.8;const e=eio(clamp(C.back.t,0,1));C.x=lerp(C.back.x0,C.back.x1,e);C.y=lerp(C.back.y0,C.back.y1,e)-Math.sin(e*PI)*L.m*0.1;if(C.back.t>=1){C.back=null;clampConst(C);}}
    else if(!C.drag&&C.form>=1&&C.leave==null){
      C.x+=Math.sin(S.t*0.35+C.id*1.7)*dt*2.5;C.y+=Math.cos(S.t*0.3+C.id)*dt*2;
      for(const D of S.consts){if(D===C||D.leave!=null||D.drag)continue;const dx=C.x-D.x,dy=C.y-D.y,d=hyp(dx,dy)||1,mn=(constRadius(C)+constRadius(D))*0.8;if(d<mn){const pu=(mn-d)*dt*1.2;C.x+=dx/d*pu;C.y+=dy/d*pu;}}
      clampConst(C);
    }
  }
  updPlayers(dt);
  // roof copies
  for(const r of S.roof){
    for(let j=0;j<r.flash.length;j++)r.flash[j]=Math.max(0,r.flash[j]-dt*3.2);
    if(r.fly<1){r.fly=Math.min(1,r.fly+dt/0.9);if(r.fly>=1){SFX.chime();addRing(L.slotX[r.slot],L.slotY,L.slotR*0.6,L.slotR*1.7,r.sp.cols[0],0.5);addSpark(L.slotX[r.slot],L.slotY,r.sp.cols[0],8,L.m*0.14,0.5);}}
  }
  for(const g of S.gar){g.app=Math.min(1,(g.app||0)+dt*1.5);for(let j=0;j<g.flash.length;j++)g.flash[j]=Math.max(0,g.flash[j]-dt*3.2);}
  if(S.cup)for(let j=0;j<S.cup.flash.length;j++)S.cup.flash[j]=Math.max(0,S.cup.flash[j]-dt*3.2);
  if(S.cupIn){S.cupIn.t+=dt/0.5;if(S.cupIn.t>=1)S.cupIn=null;}
  // finale
  if(S.finPending&&!S.fin){S.finWait-=dt;if(S.finWait<=0&&!S.act)startFinale();}
  if(S.fin)updFinale(dt);
  updBike(dt);
  updBoy(dt);
  updCue(dt);
  updDemo(dt);
  // particles
  for(let i=S.sparks.length-1;i>=0;i--){const s=S.sparks[i];s.life-=dt;if(s.life<=0){S.sparks.splice(i,1);continue;}s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=s.g*dt;s.vx*=1-Math.min(1,dt*2.2);s.vy*=1-Math.min(1,dt*2.2);}
  for(let i=S.rings.length-1;i>=0;i--){const r=S.rings[i];r.t+=dt;if(r.t>=r.dur)S.rings.splice(i,1);}
  for(let i=S.ribbons.length-1;i>=0;i--){const r=S.ribbons[i];r.t+=dt;if(r.t>=r.dur)S.ribbons.splice(i,1);}
  for(let i=S.ghosts.length-1;i>=0;i--){const g=S.ghosts[i];g.t+=dt;if(g.t>=g.dur)S.ghosts.splice(i,1);}
  for(let i=S.trail.length-1;i>=0;i--){S.trail[i].a-=dt*1.6;if(S.trail[i].a<=0)S.trail.splice(i,1);}
  motorUpd(dt);
}
function motorUpd(dt){

  B.gx=lerp(B.gx,tx,Math.min(1,dt*8));B.gy=lerp(B.gy,ty,Math.min(1,dt*8));
  B.mood=B.wowT>0?'wow':B.clapT>0?'clap':B.serve>0?'serve':B.danceT>0?'dance':B.lean>0.3?'lean':'idle';
}

// ================= render =================
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';ctx.lineJoin='round';
  const s=S.cam.s;
  if(s!==1){const cx=W/2,cy=L.cntY*0.92;ctx.translate(cx,cy);ctx.scale(s,s);ctx.translate(-cx,-cy);}
  if(!S.fin&&S.roofOpen===0&&S.cam.s===1)drawStaticLayer();else{drawRoof();drawSlotRings();drawCounter();}
  drawSlots();
  drawConsts();drawGrains();drawTrail();drawTrace();drawRibbons();
  if(S.bike)drawBike(S.bike.x,S.bike.y-(S.bike.hop>0?Math.sin(S.bike.hop*PI*2)*bikeR()*0.6:0)-(S.bike.st==='park'?Math.abs(Math.sin(S.t*2))*2:0),bikeR(),S.bike.wh,S.bike.dir);
  drawBoy();drawCup();drawMixer();drawTray();drawGarland();drawFly();
  if(S.fin)drawFinale();
  drawGhosts();drawSparks();drawRings();
  drawDragged();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawDemo();
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function drawShape(sh,x,y,sz,o){
  const a=o.a==null?1:o.a,tl=o.tilt||0,ct=Math.cos(tl),st=Math.sin(tl),lw=o.lw||LW,lite=!!o.lite;
  const fl=o.flash,form=o.form==null?1:o.form,src=o.src;
  const oa=a*clamp((form-0.3)/0.7,0,1);
  const X=(px,py)=>x+(px*ct-py*st)*sz,Y=(px,py)=>y+(px*st+py*ct)*sz;
  if(oa>0.01){
    for(let c=0;c<3;c++){
      let any=false;ctx.beginPath();
      for(const g of sh.segs){if(g.c!==c)continue;any=true;const p=g.p;ctx.moveTo(X(p[0][0],p[0][1]),Y(p[0][0],p[0][1]));for(let i=1;i<p.length;i++)ctx.lineTo(X(p[i][0],p[i][1]),Y(p[i][0],p[i][1]));}
      if(any)neon(COL[c],lw,oa*0.88,lite);
    }
    if(fl&&!lite){for(const g of sh.segs){const f=fl[g.s];if(f<0.05)continue;const p=g.p;ctx.beginPath();ctx.moveTo(X(p[0][0],p[0][1]),Y(p[0][0],p[0][1]));for(let i=1;i<p.length;i++)ctx.lineTo(X(p[i][0],p[i][1]),Y(p[i][0],p[i][1]));core(lw*0.7,oa*f*0.8);}}
    for(let c=0;c<3;c++){
      let any=false;ctx.beginPath();
      for(const d of sh.deco){if(d.c!==c)continue;any=true;const p=d.p;ctx.moveTo(X(p[0][0],p[0][1]),Y(p[0][0],p[0][1]));for(let i=1;i<p.length;i++)ctx.lineTo(X(p[i][0],p[i][1]),Y(p[i][0],p[i][1]));if(d.cl)ctx.closePath();}
      for(const d of sh.tops){if(d.c!==c)continue;any=true;const p=d.p;ctx.moveTo(X(p[0][0],p[0][1]),Y(p[0][0],p[0][1]));for(let i=1;i<p.length;i++)ctx.lineTo(X(p[i][0],p[i][1]),Y(p[i][0],p[i][1]));ctx.closePath();}
      if(any)neon(COL[c],lw*0.7,oa*0.62,true);
    }
    if(!lite)for(const d of sh.dots)spr(GLOW[d.c],X(d.p[0],d.p[1]),Y(d.p[0],d.p[1]),lw*2.1,oa*0.65);
    if(sh.links.length){ctx.beginPath();for(const l of sh.links){const A=sh.stars[l[0]],Bq=sh.stars[l[1]];ctx.moveTo(X(A.x,A.y),Y(A.x,A.y));const mx=(A.x+Bq.x)/2,my=(A.y+Bq.y)/2+0.35;ctx.quadraticCurveTo(X(mx,my),Y(mx,my),X(Bq.x,Bq.y),Y(Bq.x,Bq.y));}
      ctx.setLineDash([lw*1.4,lw*2.6]);core(lw*0.7,oa*0.55);ctx.setLineDash([]);}
  }
  const rs=o.rs||L.gr,tw=o.tw;
  for(let i=0;i<sh.stars.length;i++){
    const s=sh.stars[i];let px=X(s.x,s.y),py=Y(s.x,s.y);
    if(form<1&&src&&src[i]){const e=eob(clamp(form,0,1));px=lerp(src[i][0],px,e);py=lerp(src[i][1],py,e);}
    const f=fl?fl[i]:0,b=tw?0.8+0.25*Math.max(0,Math.cos((S.t/BEAT-i*0.25)*TAU)):1;
    spr(STAR[s.c],px,py,rs*(1.25+f*1.1)*b,a);
  }
}
function drawConsts(){
  for(const C of S.consts){
    const hw=C.shape.w*C.sz/2,ddx=clamp(C.danceX+C.slide,-(C.x-hw-L.x0-4),L.x1-4-(C.x+hw));
    let a=1,sz=C.sz,x=C.x+ddx,y=C.y+C.hop-C.bounce*Math.sin(C.bounce*PI*3)*C.sz*0.3;
    if(C.leave!=null){
      const e=eio(C.leave),r=C.roofRef;a=1-e;
      if(r&&r.fly>=1&&!S.fin){x=lerp(x,L.slotX[r.slot],e);y=lerp(y,L.slotY,e);sz=lerp(C.sz,slotSize(r),e);}else y-=e*L.m*0.2;
    }
    const cue=S.cue&&S.cue.k==='const'&&S.cue.o===C;
    if(cue){y-=Math.abs(Math.sin(S.t*4))*C.sz*0.35;spr(GLOW[C.sp.cols[0]],x,y,constRadius(C)*1.6,0.18+0.12*Math.sin(S.t*5));}
    drawShape(C.shape,x,y,sz,{a:a,tilt:C.tilt,flash:C.flash,form:C.form,src:C.src,tw:!C.singing});
  }
}
function drawGrains(){
  const r=L.gr,cue=S.cue&&S.cue.k==='grains'&&!S.trace;
  for(const g of S.grains){
    let a=g.st==='fade'?g.fa:1,rad=r*(1+0.18*Math.sin(g.tw*5+g.ph));
    if(g.st==='cap'){rad*=1.5;}
    if(cue)a*=0.75+0.35*Math.max(0,Math.sin(S.t*5-g.hx*0.02));
    spr(GLOW[g.c],g.x,g.y,rad*2.2,a*0.6);
    spr(STAR[g.c],g.x,g.y,rad*1.3,a);
    const an=g.tw*0.8+g.ph,ca=Math.cos(an)*rad*1.15,sa=Math.sin(an)*rad*1.15;
    ctx.beginPath();ctx.moveTo(g.x-ca,g.y-sa);ctx.lineTo(g.x+ca,g.y+sa);ctx.moveTo(g.x+sa,g.y-ca);ctx.lineTo(g.x-sa,g.y+ca);
    neon(COL[g.c],LW*0.55,a*0.9,true);
  }
}
function drawTrail(){for(const p of S.trail)spr(WGLOW,p.x,p.y,L.gr*1.3*p.a+1,p.a*0.35);}
function drawTrace(){
  const tr=S.trace;if(!tr||!tr.caps.length)return;
  const c=tr.caps;
  for(let i=1;i<c.length;i++){seg(c[i-1].x,c[i-1].y,c[i].x,c[i].y);neon(COL[c[i-1].c],LW*1.15,0.95);}
  const l=c[c.length-1],d=hyp(tr.fx-l.x,tr.fy-l.y),w=LW*clamp(1.4-d/(L.m*0.5),0.45,1.2);
  seg(l.x,l.y,tr.fx,tr.fy);neon(COL[l.c],w,0.7);
}
function drawRibbons(){
  for(const rb of S.ribbons){
    const e=rb.t/rb.dur,hd=eo(clamp(e*1.3,0,1)),tl=clamp(hd-0.45,0,1);
    const mx=(rb.ax+rb.bx)/2-(rb.by-rb.ay)*rb.bend,my=(rb.ay+rb.by)/2+(rb.bx-rb.ax)*rb.bend;
    const q=t=>[(1-t)*(1-t)*rb.ax+2*(1-t)*t*mx+t*t*rb.bx,(1-t)*(1-t)*rb.ay+2*(1-t)*t*my+t*t*rb.by];
    ctx.beginPath();for(let i=0;i<=10;i++){const p=q(lerp(tl,hd,i/10));if(i)ctx.lineTo(p[0],p[1]);else ctx.moveTo(p[0],p[1]);}
    neon(COL[rb.c],LW*1.1,1-e*0.6,true);const h=q(hd);spr(STAR[rb.c],h[0],h[1],L.gr*1.6,1-e*0.5);
  }
  // song link: cup -> mixer while spinning
  if(S.cup&&S.spin>0.05&&!S.fin){
    const ax=L.cupX,ay=L.cupTop,bx=L.jx+L.jw*0.3,by=L.jTop+L.jh*0.2,mx=(ax+bx)/2,my=Math.min(ay,by)-L.m*0.08;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(mx,my,bx,by);ctx.setLineDash([LW*1.5,LW*3.5]);ctx.lineDashOffset=-S.t*40;
    neon(COL[S.cup.sp.cols[0]],LW*0.8,S.spin*(0.45+0.4*S.mimPulse),true);ctx.setLineDash([]);ctx.lineDashOffset=0;
  }
}
function drawRoof(){
  const o=S.roofOpen,yT=L.roofT,yB=L.roofB,mid=W/2,n=10,sw=W/n,sh=Math.min(sw*0.22,(yB-yT)*0.4);
  for(let side=0;side<2;side++){
    ctx.save();
    const pv=side?W:0;
    if(o>0){ctx.translate(pv,yT);ctx.rotate((side?1:-1)*o*0.9);ctx.translate(-pv,-yT);}
    const a=side?mid:0,b=side?W:mid;
    seg(a,yT,b,yT);neon(COL[0],LW*1.2,0.95);
    seg(a,yT+LW*3,b,yT+LW*3);neon(COL[0],LW*0.55,0.45,true);
    for(let i=0;i<n;i++){
      const x0=i*sw,x1=x0+sw,xc=x0+sw/2;if((xc<mid)!==(side===0))continue;
      ctx.beginPath();ctx.moveTo(x0,yB-sh);ctx.quadraticCurveTo(xc,yB+sh*1.6,x1,yB-sh);neon(COL[i%2?2:1],LW,0.9);
      seg(x0,yT+LW*4,x0,yB-sh);neon(COL[i%2?1:2],LW*0.5,0.35,true);
    }
    ctx.restore();
  }
}
function slotSize(r){return L.slotR*1.7/Math.max(r.shape.w,r.shape.h);}
function drawSlotRings(){
  const a=1-S.roofOpen;
  for(let i=0;i<5;i++){
    const x=L.slotX[i],y=L.slotY,r=L.slotR;
    seg(x,L.roofB,x,y-r);neon(COL[2],LW*0.5,0.35*a,true);
    ctx.setLineDash([LW*1.6,LW*3]);circ(x,y,r);neon(COL[2],LW*0.6,0.3*a,true);ctx.setLineDash([]);
  }
}
let STATIC=null,staticKey='';
function drawStaticLayer(){
  const key=cv.width+'x'+cv.height+'|'+L.x0+','+L.y0+','+L.x1+','+L.y1;
  if(!STATIC||staticKey!==key){
    staticKey=key;STATIC=document.createElement('canvas');STATIC.width=cv.width;STATIC.height=cv.height;
    const g=STATIC.getContext('2d');ctx=g;
    try{ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.lineJoin='round';drawRoof();drawSlotRings();drawCounter();}
    finally{ctx=MAINCTX;}
  }
  ctx.globalAlpha=1;ctx.drawImage(STATIC,0,0,W,H);
}
function drawSlots(){
  if(S.fin&&S.fin.ph!=='open')return;
  for(const r of S.roof){
    const tx=L.slotX[r.slot],ty=L.slotY,ts=slotSize(r);
    let x=tx,y=ty,sz=ts;
    if(r.fly<1){const e=eio(r.fly);x=lerp(r.fx,tx,e);y=lerp(r.fy,ty,e)-Math.sin(e*PI)*L.m*0.12;sz=lerp(r.fsz,ts,e);}
    const ph=r.singing?r.singT/STEP:0,tilt=r.singing?r.sp.dir*0.18*Math.sin(ph*PI*0.5):Math.sin(S.t*1.1+r.slot*1.3)*0.05;
    drawShape(r.shape,x,y,sz,{flash:r.flash,lite:r.fly>=1&&!r.singing,lw:LW*0.75,rs:L.gr*0.75,tilt:tilt,tw:true});
  }
}
function drawCounter(){
  const y=L.cntY,gx0=L.jx-L.bw/2-6,gx1=L.jx+L.bw/2+6;
  seg(L.x0,y,gx0,y);neon(COL[2],LW,0.85);seg(gx1,y,L.x1,y);neon(COL[2],LW,0.85);
  seg(L.x0,y+LW*3.2,gx0,y+LW*3.2);neon(COL[0],LW*0.55,0.4,true);seg(gx1,y+LW*3.2,L.x1,y+LW*3.2);neon(COL[0],LW*0.55,0.4,true);
  const px0=L.x0+L.w*0.012,px1=L.x1-L.w*0.012,o=1-S.roofOpen;
  seg(px0,L.roofB+L.h*0.01,px0,y);neon(COL[0],LW*0.7,0.45*o,true);seg(px1,L.roofB+L.h*0.01,px1,y);neon(COL[0],LW*0.7,0.45*o,true);
  const sy=L.trayY+L.fr+6;seg(L.trayX[0]-L.fr*1.2,sy,L.trayX[2]+L.fr*1.2,sy);neon(COL[2],LW*0.6,0.4*custFade(),true);
}
function drawMixer(){
  const jx=L.jx,jw=L.jw,jh=L.jh,jb=L.jBot,jt=L.jTop,sq=S.squash,wob=Math.sin(S.t*30)*S.jarWob*0.035;
  ctx.save();ctx.translate(jx,L.bBot);ctx.scale(1+sq*0.035,1-sq*0.045);ctx.rotate(wob);ctx.translate(-jx,-L.bBot);
  const tw=jw/2,bw=jw*0.4,r=jw*0.1;
  const jar=(i)=>{ctx.beginPath();ctx.moveTo(jx-tw+i,jt+i*0.5);ctx.lineTo(jx-bw+i,jb-r-i*0.3);ctx.quadraticCurveTo(jx-bw+i,jb-i,jx-bw+r+i,jb-i);ctx.lineTo(jx+bw-r-i,jb-i);ctx.quadraticCurveTo(jx+bw-i,jb-i,jx+bw-i,jb-r-i*0.3);ctx.lineTo(jx+tw-i,jt+i*0.5);};
  // juice: flowing light lines
  const lvl=S.juiceVis;
  if(lvl>0.01||S.spin>0.05){
    const top=jb-Math.max(lvl,0.04)*jh*0.86,nL=lvl>0.01?4:1,cols=S.jcol.length?S.jcol:[0];
    for(let i=0;i<nL;i++){
      const y0=lerp(top,jb-5,i/nL);
      const hw=lerp(bw,tw,(jb-y0)/jh)-6;
      ctx.beginPath();
      for(let j=0;j<=14;j++){const u=j/14*2-1,x=jx+u*hw,yy=y0+Math.sin(u*3+S.t*4+i*1.7+S.spinAng*0.8)*(2+S.spin*5)+(1-u*u)*S.spin*jh*0.09*(i===0?1:0.45);if(j)ctx.lineTo(x,yy);else ctx.moveTo(x,yy);}
      neon(COL[cols[i%cols.length]],LW*0.9,lvl>0.01?0.8:0.25,i>0);
    }
    if(lvl>0.01)spr(GLOW[cols[cols.length-1]],jx,lerp(top,jb,0.5),jw*0.6,0.12+lvl*0.18);
  }
  // fruits
  const n=S.fruits.length;
  S.fruits.forEach((f,i)=>{
    const rest=[jx+(i-(n-1)/2)*jw*0.24,jb-jw*0.16-(i%2)*jw*0.08];
    const an=S.spinAng+i*TAU/Math.max(1,n)+f.a;
    const orb=[jx+Math.cos(an)*jw*0.2,(jt+jb)/2+jh*0.1+Math.sin(an)*jh*0.16];
    const sp=clamp(S.spin*1.6,0,1);
    const x=lerp(rest[0],orb[0],sp),y=lerp(rest[1],orb[1],sp)-(1-clamp(f.s,0,1))*jh*0.5;
    const rad=jw*0.19*(0.45+0.55*Math.max(0,f.amt))*Math.max(0.2,eob(clamp(f.s,0,1)));
    drawFruit(f.k,x,y,rad,S.spinAng*1.5+f.a+Math.sin(S.t*2+i)*0.1);
  });
  // blades
  const by=jb-jw*0.07;
  for(let k=0;k<2;k++){const an=S.spinAng*2+k*PI/2,dx=Math.cos(an)*bw*0.75,dy=Math.sin(an)*bw*0.16;seg(jx-dx,by-dy,jx+dx,by+dy);neon(COL[1],LW*0.7,0.75,true);}
  // glass
  jar(0);neon(COL[2],LW,0.9);
  jar(6);neon(COL[2],LW*0.5,0.35,true);
  seg(jx-tw+10,jt+10,jx-bw+8,jb-r-6);core(LW*0.5,0.2);
  const ly=jt-S.lid*9;
  seg(jx-tw-5,ly,jx+tw+5,ly);neon(COL[0],LW,0.9);
  ctx.beginPath();ctx.arc(jx,ly,jw*0.1,PI,TAU);neon(COL[0],LW*0.8,0.8,true);
  // base
  const bx0=jx-L.bw/2,bx1=jx+L.bw/2,bt=L.bTop,bb=L.bBot,rr2=L.bw*0.12;
  ctx.beginPath();ctx.moveTo(bx0+rr2,bt);ctx.lineTo(bx1-rr2,bt);ctx.quadraticCurveTo(bx1,bt,bx1,bt+rr2);ctx.lineTo(bx1,bb-rr2);ctx.quadraticCurveTo(bx1,bb,bx1-rr2,bb);ctx.lineTo(bx0+rr2,bb);ctx.quadraticCurveTo(bx0,bb,bx0,bb-rr2);ctx.lineTo(bx0,bt+rr2);ctx.quadraticCurveTo(bx0,bt,bx0+rr2,bt);
  neon(COL[0],LW,0.85);
  ctx.restore();
  drawButton();
}
function drawButton(){
  const x=L.btnX,y=L.btnY,r=L.br,d=clamp(S.btnD,-0.45,1.2),cueOn=!!(S.cue&&S.cue.k==='button'&&!S.pressing);
  const pul=cueOn?0.5+0.5*Math.sin(S.t*5):0,bnc=cueOn?-Math.abs(Math.sin(S.t*4))*r*0.08:0;
  circ(x,y,r*1.08);neon(COL[1],LW,0.8);

  ctx.save();ctx.translate(x,cy);ctx.scale(1+d*0.06,1-d*0.15);
  circ(0,0,r*0.84);neon(COL[0],LW*1.3,1);
  circ(0,0,r*0.64);neon(COL[0],LW*0.6,0.45,true);
  ctx.beginPath();for(let i=0;i<=28;i++){const t=i/28,an=t*TAU*1.7-S.spinAng*0.6,rad=r*0.52*t;const px=Math.cos(an)*rad,py=Math.sin(an)*rad;if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);}
  neon(COL[1],LW*0.85,0.9,true);
  ctx.restore();
  spr(GLOW[0],x,cy,r*(1.15+pul*0.55+S.nudge*0.4),0.3+pul*0.35+S.spin*0.2+S.nudge*0.3);

}
function drawCup(){
  const x=L.cupX,b=L.cupBot,t=L.cupTop,w=L.cupW,h=L.cupH,wb=Math.sin(S.t*28)*S.cupWob*0.06;

    const cols=[...new Set(S.cup.sp.cols)];
    for(let i=0;i<3;i++){const yy=lerp(t+h*0.42,b-6,i/3),hw=lerp(w*0.5,w*0.38,(yy-t)/h)-5;ctx.beginPath();for(let j=0;j<=10;j++){const u=j/10*2-1;const px=x+u*hw,py=yy+Math.sin(u*3+S.t*3+i)*2;if(j)ctx.lineTo(px,py);else ctx.moveTo(px,py);}neon(COL[cols[i%cols.length]],LW*0.8,0.75,true);}

    drawShape(sh,x,t+h*0.12-Math.abs(Math.sin(S.t*2))*3-S.mimPulse*4,sz,{flash:S.cup.flash,lw:LW*0.7,rs:L.gr*0.7,tilt:S.cup.singing?S.cup.sp.dir*0.15*Math.sin(ph*PI*0.5):0,tw:true});
    spr(GLOW[cols[0]],x,t+h*0.5,w*0.7,0.15+S.mimPulse*0.25);
  }
  ctx.beginPath();ctx.moveTo(x-w/2,t);ctx.lineTo(x-w*0.38,b);ctx.lineTo(x+w*0.38,b);ctx.lineTo(x+w/2,t);neon(COL[2],LW,0.85);
  ctx.beginPath();ctx.moveTo(x-w/2+5,t+4);ctx.lineTo(x-w*0.38+4,b-4);core(LW*0.45,0.25);

  const a0=performance.now();update(dt);const a1=performance.now();render();const a2=performance.now();

}

  if(raf)cancelAnimationFrame(raf);raf=0;
  endAct(true);S.pressing=false;S.spin=0;
  try{if(MOT){const t=AC.currentTime;MOT.g.gain.setValueAtTime(0,t);MOT.g2.gain.setValueAtTime(0,t);}if(AC&&AC.state==='running')AC.suspend().catch(()=>{});}catch(e){}
}
function resume(){
  if(!paused)return;paused=false;
  last=performance.now();
  if(!raf)raf=requestAnimationFrame(frame);
  try{if(AC&&AC.state!=='running')AC.resume().catch(()=>{});}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else resume();});
window.addEventListener('pagehide',pause);
window.addEventListener('pageshow',()=>{if(!document.hidden)resume();});
function resize(){
  const nw=Math.max(1,window.innerWidth),nh=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(nw*DPR);cv.height=Math.round(nh*DPR);cv.style.width=nw+'px';cv.style.height=nh+'px';
  readSA();
  const old=L.sky?{x:L.sky.x,y:L.sky.y,w:L.sky.w,h:L.sky.h,m:L.m}:null;
  W=nw;H=nh;layout();
  if(old){
    if(S.act&&S.act.k!=='btn')endAct(true);
    const mx=x=>L.sky.x+(x-old.x)/old.w*L.sky.w,my=y=>L.sky.y+(y-old.y)/old.h*L.sky.h;
    for(const g of S.grains){g.x=mx(g.x);g.y=my(g.y);g.hx=mx(g.hx);g.hy=my(g.hy);g.sx=mx(g.sx);g.sy=my(g.sy);g.oR*=L.m/old.m;}
    for(const C of S.consts){C.x=mx(C.x);C.y=my(C.y);C.sz=sizeFor(C.sp,C.shape);if(C.src)C.src=C.src.map(p=>[mx(p[0]),my(p[1])]);if(C.back){C.back.x0=L.cupX;C.back.y0=L.cupTop;C.back.x1=mx(C.back.x1);C.back.y1=my(C.back.y1);}clampConst(C);}
    if(S.bike){S.bike.x=mx(S.bike.x);S.bike.y=my(S.bike.y);}
    for(const r of S.roof)if(r.fly<1){r.fx=mx(r.fx);r.fy=my(r.fy);r.fsz*=L.m/old.m;}
    S.trail=[];
  }
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>{resize();});

// ================= init =================
function init(){
  resize();
  initTray();
  load();
  S.fruits=[{k:0,amt:1,a:0.6,s:1}];
  for(let i=0;i<3;i++)spawnGrain(0,[0],0,0,false);
  last=performance.now();
  raf=requestAnimationFrame(frame);
}

    roof:S.roof.map(r=>({type:r.sp.type,n:r.sp.cols.length,slot:r.slot,fly:r.fly,cols:r.sp.cols.slice()})),
    cup:S.cup?{type:S.cup.sp.type,cols:S.cup.sp.cols.slice(),dir:S.cup.sp.dir,melody:S.cup.song.steps.map(q=>q.deg)}:null,
    gar:S.gar.map(g=>({type:g.sp.type,cols:g.sp.cols.slice()})),

    cue:S.cue?S.cue.k:null,demo:S.demo?S.demo.kind:null,demoDone:Object.assign({},S.demoDone),
    bike:S.bike?{st:S.bike.st,x:S.bike.x,y:S.bike.y}:null,bikeSeen:S.bikeSeen,
    boy:B.mood,audio:AC?AC.state:'none',paused:paused,mimI:S.mim.i,mimPulse:S.mimPulse,
    prof:{u:+PROF.u.toFixed(2),r:+PROF.r.toFixed(2)},    sparks:S.sparks.length,act:S.act?S.act.k:null,saveOK:S.saveOK,trace:S.trace?S.trace.caps.length:0,roofOpen:S.roofOpen,cam:S.cam.s
  })
};
init();
