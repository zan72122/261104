(()=>{

// ================= basics =================
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

const eo=t=>1-(1-t)*(1-t);
const eio=t=>t<.5?2*t*t:1-2*(1-t)*(1-t);
const eob=t=>{const c=1.70158;t-=1;return 1+(c+1)*t*t*t+c*t*t;};
const hyp=Math.hypot;
let seed=((Date.now()*2654435761)^0x5bd1e995)>>>0;
function rnd(){seed=(seed+0x6D2B79F5)>>>0;let t=seed;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
const rr=(a,b)=>a+rnd()*(b-a);
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d;};
let W=0,H=0,DPR=1,NOW=0;
const SA={l:0,t:0,r:0,b:0};
const PART_MAX=130;
let DPRCAP=2;
let QS0=null;try{QS0=new URLSearchParams(location.search);}catch(_){QS0=null;}
const STILL=!!(QS0&&QS0.get('still')==='1'); // test hook: freezes idle animation so a tap's effect can be measured alone
const YARN='#a3261b', YARN_L='#d0503a', YARN_D='#5e130c';

function mkC(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
let NOISE=null;
function makeNoise(){
  const c=mkC(128,128),g=c.getContext('2d'),id=g.createImageData(128,128),d=id.data;
  for(let i=0;i<d.length;i+=4){const v=(rnd()*255)|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
  g.putImageData(id,0,0);NOISE=c;
}
// sprite: content drawn in unit coords [0..wu]x[0..hu]; s = CSS px per unit
function sprite(wu,hu,s,draw,opt){
  opt=opt||{};
  const pad=opt.pad!=null?opt.pad:12;
  const bw=opt.border!=null?opt.border:3.2;
  const R=s*DPR;
  const cw=Math.ceil((wu+pad*2)*R), ch=Math.ceil((hu+pad*2)*R);
  const a=mkC(cw,ch), g=a.getContext('2d');
  g.setTransform(R,0,0,R,pad*R,pad*R);
  draw(g);
  if(opt.grain!==0){
    g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-atop';
    g.globalAlpha=opt.grain||0.09;g.fillStyle=g.createPattern(NOISE,'repeat');g.fillRect(0,0,cw,ch);
    g.globalAlpha=1;g.globalCompositeOperation='source-over';
  }
  const out=mkC(cw,ch), o=out.getContext('2d');
  let sil=null;
  if(bw>0){
    sil=mkC(cw,ch);const b=sil.getContext('2d'),bp=bw*DPR;
    for(let ring=0;ring<2;ring++){const rad=bp*(ring?1:0.55);for(let i=0;i<14;i++){const an=(i+ring*.5)/14*TAU;b.drawImage(a,Math.cos(an)*rad,Math.sin(an)*rad);}}
    b.globalCompositeOperation='source-in';b.fillStyle=opt.edge||'#fbf8ef';b.fillRect(0,0,cw,ch);
  }
  if(opt.shadow!==0){
    o.save();o.shadowColor='rgba(45,28,12,'+(opt.shA||0.36)+')';o.shadowBlur=(opt.shB||6)*DPR;
    o.shadowOffsetX=(opt.shX!=null?opt.shX:2.5)*DPR;o.shadowOffsetY=(opt.shY!=null?opt.shY:4.5)*DPR;
    o.drawImage(sil||a,0,0);o.restore();
  }else if(sil)o.drawImage(sil,0,0);
  if(sil&&opt.shadow!==0)o.drawImage(sil,0,0);
  o.drawImage(a,0,0);
  return {c:out,w:cw/DPR,h:ch/DPR,ax:pad*s,ay:pad*s,s:s,wu:wu,hu:hu};
}
// draw sprite so that unit point (px,py) lands on (x,y)
function drawSp(sp,x,y,px,py,rot,sx,sy,al){
  if(!sp)return;
  ctx.save();ctx.translate(x,y);
  if(rot)ctx.rotate(rot);
  if(sx!==undefined&&(sx!==1||sy!==1))ctx.scale(sx,sy);
  if(al!==undefined&&al<1)ctx.globalAlpha*=al;
  ctx.drawImage(sp.c,-sp.ax-px*sp.s,-sp.ay-py*sp.s,sp.w,sp.h);
  ctx.restore();
}
function lg(g,x0,y0,x1,y1,stops){const gr=g.createLinearGradient(x0,y0,x1,y1);for(let i=0;i<stops.length;i+=2)gr.addColorStop(stops[i],stops[i+1]);return gr;}
function rg(g,x0,y0,r0,x1,y1,r1,stops){const gr=g.createRadialGradient(x0,y0,r0,x1,y1,r1);for(let i=0;i<stops.length;i+=2)gr.addColorStop(stops[i],stops[i+1]);return gr;}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}
function ell(g,x,y,rx,ry,rot){g.beginPath();g.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot||0,0,TAU);}
// cellophane tape piece (drawn live or into sprites)
function tape(g,x,y,w,h,rot,al){
  g.save();g.translate(x,y);g.rotate(rot);g.globalAlpha*=(al==null?1:al);
  g.beginPath();const z=h/5;g.moveTo(-w/2,-h/2);
  for(let i=0;i<=5;i++)g.lineTo(-w/2+((i%2)?z*.8:0),-h/2+i*z);
  for(let i=5;i>=0;i--)g.lineTo(w/2-((i%2)?z*.8:0),-h/2+i*z);
  g.closePath();g.fillStyle='rgba(250,246,226,.46)';g.fill();
  g.fillStyle='rgba(255,255,255,.35)';g.fillRect(-w/2+2,-h/2+1.5,w-4,h*.22);
  g.strokeStyle='rgba(150,135,100,.22)';g.lineWidth=.8;g.stroke();
  g.restore();
}

// ================= audio (Web Audio synth) =================
let AC=null,MG=null,NB=null,audioKick=false;
function unlockAudio(){
  try{
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      AC=new C();MG=AC.createGain();MG.gain.value=0.75;
      const cp=AC.createDynamicsCompressor();cp.threshold.value=-16;cp.ratio.value=5;
      MG.connect(cp);cp.connect(AC.destination);
      const len=(AC.sampleRate*1.2)|0;NB=AC.createBuffer(1,len,AC.sampleRate);
      const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended'&&!document.hidden)AC.resume().catch(()=>{});
    if(!audioKick){const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);audioKick=true;}
  }catch(e){AC=null;}
}
const aT=()=>AC.currentTime+0.005;
function envG(t,a,peak,d){const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);return g;}
function tone(type,f,t,a,peak,d,f2,dest){
  if(!AC)return;const o=AC.createOscillator(),g=envG(t,a,peak,d);o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+d);o.connect(g);g.connect(dest||MG);o.start(t);o.stop(t+a+d+0.05);
}
function nz(t,dur,ft,f,q,peak,a,f2){
  if(!AC)return;const s=AC.createBufferSource();s.buffer=NB;const fl=AC.createBiquadFilter();fl.type=ft;
  fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;
  const g=envG(t,a||0.004,peak,dur);s.connect(fl);fl.connect(g);g.connect(MG);s.start(t,Math.random()*0.8);s.stop(t+dur+0.06);
}
let lastShara=0,voiceBudget=0;
const SFX={
  press(){if(!AC)return;const t=aT();tone('sine',240,t,0.004,0.32,0.11,120);nz(t,0.04,'bandpass',1800,1.2,0.06);},
  boing(){if(!AC)return;const t=aT();tone('sine',330,t,0.005,0.2,0.22,520);tone('triangle',165,t+0.02,0.005,0.08,0.18,260);},
  shara(v){if(!AC)return;const n=performance.now();if(n-lastShara<40)return;lastShara=n;const t=aT();
    nz(t,0.05+0.06*v,'highpass',5200+Math.random()*3500,0.8,0.035+0.07*v,0.003);},
  unravel(len){if(!AC)return;const t=aT();for(let i=0;i<5;i++)nz(t+i*0.045,0.07,'highpass',6000+i*500,0.7,0.06,0.003);
    const f=clamp(950-len*0.9,200,950);tone('triangle',f*1.5,t,0.01,0.09,0.3,f*0.75);},
  pluck(len,q){if(!AC)return;const t=aT();const f=clamp(880*Math.pow(0.5,(len-80)/320),150,1100);
    tone('triangle',f,t,0.003,0.2*(q||1),0.55,f*0.995);tone('sine',f*2,t,0.003,0.07*(q||1),0.3);},

  tick(){if(!AC)return;const t=aT();tone('sine',1300+Math.random()*300,t,0.002,0.06,0.05);nz(t,0.02,'bandpass',3500,3,0.04);},
  bell(big){if(!AC)return;const t=aT(),f=big?880:1046;
    [[1,0.22,1.6],[2.76,0.09,0.9],[5.4,0.05,0.5],[8.93,0.025,0.3]].forEach(p=>tone('sine',f*p[0],t,0.002,p[1],p[2]));
    tone('sine',f*1.5,t+0.12,0.002,0.08,1.0);},
  knot(){if(!AC)return;const t=aT();tone('sine',1760,t,0.002,0.08,0.12);tone('sine',2637,t+0.05,0.002,0.06,0.14);},
  zip(len){if(!AC)return;const t=aT(),d=0.2+len/1600;nz(t,d,'bandpass',2500,2,0.07,0.01,7000);tone('sine',300,t,0.01,0.05,d,900);},
  pour(){if(!AC)return;const t=aT();nz(t,1.1,'lowpass',900,1,0.12,0.08,500);for(let i=0;i<9;i++)tone('sine',500+Math.random()*700,t+0.1+i*0.1,0.003,0.05,0.06,900);},
  car(d){if(!AC)return;const t=aT();const o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=envG(t,0.05,0.07,d);
    o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.linearRampToValueAtTime(110,t+d*0.5);o.frequency.linearRampToValueAtTime(65,t+d);
    fl.type='lowpass';fl.frequency.value=600;o.connect(fl);fl.connect(g);g.connect(MG);o.start(t);o.stop(t+d+0.1);
    for(let i=0;i<d/0.09;i++)nz(t+i*0.09,0.02,'bandpass',2000,4,0.02);},
  rev(){if(!AC)return;const t=aT();tone('sawtooth',80,t,0.02,0.04,0.25,140);},
  curtain(open){if(!AC)return;const t=aT();nz(t,0.55,'bandpass',open?600:2400,1.2,0.09,0.06,open?2400:600);},
  hop(){if(!AC)return;const t=aT();tone('sine',520,t,0.004,0.1,0.14,880);},
  slide(){if(!AC)return;const t=aT();nz(t,0.35,'bandpass',900,2,0.05,0.04,500);},
  snore(){if(!AC)return;const t=aT();tone('sine',140,t,0.2,0.03,0.6,110);},
  music(n){if(!AC)return;const t=aT();const sc=[784,880,988,1175,1319,1175,988,880,784,988,1175,1568];
    for(let i=0;i<n;i++){const f=sc[i%sc.length];tone('triangle',f,t+i*0.16,0.004,0.07,0.32);tone('sine',f*2,t+i*0.16,0.003,0.02,0.18);}},
  success(level){if(!AC)return;const t=aT();const base=[523.25,659.25,783.99,1046.5,1318.5];const n=level>1?5:4;
    for(let i=0;i<n;i++){tone('sine',base[i],t+i*0.075,0.006,0.15,0.6);tone('triangle',base[i]*2,t+i*0.075,0.004,0.04,0.3);}
    if(level>1){[523.25,659.25,783.99].forEach(f=>tone('triangle',f,t+0.4,0.08,0.06,1.4));for(let i=0;i<6;i++)tone('sine',2000+Math.random()*2500,t+0.3+i*0.07,0.002,0.03,0.12);}},
  clap(n,dur){if(!AC)return;const t=aT();for(let i=0;i<n;i++){const tt=t+Math.random()*dur;nz(tt,0.03,'bandpass',1200+Math.random()*1500,1.5,0.08+Math.random()*0.06,0.002);}},
  fanfare(){if(!AC)return;const t=aT();const m=[392,523.25,659.25,783.99,1046.5];m.forEach((f,i)=>{tone('triangle',f,t+i*0.12,0.01,0.12,0.5);tone('sine',f/2,t+i*0.12,0.01,0.06,0.5);});
    [523.25,659.25,783.99,1046.5].forEach(f=>tone('triangle',f,t+0.7,0.1,0.07,1.8));},
  page(){if(!AC)return;const t=aT();nz(t,0.25,'highpass',3000,0.7,0.06,0.02,1500);},
  grow(){if(!AC)return;const t=aT();for(let i=0;i<8;i++)nz(t+i*0.05,0.08,'highpass',4000+i*400,0.8,0.05,0.004);tone('sine',400,t,0.02,0.08,0.6,800);}
};

// ================= layout =================
const JIT={};
function initJitter(){['stool','pot','stage','bell','car','gtab'].forEach(k=>{JIT[k]=[rr(-1,1),rr(-1,1)];});}
const LAY={
  land:{ref:[1180,820],os:1,gs:1,
    wall:[.012,.018,.988,.765],floorY:.742,head:[.165,.352],
    gTable:[.02,.405,.668],gSpots:[[.305,.668],[.372,.668]],tapes:[.055,.39,.712],
    stool:[.487,.568],potTable:[.657,.505],potSpot:[.713,.505],
    shelf:[.29,.565,.098],bellHook:[.405,.103],shelfSpot:[.52,.098],
    cab:[.765,.978,.632],stage:[.871,.632],
    lane:[.1,.94,.893],stops:[.27,.87],
    pins:[[.05,.07],[.22,.045],[.66,.05],[.955,.09],[.978,.70],[.022,.56]],
    cards:[[.08,.135],[.17,.09],[.26,.135]],aud:[.4,.99,.995]},
  port:{ref:[390,844],os:.58,gs:.68,
    wall:[.02,.015,.98,.80],floorY:.785,head:[.215,.40],
    gTable:[-.02,.56,.615],gSpots:[[.36,.615],[.48,.615]],tapes:[.06,.52,.656],
    stool:[.575,.452],potTable:null,potSpot:null,potCab:[.85,.475],
    shelf:[.2,.62,.072],bellHook:[.40,.077],shelfSpot:[.56,.072],
    cab:[.675,1.02,.335],stage:[.825,.335],
    lane:[.1,.92,.897],stops:[.24,.84],
    pins:[[.05,.045],[.27,.028],[.73,.04],[.955,.115],[.975,.585],[.03,.70]],

};
let L=null;
function layout(){
  const P=H>W*1.05, D=P?LAY.port:LAY.land;
  const rx=SA.l, ry=SA.t, rw=Math.max(120,W-SA.l-SA.r), rh=Math.max(120,H-SA.t-SA.b);
  const k=Math.min(rw/D.ref[0],rh/D.ref[1]);
  const X=f=>rx+f*rw, Y=f=>ry+f*rh;
  const j=(key,i,a)=>(JIT[key]?JIT[key][i]:0)*a;
  L={P,D,rx,ry,rw,rh,k,os:k*D.os,gs:k*D.gs,X,Y};
  L.wall={x0:X(D.wall[0]),y0:Y(D.wall[1]),x1:X(D.wall[2]),y1:Y(D.wall[3])};
  L.floorY=Y(D.floorY);
  L.head={x:X(D.head[0]),y:Y(D.head[1]),r:88*L.gs};
  L.gTable={x0:X(D.gTable[0]),x1:X(D.gTable[1]),y:Y(D.gTable[2])};
  L.spots={};
  L.spots.g0={x:X(D.gSpots[0][0]),y:Y(D.gSpots[0][1]),kind:'g'};
  L.spots.g1={x:X(D.gSpots[1][0]),y:Y(D.gSpots[1][1]),kind:'g'};
  L.stool={x:X(D.stool[0])+j('stool',0,.012*rw),y:Y(D.stool[1])+j('stool',1,.008*rh)};
  L.spots.stool={x:L.stool.x,y:L.stool.y,kind:'stool'};
  if(D.potTable){L.potTable={x:X(D.potTable[0])+j('pot',0,.012*rw),y:Y(D.potTable[1])+j('pot',1,.008*rh)};
    L.pot={x:L.potTable.x,y:L.potTable.y};L.spots.pot={x:L.pot.x+(D.potSpot[0]-D.potTable[0])*rw,y:L.pot.y,kind:'pot'};}
  else{L.potTable=null;L.pot={x:X(D.potCab[0])+j('pot',0,.01*rw),y:Y(D.potCab[1])};}
  L.shelf={x0:X(D.shelf[0]),x1:X(D.shelf[1]),y:Y(D.shelf[2])};
  L.bellHook={x:X(D.bellHook[0])+j('bell',0,.012*rw),y:Y(D.bellHook[1])};
  L.spots.shelf={x:X(D.shelfSpot[0]),y:Y(D.shelfSpot[1]),kind:'shelf'};
  L.cab={x0:X(D.cab[0]),x1:X(D.cab[1]),y:Y(D.cab[2])};
  L.stage={x:X(D.stage[0])+j('stage',0,.006*rw),y:Y(D.stage[1]),w:250*L.os,h:262*L.os};
  L.spots.stage={x:L.stage.x-L.stage.w*.18,y:L.stage.y-L.stage.h*.1,kind:'stage'};
  L.lane={x0:X(D.lane[0]),x1:X(D.lane[1]),y:Y(D.lane[2])};
  L.stops=D.stops.map(f=>X(f));
  L.pins=D.pins.map(p=>({x:X(p[0]),y:Y(p[1])}));
  L.cards=D.cards.map(p=>({x:X(p[0]),y:Y(p[1])}));
  L.aud={x0:X(D.aud[0]),x1:X(D.aud[1]),y:Y(D.aud[2])};
  L.tapeSlots=[];
  const t0=X(D.tapes[0]),t1=X(D.tapes[1]),ty=Y(D.tapes[2]);
  const gap=Math.max(46,Math.min(64,(t1-t0)/6)), n=Math.max(3,Math.floor((t1-t0)/gap)+1);
  for(let r=0;r<3;r++)for(let i=0;i<n;i++)L.tapeSlots.push({x:t0+i*gap+(r%2)*gap*.5,y:ty+r*Math.min(40,gap*.75)});
}

// ================= textures / static scenery =================
function woodRect(g,x,y,w,h,c0,c1,horiz,lines){
  g.fillStyle=horiz?lg(g,x,y,x,y+h,[0,c0,1,c1]):lg(g,x,y,x+w,y,[0,c1,.5,c0,1,c1]);g.fillRect(x,y,w,h);
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  const n=lines||Math.max(4,(horiz?h:w)/5);
  for(let i=0;i<n;i++){
    g.strokeStyle=rnd()<.5?'rgba(30,15,5,.16)':'rgba(255,230,190,.08)';g.lineWidth=rr(.5,1.6);g.beginPath();
    if(horiz){const yy=y+rnd()*h;g.moveTo(x,yy);for(let k=1;k<=6;k++)g.lineTo(x+w*k/6,yy+rr(-1.5,1.5));}
    else{const xx=x+rnd()*w;g.moveTo(xx,y);for(let k=1;k<=6;k++)g.lineTo(xx+rr(-1.5,1.5),y+h*k/6);}
    g.stroke();
  }
  g.restore();

function drawFlaps(g,t){
  const sp=SP.wall,x0=L.wall.x0,y0=L.wall.y0,w=L.wall.x1-x0,h=L.wall.y1-y0;
  const hw=w/2,ang=eio(clamp(t,0,1))*1.33,sc=Math.max(.2,Math.cos(ang)),lift=Math.sin(ang);
  const sx=sp.ax*DPR,sy=sp.ay*DPR,sw=hw*DPR,sh=h*DPR;
  for(let s=0;s<2;s++){
    g.save();
    const ox=s?x0+w:x0;g.translate(ox,y0);g.scale(s?-sc:sc,1);
    // perspective-ish: outer edge stays, inner edge grows taller as it swings toward us
    g.transform(1,(s?1:1)*lift*0.06,0,1+lift*.05,0,-h*lift*.025);
    if(s){g.drawImage(sp.c,sx+sw,sy,sw,sh,0,0,hw,h);}else g.drawImage(sp.c,sx,sy,sw,sh,0,0,hw,h);
    g.fillStyle='rgba(20,15,10,'+(lift*.35)+')';g.fillRect(0,0,hw,h);
    g.fillStyle='rgba(251,248,239,.95)';g.fillRect(hw-3,0,3,h);
    g.restore();
  }
}

function drawTress(t,time,glow){

    for(let k=n-2;k>0;k--)ctx.quadraticCurveTo(Rp[k][0],Rp[k][1],(Rp[k][0]+Rp[k-1][0])/2,(Rp[k][1]+Rp[k-1][1])/2);

// ---- positions ----
function carX(){return lerp(L.lane.x0,L.lane.x1,OB.car.f);}
function carBed(){return {x:carX()-OB.car.face*42*L.os,y:L.lane.y-54*L.os-OB.car.bounce*3};}
function spotPos(k){return k==='car'?carBed():L.spots[k]||L.spots.stool;}
function cupBase(){
  const c=OB.cup;
  if(c.hop){const h=c.hop,t=clamp((NOW-h.t0)/h.dur,0,1),b=spotPos(h.to),e=eio(t);return {x:lerp(h.fx,b.x,e),y:lerp(h.fy,b.y,e)-Math.sin(t*PI)*h.arc};}
  return spotPos(c.spot);
}
function potRot(){return -OB.pot.tilt*OB.pot.flip;}
function rot(x,y,a){const c=Math.cos(a),s=Math.sin(a);return {x:x*c-y*s,y:x*s+y*c};}
function objCenter(k){
  const s=L.os;
  switch(k){
    case 'cup':{const b=cupBase();return {x:b.x,y:b.y-34*s};}
    case 'pot':return {x:L.pot.x,y:L.pot.y-66*s};
    case 'bell':{const a=OB.bell.ang;return {x:L.bellHook.x-Math.sin(a)*64*s,y:L.bellHook.y+Math.cos(a)*64*s};}
    case 'stage':return {x:L.stage.x,y:L.stage.y-L.stage.h*.5};
    case 'car':return {x:carX(),y:L.lane.y-40*s};
  }
  return {x:0,y:0};
}
function objRad(k){const s=L.os;return k==='cup'?Math.max(40,52*s):k==='pot'?Math.max(44,70*s):k==='bell'?Math.max(42,56*s):k==='stage'?Math.max(60,128*s):Math.max(44,88*s);}
function hitObj(k,x,y,m){
  if(k==='stage'){const S=L.stage,mm=(m||1)-1;return x>S.x-S.w*(.5+mm*.3)&&x<S.x+S.w*(.5+mm*.3)&&y>S.y-S.h*(1+mm*.2)&&y<S.y+S.h*mm*.2;}
  const c=objCenter(k);return hyp(c.x-x,c.y-y)<objRad(k)*(m||1);
}
function anchorPos(k,i){
  const s=L.os,sp=Math.max(8,9*s);let p;
  switch(k){
    case 'cup':{const b=cupBase();p={x:b.x+46*s,y:b.y-42*s};break;}
    case 'pot':{const r=rot(0,-104*s,potRot());p={x:L.pot.x+r.x,y:L.pot.y+r.y};break;}
    case 'bell':{const r=rot(0,104*s,OB.bell.ang);p={x:L.bellHook.x+r.x,y:L.bellHook.y+r.y};break;}
    case 'stage':p={x:L.stage.x,y:L.stage.y-L.stage.h+14*s};break;
    case 'car':p={x:carX()+OB.car.face*86*s,y:L.lane.y-30*s-OB.car.bounce*3};break;
    default:p={x:0,y:0};
  }
  const j=(i||0)%6;if(j){p.x+=((j%3)-1)*sp+(j===3?sp*.5:0);p.y+=Math.floor(j/3)*sp*.8-(j%3===0?sp*.6:0);}
  return p;
}

function computeCross(){
  threads.forEach(t=>{t.cross.length=0;});

  const N=16;let sig='';
  for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){
    const a=live[i],b=live[j];
    if(a.bb[2]<b.bb[0]||b.bb[2]<a.bb[0]||a.bb[3]<b.bb[1]||b.bb[3]<a.bb[1])continue;
    const P=a.rest,Q=b.rest;
    for(let s=0;s<N;s++){
      const ax=P[s*2],ay=P[s*2+1],bx=P[s*2+2],by=P[s*2+3];
      for(let r=0;r<N;r++){
        const cx=Q[r*2],cy=Q[r*2+1],ex=Q[r*2+2],ey=Q[r*2+3];
        const d1x=bx-ax,d1y=by-ay,d2x=ex-cx,d2y=ey-cy,den=d1x*d2y-d1y*d2x;if(Math.abs(den)<1e-6)continue;

      }
    }

  if(sig!==crossSig){
    const before=crossSig.split(',').filter(Boolean).length,after=sig.split(',').filter(Boolean).length;

  let i=PINS.findIndex(q=>hyp(q.x-x,q.y-y)<42);

  if(Pt.pourT>0){Pt.pourT-=dt;const e=NOW-Pt.pourStart;const tgt=e<1.35?.62:0;Pt.tilt=lerp(Pt.tilt,tgt,Math.min(1,dt*6));
    if(e>.35&&e<1.4&&!C.hop){const bf=C.fill;C.fill=Math.min(1,C.fill+dt*1.05);if(bf<.95&&C.fill>=.95){const c=objCenter('cup');if(flag('potPoured'))success(1,c.x,c.y);else SFX.success(0);}}}
  else Pt.tilt=lerp(Pt.tilt,0,Math.min(1,dt*5));
  Pt.wob=Math.max(0,Pt.wob-dt*2);
  // bell
  const B=OB.bell;B.av+=(-B.ang*34-B.av*1.6)*dt;B.ang+=B.av*dt;B.wob=Math.max(0,B.wob-dt*2);
  if(B.wob>.5&&Math.abs(B.av)<.6)B.av+=Math.sin(NOW*40)*.15;
  // stage
  const S=OB.stage;S.open+=clamp(S.target-S.open,-dt*2.2,dt*2.2);S.wob=Math.max(0,S.wob-dt*2);
  if(S.sleepAt&&NOW>S.sleepAt){S.sleepAt=0;if(S.target<.5){S.doll='sleep';}}
  S.dance=Math.max(0,S.dance-dt*.18);S.peekWave=Math.max(0,S.peekWave-dt*.6);
  if(S.doll==='sleep'&&S.open>.5&&((NOW*1000|0)%1400)<17)addP({t:'zz',x:L.stage.x+10*L.os,y:L.stage.y-80*L.os,vx:rr(4,12),vy:-26,life:0,max:1.6,sz:rr(4,7)*Math.max(.6,L.os),rot:0,vr:0});
  // car
  const K=OB.car;
  if(K.drive){const d=K.drive,t=clamp((NOW-d.t0)/d.dur,0,1),pf=K.f;K.f=lerp(d.f0,d.f1,eio(t));K.wheel+=(K.f-pf)*(L.lane.x1-L.lane.x0)/(16*L.os);K.bounce=Math.abs(Math.sin(NOW*22))*.8;
    if(t>=1){K.drive=null;K.bounce=0;onCarArrive(d.why);}}
  if(K.wheelKick){K.wheel+=dt*14*K.wheelKick;K.wheelKick=Math.max(0,K.wheelKick-dt*1.5);}
  K.wob=Math.max(0,K.wob-dt*2);K.brace=Math.max(0,K.brace-dt*1.8);
  OBJKEYS.forEach(k=>{if(OB[k].pre)OB[k].pre=Math.max(0,OB[k].pre-dt*2);});
  // threads
  for(let i=0;i<threads.length;i++){const th=threads[i];updFly(th);updThread(th,dt);updPulses(th,dt);}
  if(++crossTick%(threads.length>14?2:1)===0)computeCross();
  if(waves.size>40){for(const [k,v] of waves)if(NOW-v.t>8)waves.delete(k);}
  PINS.forEach(q=>{q.flut=Math.max(0,q.flut-dt*1.5);});
  // particles
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>=p.max){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    if(p.t==='conf'){p.vy+=420*dt;p.vx*=1-dt*1.2;}else if(p.t==='fib'){p.vy+=160*dt;p.vx*=1-dt*2;}else if(p.t==='spk'){p.vx*=1-dt*4;p.vy*=1-dt*4;}}
  updGuide(dt);
  // a full unravel turns the room into a theater
  if(!TH.pending&&!TH.cycleDone&&!CARDS.active&&hairLeft()<.015&&G.tr.every(t=>t.grow>=1)&&!threads.some(t=>t.e[1].type==='fly'))TH.pending=NOW+1.3;
  if(TH.pending&&NOW>TH.pending&&!CARDS.active)startTheater();
  if(TH.anim&&NOW-TH.t0>2.6){TH.anim=false;TH.open=true;buildBG();}
  TH.clapT=Math.max(0,TH.clapT-dt);
}

function shake(o){return o.wob>0?Math.sin(NOW*42)*o.wob*.05:0;}

function drawThreads(){
  const k=Math.max(.6,L.k);
  for(const th of threads){
    const P=th.pts,n=P.length/2;if(n<2)continue;
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(P[0]+2,P[1]+3);for(let i=1;i<n;i++)ctx.lineTo(P[i*2]+2,P[i*2+1]+3);
    ctx.strokeStyle='rgba(50,25,10,.2)';ctx.lineWidth=4.5*k;ctx.stroke();
    ctx.beginPath();ctx.moveTo(P[0],P[1]);for(let i=1;i<n;i++)ctx.lineTo(P[i*2],P[i*2+1]);
    const hi=INV&&INV.kind==='end'&&INV.th===th;
    if(hi){ctx.strokeStyle='rgba(255,250,230,.5)';ctx.lineWidth=9*k;ctx.stroke();}
    ctx.strokeStyle=YARN;ctx.lineWidth=Math.max(2.6,4*k);ctx.stroke();
    ctx.strokeStyle=YARN_L;ctx.lineWidth=Math.max(1,1.4*k);ctx.setLineDash([3*k,4.5*k]);ctx.stroke();ctx.setLineDash([]);

      ctx.save();ctx.translate(x,y);ctx.rotate(sw);ctx.fillStyle='#fbf8ef';
      if(f.shape===0){ctx.beginPath();ctx.moveTo(-z*.75,-1);ctx.lineTo(z*.75,-1);ctx.lineTo(0,z*1.5);ctx.closePath();ctx.fill();ctx.fillStyle=SP.flagC[f.c];ctx.beginPath();ctx.moveTo(-z*.55,1);ctx.lineTo(z*.55,1);ctx.lineTo(0,z*1.2);ctx.closePath();ctx.fill();}
      else if(f.shape===1){ctx.fillRect(-z*.6,0,z*1.2,z*1.3);ctx.fillStyle=SP.flagC[f.c];ctx.fillRect(-z*.45,z*.15,z*.9,z);}
      else{ell(ctx,0,z*.7,z*.7,z*.7);ctx.fill();ctx.fillStyle=SP.flagC[f.c];ell(ctx,0,z*.7,z*.52,z*.52);ctx.fill();}
      ctx.restore();
    }
    for(const q of th.pulses){
      const u=clamp(q.p,0,1)*(n-1),i=Math.min(n-2,Math.floor(u)),fr=u-i,x=lerp(P[i*2],P[i*2+2],fr),y=lerp(P[i*2+1],P[i*2+3],fr);
      ctx.fillStyle=rg(ctx,x,y,0,x,y,12*k,[0,'rgba(255,250,225,.95)',1,'rgba(255,240,200,0)']);ell(ctx,x,y,12*k,12*k);ctx.fill();
    }
    for(const c of th.cross)if(c.a===th){
      ctx.fillStyle='#fbf8ef';ell(ctx,c.x,c.y,6.5*k,6.5*k);ctx.fill();ctx.fillStyle=YARN_D;ell(ctx,c.x,c.y,4.6*k,4.6*k);ctx.fill();
      ctx.strokeStyle=YARN_L;ctx.lineWidth=1.4*k;ctx.beginPath();ctx.arc(c.x,c.y,3*k,0,PI*1.2);ctx.stroke();

      const q=endPos(e),root=ei===ri&&attached(th.e[1-ei]);

function drawCards(){
  if(!CARDS.active)return;

    const t=clamp((NOW-CARDS.t0-j*.15)/.5,0,1);if(t<=0)return;

    if(b>1&&j===((NOW/1.6|0)%3))halo(c.x,c.y,70*SP.cards[0].s);
    drawSp(SP.cards[c.style],c.x,c.y+(1-eob(t))*60,48,58,c.rot+Math.sin(NOW*2+j)*.03,b*eob(t),b*eob(t));
    tape(ctx,c.x,c.y-58*SP.cards[0].s+(1-eob(t))*60,30,12,c.rot,1);
  });
}
function drawDemo(){
  if(!demo)return;
  const p=demo.p,t=(NOW-demo.t0)/demo.dur;let x,y,press=0,al=1;
  if(p.drag){
    if(t<.22){const u=t/.22;x=p.a.x+18;y=p.a.y+30-u*30;press=0;al=u;}
    else if(t<.32){x=p.a.x;y=p.a.y;press=(t-.22)/.1;}
    else if(t<.8){const u=eio((t-.32)/.48);x=lerp(p.a.x,p.b.x,u);y=lerp(p.a.y,p.b.y,u);press=1;}
    else{const u=(t-.8)/.2;x=p.b.x+u*10;y=p.b.y+u*20;press=1-u;al=1-u;}
  }else{x=p.a.x;y=p.a.y;const u=(t*2)%1;press=u<.3?u/.3:u<.5?1:0;al=t<.15?t/.15:t>.85?(1-t)/.15:1;}
  if(p.drag&&t>.32&&t<.85){ctx.strokeStyle='rgba(255,252,236,.55)';ctx.lineWidth=6;ctx.lineCap='round';ctx.setLineDash([2,12]);ctx.beginPath();ctx.moveTo(p.a.x,p.a.y);ctx.lineTo(x,y);ctx.stroke();ctx.setLineDash([]);}
  if(press>.5){ctx.fillStyle='rgba(255,252,236,.45)';ell(ctx,x,y,16,16);ctx.fill();}
  drawSp(SP.hand,x,y,27,5,-.42,1-.08*press,1-.08*press,clamp(al,0,1));
}
function drawRings(){
  for(let i=RING.length-1;i>=0;i--){const r=RING[i],t=(NOW-r.t0)/(r.big?1:.7);if(t>1){RING.splice(i,1);continue;}
    ctx.strokeStyle='rgba(255,248,220,'+(1-t)+')';ctx.lineWidth=(r.big?8:5)*(1-t)+1;const rad=(r.big?160:90)*Math.max(.6,L.k)*eo(t);ell(ctx,r.x,r.y,rad,rad);ctx.stroke();}
}
const PROF=!!(QS0&&QS0.get('prof')==='1'),PR={};let prT=0;
if(QS0&&QS0.get('dpr'))DPRCAP=clamp(+QS0.get('dpr')||2,1,2);
function pm(n){if(!PROF)return;const t=performance.now();PR[n]=(PR[n]||0)+(t-prT);prT=t;}
if(PROF)window.__prof=PR;
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);

function resize(){
  const w=Math.max(200,window.innerWidth|0),h=Math.max(200,window.innerHeight|0);
  DPR=Math.min(DPRCAP,window.devicePixelRatio||1);W=w;H=h;perf.n=0;perf.sum=0;perf.skip=60;
  cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+'px';cv.style.height=h+'px';

let rsT=0;function queueResize(){clearTimeout(rsT);rsT=setTimeout(()=>{cancelAll();resize();},120);}
window.addEventListener('resize',queueResize);window.addEventListener('orientationchange',queueResize);
let rafId=0,lastTs=0,running=false;
const perf={n:0,sum:0,skip:60,slow:0};
function frame(ts){
  if(!running)return;rafId=requestAnimationFrame(frame);
  const raw=(ts-lastTs)/1000,dt=clamp(raw,0,1/20);lastTs=ts;
  // adaptive resolution: if frames stay slow, render fewer pixels (DPR 2 -> 1.5 -> 1)
  if(perf.skip>0)perf.skip--;else if(raw>0&&raw<.25){perf.sum+=raw;if(++perf.n>=90){const avg=perf.sum/perf.n;perf.n=0;perf.sum=0;
    if(avg>.0235){if(++perf.slow>=2&&DPR>1.01){perf.slow=0;DPRCAP=Math.max(1,Math.min(DPR,2)-.5);cancelAll();resize();}}else perf.slow=0;}}
  try{const u0=PROF?performance.now():0;update(dt);if(PROF)PR.update=(PR.update||0)+performance.now()-u0;render();if(PROF)PR.frames=(PR.frames||0)+1;}catch(err){if(!frame.err){frame.err=1;console.warn(err);}}
}
function start(){if(running)return;running=true;lastTs=performance.now();rafId=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(rafId);}

    t:+NOW.toFixed(3),dpr:DPR,inv:INV?{kind:INV.kind,i:INV.i,k:INV.k,target:INV.target,to:INV.to}:null,demo:!!demo,audio:AC?AC.state:'none',threads:threads.length}),

  lane:()=>Object.assign({},L.lane),spots:()=>JSON.parse(JSON.stringify(L.spots))
};
